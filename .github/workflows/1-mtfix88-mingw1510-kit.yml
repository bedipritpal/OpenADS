        hist.append('baseline names passing now: '+str(sum(1 for n in expected if n in summary['cases'] and summary['cases'][n]['passed'])))
        hist.append('baseline names with fewer than 2 assertion successes now: '+str([n for n in expected if n in summary['cases'] and int(summary['cases'][n]['assertions'].get('successes','0'))<2]))
        hist.append('cases with zero assertions: '+str(sorted(n for n,v in summary['cases'].items() if int(v['assertions'].get('successes','0'))==0)))
        (out/'baseline-historical-diagnostic.txt').write_text('\n'.join(hist),encoding='utf-8')
