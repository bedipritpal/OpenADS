        assert summary['cases']['indexed explicit refresh sees peer writes without losing position']['assertions']['successes']=='113','explicit refresh assertion count changed'
        assert summary['cases']['Tim 2e deleted-only scope never substitutes a preceding live row']['assertions']['successes']=='304','2e assertion count changed'
        new_cases=[n for n in summary['cases'] if n.startswith('commit fusion:')]
