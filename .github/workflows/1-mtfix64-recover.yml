      with:
        if-no-files-found: warn
        name: mtfix64-x86-proof
        path: 'output/

          delivery/

          mtfix64-full-qt492-x86.zip

          srv/*.log

          srv/*.txt

          '
        retention-days: 14
    - uses: actions/upload-artifact@v4
      with:
        name: kit-x86
        path: mtfix64-full-qt492-x86.zip
        retention-days: 14
    timeout-minutes: 140
  x64kit:
    name: Reuse verified original x64kit artifact
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@v4
      with:
        artifact-ids: '12994339061'
        run-id: '41092010335'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: reuse
    - name: Preserve successful platform archive unchanged
      run: 'find reuse -type f -maxdepth 3 -print

        '
    - uses: actions/upload-artifact@v4
      with:
        name: kit-x64
        path: reuse/
        retention-days: 14
  linuxkit:
    name: Reuse verified original linuxkit artifact
    runs-on: ubuntu-24.04
