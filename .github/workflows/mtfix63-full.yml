        \ | head -1)\"\necho \"Harbour SDK layout:\"\necho \"  include: ${HB_INC:-MISSING}\"\necho \"  libdir: \
        \ ${HB_LIBDIR:-MISSING}\"\necho \"  compiler:${HB_CC:-MISSING}\"\nif [ -z \"$HB_INC\" ] || [ -z \"$HB_LIBDIR\"\
