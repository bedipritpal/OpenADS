name: Build exact reviewed stable1.09.74 artifacts (no branch tag or release)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: stable-1.09.74-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'bedipritpal/OpenADS'
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.seed.outputs.head }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Validate exact candidate patch and tree, upload patch without branch push
      id: seed
      shell: bash
      run: 'set -euo pipefail

        base=383dac64933db2e8eba0efaa0f96967f1ae4c99f

        test "$(git ls-remote https://github.com/FiveTechSoft/OpenADS.git refs/heads/main | cut -f1)" = "$base"

        test -z "$(git ls-remote origin refs/heads/release/1.09.74-candidate)"

        test -z "$(git ls-remote origin refs/tags/v1.09.74)"

        git fetch https://github.com/FiveTechSoft/OpenADS.git "$base"

        git checkout -b release/1.09.74-candidate "$base"

        base64 -d > "$RUNNER_TEMP/candidate.patch" <<''REVIEWED_PATCH_BASE64''

        

        REVIEWED_PATCH_BASE64

        echo "c10697ff4b4305128e91c3376955720c975b22629ba126b61470573da27de593  $RUNNER_TEMP/candidate.patch" | sha256sum --check --strict

        git apply --check "$RUNNER_TEMP/candidate.patch"

        git apply "$RUNNER_TEMP/candidate.patch"

        git add .github/workflows/release.yml CMakeLists.txt include/openads/version.h release-notes-1.09.74.md tests/mingw_import_parser_test.py tools/scripts/regenerate_mingw_imports.py

        test "$(git write-tree)" = "c160c4587a29ae8952431231cd81d38ee52e71b6"

        git config user.name ''Pritpal Bedi''

        git config user.email ''bedipritpal@users.noreply.github.com''

        git commit -m ''Prepare reviewed OpenADS1.09.74 stable candidate''

        test "$(git ls-remote https://github.com/FiveTechSoft/OpenADS.git refs/heads/main | cut -f1)" = "$base"

        cp "$RUNNER_TEMP/candidate.patch" candidate-approved.patch

        echo "head=383dac64933db2e8eba0efaa0f96967f1ae4c99f" >> "$GITHUB_OUTPUT"

        '
    - uses: actions/upload-artifact@v4
      with:
        name: reviewed-candidate-patch
        path: candidate-approved.patch
  source-build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}${{ matrix.tls && ' / TLS' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2022
          preset: msvc-x64
          tls: false
        - os: windows-2022
          preset: msvc-x86
          tls: false
        - os: ubuntu-24.04
          preset: ninja-clang
          tls: false
        - os: macos-14
          preset: default
          tls: false
        - os: ubuntu-24.04
          preset: ninja-clang
          tls: true
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-tags: true
        fetch-depth: 0
        ref: ${{ needs.candidate.outputs.head }}
    - uses: actions/download-artifact@v4
      with:
        name: reviewed-candidate-patch
        path: reviewed-patch
    - name: Apply exact approved candidate and verify tree
      shell: bash
      run: 'set -euo pipefail

        echo ''c10697ff4b4305128e91c3376955720c975b22629ba126b61470573da27de593  reviewed-patch/candidate-approved.patch'' | sha256sum --check --strict

        git apply --index reviewed-patch/candidate-approved.patch

        test "$(git write-tree)" = "c160c4587a29ae8952431231cd81d38ee52e71b6"

        rm -rf reviewed-patch

        '
    - name: Install Ninja (Linux / macOS)
      if: runner.os != 'Windows'
      uses: seanmiddleditch/gha-setup-ninja@v6
    - name: Configure
      run: "cmake --preset ${{ matrix.preset }} \\\n      ${{ matrix.tls && '-DOPENADS_WITH_TLS=ON' || '' }}\n"
      shell: bash
    - name: Build
      run: cmake --build build/${{ matrix.preset }} --config Release --target dbf_cdx_bench openads_unit_tests
    - name: Test
      run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure -C Release
    - name: Bench smoke (CDX multi-tag create)
      run: "BENCH=\"build/${{ matrix.preset }}/tests/Release/dbf_cdx_bench${{ runner.os == 'Windows' && '.exe' || '' }}\"\nif [ -f \"$BENCH\" ]; then\n\
        \  \"$BENCH\" 1000 || true\nfi\n"
      shell: bash
    needs: candidate
  source-php-binding:
    name: PHP binding
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.candidate.outputs.head }}
    - uses: actions/download-artifact@v4
      with:
        name: reviewed-candidate-patch
        path: reviewed-patch
    - name: Apply exact approved candidate and verify tree
      shell: bash
      run: 'set -euo pipefail

        echo ''c10697ff4b4305128e91c3376955720c975b22629ba126b61470573da27de593  reviewed-patch/candidate-approved.patch'' | sha256sum --check --strict

        git apply --index reviewed-patch/candidate-approved.patch

        test "$(git write-tree)" = "c160c4587a29ae8952431231cd81d38ee52e71b6"

        rm -rf reviewed-patch

        '
    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@v6
    - name: Build OpenADS ACE library
      run: 'cmake --preset ninja-clang

        cmake --build build/ninja-clang --config Release --target openads_ace

        '
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: ffi
        ini-values: ffi.enable=1
    - name: Install PHP dependencies
      working-directory: bindings/php
      run: composer install --no-interaction
    - name: Run PHP binding tests
      working-directory: bindings/php
      env:
        OPENADS_ACE_LIB: ${{ github.workspace }}/build/ninja-clang/src/libace64.so
      run: composer test
    needs: candidate
  source-sql-uri-smoke:
    name: SQL URI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.candidate.outputs.head }}
    - uses: actions/download-artifact@v4
      with:
        name: reviewed-candidate-patch
        path: reviewed-patch
    - name: Apply exact approved candidate and verify tree
      shell: bash
      run: 'set -euo pipefail

        echo ''c10697ff4b4305128e91c3376955720c975b22629ba126b61470573da27de593  reviewed-patch/candidate-approved.patch'' | sha256sum --check --strict

        git apply --index reviewed-patch/candidate-approved.patch

        test "$(git write-tree)" = "c160c4587a29ae8952431231cd81d38ee52e71b6"

        rm -rf reviewed-patch

        '
    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@v6
    - name: Configure
      run: cmake --preset ninja-clang
      shell: bash
    - name: Build unit tests
      run: cmake --build build/ninja-clang --config Release --target openads_unit_tests
      shell: bash
    - name: Run SQL URI smoke tests
      run: "ctest --test-dir build/ninja-clang -C Release --output-on-failure \\\n  -R \"sql_uri_smoke|sqlite_filter_pushdown|sqlite_seek_smoke\"\n"
      shell: bash
    needs: candidate
  source-sql-live-pg-maria:
    name: SQL live PG + Maria
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: test
        ports:
        - 3306:3306
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.candidate.outputs.head }}
    - uses: actions/download-artifact@v4
      with:
        name: reviewed-candidate-patch
        path: reviewed-patch
    - name: Apply exact approved candidate and verify tree
      shell: bash
      run: 'set -euo pipefail

        echo ''c10697ff4b4305128e91c3376955720c975b22629ba126b61470573da27de593  reviewed-patch/candidate-approved.patch'' | sha256sum --check --strict

        git apply --index reviewed-patch/candidate-approved.patch

        test "$(git write-tree)" = "c160c4587a29ae8952431231cd81d38ee52e71b6"

        rm -rf reviewed-patch

        '
    - name: Install build deps
      run: 'sudo apt-get update

        sudo apt-get install -y ninja-build libpq-dev libmariadb-dev

        '
    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@v6
    - name: Configure (PostgreSQL + MariaDB)
      run: "cmake --preset ninja-clang \\\n  -DOPENADS_WITH_POSTGRESQL=ON \\\n  -DOPENADS_WITH_MARIADB=ON\n"
      shell: bash
    - name: Build unit tests
      run: cmake --build build/ninja-clang --config Release --target openads_unit_tests
      shell: bash
    - name: Run live PG + Maria smoke tests
      env:
        OPENADS_TEST_PG_URI: postgresql://postgres@127.0.0.1:5432/postgres
        OPENADS_TEST_MARIADB_URI: mariadb://root@127.0.0.1:3306/test
      run: "ctest --test-dir build/ninja-clang -C Release --output-on-failure \\\n  -R \"pg_live_smoke|maria_live_smoke\"\n"
      shell: bash
    needs: candidate
  source-sql-live-mssql:
    name: SQL live MSSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: OpenADS_CI_Passw0rd!
        ports:
        - 1433:1433
        options: --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P OpenADS_CI_Passw0rd! -Q 'SELECT 1' || exit 1" --health-interval 10s
          --health-timeout 5s --health-retries 10 --health-start-period 30s
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.candidate.outputs.head }}
    - uses: actions/download-artifact@v4
      with:
        name: reviewed-candidate-patch
        path: reviewed-patch
    - name: Apply exact approved candidate and verify tree
      shell: bash
      run: 'set -euo pipefail

        echo ''c10697ff4b4305128e91c3376955720c975b22629ba126b61470573da27de593  reviewed-patch/candidate-approved.patch'' | sha256sum --check --strict

        git apply --index reviewed-patch/candidate-approved.patch

        test "$(git write-tree)" = "c160c4587a29ae8952431231cd81d38ee52e71b6"

        rm -rf reviewed-patch

        '
    - name: Install build deps
      run: sudo apt-get update && sudo apt-get install -y ninja-build
    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@v6
    - name: Configure (MSSQL)
      run: cmake --preset ninja-clang -DOPENADS_WITH_MSSQL=ON -DOPENADS_WITH_TLS=ON
      shell: bash
    - name: Build unit tests
      run: cmake --build build/ninja-clang --config Release --target openads_unit_tests
      shell: bash
    - name: Run live MSSQL smoke test
      env:
        OPENADS_TEST_MSSQL_CONNSTR: mssql://sa:OpenADS_CI_Passw0rd!@127.0.0.1:1433/master
      run: "ctest --test-dir build/ninja-clang -C Release --output-on-failure \\\n  -R mssql_live_smoke\n"
      shell: bash
    needs: candidate
  source-sql-live-firebird:
    name: SQL live Firebird
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.candidate.outputs.head }}
    - uses: actions/download-artifact@v4
      with:
        name: reviewed-candidate-patch
        path: reviewed-patch
    - name: Apply exact approved candidate and verify tree
      shell: bash
      run: 'set -euo pipefail

        echo ''c10697ff4b4305128e91c3376955720c975b22629ba126b61470573da27de593  reviewed-patch/candidate-approved.patch'' | sha256sum --check --strict

        git apply --index reviewed-patch/candidate-approved.patch

        test "$(git write-tree)" = "c160c4587a29ae8952431231cd81d38ee52e71b6"

        rm -rf reviewed-patch

        '
    - name: Install build deps
      run: 'sudo apt-get update

        sudo apt-get install -y ninja-build firebird-dev firebird3.0-utils

        '
    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@v6
    - name: Seed embedded Firebird fixture
      run: 'mkdir -p /tmp/openads-fb

        cat > /tmp/openads-fb/seed.sql <<''EOF''

        CREATE DATABASE ''/tmp/openads-fb/live.fdb'' USER ''SYSDBA'' DEFAULT CHARACTER SET UTF8;

        EXIT;

        EOF

        isql-fb -user SYSDBA -i /tmp/openads-fb/seed.sql

        '
    - name: Configure (Firebird)
      run: cmake --preset ninja-clang -DOPENADS_WITH_FIREBIRD=ON
      shell: bash
    - name: Build unit tests
      run: cmake --build build/ninja-clang --config Release --target openads_unit_tests
      shell: bash
    - name: Run live Firebird smoke test
      env:
        OPENADS_TEST_FIREBIRD_DB: /tmp/openads-fb/live.fdb
      run: "ctest --test-dir build/ninja-clang -C Release --output-on-failure \\\n  -R firebird_live_smoke\n"
      shell: bash
    needs: candidate
  source-harbour-smoke:
    name: Harbour smoke (Windows)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.candidate.outputs.head }}
    - uses: actions/download-artifact@v4
      with:
        name: reviewed-candidate-patch
        path: reviewed-patch
    - name: Apply exact approved candidate and verify tree
      shell: bash
      run: 'set -euo pipefail

        echo ''c10697ff4b4305128e91c3376955720c975b22629ba126b61470573da27de593  reviewed-patch/candidate-approved.patch'' | sha256sum --check --strict

        git apply --index reviewed-patch/candidate-approved.patch

        test "$(git write-tree)" = "c160c4587a29ae8952431231cd81d38ee52e71b6"

        rm -rf reviewed-patch

        '
    - name: Cache Harbour toolchain
      uses: actions/cache@v4
      id: harbour-cache
      with:
        path: ${{ runner.temp }}/harbour-ci
        key: harbour-core-master-msvc64-v5-${{ hashFiles('tools/scripts/bootstrap_harbour_ci.ps1') }}
    - name: Configure OpenADS
      run: cmake --preset msvc-x64
      shell: bash
    - name: Build OpenADS + make_cdx
      run: cmake --build build/msvc-x64 --config Release --target openads_ace make_cdx
      shell: bash
    - name: Bootstrap Harbour
      run: pwsh -File tools/scripts/bootstrap_harbour_ci.ps1
      env:
        HARBOUR_CI_ROOT: ${{ runner.temp }}/harbour-ci
        OPENADS_ROOT: ${{ github.workspace }}
        OPENADS_BUILD: ${{ github.workspace }}/build/msvc-x64
        GIT_TERMINAL_PROMPT: '0'
    - name: Run Harbour smoke
      run: pwsh -File tools/scripts/run_harbour_smoke.ps1
      env:
        OPENADS_BUILD: ${{ github.workspace }}/build/msvc-x64
        HARBOUR_ROOT: ${{ runner.temp }}/harbour-ci
    needs: candidate
  package-build:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2022
          arch: x64
          preset: msvc-x64
          artifact_ext: zip
          cmake_extra: ''
        - os: windows-2022
          arch: x86
          preset: msvc-x86
          artifact_ext: zip
          cmake_extra: ''
        - os: ubuntu-24.04
          arch: x64
          preset: ninja-clang
          artifact_ext: tar.gz
          cmake_extra: ''
        - os: macos-14
          arch: universal
          preset: default
          artifact_ext: tar.gz
          cmake_extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.candidate.outputs.head }}
    - uses: actions/download-artifact@v4
      with:
        name: reviewed-candidate-patch
        path: reviewed-patch
    - name: Apply exact approved candidate and verify tree
      shell: bash
      run: 'set -euo pipefail

        echo ''c10697ff4b4305128e91c3376955720c975b22629ba126b61470573da27de593  reviewed-patch/candidate-approved.patch'' | sha256sum --check --strict

        git apply --index reviewed-patch/candidate-approved.patch

        test "$(git write-tree)" = "c160c4587a29ae8952431231cd81d38ee52e71b6"

        rm -rf reviewed-patch

        '
    - name: Resolve tag
      id: tag
      shell: bash
      run: 'T="v1.09.74"

        if [ -z "$T" ]; then T="${GITHUB_REF#refs/tags/}"; fi

        echo "tag=$T" >> "$GITHUB_OUTPUT"

        echo "version=${T#v}" >> "$GITHUB_OUTPUT"

        '
    - name: Install Ninja (Linux / macOS)
      if: runner.os != 'Windows'
      uses: seanmiddleditch/gha-setup-ninja@v6
    - name: Cache Harbour SDK (Linux)
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/harbour-udf
        key: harbour-udf-linux-4ec2e154ed92757418bc30af571ab90240ab3209-v1
    - name: Provision Harbour SDK (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        HARBOUR_REF: 4ec2e154ed92757418bc30af571ab90240ab3209
      run: "set -e\nHB=\"$RUNNER_TEMP/harbour-udf\"\necho \"HB_ROOT=$HB/install\" >> \"$GITHUB_ENV\"\nif [ -f \"$HB/install/include/hbvm.h\" ] && \\\n \
        \  [ -n \"$(find \"$HB/install\" -name 'libhbvmmt.a' 2>/dev/null | head -1)\" ] && \\\n   [ -n \"$(find \"$HB/install\" -name harbour -type f 2>/dev/null\
        \ | head -1)\" ]; then\n  echo \"Harbour SDK cached at $HB/install\"\nelse\n  sudo apt-get update\n  sudo apt-get install -y build-essential libncurses-dev\
        \ libx11-dev\n  rm -rf \"$HB\"\n  mkdir -p \"$HB\"\n  git clone --depth 1 --branch master https://github.com/harbour/core.git \"$HB/src\"\n  git\
        \ -C \"$HB/src\" fetch --depth 1 origin \"$HARBOUR_REF\"\n  git -C \"$HB/src\" checkout \"$HARBOUR_REF\"\n  cd \"$HB/src\"\n  make -j\"$(nproc)\"\
        \ install HB_INSTALL_PREFIX=\"$HB/install\" HB_BUILD_3RDEXT=no\nfi\n# Resolve exact SDK paths (no layout guessing in CMake):\n# headers, MT VM archive,\
        \ compiler binary.\nHB_INC=\"$(dirname \"$(find \"$HB/install\" -name hbvm.h | head -1)\")\"\nHB_LIBDIR=\"$(dirname \"$(find \"$HB/install\" -name\
        \ 'libhbvmmt.a' | head -1)\")\"\nHB_CC=\"$(find \"$HB/install\" -name harbour -type f -executable | head -1)\"\necho \"Harbour SDK layout:\"\necho\
        \ \"  include: ${HB_INC:-MISSING}\"\necho \"  libdir:  ${HB_LIBDIR:-MISSING}\"\necho \"  compiler:${HB_CC:-MISSING}\"\nif [ -z \"$HB_INC\" ] ||\
        \ [ -z \"$HB_LIBDIR\" ] || [ -z \"$HB_CC\" ]; then\n  echo \"::error::Harbour SDK layout unexpected — full listing:\"\n  find \"$HB/install\" -maxdepth\
        \ 4 | sort | head -80\n  exit 1\nfi\n{\n  echo \"HARBOUR_INCLUDE_DIR=$HB_INC\"\n  echo \"HARBOUR_LIB_DIR=$HB_LIBDIR\"\n  echo \"HARBOUR_COMPILER=$HB_CC\"\
        \n} >> \"$GITHUB_ENV\"\n"
    - name: Configure
      shell: bash
      run: "cmake --preset ${{ matrix.preset }} \\\n      -DOPENADS_WITH_TLS=ON \\\n      -DOPENADS_WITH_HTTP=ON \\\n      -DOPENADS_VERSION_FORCE=\"${{\
        \ steps.tag.outputs.version }}\" \\\n      ${{ matrix.cmake_extra }} \\\n      ${{ runner.os == 'Linux' && format('-DOPENADS_WITH_HARBOUR_UDF=ON\
        \ -DHARBOUR_INCLUDE_DIR={0} -DHARBOUR_LIB_DIR={1} -DHARBOUR_COMPILER={2}', env.HARBOUR_INCLUDE_DIR, env.HARBOUR_LIB_DIR, env.HARBOUR_COMPILER) ||\
        \ '' }}\n"
    - name: Build
      run: cmake --build build/${{ matrix.preset }} --config Release
    - name: Test
      timeout-minutes: ${{ startsWith(matrix.os, 'macos') && 20 || 30 }}
      run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure -C Release
    - name: Set up MinGW for the static ACE library
      if: always() && runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.arch == 'x64' && 'MINGW64' || 'MINGW32' }}
        release: false
        update: false
        install: ${{ matrix.arch == 'x64' && 'mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake python' || 'mingw-w64-i686-toolchain mingw-w64-i686-cmake
          python' }}
    - name: Build static ACE library (MinGW)
      if: always() && runner.os == 'Windows'
      shell: msys2 {0}
      run: "cmake -S . -B build/mingw-${{ matrix.arch }} -G \"MinGW Makefiles\" \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DOPENADS_BUILD_TESTS=ON\
        \ \\\n      -DOPENADS_VERSION_FORCE=\"${{ steps.tag.outputs.version }}\" \\\n      -DOPENADS_WITH_HTTP=OFF \\\n      -DOPENADS_WITH_TLS=OFF \\\n\
        \      -DOPENADS_WARNINGS_AS_ERRORS=OFF\ncmake --build build/mingw-${{ matrix.arch }} \\\n      --target openads_ace_static openads_unit_tests -j\"\
        $(nproc)\"\nctest --test-dir build/mingw-${{ matrix.arch }} --output-on-failure -C Release\nls -la build/mingw-${{ matrix.arch }}/src/libopenace*.a\n"
    - name: Regenerate MinGW DLL imports and link health probe
      if: always() && runner.os == 'Windows'
      shell: msys2 {0}
      run: "set -euo pipefail\nBITS=\"${{ matrix.arch == 'x64' && '64' || '32' }}\"\nmkdir -p build/fresh-imports\npython3 tests/mingw_import_parser_test.py\n\
        python3 tools/scripts/regenerate_mingw_imports.py \\\n  \"build/${{ matrix.preset }}/src/Release/openace${BITS}.dll\" \\\n  \"dist/import-libs/${{\
        \ matrix.arch }}/mingw/libace${BITS}.a\" \\\n  \"build/fresh-imports/libace${BITS}.a\" \"$BITS\"\n"
    - name: Stage release files (POSIX)
      if: always() && runner.os != 'Windows'
      shell: bash
      run: "STAGE=\"openads-${{ steps.tag.outputs.version }}-${{ runner.os == 'Linux' && 'linux' || 'macos' }}-${{ matrix.arch }}\"\nmkdir -p \"$STAGE\"\
        \nBUILD=\"build/${{ matrix.preset }}\"\n# Engine shared lib is built as libopenace64.{so,dylib}. Ship it,\n# plus a drop-in-named copy libace64.*\
        \ for apps that load by the\n# canonical ACE name.\nfor f in \"$BUILD\"/src/libopenace64.*; do\n  [ -e \"$f\" ] || continue\n  cp \"$f\" \"$STAGE/\"\
        \n  cp \"$f\" \"$STAGE/$(basename \"$f\" | sed 's/libopenace64/libace64/')\"\ndone\n# Server + bench CLIs\ncp \"$BUILD\"/tools/serverd/openads_serverd\
        \ \"$STAGE/\"\ncp \"$BUILD\"/tools/bench/openads_bench   \"$STAGE/\"\ncp LICENSE NOTICE README.md openads.ini.sample \"$STAGE/\"\nmkdir -p \"$STAGE/include/openads\"\
        \ncp include/openads/ace.h \"$STAGE/include/ace.h\"\ncp include/openads/{ace,error,openads_sql,platform,version}.h \"$STAGE/include/openads/\"\n\
        mkdir -p \"$STAGE/contrib/oads_hb\"\ncp contrib/oads_hb/{oads_hb.c,oads_stats_display.prg,README.md} \"$STAGE/contrib/oads_hb/\"\ntar czvf \"$STAGE.tar.gz\"\
        \ \"$STAGE\"\nls -la \"$STAGE.tar.gz\"\necho \"ASSET=$STAGE.tar.gz\" >> \"$GITHUB_ENV\"\n"
    - name: Stage release files (Windows)
      if: always() && runner.os == 'Windows'
      shell: pwsh
      run: "$stage = \"openads-${{ steps.tag.outputs.version }}-windows-${{ matrix.arch }}\"\nNew-Item -ItemType Directory -Path $stage | Out-Null\n$build\
        \ = \"build/${{ matrix.preset }}\"\n$bits  = if (\"${{ matrix.arch }}\" -eq \"x64\") { \"64\" } else { \"32\" }\n$builtDll = \"$build/src/Release/openace$bits.dll\"\
        \n$builtLib = \"$build/src/Release/openace$bits.lib\"\nif (-not (Test-Path $builtDll)) {\n    throw \"Engine DLL missing: $builtDll\"\n}\nif (-not\
        \ (Test-Path $builtLib)) {\n    throw \"Import library missing: $builtLib\"\n}\n# Ship BOTH names at the archive root:\n#   openace64.dll / openace32.dll\
        \ — OpenADS build product (PHP ext,\n#     side-by-side with SAP ACE)\n#   ace64.dll     / ace32.dll     — drop-in for Harbour rddads / FWH\nCopy-Item\
        \ $builtDll \"$stage/openace$bits.dll\"\nCopy-Item $builtLib \"$stage/openace$bits.lib\"\nCopy-Item \"$build/src/Release/openace$bits.exp\" \"$stage/\"\
        \ -ErrorAction SilentlyContinue\nCopy-Item $builtDll \"$stage/ace$bits.dll\"\nCopy-Item $builtLib \"$stage/ace$bits.lib\"\nforeach ($req in @(\n\
        \    \"openace$bits.dll\", \"openace$bits.lib\",\n    \"ace$bits.dll\",     \"ace$bits.lib\")) {\n    if (-not (Test-Path \"$stage/$req\")) {\n\
        \        throw \"Release staging incomplete: missing $req\"\n    }\n}\n# Per-compiler import libraries (MSVC / MinGW-GCC / Borland) for\n# ace<bits>.dll\
        \ — prebuilt under dist/import-libs because the CI\n# runners have no Borland toolchain (see dist/import-libs/gen.ps1).\nNew-Item -ItemType Directory\
        \ \"$stage/lib\" | Out-Null\nCopy-Item -Recurse \"dist/import-libs/${{ matrix.arch }}/*\" \"$stage/lib/\"\n# Replace stale MinGW archives with this\
        \ DLL's actual exports.\nCopy-Item \"build/fresh-imports/libace$bits.a\" \"$stage/lib/mingw/libace$bits.a\" -Force\n# Static ACE library (MinGW):\
        \ link into an hbmk2 -comp=mingw[64]\n# app and no ace<bits>.dll is needed at all. Built in the\n# \"Build static ACE library (MinGW)\" step above.\n\
        $staticLib = \"build/mingw-${{ matrix.arch }}/src/libopenace$bits.a\"\nif (-not (Test-Path $staticLib)) {\n    throw \"Static ACE library missing:\
        \ $staticLib\"\n}\nCopy-Item $staticLib \"$stage/libopenace$bits.a\"\n# Server + bench CLIs\nCopy-Item \"$build/tools/serverd/Release/openads_serverd.exe\"\
        \ \"$stage/\"\nCopy-Item \"$build/tools/bench/Release/openads_bench.exe\"     \"$stage/\"\nCopy-Item LICENSE,NOTICE,README.md,openads.ini.sample\
        \  $stage/\nCopy-Item QUICKSTART.md                              \"$stage/\" -ErrorAction SilentlyContinue\nNew-Item -ItemType Directory \"$stage/include/openads\"\
        \ -Force | Out-Null\nCopy-Item include/openads/ace.h \"$stage/include/ace.h\"\nCopy-Item include/openads/ace.h,include/openads/error.h,include/openads/openads_sql.h,include/openads/platform.h,include/openads/version.h\
        \ \"$stage/include/openads/\"\n# Harbour HB_FUNC wrappers for the oads_* VFS API — compiled\n# into the app, not shipped in the DLL. Arch-independent\
        \ C\n# source: both Windows zips carry it. (Pritpal Bedi.)\nNew-Item -ItemType Directory \"$stage/contrib/oads_hb\" -Force | Out-Null\nCopy-Item\
        \ contrib/oads_hb/oads_hb.c,contrib/oads_hb/oads_stats_display.prg,contrib/oads_hb/README.md \"$stage/contrib/oads_hb/\"\nif (\"${{ matrix.arch\
        \ }}\" -eq \"x86\") {\n    Copy-Item src/openads_ace_x86_stdcall.def      \"$stage/\"\n    # Ship the 32-bit MinGW import library at the archive\
        \ root too:\n    # 32-bit Harbour (hbmk2 -comp=mingw, rddads) links it directly.\n    # (Reported by Pritpal Bedi.)\n    Copy-Item build/fresh-imports/libace32.a\
        \ \"$stage/\"\n} else {\n    Copy-Item src/openads_ace.def                   \"$stage/\"\n}\nCompress-Archive -Path \"$stage/*\" -DestinationPath\
        \ \"$stage.zip\" -Force\nGet-Item \"$stage.zip\"\n\"ASSET=$stage.zip\" | Out-File -FilePath $env:GITHUB_ENV -Append\n"
    - name: Upload artifact (workflow run)
      if: always() && env.ASSET != ''
      uses: actions/upload-artifact@v4
      with:
        name: openads-${{ runner.os }}-${{ matrix.arch }}
        path: ${{ env.ASSET }}
    needs: candidate
  package-build-glibc231:
    name: ubuntu 20.04 container / x64 (glibc 2.31)
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 90
    steps:
    - name: Install bootstrap tools
      shell: bash
      run: "export DEBIAN_FRONTEND=noninteractive\napt-get update\napt-get install -y --no-install-recommends \\\n  git ca-certificates curl xz-utils\n"
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.candidate.outputs.head }}
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        name: reviewed-candidate-patch
        path: reviewed-patch
    - name: Apply exact approved candidate and verify tree
      shell: bash
      run: 'set -euo pipefail

        echo ''c10697ff4b4305128e91c3376955720c975b22629ba126b61470573da27de593  reviewed-patch/candidate-approved.patch'' | sha256sum --check --strict

        git apply --index reviewed-patch/candidate-approved.patch

        test "$(git write-tree)" = "c160c4587a29ae8952431231cd81d38ee52e71b6"

        rm -rf reviewed-patch

        '
    - name: Make the tag resolvable to git in the container
      shell: bash
      run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"

        git fetch --tags --force origin

        git describe --tags

        '
    - name: Resolve tag
      id: tag
      shell: bash
      run: 'T="v1.09.74"

        if [ -z "$T" ]; then T="${GITHUB_REF#refs/tags/}"; fi

        echo "tag=$T" >> "$GITHUB_OUTPUT"

        echo "version=${T#v}" >> "$GITHUB_OUTPUT"

        '
    - name: Install toolchain and CMake
      shell: bash
      run: "export DEBIAN_FRONTEND=noninteractive\napt-get update\napt-get install -y --no-install-recommends \\\n  build-essential g++-10 ninja-build pkg-config\
        \ \\\n  libncurses-dev libx11-dev bison flex python3 perl\ncurl -sSL -o /tmp/cmake.tar.gz \\\n  https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-linux-x86_64.tar.gz\n\
        mkdir -p /opt/cmake\ntar xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1\necho \"/opt/cmake/bin\" >> \"$GITHUB_PATH\"\n/opt/cmake/bin/cmake\
        \ --version\n"
    - name: Cache Harbour SDK (glibc 2.31)
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/harbour-udf-glibc231
        key: harbour-udf-linux-glibc231-4ec2e154ed92757418bc30af571ab90240ab3209-v1
    - name: Provision Harbour SDK (glibc 2.31)
      shell: bash
      env:
        HARBOUR_REF: 4ec2e154ed92757418bc30af571ab90240ab3209
      run: "set -e\nHB=\"$RUNNER_TEMP/harbour-udf-glibc231\"\necho \"HB_ROOT=$HB/install\" >> \"$GITHUB_ENV\"\nif [ -f \"$HB/install/include/hbvm.h\" ]\
        \ && \\\n   [ -n \"$(find \"$HB/install\" -name 'libhbvmmt.a' 2>/dev/null | head -1)\" ] && \\\n   [ -n \"$(find \"$HB/install\" -name harbour -type\
        \ f 2>/dev/null | head -1)\" ]; then\n  echo \"Harbour SDK cached at $HB/install\"\nelse\n  rm -rf \"$HB\"\n  mkdir -p \"$HB\"\n  git clone --depth\
        \ 1 --branch master https://github.com/harbour/core.git \"$HB/src\"\n  git -C \"$HB/src\" fetch --depth 1 origin \"$HARBOUR_REF\"\n  git -C \"$HB/src\"\
        \ checkout \"$HARBOUR_REF\"\n  cd \"$HB/src\"\n  make -j\"$(nproc)\" install HB_INSTALL_PREFIX=\"$HB/install\" HB_BUILD_3RDEXT=no\nfi\nHB_INC=\"\
        $(dirname \"$(find \"$HB/install\" -name hbvm.h | head -1)\")\"\nHB_LIBDIR=\"$(dirname \"$(find \"$HB/install\" -name 'libhbvmmt.a' | head -1)\"\
        )\"\nHB_CC=\"$(find \"$HB/install\" -name harbour -type f -executable | head -1)\"\necho \"Harbour SDK layout:\"\necho \"  include: ${HB_INC:-MISSING}\"\
        \necho \"  libdir:  ${HB_LIBDIR:-MISSING}\"\necho \"  compiler:${HB_CC:-MISSING}\"\nif [ -z \"$HB_INC\" ] || [ -z \"$HB_LIBDIR\" ] || [ -z \"$HB_CC\"\
        \ ]; then\n  echo \"::error::Harbour SDK layout unexpected - full listing:\"\n  find \"$HB/install\" -maxdepth 4 | sort | head -80\n  exit 1\nfi\n\
        {\n  echo \"HARBOUR_INCLUDE_DIR=$HB_INC\"\n  echo \"HARBOUR_LIB_DIR=$HB_LIBDIR\"\n  echo \"HARBOUR_COMPILER=$HB_CC\"\n} >> \"$GITHUB_ENV\"\n"
    - name: Configure
      shell: bash
      run: "cmake --preset ninja-clang \\\n      -DOPENADS_VERSION_FORCE=${{ steps.tag.outputs.version }} \\\n      -DCMAKE_C_COMPILER=gcc-10 \\\n     \
        \ -DCMAKE_CXX_COMPILER=g++-10 \\\n      -DOPENADS_WITH_TLS=ON \\\n      -DOPENADS_WITH_HTTP=ON \\\n      -DOPENADS_WARNINGS_AS_ERRORS=OFF \\\n \
        \     -DOPENADS_WITH_HARBOUR_UDF=ON \\\n      -DHARBOUR_INCLUDE_DIR=\"$HARBOUR_INCLUDE_DIR\" \\\n      -DHARBOUR_LIB_DIR=\"$HARBOUR_LIB_DIR\" \\\
        \n      -DHARBOUR_COMPILER=\"$HARBOUR_COMPILER\"\n"
    - name: Build
      run: cmake --build build/ninja-clang --config Release
    - name: Test
      timeout-minutes: 30
      run: ctest --test-dir build/ninja-clang --output-on-failure -C Release
    - name: Stage release files
      shell: bash
      run: "STAGE=\"openads-${{ steps.tag.outputs.version }}-linux-glibc231\"\nmkdir -p \"$STAGE\"\nBUILD=\"build/ninja-clang\"\nfor f in \"$BUILD\"/src/libopenace64.*;\
        \ do\n  [ -e \"$f\" ] || continue\n  cp \"$f\" \"$STAGE/\"\n  cp \"$f\" \"$STAGE/$(basename \"$f\" | sed 's/libopenace64/libace64/')\"\ndone\ncp\
        \ \"$BUILD\"/tools/serverd/openads_serverd \"$STAGE/\"\ncp \"$BUILD\"/tools/bench/openads_bench   \"$STAGE/\"\ncp LICENSE NOTICE README.md openads.ini.sample\
        \ \"$STAGE/\"\nmkdir -p \"$STAGE/include/openads\"\ncp include/openads/ace.h \"$STAGE/include/ace.h\"\ncp include/openads/{ace,error,openads_sql,platform,version}.h\
        \ \"$STAGE/include/openads/\"\nmkdir -p \"$STAGE/contrib/oads_hb\"\ncp contrib/oads_hb/{oads_hb.c,oads_stats_display.prg,README.md} \"$STAGE/contrib/oads_hb/\"\
        \ntar czvf \"$STAGE.tar.gz\" \"$STAGE\"\nls -la \"$STAGE.tar.gz\"\necho \"ASSET=$STAGE.tar.gz\" >> \"$GITHUB_ENV\"\n"
    - name: Verify glibc ceiling (<= 2.31)
      shell: bash
      run: "set -e\nSTAGE=\"openads-${{ steps.tag.outputs.version }}-linux-glibc231\"\nfail=0\nfor b in \"$STAGE\"/openads_serverd \"$STAGE\"/openads_bench\
        \ \\\n         \"$STAGE\"/libopenace64.so \"$STAGE\"/libace64.so; do\n  hit=$(objdump -T \"$b\" | grep -oE 'GLIBC_2\\.(3[2-9]|[4-9][0-9])' | sort\
        \ -uV || true)\n  if [ -n \"$hit\" ]; then\n    echo \"::error::$b references > GLIBC_2.31: $hit\"\n    fail=1\n  fi\ndone\n[ \"$fail\" -eq 0 ]\
        \ && echo \"All staged binaries within GLIBC_2.31.\"\n"
    - name: Upload artifact (workflow run)
      if: always() && env.ASSET != ''
      uses: actions/upload-artifact@v4
      with:
        name: openads-Linux-x64-glibc231
        path: ${{ env.ASSET }}
    needs: candidate
