          -        (void)refresh_record_count_();
          +    util::Result<void> refresh_record_count_from_disk() override {
          +        return refresh_record_count_();
               }
           
               // Drop the sequential read-ahead block (the engine calls this when a peer
          diff --git a/src/drivers/cache/cached_driver.h b/src/drivers/cache/cached_driver.h
          index 601d6b88..b8553404 100644
          --- a/src/drivers/cache/cached_driver.h
          +++ b/src/drivers/cache/cached_driver.h
          @@ -60,8 +60,9 @@ public:
                   bump_autoinc(std::uint16_t field_index) override;
           
               void invalidate_read_cache() noexcept override {}
          -    void refresh_record_count_from_disk() noexcept override {
          -        if (inner_) inner_->refresh_record_count_from_disk();
          +    util::Result<void> refresh_record_count_from_disk() override {
          +        if (inner_) return inner_->refresh_record_count_from_disk();
          +        return {};
               }
           
               TableCacheMode mode() const noexcept { return mode_; }
          diff --git a/src/drivers/cdx/cdx_driver.cpp b/src/drivers/cdx/cdx_driver.cpp
          index 60f2cf38..8a8af92e 100644
          --- a/src/drivers/cdx/cdx_driver.cpp
          +++ b/src/drivers/cdx/cdx_driver.cpp
          @@ -380,22 +380,19 @@ util::Result<void> CdxDriver::refresh_record_count_() {
                            (static_cast<std::uint32_t>(hdr_buf[5]) <<  8) |
                            (static_cast<std::uint32_t>(hdr_buf[6]) << 16) |
                            (static_cast<std::uint32_t>(hdr_buf[7]) << 24);
          -    // Harbour DBFCDX derives the record count from the FILE SIZE
          -    // (hb_dbfCalcRecCount) and flushes the header lazily — a peer's
          -    // just-appended record can be on disk while the header still lags.
          -    // Reading the header alone then hands the same recno to two writers
          -    // (one record overwritten, both keys in the index: 299 rows / 300
          -    // keys in the mixed stress test). Take the max of both views; zap()
          -    // truncates the file, so the size-derived count can never resurrect
          -    // zapped rows.
          +    // Match Harbour hb_dbfCalcRecCount for ordinary DBFs: the physical
          +    // file length, not the header count, is authoritative. Integer division
          +    // discards the optional EOF byte for ordinary record lengths. A partial
          +    // encryption bitmap follows the records, so that format retains its
          +    // header-count path. Full-table encryption keeps fixed-length records.
               if (!partial_enc_ && rec_len_ != 0) {
          -        // (a partially-encrypted table keeps a bitmap past the EOF record,
          -        // so its file size does not track the record count)
          -        if (auto sz = file_.size(); sz && sz.value() > hdr_len_) {
          -            const std::uint32_t size_count = static_cast<std::uint32_t>(
          -                (sz.value() - hdr_len_) / rec_len_);
          -            if (size_count > rec_count_) rec_count_ = size_count;
          +        auto sz = file_.size();
          +        if (!sz) return sz.error();
          +        if (sz.value() < hdr_len_) {
          +            return util::Error{5103, 0, "DBF body shorter than header", ""};
                   }
          +        rec_count_ = static_cast<std::uint32_t>(
          +            (sz.value() - hdr_len_) / rec_len_);
               }
               return {};
           }
          diff --git a/src/drivers/cdx/cdx_driver.h b/src/drivers/cdx/cdx_driver.h
          index a3a3b4bc..33f3930d 100644
          --- a/src/drivers/cdx/cdx_driver.h
          +++ b/src/drivers/cdx/cdx_driver.h
          @@ -39,8 +39,8 @@ public:
                   bump_autoinc(std::uint16_t field_index) override;
           
               void invalidate_read_cache() noexcept override { invalidate_read_cache_(); }
          -    void refresh_record_count_from_disk() noexcept override {
          -        (void)refresh_count_shared_();
          +    util::Result<void> refresh_record_count_from_disk() override {
          +        return refresh_count_shared_();
               }
           
               // M11.2 — encrypted DBF support. `encrypted()` reflects the
          diff --git a/src/drivers/driver_trait.h b/src/drivers/driver_trait.h
          index 312845ea..283b8893 100644
          --- a/src/drivers/driver_trait.h
          +++ b/src/drivers/driver_trait.h
          @@ -98,7 +98,7 @@ public:
               // when answering GetRecordCount to keep the value fresh across
               // concurrent clients.  Default no-op (drivers that cache the count
               // in rec_count_ must override).
          -    virtual void refresh_record_count_from_disk() noexcept {}
          +    virtual util::Result<void> refresh_record_count_from_disk() { return {}; }
           };
           
           } // namespace openads::drivers
          diff --git a/src/drivers/ntx/ntx_driver.h b/src/drivers/ntx/ntx_driver.h
          index ca284991..f986e8aa 100644
          --- a/src/drivers/ntx/ntx_driver.h
          +++ b/src/drivers/ntx/ntx_driver.h
          @@ -15,8 +15,8 @@ public:
           
