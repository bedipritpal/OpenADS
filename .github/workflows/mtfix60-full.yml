    - name: Actual worker crypto and Windows Job containment release gate
      shell: bash
      run: "set -euxo pipefail\nHB=\"$(cygpath -u \"$RUNNER_TEMP/harbour-server\")\"\nfor name in crypto_probe resource_probe;\
        \ do\n \"$HB/bin/win/mingw/harbour.exe\" tests/hrb/mutual/$name.prg -gh -o$name.hrb\n MSYS_NO_PATHCONV=1\
        \ icacls.exe $name.hrb /inheritance:r /grant \"$USERNAME:R\" /grant 'SYSTEM:R' /grant 'Administrators:R'\n\
        done\npython tests/hrb/mutual/crypto_probe.py \"$(cygpath -m \"$PWD/build-legacy/tools/serverd/openads_auth_worker.exe\"\
        )\" \"$(cygpath -m \"$PWD/crypto_probe.hrb\")\" | tee output/hrb-crypto-proof.txt\nbuild-legacy/tools/serverd/auth_resource_probe.exe\
        \ \"$(cygpath -m \"$PWD/build-legacy/tools/serverd/openads_auth_worker.exe\")\" \"$(cygpath -m \"$PWD/resource_probe.hrb\"\
        )\" | tee output/hrb-resource-proof.txt\n"
    - name: Full repository default unit regression in bounded batches
      shell: bash
      run: "set -euxo pipefail\npython - <<'PYBATCH'\nimport pathlib,subprocess,os,re,json,xml.etree.ElementTree\
        \ as ET\nimport sys\nsys.stdout.reconfigure(encoding=\"utf-8\")\nout=pathlib.Path('output');out.mkdir(exist_ok=True)\n\
        tmp=pathlib.Path('unit-native-tmp').resolve();tmp.mkdir(exist_ok=True)\nfor key in ('TMPDIR','TMP','TEMP'):os.environ[key]=str(tmp)\n\
        exe=str(pathlib.Path('build-legacy/tests/openads_unit_tests.exe').resolve())\nos.environ['OPENADS_TEST_SERVERD']=str(pathlib.Path('build-legacy/tools/serverd/openads_serverd.exe').resolve())\n\
        listing=subprocess.check_output([exe,'--count','-tce=*[slow]*,*flaky*'],text=True)\n(out/'unit-count.txt').write_text(listing);print(listing,flush=True)\n\
        match=re.search(r'test cases passing the current filters: (\\d+)',listing);assert match,listing\ncount=int(match.group(1));assert\
        \ count>1000\nseen={};errors=[]\nfor first in range(1,count+1,25):\n xml=out/('unit-'+str(first)+'.xml');log=out/('unit-'+str(first)+'.txt')\n\
        \ args=[exe,'-tce=*[slow]*,*flaky*','--first='+str(first),'--last='+str(first+24),'--reporters=xml','--out='+str(xml.resolve())]\n\
        \ try:\n  with log.open('w',encoding='utf-8') as f:r=subprocess.run(args,stdout=f,stderr=subprocess.STDOUT,timeout=180)\n\
        \  doc=ET.parse(xml)\n  cases=[c for c in doc.iter('TestCase') if c.get('skipped')!='true']\n  assert cases,(first,'No\
        \ executed cases')\n  for c in cases:\n   result=c.find('OverallResultsAsserts');ok=result is not None and\
        \ result.get('test_case_success')=='true'\n   name=c.get('name');assert name not in seen,(first,'duplicate',name)\n\
        \   seen[name]={'passed':ok,'assertions':dict(result.attrib) if result is not None else {},'file':pathlib.Path(c.get('filename')).name}\n\
        \  if r.returncode and all(v['passed'] for c in cases for v in [seen[c.get('name')]]):errors.append('Nonzero\
        \ batch exit '+str(first))\n except Exception as e:errors.append(str(first)+': '+repr(e))\n print('Batch',first,'complete;\
        \ cases',len(seen),'errors',len(errors),flush=True)\nsummary={'count':count,'executed':len(seen),'failed':sorted(n\
        \ for n,v in seen.items() if not v['passed']),'errors':errors,'cases':seen}\nif len(seen)!=count:summary['errors'].append('Coverage\
        \ mismatch')\n(out/'unit-summary.json').write_text(json.dumps(summary,indent=2))\n(out/'unit-batch-summary.txt').write_text('registered='+str(count)+'\
        \ executed='+str(len(seen))+' failed='+str(len(summary['failed']))+' harness_errors='+str(len(summary['errors']))+'\\\
        n'+'\\n'.join(summary['failed'])+'\\n'+'\\n'.join(summary['errors']),encoding='utf-8')\nprint((out/'unit-batch-summary.txt').read_text(encoding='utf-8'),flush=True)\n\
        \nPYBATCH\n"
    - name: Package DLL-only Vouch test kit
      run: "set -euxo pipefail\nmkdir -p delivery/mtfix60-full/{bin,lib,include,docs}\ncp output/openace32.dll\
        \ delivery/mtfix60-full/bin/\ncp kit/libopenace32.dll.a kit/librddads.a delivery/mtfix60-full/lib/\n\
        cp include/openads/ace.h \"$RUNNER_TEMP/harbour-old/contrib/rddads/ads.ch\" delivery/mtfix60-full/include/\n\
        cat > delivery/mtfix60-full/docs/README.txt <<'NOTES'\nMTFIX60 FULL TEST KIT, WINDOWS X86\nBuilt from 3bc1c245: mtfix59 plus ADT create-name/type fixes, scoped OrdKeyNo and REMOTE RelKeyPos fixes, SAP filter constants, and the 2a exclusive/FLock append-lock fix. Shared non-FLocked append locking is unchanged. Includes the V2 mutual auth test content, HRB crypto toolbox, worker resource limits.\n\n After-auth Hello adds one application\
        \ RTT (auth two becomes three).\n\n MD5/Blowfish legacy only; not identity proof/signatures.\n\n V2 mutual\
        \ auth opt-in. Public mock HRB only; replace with your real module. Not for production servers.\nRead MUTUAL-V2.txt and ACL-SETUP.txt\
        \ before use.\nZIP extraction loses the protected HRB ACL. Apply that step before server startup.\nExtract\
        \ into a new folder C:/OpenADS_mtfix60.\nUse include/ace.h and ads.ch. Keep this kit's import lib and RDD\
        \ together.\nLink additions: -LC:/OpenADS_mtfix60/lib -lrddads -lopenace32\nRemove -fullstatic. Copy bin/openace32.dll\
        \ beside VouchADS.exe.\nDo not copy the old combined libopenace32.a into this lib folder.\nHarbour searches\
        \ its own lib folder first: rename stale libopenace32.a,\nlibopenace32.dll.a and librddads.a there, and\
        \ disable scripts that re-copy them.\nThe import archive contains C function import thunks, not the C++\
        \ engine/runtime.\nDLL ABI: 32-bit Windows cdecl C exports. No Qt runtime required.\nMatch x86 architecture,\
        \ cdecl declarations and Harbour/RDD ABI, not GCC10.2 C++ ABI.\nStatic RDDADS/glue still needs the caller's\
        \ compatible Harbour C API.\nDLL's GCC C++/gcc/winpthread runtime is static; Windows system DLLs remain\
        \ required.\nLocal Windows proofs use Qt4.9.2 and Winlibs GCC10.2/binutils2.35.1.\nB_BIG threaded fixture\
        \ is a headless exact100-row stand-in, not full Vouch.\nNOTES\ncp output/source-commit.txt output/dll-pe.txt\
        \ output/owner-ld-version.txt output/repeat-summary.txt output/static-auth-stdout.txt delivery/mtfix60-full/docs/\n\
        cp -r kit/runtime-notices delivery/mtfix60-full/\ncp build-legacy/tools/serverd/openads_serverd.exe\
        \ build-legacy/tools/serverd/openads_auth_worker.exe delivery/mtfix60-full/bin/\ncp mutual-test-only.hrb\
