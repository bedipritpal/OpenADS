name: Stage 4 wire optimizations review on current parent
on:
  push:
    branches: [stage4/wire-optimizations]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Configure
        run: cmake --preset ninja-clang -DOPENADS_WITH_TLS=ON -DOPENADS_WARNINGS_AS_ERRORS=OFF
      - name: Build
        run: cmake --build build/ninja-clang --parallel 2
      - name: List tests
        run: ctest --test-dir build/ninja-clang -N
      - name: Unit suite and integration tests, soak excluded
        run: ctest --test-dir build/ninja-clang --output-on-failure -E soak
      - name: Explicit wire optimization tests
        shell: bash
        run: |
          set -o pipefail
          build/ninja-clang/tests/openads_unit_tests -tc='mtfix68*,mtfix67*,bottom count*,commit fusion*,append replacement*,checked commit flush*,pending field drain*,Commit slimming*' -tce='*[slow]*,*flaky*' | tee stage4-wire.txt
