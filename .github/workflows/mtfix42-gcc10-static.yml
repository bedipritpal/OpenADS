name: Publish UNMERGED external PSK spike for owner review
on:
  push:
    branches: [security/tls13-psk-native]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 50d51a5e64f62b6f980df0d6aaa4b2df9fc8868f
          fetch-depth: 0
      - name: Apply exact isolated spike, never main
        shell: bash
        run: |
          set -euo pipefail
          echo  > /tmp/spike.b64
          python3 -c "import base64,gzip,pathlib;pathlib.Path('/tmp/spike.patch').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path('/tmp/spike.b64').read_text())))"
          echo '9e13afda155351c9e0981d45999357a6d2e6c380e4d43323fcf3a56a42c7988c  /tmp/spike.patch' | sha256sum -c -
          test -z "$(git ls-remote origin refs/heads/spike-unmerged/tls13-external-psk)"
          git apply --check --index /tmp/spike.patch
          git apply --index /tmp/spike.patch
          git checkout -b spike-unmerged/tls13-external-psk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'UNMERGED PSK spike for Pritpal Bedi review; Windows ACL gate unresolved'
          git push origin HEAD:refs/heads/spike-unmerged/tls13-external-psk
