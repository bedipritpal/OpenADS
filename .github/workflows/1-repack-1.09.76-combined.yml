# Credit: Pritpal Bedi
# One-off repack: real 1.09.76 Windows build files (x86 client kit + x64
# server kit, binaries untouched) combined into ONE zip with a single
# top-level folder holding 32- and 64-bit files together, attached to
# release-1.09.76. Requested by Pritpal Bedi 2026-11-25; layout corrected
# same day per his message: only one folder, 32 and 64 bit files together.
# Colliding binaries are tagged _32/_64 (his openads_serverd_32/64 pattern);
# the 64-bit auth pair keeps its names (serverd spawns the worker by name).
name: Repack 1.09.76 Windows kits into one client+server zip
'on':
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  repack:
    name: Download, verify, repack, upload
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Download the real 1.09.76 Windows kits and the release checksums
      run: |
        set -euo pipefail
        B=https://github.com/bedipritpal/OpenADS/releases/download/release-1.09.76
        curl -fL -o x86.zip "$B/openads-1.09.76-windows-x86.zip"
        curl -fL -o x64.zip "$B/openads-1.09.76-windows-x64.zip"
        curl -fL -o SHA256SUMS.txt "$B/SHA256SUMS.txt"
        curl -fL -o ALL-ASSET-SHA256SUMS.txt "$B/ALL-ASSET-SHA256SUMS.txt"
        echo '--- SHA256SUMS.txt'; cat SHA256SUMS.txt
        echo '--- ALL-ASSET-SHA256SUMS.txt'; cat ALL-ASSET-SHA256SUMS.txt
    - name: Verify downloaded kits against the release's own published checksums
      run: |
        set -euo pipefail
        X86=$(sha256sum x86.zip | cut -d' ' -f1)
        X64=$(sha256sum x64.zip | cut -d' ' -f1)
        echo "downloaded x86: $X86"
        echo "downloaded x64: $X64"
        grep -q "$X86" SHA256SUMS.txt ALL-ASSET-SHA256SUMS.txt
        grep -q "$X64" SHA256SUMS.txt ALL-ASSET-SHA256SUMS.txt
        echo 'both kits match the release checksums - binaries untouched'
    - name: Repack into one folder with 32 and 64 bit files together
      run: |
        set -euo pipefail
        mkdir -p x86 x64 stage/openads-1.09.76-windows
        unzip -q x86.zip -d x86
        unzip -q x64.zip -d x64
        STAGE=stage/openads-1.09.76-windows
        # x64 tree first (adds the 64-bit auth pair), excluding the two
        # colliding ROOT binaries (auth/openads_serverd.exe must stay)
        (cd x64 && find . -type f ! -path './openads_serverd.exe' ! -path './openads_bench.exe' -exec cp --parents {} ../$STAGE/ \;)
        # x86-only files (paths already staged are byte-identical shared docs)
        (cd x86 && find . -type f ! -path './openads_serverd.exe' ! -path './openads_bench.exe' | while read -r f; do [ -f "../$STAGE/$f" ] || cp --parents "$f" ../$STAGE/; done)
        # colliding binaries tagged _32/_64 (openads_serverd_32/64 pattern)
        cp x86/openads_serverd.exe $STAGE/openads_serverd_32.exe
        cp x64/openads_serverd.exe $STAGE/openads_serverd_64.exe
        cp x86/openads_bench.exe   $STAGE/openads_bench_32.exe
        cp x64/openads_bench.exe   $STAGE/openads_bench_64.exe
        (cd stage && zip -q -r -X ../openads-1.09.76-windows-client-server.zip openads-1.09.76-windows)
        ls -la openads-1.09.76-windows-client-server.zip
        echo '--- combined sha256:'
        sha256sum openads-1.09.76-windows-client-server.zip
        echo '--- file list (expect 50 files):'
        (cd stage && find . -type f | sort)
        test "$(cd stage && find . -type f | wc -l)" = 50
    - name: Attach the combined zip to release-1.09.76
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        gh release upload release-1.09.76 openads-1.09.76-windows-client-server.zip --repo bedipritpal/OpenADS --clobber
    - name: Verify the uploaded asset downloads byte-identical
      run: |
        set -euo pipefail
        sleep 5
        curl -fL -o check.zip https://github.com/bedipritpal/OpenADS/releases/download/release-1.09.76/openads-1.09.76-windows-client-server.zip
        A=$(sha256sum openads-1.09.76-windows-client-server.zip | cut -d' ' -f1)
        B=$(sha256sum check.zip | cut -d' ' -f1)
        echo "uploaded: $A"; echo "served:   $B"
        test "$A" = "$B"
        echo 'ASSET VERIFIED'
