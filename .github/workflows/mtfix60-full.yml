    timeout-minutes: 140
  x64kit:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: release/mtfix60-full
    - name: Verify clean main-based source
      shell: bash
      run: |
        set -euxo pipefail
        test "$GITHUB_REF" = refs/heads/release/mtfix60-full
        git merge-base --is-ancestor 3bc1c245cb348c0264e06ef2254509be2188edaa HEAD
        test -z "$(git diff --name-only 3bc1c245cb348c0264e06ef2254509be2188edaa HEAD -- . ':!.github/workflows')"
    - name: Download pinned Winlibs GCC 10.2 x86_64 (same GCC version as the x86 kit)
      shell: pwsh
      run: |
        Invoke-WebRequest 'https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-x86_64-posix-seh-gcc-10.2.0-mingw-w64-8.0.0-r8.7z' -OutFile "$env:RUNNER_TEMP/winlibs64.7z"
        if((Get-FileHash "$env:RUNNER_TEMP/winlibs64.7z" -Algorithm SHA256).Hash.ToLower() -ne '1e525afc8a3362a1054d7a9a44c8f496a7a652b224b79dbf4b6e5ca8c1012b74'){throw 'Winlibs x64 hash mismatch'}
        & 7z x "$env:RUNNER_TEMP/winlibs64.7z" "-o$env:RUNNER_TEMP/winlibs64" -y
    - name: Build Harbour (x64) and the x64 engine, DLL, server and auth worker
      shell: bash
      run: |
        set -euxo pipefail
        export PATH="$(cygpath -u "$RUNNER_TEMP/winlibs64/mingw64/bin"):$PATH"
        test "$(gcc -dumpversion)" = 10.2.0
        gcc -dumpmachine
        git clone https://github.com/harbour/core.git "$RUNNER_TEMP/harbour-x64"
        git -C "$RUNNER_TEMP/harbour-x64" checkout --detach 6deac9cf3ad977ae829e5bca543d553b92dd4b6d
        export HB_PLATFORM=win HB_COMPILER=mingw64 HB_BUILD_CONTRIBS=no HB_BUILD_DYN=no
        mingw32-make -C "$RUNNER_TEMP/harbour-x64" -j2
        HB="$(cygpath -m "$RUNNER_TEMP/harbour-x64")"
        ls "$HB/lib/win/" || true
        HBLIB="$RUNNER_TEMP/harbour-x64/lib/win/mingw64"
        HBBIN="$RUNNER_TEMP/harbour-x64/bin/win/mingw64"
        test -f "$HBBIN/harbour.exe"
        printf '\nif(WIN32 AND MINGW)\n set_target_properties(openads_ace PROPERTIES PREFIX "")\nendif()\n' >> src/CMakeLists.txt
        cmake -S . -B build-x64 -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0600 \
          -DCMAKE_SHARED_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
          -DOPENADS_BUILD_TESTS=OFF -DOPENADS_WITH_HTTP=OFF -DOPENADS_WITH_TLS=ON \
          -DOPENADS_VERSION_FORCE=1.09.74-mtfix60-full-test -DOPENADS_AUTH_CAPACITY_TEST_SWITCH=OFF \
          -DOPENADS_WITH_HARBOUR_UDF=ON -DHARBOUR_COMPILER="$(cygpath -m "$HBBIN")/harbour.exe" \
          -DHARBOUR_INCLUDE_DIR="$HB/include" -DHARBOUR_LIB_DIR="$(cygpath -m "$HBLIB")" \
          -DOPENADS_HARBOUR_LIBS="hbvmmt;hbrtl;hbmacro;hbpcre;hblang;hbcpage;hbrdd;rddfpt;rddntx;hbsix;hbcommon" \
          -DOPENADS_WARNINGS_AS_ERRORS=OFF
        cmake --build build-x64 --target openads_ace openads_serverd openads_auth_worker -j2
        find build-x64 -name '*.dll' -o -name '*.exe' -o -name '*.dll.a' | sort
    - name: Verify the binaries are 64-bit and the server starts
      shell: bash
      run: |
        set -euxo pipefail
        export PATH="$(cygpath -u "$RUNNER_TEMP/winlibs64/mingw64/bin"):$PATH"
        mkdir -p output
        for f in build-x64/src/openace64.dll build-x64/tools/serverd/openads_serverd.exe build-x64/tools/serverd/openads_auth_worker.exe; do
          test -f "$f"
          objdump -f "$f" | tee -a output/pe-check.txt
          objdump -f "$f" | grep -q 'pei-x86-64'
        done
        build-x64/tools/serverd/openads_serverd.exe --help > output/serverd-help.txt 2>&1 || true
        head -5 output/serverd-help.txt
    - name: Package x64 test kit
      shell: bash
      run: |
        set -euxo pipefail
        D=delivery/mtfix60-x64
        mkdir -p $D/bin $D/lib $D/include $D/docs
        cp build-x64/src/openace64.dll build-x64/tools/serverd/openads_serverd.exe build-x64/tools/serverd/openads_auth_worker.exe $D/bin/
        cp build-x64/src/*.dll.a $D/lib/ 2>/dev/null || true
        cp include/openads/ace.h $D/include/
        cp output/pe-check.txt output/serverd-help.txt $D/docs/
        echo "$PINNED_SOURCE" > $D/docs/source-commit.txt
        cat > $D/docs/README.txt <<'NOTES'
        OPENADS MTFIX60 FULL TEST KIT, WINDOWS X64.
        Pritpal Bedi. Fork bedipritpal/OpenADS from FiveTechSoft/OpenADS.
        Windows x64, built with Winlibs GCC 10.2 x86_64 (same GCC version as the x86 kit).
        Built from 3bc1c245: mtfix59 plus ADT create-name/type fixes, scoped
        OrdKeyNo and REMOTE RelKeyPos fixes, SAP filter constants, and the
        2a exclusive/FLock append-lock fix. Shared append locking is unchanged.
        Server: bin/openads_serverd.exe (keep openads_auth_worker.exe beside it).
        Client DLL: bin/openace64.dll. Not for production.
        Linux unit suite was run on the same source; this Windows build runs no unit suite.
        NOTES
        find $D -type f -exec sha256sum {} \; > delivery/SHA256.txt
        7z a -tzip mtfix60-full-x64.zip ./delivery/*
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: warn
        name: mtfix60-x64-proof
        path: |
          output/
          mtfix60-full-x64.zip
        retention-days: 14
    - uses: actions/upload-artifact@v4
      with:
        name: kit-x64
        path: mtfix60-full-x64.zip
        retention-days: 14
  linuxkit:
    name: Build, test, package, verify, prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PINNED_SOURCE }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify pinned source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PINNED_SOURCE"
          git log -1 --oneline

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # Same Harbour UDF SDK as release.yml's Linux leg, same cache key.
      - name: Cache Harbour SDK (Linux)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/harbour-udf
          key: harbour-udf-linux-4ec2e154ed92757418bc30af571ab90240ab3209-v1

      - name: Provision Harbour SDK (Linux)
        shell: bash
        env:
          HARBOUR_REF: 4ec2e154ed92757418bc30af571ab90240ab3209
        run: |
          set -e
          HB="$RUNNER_TEMP/harbour-udf"
          echo "HB_ROOT=$HB/install" >> "$GITHUB_ENV"
          if [ -f "$HB/install/include/hbvm.h" ] &&              [ -n "$(find "$HB/install" -name 'libhbvmmt.a' 2>/dev/null | head -1)" ] &&              [ -n "$(find "$HB/install" -name harbour -type f 2>/dev/null | head -1)" ]; then
            echo "Harbour SDK cached at $HB/install"
          else
            sudo apt-get update
            sudo apt-get install -y build-essential libncurses-dev libx11-dev
            rm -rf "$HB"
            mkdir -p "$HB"
            git clone --depth 1 --branch master https://github.com/harbour/core.git "$HB/src"
            git -C "$HB/src" fetch --depth 1 origin "$HARBOUR_REF"
            git -C "$HB/src" checkout "$HARBOUR_REF"
            cd "$HB/src"
            make -j"$(nproc)" install HB_INSTALL_PREFIX="$HB/install" HB_BUILD_3RDEXT=no
          fi
          HB_INC="$(dirname "$(find "$HB/install" -name hbvm.h | head -1)")"
          HB_LIBDIR="$(dirname "$(find "$HB/install" -name 'libhbvmmt.a' | head -1)")"
          HB_CC="$(find "$HB/install" -name harbour -type f -executable | head -1)"
          echo "Harbour SDK layout:"
          echo "  include: ${HB_INC:-MISSING}"
          echo "  libdir:  ${HB_LIBDIR:-MISSING}"
          echo "  compiler:${HB_CC:-MISSING}"
          if [ -z "$HB_INC" ] || [ -z "$HB_LIBDIR" ] || [ -z "$HB_CC" ]; then
            echo "::error::Harbour SDK layout unexpected"
            exit 1
          fi
          {
            echo "HARBOUR_INCLUDE_DIR=$HB_INC"
            echo "HARBOUR_LIB_DIR=$HB_LIBDIR"
            echo "HARBOUR_COMPILER=$HB_CC"
          } >> "$GITHUB_ENV"

      # warnings-as-errors off: test-only spike probe abi_probe.cpp trips
      # clang's -Wshorten-64-to-32; product sources stay byte-identical to
      # the pinned main commit (same precedent as the mtfix51 Linux kit).
      - name: Configure
        shell: bash
        run: |
          cmake --preset ninja-clang                 -DOPENADS_WITH_TLS=ON                 -DOPENADS_WITH_HTTP=ON                 -DOPENADS_WITH_HARBOUR_UDF=ON                 -DOPENADS_WARNINGS_AS_ERRORS=OFF                 -DOPENADS_VERSION_FORCE="$KIT_VERSION"                 -DHARBOUR_INCLUDE_DIR="$HARBOUR_INCLUDE_DIR"                 -DHARBOUR_LIB_DIR="$HARBOUR_LIB_DIR"                 -DHARBOUR_COMPILER="$HARBOUR_COMPILER"

      - name: Build
        run: cmake --build build/ninja-clang --config Release

      - name: Test (full suite)
        timeout-minutes: 30
        run: ctest --test-dir build/ninja-clang --output-on-failure -C Release

      - name: Write install note
        shell: bash
        run: |
          cat > MTFIX60_LINUX_SERVER_TEST.md <<'NOTE'
          # 1.09.74-mtfix60-full-test - Linux x64 server test kit

          Pritpal Bedi. Fork bedipritpal/OpenADS from FiveTechSoft/OpenADS.

          Built from fork branch test/tim-2a-append-lock-ledger, commit 3bc1c245cb348c0264e06ef2254509be2188edaa
          (mtfix59 plus ADT create-name/type fixes, scoped OrdKeyNo and REMOTE
          RelKeyPos fixes, SAP filter constants, and the exclusive/FLock
          append-lock fix).
          The full ctest suite passed on
          ubuntu-24.04.

          Kit contents: openads_serverd, openads_auth_worker, openads_bench,
          libace64.so / libopenace64.so, openads.ini.sample, headers, contrib,
          mutual-test-only.hrb (mock V2 auth module), run-mock-test.sh,
          source-commit.txt, ldd-server.txt, ldd-worker.txt, SHA256SUMS.

          Fresh-box install (Ubuntu 24.04 x86_64):

          1. sudo apt-get update && sudo apt-get install -y libncurses6
          2. sudo mkdir -p /openads-server && cd /openads-server
          3. Download the tar.gz and its .sha256, then
             sha256sum -c the .sha256 file.
          4. tar xzf the tar.gz and cd into the extracted folder.
          5. Start the mock V2 test server: ./run-mock-test.sh
             The banner must show OpenADS 1.09.74-mtfix60-full-test
             listening on 127.0.0.1:6262.
          6. First run copies openads.ini.sample to openads.ini, sets
             legacy_paths = 1 so Vouch URLs with C:/ roots resolve, and
             sets data to the kit folder as an absolute path (a relative
             data root breaks the login path resolution on Linux), and
             sets enable_file_func = 1 so Vouch can create its data
             dictionary and log files inside the data folder. To
             reach the server from another machine, set host = 0.0.0.0 in
             openads.ini and open TCP 6262 in the box firewall and the EC2
             security group.
          7. Vouch login, same call as the Windows mtfix52 mock test:
             V2LoginMock("auth://BOX-IP:6262/C:/", "fixture-firm", "C:/", @s_hConn)
             Use 127.0.0.1 as BOX-IP when testing on the box itself.

          Nothing here touches the Lightsail box or any running server.
          NOTE

      - name: Write mock module and run script
        shell: bash
        run: |
          set -euo pipefail
          echo "" | base64 -d > mutual-test-only.hrb
          chmod 600 mutual-test-only.hrb
          cat > run-mock-test.sh <<'SCRIPT'
          #!/usr/bin/env bash
          # Starts the mtfix60 test server with the mock V2 auth module,
          # same drill as the Windows mtfix52 mock test: mock module plus
          # the additive CLI user usr:pw on port 6262.
          set -euo pipefail
          cd "$(dirname "$0")"
          chmod 600 mutual-test-only.hrb
          if [ ! -f openads.ini ]; then
            cp openads.ini.sample openads.ini
            sed -i 's/^# legacy_paths = 0/legacy_paths = 1/' openads.ini
            sed -i "s|^data = \.$|data = $PWD|" openads.ini
            sed -i 's|^# enable_file_func = 0|enable_file_func = 1|' openads.ini
          fi
          ulimit -n 65535 2>/dev/null || true
          exec ./openads_serverd --config ./openads.ini --http_port 0 --auth_module "$PWD/mutual-test-only.hrb" --auth_user usr:pw
          SCRIPT
          chmod 755 run-mock-test.sh

      - name: Stage kit
        shell: bash
        run: |
          set -euo pipefail
          STAGE="openads-$KIT_VERSION-linux-x64"
          B=build/ninja-clang
          mkdir -p "$STAGE"
          for f in "$B"/src/libopenace64.*; do
            [ -e "$f" ] || continue
            cp "$f" "$STAGE/"
            cp "$f" "$STAGE/$(basename "$f" | sed 's/libopenace64/libace64/')"
          done
          cp "$B"/tools/serverd/openads_serverd "$STAGE/"
          cp "$B"/tools/serverd/openads_auth_worker "$STAGE/"
          cp "$B"/tools/bench/openads_bench "$STAGE/"
          cp LICENSE NOTICE README.md openads.ini.sample MTFIX60_LINUX_SERVER_TEST.md "$STAGE/"
          cp mutual-test-only.hrb run-mock-test.sh "$STAGE/"
          mkdir -p "$STAGE/include/openads"
          cp include/openads/ace.h "$STAGE/include/ace.h"
          cp include/openads/ace.h include/openads/error.h include/openads/openads_sql.h include/openads/platform.h include/openads/version.h "$STAGE/include/openads/"
          mkdir -p "$STAGE/contrib/oads_hb"
          cp contrib/oads_hb/oads_hb.c contrib/oads_hb/oads_stats_display.prg contrib/oads_hb/README.md "$STAGE/contrib/oads_hb/"
          echo "$PINNED_SOURCE" > "$STAGE/source-commit.txt"
          ldd "$STAGE/openads_serverd" > "$STAGE/ldd-server.txt"
          ldd "$STAGE/openads_auth_worker" > "$STAGE/ldd-worker.txt"
          (cd "$STAGE" && find . -type f ! -name SHA256SUMS | sort | xargs sha256sum > SHA256SUMS)
          tar czf "$STAGE.tar.gz" "$STAGE"
          sha256sum "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
          cat "$STAGE.tar.gz.sha256"

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="openads-$KIT_VERSION-linux-x64"
          tar tzf "$STAGE.tar.gz" > listing.txt
          for req in openads_serverd openads_auth_worker openads_bench libace64.so libopenace64.so openads.ini.sample source-commit.txt MTFIX60_LINUX_SERVER_TEST.md mutual-test-only.hrb run-mock-test.sh SHA256SUMS LICENSE NOTICE README.md; do
            grep -q "/$req$" listing.txt || { echo "::error::missing $req in archive"; exit 1; }
          done
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          tar xzf "$STAGE.tar.gz" -C /tmp/verify
          V="/tmp/verify/$STAGE"
          (cd "$V" && sha256sum -c SHA256SUMS >/dev/null && echo "SHA256SUMS ok")
          "$V/openads_serverd" --version | tee server-version.txt
          grep -q "$KIT_VERSION" server-version.txt
          grep -aq "$KIT_VERSION" "$V/libopenace64.so"
          # Mock module byte check against the Windows mtfix52 kit module.
          test "$(sha256sum "$V/mutual-test-only.hrb" | cut -d' ' -f1)" = "$(sha256sum mutual-test-only.hrb | cut -d' ' -f1)"
          # Auth worker probe: one byte P must print READY (or READY2).
          "$HARBOUR_COMPILER" -gh -o/tmp/test_only.hrb tests/hrb/auth-spike/test_only.prg
          # Worker refuses a group/other-readable module by design; lock it.
          chmod 600 /tmp/test_only.hrb
          probe="$(printf 'P' | "$V/openads_auth_worker" /tmp/test_only.hrb)"
          echo "worker probe: $probe"
          [[ "$probe" == READY* ]]
          # Record the glibc ceiling for the target (Ubuntu 24.04) platform.
          echo "Max GLIBC referenced:"
          for b in "$V/openads_serverd" "$V/openads_auth_worker" "$V/libopenace64.so"; do
            echo "$b: $(objdump -T "$b" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: kit-linux
          path: |
            openads-1.09.74-mtfix60-full-test-linux-x64.tar.gz
            openads-1.09.74-mtfix60-full-test-linux-x64.tar.gz.sha256
            MTFIX60_LINUX_SERVER_TEST.md
          retention-days: 14
  mackit:
    name: Build macOS universal server kit
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: release/mtfix60-full
      - name: Verify clean main-based source
        shell: bash
        run: |
          set -euxo pipefail
          test "$GITHUB_REF" = refs/heads/release/mtfix60-full
          git merge-base --is-ancestor 3bc1c245cb348c0264e06ef2254509be2188edaa HEAD
          test -z "$(git diff --name-only 3bc1c245cb348c0264e06ef2254509be2188edaa HEAD -- . ':!.github/workflows')"
      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Configure
        shell: bash
        run: |
          cmake --preset default \
                -DOPENADS_WITH_TLS=ON \
                -DOPENADS_WITH_HTTP=ON \
                -DOPENADS_VERSION_FORCE=$KIT_VERSION \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        shell: bash
        run: cmake --build build/default --config Release
      - name: Test
        timeout-minutes: 25
        shell: bash
        run: ctest --test-dir build/default --output-on-failure -C Release
      - name: Stage and verify macOS kit
        shell: bash
        run: |
          set -euxo pipefail
          STAGE="openads-$KIT_VERSION-macos-universal"
          B=build/default
          mkdir -p "$STAGE"
          for f in "$B"/src/libopenace64*.dylib; do
            [ -e "$f" ] || continue
            cp "$f" "$STAGE/"
            cp "$f" "$STAGE/$(basename "$f" | sed 's/libopenace64/libace64/')"
          done
          cp "$B"/tools/serverd/openads_serverd "$STAGE/"
          if [ -e "$B"/tools/serverd/openads_auth_worker ]; then cp "$B"/tools/serverd/openads_auth_worker "$STAGE/"; fi
          cp "$B"/tools/bench/openads_bench "$STAGE/"
          cp LICENSE NOTICE README.md openads.ini.sample "$STAGE/"
          mkdir -p "$STAGE/include/openads"
          cp include/openads/ace.h "$STAGE/include/ace.h"
          cp include/openads/ace.h include/openads/error.h include/openads/openads_sql.h include/openads/platform.h include/openads/version.h "$STAGE/include/openads/"
          mkdir -p "$STAGE/contrib/oads_hb"
          cp contrib/oads_hb/oads_hb.c contrib/oads_hb/oads_stats_display.prg contrib/oads_hb/README.md "$STAGE/contrib/oads_hb/"
          echo "$PINNED_SOURCE" > "$STAGE/source-commit.txt"
          (cd "$STAGE" && find . -type f ! -name SHA256SUMS | sort | xargs shasum -a 256 > SHA256SUMS)
          tar czf "$STAGE.tar.gz" "$STAGE"
          shasum -a 256 "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
          cat "$STAGE.tar.gz.sha256"
          tar tzf "$STAGE.tar.gz" | grep -q "/openads_serverd$"
          "$STAGE/openads_serverd" --version | tee server-version.txt
          grep -q "$KIT_VERSION" server-version.txt
          lipo -info "$STAGE/openads_serverd" | tee lipo.txt
          grep -q arm64 lipo.txt
          grep -q x86_64 lipo.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kit-macos
          path: |
            openads-1.09.74-mtfix60-full-test-macos-universal.tar.gz
            openads-1.09.74-mtfix60-full-test-macos-universal.tar.gz.sha256
          retention-days: 14
  publish:
    name: Publish combined prerelease
    runs-on: ubuntu-24.04
    needs: [x86kit, x64kit, linuxkit, mackit]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kit-*
          merge-multiple: true
      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'NOTES'
          # OpenADS mtfix60 full test kit

          Pritpal Bedi. Fork: bedipritpal/OpenADS, from FiveTechSoft/OpenADS.

          One entry, all kits, built from fork branch test/tim-2a-append-lock-ledger at 3bc1c245.

          What sits on top of mtfix59, exactly:
          - ADT create without extension uses .adt; SQL CREATE TABLE with a .adt name creates ADT.
          - Scoped OrdKeyNo and REMOTE SetRelKeyPos use the scoped key range; ACE filter constants match SAP.
          - Finding 2a: exclusive or FLocked appends no longer accumulate unused record locks or stop at 4096; shared, non-FLocked appends retain their automatic lock and cap.
          - Regression tests for these changes, including both FLock handle-creation orders and a post-release peer lock check.

          The mtfix52/58/59 V2 auth line and existing pinned compiler versions are retained. Findings 2b, 2c and 2d remain open. The GCC-DLL stars cause remains unverified; Tim reports no stars with MSVC, whose separate kit is not the Vouch kit.

          Assets:
          - mtfix60-full-qt492-x86.zip: Windows x86 (32-bit) kit, pinned Qt 4.9.2 / Winlibs GCC 10.2 i686. Full proof suite: B_BIG threaded fixtures, auth probes, batched unit regression, Vouch link-shape proof.
          - mtfix60-full-x64.zip: Windows x64 kit, Winlibs GCC 10.2 x86_64. PE-checked on Windows; unit suite run on Linux only.
          - openads-1.09.74-mtfix60-full-test-linux-x64.tar.gz (+ .sha256 + MTFIX60_LINUX_SERVER_TEST.md): Linux x64 server kit, full ctest suite passed on ubuntu-24.04.
          - openads-1.09.74-mtfix60-full-test-macos-universal.tar.gz (+ .sha256): macOS universal (arm64 + x86_64) server kit, full ctest suite passed on macos-14.

          Same mock-HRB auth test content as the mtfix52/56 kits. Public mock module only, not real auth. Test only, not for production.
          NOTES
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          ls -la
          sha256sum mtfix60-full-qt492-x86.zip mtfix60-full-x64.zip openads-1.09.74-mtfix60-full-test-linux-x64.tar.gz openads-1.09.74-mtfix60-full-test-macos-universal.tar.gz
          sha256sum mtfix60-full-qt492-x86.zip mtfix60-full-x64.zip > WINDOWS_SHA256SUMS.txt
          gh release create v1.09.74-mtfix60-full-test --target 3bc1c245cb348c0264e06ef2254509be2188edaa --prerelease --latest=false --title "OpenADS mtfix60 full test kit - Windows x86 + Windows x64 + Linux x64 server + macOS universal" --notes-file RELEASE_NOTES.md WINDOWS_SHA256SUMS.txt mtfix60-full-qt492-x86.zip mtfix60-full-x64.zip openads-1.09.74-mtfix60-full-test-linux-x64.tar.gz openads-1.09.74-mtfix60-full-test-linux-x64.tar.gz.sha256 MTFIX60_LINUX_SERVER_TEST.md openads-1.09.74-mtfix60-full-test-macos-universal.tar.gz openads-1.09.74-mtfix60-full-test-macos-universal.tar.gz.sha256
          gh release view v1.09.74-mtfix60-full-test --json tagName,isPrerelease,url,assets
