name: MinGW x86 client kit for 1.09.76 (mtfix88 layout)

'on':
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mingw-client-10976
  cancel-in-progress: false

env:
  KIT_VERSION: 1.09.76-mingw-client
  PINNED_SOURCE: e59aee22bc0444f747468f31e935c1f5be581eeb

jobs:
  build:
    name: Build MinGW x86 client kit
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: e59aee22bc0444f747468f31e935c1f5be581eeb
    - name: Verify pinned source
      run: |
        set -euxo pipefail
        test "$(git rev-parse HEAD)" = "e59aee22bc0444f747468f31e935c1f5be581eeb"
      shell: bash
    - name: Prefetch identical hash-pinned dependency archives via alternate transport
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PYDEPS'
        import hashlib,pathlib,tarfile,urllib.request,time
        items=[('zlib','https://zlib.net/fossils/zlib-1.3.1.tar.gz','9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23'),('nlohmann_json','https://codeload.github.com/nlohmann/json/tar.gz/refs/tags/v3.11.3','0d8ef5af7f9794e3263480193c491549b2ba6cc74bb018906202ada498a79406'),('cpp_httplib','https://codeload.github.com/yhirose/cpp-httplib/tar.gz/refs/tags/v0.18.5','731190e97acd63edce57cc3dacd496f57e7743bfc7933da7137cb3e93ec6c9a0')]
        for name,url,sha in items:
         for attempt in range(3):
          try:
           source=url if attempt==0 else url+'?openads_mtfix88_retry='+str(attempt)
           body=urllib.request.urlopen(source,timeout=60).read();actual=hashlib.sha256(body).hexdigest()
           if actual!=sha:raise RuntimeError(name+' hash mismatch: expected '+sha+' got '+actual+' bytes='+str(len(body)))
           break
          except Exception as error:
           print(name,str(error),flush=True)
           if attempt==2:raise
           time.sleep(3*(attempt+1))
         archive=pathlib.Path(name+'.tar.gz');archive.write_bytes(body)
         dest=pathlib.Path('third_party')/name;dest.mkdir(parents=True,exist_ok=True)
         with tarfile.open(archive) as z:
          for member in z.getmembers():
           parts=pathlib.PurePosixPath(member.name).parts[1:]
           if not parts:continue
           assert '..' not in parts
           member.name=str(pathlib.PurePosixPath(*parts));z.extract(member,dest)
         print(name,sha,'verified')
        PYDEPS
    - name: Download exact historical Qt compiler
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        function Download-Exact($url,$out) {
         for($i=0;$i -lt 4;$i++) {
          try {
            $headers=@{Accept='application/octet-stream'}
            if(([uri]$url).Host -eq 'api.github.com'){$headers.Authorization="Bearer $env:GH_TOKEN"}
            Invoke-WebRequest -Headers $headers $url -OutFile $out; return
          }
          catch { if($i -eq 3){throw}; Start-Sleep -Seconds (5*($i+1)) }
         }
        }
        Download-Exact 'https://download.qt.io/development_releases/prebuilt/mingw_32/i686-4.9.2-release-posix-dwarf-rt_v3-rev1.7z' "$env:RUNNER_TEMP/qt492.7z"
        if((Get-FileHash "$env:RUNNER_TEMP/qt492.7z" -Algorithm SHA256).Hash.ToLower() -ne 'f6de32350a28f4b6c30eec26dbfee65f112300d51e37e4d2007b0598bef9bb79'){throw 'Qt compiler hash mismatch'}
        & 7z x "$env:RUNNER_TEMP/qt492.7z" "-o$env:RUNNER_TEMP/qt492" -y

        Download-Exact 'https://api.github.com/repos/brechtsanders/winlibs_mingw/releases/assets/32966370' "$env:RUNNER_TEMP/winlibs.7z"
        if((Get-FileHash "$env:RUNNER_TEMP/winlibs.7z" -Algorithm SHA256).Hash.ToLower() -ne '019ee601c48069b91101a3af923bf2cdd4399c99b9a1c70b5d59da9cfbb8e907'){throw 'Winlibs hash mismatch'}
        & 7z x "$env:RUNNER_TEMP/winlibs.7z" "-o$env:RUNNER_TEMP/winlibs" -y
      shell: pwsh
    - name: Build engine DLL with pinned GCC10.2 (msvcrt, TLS on)
      run: |
        set -euxo pipefail
        export PATH="$(cygpath -u "$RUNNER_TEMP/winlibs/mingw32/bin"):$PATH"
        test "$(gcc -dumpversion)" = 10.2.0
        git clone https://github.com/harbour/core.git "$RUNNER_TEMP/harbour-server"
        git -C "$RUNNER_TEMP/harbour-server" checkout --detach 6deac9cf3ad977ae829e5bca543d553b92dd4b6d
        export HB_PLATFORM=win HB_COMPILER=mingw HB_BUILD_CONTRIBS=no HB_BUILD_DYN=no
        mingw32-make -C "$RUNNER_TEMP/harbour-server" -j2
        HB="$(cygpath -m "$RUNNER_TEMP/harbour-server")"
        printf '\nif(WIN32 AND MINGW)\n set_target_properties(openads_ace PROPERTIES PREFIX "")\nendif()\n' >> src/CMakeLists.txt
        cmake -DFETCHCONTENT_SOURCE_DIR_NLOHMANN_JSON="$PWD/third_party/nlohmann_json" -DFETCHCONTENT_SOURCE_DIR_CPP_HTTPLIB="$PWD/third_party/cpp_httplib" -S . -B build-legacy -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_SHARED_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" -DOPENADS_BUILD_TESTS=OFF -DOPENADS_WITH_HTTP=OFF -DOPENADS_WITH_TLS=ON -DOPENADS_VERSION_FORCE=1.09.76-mingw-client -DOPENADS_AUTH_CAPACITY_TEST_SWITCH=OFF -DOPENADS_WITH_HARBOUR_UDF=ON -DHARBOUR_COMPILER="$HB/bin/win/mingw/harbour.exe" -DHARBOUR_INCLUDE_DIR="$HB/include" -DHARBOUR_LIB_DIR="$HB/lib/win/mingw" -DOPENADS_HARBOUR_LIBS="hbvmmt;hbrtl;hbmacro;hbpcre;hblang;hbcpage;hbrdd;rddfpt;rddntx;hbsix;hbcommon" -DOPENADS_WARNINGS_AS_ERRORS=OFF
        cmake --build build-legacy --target openads_ace -j2
        test -f build-legacy/src/openace32.dll
        test -f build-legacy/src/libopenace32.dll.a
      shell: bash
    - name: Build Harbour with unchanged Qt4.9.2
      run: |
        set -euxo pipefail
        export PATH="$(cygpath -u "$RUNNER_TEMP/qt492/mingw32/bin"):$PATH"
        test "$(gcc -dumpversion)" = 4.9.2
        git clone https://github.com/harbour/core.git "$RUNNER_TEMP/harbour-old"
        git -C "$RUNNER_TEMP/harbour-old" checkout --detach 4ec2e154ed92757418bc30af571ab90240ab3209
        git -C "$RUNNER_TEMP/harbour-old" apply "$PWD/patches/harbour/rddads-pending-fields.patch"
        export HB_PLATFORM=win HB_COMPILER=mingw HB_BUILD_CONTRIBS=no HB_BUILD_DYN=no
        mingw32-make -C "$RUNNER_TEMP/harbour-old" -j2
      shell: bash
    - name: Exact GCC10.2 and mingw-w64 8 runtime notices (Winlibs omits them)
      run: |
        set -euxo pipefail
        W="$(cygpath -u "$RUNNER_TEMP/winlibs/mingw32")"
        mkdir -p "$W/share/licenses/gcc" "$W/share/licenses/crt" "$W/share/licenses/winpthreads"
        curl -fL https://raw.githubusercontent.com/gcc-mirror/gcc/ee5c3db6c5b2c3332912fb4c9cfa2864569ebd9a/COPYING3 -o "$W/share/licenses/gcc/COPYING3"
        echo '8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903  '"$W/share/licenses/gcc/COPYING3" | sha256sum -c -
        curl -fL https://raw.githubusercontent.com/gcc-mirror/gcc/ee5c3db6c5b2c3332912fb4c9cfa2864569ebd9a/COPYING.RUNTIME -o "$W/share/licenses/gcc/COPYING.RUNTIME"
        echo '9d6b43ce4d8de0c878bf16b54d8e7a10d9bd42b75178153e3af6a815bdc90f74  '"$W/share/licenses/gcc/COPYING.RUNTIME" | sha256sum -c -
        curl -fL https://raw.githubusercontent.com/mingw-w64/mingw-w64/98dad1fefed2a07ade0b37ca6c610ad66739631a/COPYING.MinGW-w64-runtime/COPYING.MinGW-w64-runtime.txt -o "$W/share/licenses/crt/COPYING.MinGW-w64-runtime.txt"
        echo 'e9b2dc02451ea29092a1f25fa0f3c07207ed421f1807dffb0c4e6dce69dee7bd  '"$W/share/licenses/crt/COPYING.MinGW-w64-runtime.txt" | sha256sum -c -
        curl -fL https://raw.githubusercontent.com/mingw-w64/mingw-w64/98dad1fefed2a07ade0b37ca6c610ad66739631a/mingw-w64-libraries/winpthreads/COPYING -o "$W/share/licenses/winpthreads/COPYING"
        echo '63263614cdd29f2f93cba85e992f041b31f9fc7b4033692f31269489a8a1b177  '"$W/share/licenses/winpthreads/COPYING" | sha256sum -c -

        mkdir -p kit/runtime-notices
        cp "$W/share/licenses/gcc/COPYING3" kit/runtime-notices/gcc-COPYING3.txt
        cp "$W/share/licenses/gcc/COPYING.RUNTIME" kit/runtime-notices/gcc-COPYING.RUNTIME.txt
        cp "$W/share/licenses/crt/COPYING.MinGW-w64-runtime.txt" kit/runtime-notices/MinGW-w64-runtime.txt
        cp "$W/share/licenses/winpthreads/COPYING" kit/runtime-notices/winpthreads-COPYING.txt
      shell: bash
    - name: Assemble client kit (import lib + RDD + layout + guards)
      run: |
        set -euxo pipefail
        export PATH="$(cygpath -u "$RUNNER_TEMP/qt492/mingw32/bin"):$PATH"
        HB="$(cygpath -u "$RUNNER_TEMP/harbour-old")"
        mkdir -p output kit
        # DLL import library only. Never place a combined archive in kit.
        cp build-legacy/src/libopenace32.dll.a kit/libopenace32.dll.a
        cp build-legacy/src/openace32.dll output/openace32.dll
        objdump -p output/openace32.dll > output/dll-pe.txt
        if grep -Ei 'DLL Name:.*(libstdc|libgcc|libwinpthread|libssl|libcrypto|mbedtls|zlib).*\.dll' output/dll-pe.txt;then exit 1;fi
        if grep -Ei 'DLL Name:.*(MSVCP|VCRUNTIME|MFC)' output/dll-pe.txt;then exit 1;fi
        grep -i 'DLL Name' output/dll-pe.txt
        objdump -p output/openace32.dll | sed -n '/\[Ordinal\/Name Pointer\] Table/,$p' > output/dll-exports.txt
        grep -q 'OAdsBeginAuth' output/dll-exports.txt
        grep -q 'AdsConnect60' output/dll-exports.txt
        grep -q 'AdsOpenTable' output/dll-exports.txt
        for unit in ads1 adsfunc adsmgmnt adsx;do
         gcc -c "$HB/contrib/rddads/$unit.c" -I"$HB/include" -I"$HB/contrib/rddads" -Iinclude/openads -o "output/$unit.o"
        done
        gcc -c contrib/oads_hb/oads_hb.c -I"$HB/include" -Iinclude/openads -o output/oads_hb.o
        for member in oads_vf oads_vf_driver oads_vf_socket; do
         gcc -c "contrib/oads_hb/$member.c" -I"$HB/include" -Iinclude/openads -o "output/$member.o"
        done
        ar rcs kit/librddads.a output/ads1.o output/adsfunc.o output/adsmgmnt.o output/adsx.o output/oads_hb.o output/oads_vf.o output/oads_vf_driver.o output/oads_vf_socket.o
        # Guard: import library stays small. A static engine archive would be ~20+ MB.
        test "$(stat -c%s kit/libopenace32.dll.a)" -lt 5000000
        D=delivery/openads-1.09.76-mingw-client-x86
        mkdir -p "$D/bin" "$D/lib" "$D/include/openads" "$D/docs"
        cp output/openace32.dll "$D/bin/"
        cp kit/libopenace32.dll.a kit/librddads.a "$D/lib/"
        cp include/openads/ace.h "$HB/contrib/rddads/ads.ch" "$D/include/"
        cp include/openads/vf_wire.h "$D/include/openads/"
        cp -r kit/runtime-notices "$D/"
        cat > "$D/docs/README.txt" <<'NOTES'
        OpenADS 1.09.76 MinGW x86 client kit (mtfix88 layout)
        2026-11-25

        Built from the 1.09.76 source (e59aee22bc04) with the mtfix88 x86
        recipe: engine DLL compiled with pinned MinGW GCC 10.2 against
        msvcrt, TLS and auth ON; RDD and import side compiled with the
        unchanged Qt 4.9.2 MinGW.

        Files:
          bin/openace32.dll          MinGW engine DLL. TLS and auth:// work.
                                     Depends only on Windows system DLLs
                                     (msvcrt, KERNEL32, WS2_32, bcrypt, PSAPI).
                                     No VC++ redist, no other runtime DLL.
          lib/libopenace32.dll.a     Import library for openace32.dll.
          lib/librddads.a            ADS RDD for Harbour (Qt492-built objects).
          include/ace.h              Engine API header.
          include/ads.ch             RDD header for .prg builds.
          include/openads/vf_wire.h  vf wire helpers.
          runtime-notices/           Compiler runtime licenses.

        Link recipe for Vouch (hbmk2):
          hbmk2 vouch.prg -Llib -lrddads -lopenace32 -iinclude -iinclude/openads -mt -lws2_32 -lbcrypt -lpsapi
        Then ship bin/openace32.dll beside Vouch.exe. No redist needed.
        This test kit does not deploy or restart anything.
        NOTES
        find "$D" -type f -exec sha256sum {} \; > delivery/SHA256.txt
        cat delivery/SHA256.txt
      shell: bash
    - name: Zip client kit
      shell: pwsh
      run: |
        Compress-Archive -Path delivery/openads-1.09.76-mingw-client-x86,delivery/SHA256.txt -DestinationPath openads-1.09.76-mingw-client-x86.zip -Force
        Get-Item openads-1.09.76-mingw-client-x86.zip
    - uses: actions/upload-artifact@v4
      with:
        name: mingw-client-10976-x86
        path: openads-1.09.76-mingw-client-x86.zip
        retention-days: 14
  publish:
    name: Publish prerelease with the client kit
    runs-on: ubuntu-24.04
    needs: build
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: mingw-client-10976-x86
    - name: Create prerelease and attach the kit
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euxo pipefail
        sha256sum openads-1.09.76-mingw-client-x86.zip | tee SHA256SUMS.txt
        cat > RELEASE_NOTES.md <<'NOTES'
        # OpenADS 1.09.76 MinGW x86 client kit (mtfix88 layout, TEST)
        Pritpal Bedi
        2026-11-25

        Built from the pinned 1.09.76 source e59aee22bc0444f747468f31e935c1f5be581eeb
        with the mtfix88 x86 recipe: the engine DLL is compiled with pinned
        MinGW GCC 10.2 against msvcrt with TLS and auth ON; the ADS RDD and
        import side are compiled with the unchanged Qt 4.9.2 MinGW.

        openace32.dll depends only on Windows system DLLs (msvcrt, KERNEL32,
        WS2_32, bcrypt, PSAPI). No VC++ redist and no other runtime DLL.
        The build fails its own gates if any non-msvcrt runtime, any MSVC
        redist DLL, or the auth exports are missing.

        Layout matches the mtfix88 kit: bin/, lib/, include/, runtime-notices/, docs/.
        Link lib/librddads.a + lib/libopenace32.dll.a and ship bin/openace32.dll
        beside the exe. See docs/README.txt inside the zip for the link line.

        Test kit. No automatic deployment or restart. Prior kits stay frozen.
        NOTES
        cat SHA256SUMS.txt >> RELEASE_NOTES.md
        gh release create v1.09.76-mingw-client-test --repo bedipritpal/OpenADS --prerelease --target e59aee22bc0444f747468f31e935c1f5be581eeb --title "OpenADS 1.09.76 MinGW x86 client kit (mtfix88 layout, TEST)" --notes-file RELEASE_NOTES.md openads-1.09.76-mingw-client-x86.zip SHA256SUMS.txt
