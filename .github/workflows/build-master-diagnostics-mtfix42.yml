name: Stage isolated tested mtfix42 source, no tag or release
'on':
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'bedipritpal/OpenADS'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Stage verified non-production source
      shell: bash
      run: 'set -euo pipefail

        base=b312c71696dbd22dae1bd6fbd84b6ae049efa825

        branch=security/master-diagnostics-mtfix42

        test -z "$(git ls-remote origin refs/heads/$branch)"

        test -z "$(git ls-remote origin refs/tags/v1.09.74-mtfix42)"

        git checkout --detach "$base"

        base64 -d > "$RUNNER_TEMP/patch.gz" <<''PATCH_BASE64''

        

        PATCH_BASE64

        gzip -dc "$RUNNER_TEMP/patch.gz" > "$RUNNER_TEMP/patch"

        echo "7da45c49cdc7be6388d10cc77eb90eab710ea86c9bb9c6ef9609133fc343f813  $RUNNER_TEMP/patch" | sha256sum -c --strict

        git apply --index "$RUNNER_TEMP/patch"

        test "$(git write-tree)" = 2586ce8356be284e5ea16f6529470d23a415e693

        # GitHub workflow token cannot write workflow blobs. Keep only this file at

        # baseline for staging, then the web editor restores its tested content.

        git restore --source "$base" --staged --worktree .github/workflows/release.yml

        git config user.name ''Pritpal Bedi''

        git config user.email ''bedipritpal@users.noreply.github.com''

        git commit -m ''Stage mtfix42 diagnostic master and MinGW static client; tested workflow pending''

        git push origin HEAD:refs/heads/$branch

        '
