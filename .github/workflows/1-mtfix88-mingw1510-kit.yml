        cat > "$K/docs/README.txt" <<'NOTES'
        OpenADS mtfix88 x86 client kit - MinGW GCC 15.1 UCRT build
        Pritpal Bedi

        Same mtfix88 code as the published qt492 kit (source pin
        b0b66c49c404b6fa4055d98cf7fe7a1f53776161), built with the toolchain
        tested today: winlibs i686 posix dwarf GCC 15.1.0 UCRT (C:\mingw32_15,
        zip hash 869fa6c0...04c2) and Antonio Linares'
        harbour_mingw1510_32_20260404 (C:\harbour-bin, zip hash
        e90b249a...0998) for the Harbour compiler, headers and link libraries.

        Layout: bin\openace32.dll (client DLL, keep matched with lib) +
        auth-probe.hrb; lib\libopenace32.dll.a + librddads.a (rddads units
        ads1/adsfunc/adsmgmnt/adsx + oads_hb/oads_vf/oads_vf_driver/
        oads_vf_socket, compiled with GCC 15.1); include\ace.h + ads.ch;
        docs\ the mtfix85/86/87 behavior notes and this run's proofs;
        fixtures\ the four fixture .prg sources used in CI;
        runtime-notices\ license texts of the shipped toolchain runtime.

        Verified in this CI run with this exact toolchain: twenty threaded
        B_BIG integrity fixtures (auto-open, 2000 ops, all PASS), actual TCP
        CopyFile/FCopyFile through the packaged MinGW glue, the vf87 family
        (its read-only front-end comparison is gated by a matched-initial-state
        harness, see the note below) and fs_args88, the BeginAuth/CompleteAuth native smoke, the auth
        static fixture, the auth probe module compile, the Harbour peer
        refresh against the staged matched DLL and daemon, the matched
        DLL/import-library export check (AdsFlushPendingFields present, no
        C++ mangled exports) and the unsupported old-DLL guard.
        Note on vf_frontend87: run unmodified with the CI runner's inherited stdin,
        its 18-case native vs OAds_vf comparison reports 2 FError differences
        (cases 1 and 2: native 109, wrapper 0); with NUL or pipe stdin it reports
        0. A diagnostic showed a stale hb_fsError of 109 is already present at
        process start under that stdin, and the first existence call reports it
        whichever of native or wrapper is called first. The gate therefore uses a
        matched-initial-state harness (same 18 cases, verified incoming error
        state 0 and 2, both call orders, 0 differences). That is parity under
        equal incoming state; why the runner's startup state is 109 was not
        isolated. Records: docs\vf87-proof.txt and docs\vf87-diag.txt.
        The full 1832-case unit suite is NOT rerun under GCC 15.1 here; the
        qt492 mtfix88 kit remains the published verified runtime. The first
        Vouch/B_BIG link against this kit is yours. This kit does not deploy
        or restart anything.

        Functional content is unchanged from mtfix88: OAds_* connection-
        argument repair, the full OAds_vf family (see VF_PARITY_MTFIX87.txt),
        the mtfix86 socket allowlist repair and OAds_FCopyFile alias, and the
        inherited mtfix82-85 file I/O, metadata and lock behavior described
        in FILE_LOCKS_MTFIX85.txt. Prior kits stay frozen.
        NOTES
        sed -i 's/^        //' "$K/docs/README.txt"
        (cd "$K" && find . -type f -exec sha256sum {} \;) > "$K/SHA256.txt"
        7z a -tzip mtfix88-mingw1510-x86.zip ./delivery/mtfix88-mingw1510
        sha256sum mtfix88-mingw1510-x86.zip
      shell: bash
    - uses: actions/upload-artifact@v4
