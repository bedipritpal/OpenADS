        The semantics are OpenSSL's own.

        Install: copy lib\*.a and include\* into the toolchain's lib/include folders (keep
        a backup of the replaced files). Link exactly as your current working build links.
        For reference, the CI proof invoked hbmk2 with: -lhbcurls -lhbssl-x86 -lcurl
