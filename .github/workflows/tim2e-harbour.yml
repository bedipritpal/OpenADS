name: Tim2e actual Windows Harbour proof
'on':
  push:
    branches:
    - test/tim-2e-deleted-scope
    paths:
    - .github/workflows/tim2e-harbour.yml
  workflow_dispatch: {}
jobs:
  proof:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/harbour-ci
        key: harbour-core-master-msvc64-v5-${{ hashFiles('tools/scripts/bootstrap_harbour_ci.ps1') }}
    - name: Build matched DLL and daemon
      shell: bash
      run: 'cmake --preset msvc-x64

        cmake --build build/msvc-x64 --config Release --target openads_ace openads_serverd'
    - name: Bootstrap Harbour
      shell: pwsh
      run: pwsh -File tools/scripts/bootstrap_harbour_ci.ps1
      env:
        HARBOUR_CI_ROOT: ${{ runner.temp }}/harbour-ci
        OPENADS_ROOT: ${{ github.workspace }}
        OPENADS_BUILD: ${{ github.workspace }}/build/msvc-x64
    - name: Run synthetic supplied-sequence DBFCDX versus REMOTE proof
      shell: pwsh
      run: "$ErrorActionPreference = \"Stop\"\n$vswhere = Join-Path ${env:ProgramFiles(x86)} \"Microsoft Visual\
        \ Studio\\Installer\\vswhere.exe\"\n$vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64\
        \ -property installationPath\n$vc = Join-Path $vs \"VC\\Auxiliary\\Build\\vcvarsall.bat\"\ncmd /c \"`\"\
        $vc`\" x64 >nul 2>&1 && set\" | ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { Set-Item -Path \"env:$($matches[1])\"\
        \ -Value $matches[2] } }\n$hb = \"$env:RUNNER_TEMP\\harbour-ci\"\n$mk = @(\"$hb\\bin\\win\\msvc64\\hbmk2.exe\"\
        , \"$hb\\bin\\win\\mingw64\\hbmk2.exe\", \"$hb\\bin\\hbmk2.exe\") | Where-Object { Test-Path $_ } | Select-Object\
        \ -First 1\nif (-not $mk) { throw \"hbmk2 not found after bootstrap\" }\n$env:HB_INSTALL = $hb\n$env:PATH\
        \ = \"$(Split-Path $mk);$env:PATH\"\n$stage = Join-Path $env:RUNNER_TEMP \"tim2e-proof\"\n$data = Join-Path\
        \ $stage \"data\"\nNew-Item -ItemType Directory -Force $data | Out-Null\nCopy-Item build/msvc-x64/src/Release/openace64.dll\
        \ \"$stage/ace64.dll\"\nCopy-Item build/msvc-x64/src/Release/openace64.dll \"$stage/openace64.dll\"\nCopy-Item\
        \ build/msvc-x64/src/Release/openace64.lib \"$stage/ace64.lib\"\nCopy-Item build/msvc-x64/tools/serverd/Release/openads_serverd.exe\
        \ $stage\nCopy-Item build/msvc-x64/tools/serverd/Release/openads_auth_worker.exe $stage -ErrorAction SilentlyContinue\n\
        Set-Content \"$stage/repro.prg\" -Value @'\nREQUEST ADS, ADSCDX, DBFCDX\n#define ADS_REMOTE_SERVER 2\n#define\
        \ ADS_CDX 2\nPROCEDURE Main(cUri,cDir)\n LOCAL h:=0,aRows:={{\"105555\",.F.},{\"105556\",.F.},{\"105557\"\
        ,.T.},{\"105557\",.T.},{\"105566\",.F.}},a\n SET DELETED ON\n DbCreate(cDir+\"T_REC\",{{\"WRKORD\",\"C\"\
        ,6,0},{\"LABCOD\",\"C\",15,0}},\"DBFCDX\")\n DbUseArea(.T.,\"DBFCDX\",cDir+\"T_REC\",\"SEED\",.F.)\n FOR\
        \ EACH a IN aRows\n  DbAppend(); FIELD->WRKORD:=a[1]; FIELD->LABCOD:=\"C\"+a[1]+\"_\"+hb_ntos(a:__enumIndex())\n\
        \  IF a[2]; DbDelete(); ENDIF\n NEXT\n OrdCreate(,\"WRKORD\",\"WRKORD\",{||FIELD->WRKORD},.F.)\n DbCloseArea()\n\
        \ DbUseArea(.T.,\"DBFCDX\",cDir+\"T_REC\",\"REF\",.T.)\n CheckScope(\"DBFCDX\")\n DbCloseArea()\n AdsSetFileType(ADS_CDX)\n\
        \ Assert(AdsConnect60(cUri,ADS_REMOTE_SERVER,NIL,NIL,0,@h),\"connect\")\n DbUseArea(.T.,\"ADSCDX\",\"T_REC.dbf\"\
        ,\"REMOTE\",.T.,.F.,NIL,h)\n CheckScope(\"REMOTE\")\n DbCloseArea()\n ? \"TIM2E-HARBOUR-PASS\"\n ErrorLevel(0)\n\
        \ RETURN\nSTATIC PROCEDURE CheckScope(cEngine)\n LOCAL c,lLive\n OrdSetFocus(1)\n FOR EACH c IN {\"105557\"\
        ,\"105560\",\"105556\",\"105557\"}\n  lLive:=c==\"105556\"\n  OrdScope(0,c);OrdScope(1,c);DbGoTop()\n  Assert(Eof()==!lLive,cEngine+\"\
        \ EOF \"+c)\n  Assert(RecNo()==IIf(lLive,2,6),cEngine+\" RecNo \"+c)\n  Assert(FIELD->WRKORD==IIf(lLive,\"\
        105556\",Space(6)),cEngine+\" fields \"+c)\n  ? cEngine,c,Eof(),RecNo(),FIELD->WRKORD\n  DbSkip(1)\n  Assert(Eof(),cEngine+\"\
        \ skip EOF \"+c)\n NEXT\n OrdScope(0,NIL);OrdScope(1,NIL)\n RETURN\nSTATIC PROCEDURE Assert(lOk,cWhat)\n\
        \ IF !lOk\n  ? \"TIM2E-HARBOUR-FAIL\",cWhat\n  ErrorLevel(1)\n  QUIT\n ENDIF\n RETURN\n\n'@ -Encoding ascii\n\
        Push-Location $stage\n& $mk -comp=msvc64 -gtstd repro.prg -lrddads \"-L$stage\" -lace64 -llegacy_stdio_definitions\
        \ -loldnames\nif ($LASTEXITCODE -ne 0) { throw \"hbmk2 failed\" }\n$p = Start-Process ./openads_serverd.exe\
        \ -ArgumentList @('--host','127.0.0.1','--allow_anonymous','--port','6278','--data',$data) -PassThru -RedirectStandardOutput\
        \ server.txt -RedirectStandardError server-error.txt\ntry {\n Start-Sleep -Seconds 4\n & ./repro.exe 'tcp://127.0.0.1:6278/'\
        \ ($data+'\\') *> result.txt\n $rc = $LASTEXITCODE\n Write-Host \"repro process exit: $rc\"\n Get-Content\
        \ result.txt\n if ($rc -ne 0 -or -not (Select-String -Path result.txt -Pattern 'TIM2E-HARBOUR-PASS' -Quiet))\
        \ { throw 'Harbour regression failed' }\n} finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;\
        \ Pop-Location }\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tim2e-windows-harbour-proof
        path: ${{ runner.temp }}/tim2e-proof/*.txt
        retention-days: 14
