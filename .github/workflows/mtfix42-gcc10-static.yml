name: mtfix42 Winlibs GCC10.2 matched static (Pritpal Bedi)
on:
  push:
    branches: [security/mtfix42-gcc10-static]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            bits: 32
            folder: mingw32
            url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z
            checksum_url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z.sha256
          - arch: x64
            bits: 64
            folder: mingw64
            url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-x86_64-posix-seh-gcc-10.2.0-mingw-w64-8.0.0-r8.7z
            checksum_url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-x86_64-posix-seh-gcc-10.2.0-mingw-w64-8.0.0-r8.7z.sha256
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 50d51a5e64f62b6f980df0d6aaa4b2df9fc8868f
          persist-credentials: false
      - name: Download and verify Winlibs GCC10.2
        shell: pwsh
        run: |
          Invoke-WebRequest '${{ matrix.url }}' -OutFile "$env:RUNNER_TEMP/winlibs.7z"
          $sum = (Invoke-WebRequest '${{ matrix.checksum_url }}').Content
          $expected = [regex]::Match($sum, '[a-fA-F0-9]{64}').Value.ToLower()
          $actual = (Get-FileHash "$env:RUNNER_TEMP/winlibs.7z" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw 'Toolchain digest mismatch' }
          & 7z x "$env:RUNNER_TEMP/winlibs.7z" "-o$env:RUNNER_TEMP/winlibs" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/winlibs/${{ matrix.folder }}/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Exact-source build and full static validation
        shell: bash
        env:
          BITS: ${{ matrix.bits }}
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = 50d51a5e64f62b6f980df0d6aaa4b2df9fc8868f
          mkdir -p output
          gcc -v 2> output/toolchain.txt
          test "$(gcc -dumpfullversion)" = 10.2.0
          g++ -print-file-name=libstdc++.a > output/runtime-path.txt
          nm -C "$(g++ -print-file-name=libstdc++.a)" > output/runtime-symbols.txt
          echo '#include <bits/c++config.h>' > config-check.cpp
          g++ -dM -E config-check.cpp > output/runtime-macros.txt
          grep '_GLIBCXX_HAVE_TLS 1' output/runtime-macros.txt
          grep '__once_callable' output/runtime-symbols.txt
          cmake -S . -B build-winlibs -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0600 -DOPENADS_BUILD_TESTS=ON -DOPENADS_VERSION_FORCE=1.09.74-mtfix42 -DOPENADS_WITH_HTTP=OFF -DOPENADS_WITH_TLS=OFF -DOPENADS_WARNINGS_AS_ERRORS=OFF
          cmake --build build-winlibs --target openads_ace_static openads_static_archive_smoke -j2
          cp "build-winlibs/src/libopenace$BITS.a" output/libopenace32.a
          nm -u output/libopenace32.a > output/undefined-symbols.txt
          ! grep -E '__get_once_mutex|__once_functor|__set_once_functor_lock_ptr|__throw_bad_array_new_length|pthread_cond_timedwait32|nanosleep32' output/undefined-symbols.txt
          g++ -std=c++17 -Iinclude tests/smoke/mingw_static_ace.cpp output/libopenace32.a -static -lws2_32 -lpsapi -o output/static-smoke.exe
          g++ -std=c++17 -Iinclude tests/smoke/mingw_static_ace.cpp -Wl,--whole-archive output/libopenace32.a -Wl,--no-whole-archive -static -lws2_32 -lpsapi -o output/whole-archive-smoke.exe
          objdump -p output/whole-archive-smoke.exe > output/whole-archive-imports.txt
          ! grep -Ei 'DLL Name:.*(ace32|ace64|openace|libstdc|libgcc|libwinpthread)' output/whole-archive-imports.txt
          ./output/static-smoke.exe
          ./output/whole-archive-smoke.exe
          git clone https://github.com/harbour/core.git "$RUNNER_TEMP/harbour"
          git -C "$RUNNER_TEMP/harbour" checkout --detach 4ec2e154ed92757418bc30af571ab90240ab3209
          for unit in ads1 adsfunc adsmgmnt adsx; do
            gcc -c "$RUNNER_TEMP/harbour/contrib/rddads/$unit.c" -I"$RUNNER_TEMP/harbour/include" -I"$RUNNER_TEMP/harbour/contrib/rddads" -Iinclude/openads -o "output/$unit.o"
          done
          ar rcs output/librddads_openads_static.a output/ads1.o output/adsfunc.o output/adsmgmnt.o output/adsx.o
          git rev-parse HEAD > output/source-commit.txt
          sha256sum output/*.a > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtfix42-winlibs102-static-${{ matrix.arch }}
          path: output/
          if-no-files-found: error
          retention-days: 14
