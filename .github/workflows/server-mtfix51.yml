name: MTFIX51 POSIX signal fixture disposition proof
'on':
  push:
    branches:
    - test/auth-diagnostic-mtfix50
    paths:
    - .github/workflows/server-mtfix51.yml
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fixture:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
      with:
        ref: merge/mtfix51-owner-tested
    - name: Correct only signal test disposition and checksum
      run: 'set -euxo pipefail

        python3 - <<''PYFIX''

        import base64,pathlib

        pathlib.Path(''/tmp/fixture.patch'').write_bytes(base64.b64decode(''''))

        PYFIX

        test "$(git rev-parse HEAD)" = f96e625cc671ded94e7e4415816fa09e68a1cce2

        git apply --check /tmp/fixture.patch

        git apply /tmp/fixture.patch

        sha256sum -c docs/MTFIX51_TESTED_SOURCE_SHA256.txt

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add tests/unit/network_auth_signal_drain_test.cpp docs/MTFIX51_TESTED_SOURCE_SHA256.txt

        git commit -m ''Set and restore SIGPIPE disposition in portable drain test''

        git push origin HEAD:refs/heads/merge/mtfix51-owner-tested

        '
  posix-drain:
    needs: fixture
    strategy:
      matrix:
        os:
        - ubuntu-24.04
        - macos-14
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: merge/mtfix51-owner-tested
    - name: Test portable signal drain with real broken pipe
      run: 'set -euxo pipefail

        c++ -std=c++17 -pthread -Isrc -Ithird_party/doctest tests/unit/doctest_main.cpp
        tests/unit/network_auth_signal_drain_test.cpp -o signal-drain-tests

        ./signal-drain-tests

        '
