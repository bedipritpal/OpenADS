name: Unchanged main native baseline diagnosis (Pritpal Bedi)
'on':
  push:
    branches:
    - spike-unmerged/hrb-challenge-auth
    paths:
    - .github/workflows/hrb-worker-rtl.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86
          bits: 32
          checksum: 019ee601c48069b91101a3af923bf2cdd4399c99b9a1c70b5d59da9cfbb8e907
          folder: mingw32
          url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z
          checksum_url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z.sha256
        - arch: x64
          bits: 64
          checksum: 1e525afc8a3362a1054d7a9a44c8f496a7a652b224b79dbf4b6e5ca8c1012b74
          folder: mingw64
          url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-x86_64-posix-seh-gcc-10.2.0-mingw-w64-8.0.0-r8.7z
          checksum_url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-x86_64-posix-seh-gcc-10.2.0-mingw-w64-8.0.0-r8.7z.sha256
    steps:
    - uses: actions/checkout@v5
      with:
        ref: c450a220570e0fe7036a91aee66fe27ae3bee36d
        persist-credentials: false
    - name: Download and verify Winlibs GCC10.2
      shell: pwsh
      run: |
        Invoke-WebRequest '${{ matrix.url }}' -OutFile "$env:RUNNER_TEMP/winlibs.7z"
        $sum = (Invoke-WebRequest '${{ matrix.checksum_url }}').Content
        $expected = '${{ matrix.checksum }}'
        Write-Host "Expected: $expected"
        $actual = (Get-FileHash "$env:RUNNER_TEMP/winlibs.7z" -Algorithm SHA256).Hash.ToLower()
        Write-Host "Actual: $actual"
        if ($actual -ne $expected) { throw 'Toolchain digest mismatch' }
        & 7z x "$env:RUNNER_TEMP/winlibs.7z" "-o$env:RUNNER_TEMP/winlibs" -y
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "$env:RUNNER_TEMP/winlibs/${{ matrix.folder }}/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Unchanged main baseline exact runtime comparison
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p output
        gcc -v 2> output/toolchain.txt
        test "$(gcc -dumpfullversion)" = 10.2.0
        cmake -S . -B build-test -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0600 -DOPENADS_BUILD_TESTS=ON -DOPENADS_WITH_HTTP=OFF -DOPENADS_WITH_TLS=OFF -DOPENADS_WITH_HARBOUR_UDF=OFF -DOPENADS_WARNINGS_AS_ERRORS=OFF -DOPENADS_VERSION_FORCE=1.09.74-reconcile-test
        cmake --build build-test --target openads_serverd openads_unit_tests -j2
        # First reproduce the original candidate harness exactly, then isolate Windows temp environment.
        set +e
        build-test/tests/openads_unit_tests.exe --test-case-exclude='*soak*,*bench*,*5000*' > output/baseline-original-proof.txt
        original=$?
        set -e
        mkdir -p "$RUNNER_TEMP/openads-native-tmp"
        export TMP="$(cygpath -w "$RUNNER_TEMP/openads-native-tmp")"
        export TEMP="$TMP" TMPDIR="$TMP"
        export OPENADS_TEST_SERVERD="$(cygpath -w "$PWD/build-test/tools/serverd/openads_serverd.exe")"
        set +e
        build-test/tests/openads_unit_tests.exe --test-case-exclude='*soak*,*bench*,*5000*' > output/baseline-valid-temp-proof.txt
        fixed=$?
        set -e
        printf 'original_status=%s valid_temp_status=%s\n' "$original" "$fixed" > output/baseline-status.txt
        git rev-parse HEAD > output/source-commit.txt
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: main-baseline-${{ matrix.arch }}
        path: output/
        if-no-files-found: error
        retention-days: 14
