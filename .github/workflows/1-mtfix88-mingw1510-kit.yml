        test "$(wc -l < legacy2.txt)" -ge 55
        {
        echo '/* OpenSSL 1.1.x -> 3.x legacy symbol shim: tail-jumps to the renamed 3.x functions. */'
        while read old new; do
         echo "__asm__(\".text\\n.globl _${old}\\n_${old}:\\n\\tjmp _${new}\\n\");"
