           data root breaks the login path resolution on Linux), and
           sets enable_file_func = 1 so Vouch can create its data
           dictionary and log files inside the data folder. To
           reach the server from another machine, set host = 0.0.0.0 in
           openads.ini and open TCP 6262 in the box firewall and the EC2
           security group.
        7. Vouch login, same call as the Windows mtfix52 mock test:
           V2LoginMock("auth://BOX-IP:6262/C:/", "fixture-firm", "C:/", @s_hConn)
