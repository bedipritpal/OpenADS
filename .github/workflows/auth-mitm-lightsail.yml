name: Linux auth MITM and Qt492 one-archive TEST ONLY
'on':
  push:
    branches:
    - test/auth-mitm-lightsail
    paths:
    - .github/workflows/auth-mitm-lightsail.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
      with:
        ref: 6d5c59f4f91e9603c10231db14691d636f747faf
        fetch-depth: 0
    - name: Apply isolated auth MITM patch
      shell: bash
      run: 'set -euxo pipefail

        python - <<''PYCODE''

        import base64,gzip,pathlib

        pathlib.Path(''auth-candidate.patch'').write_bytes(gzip.decompress(base64.b64decode('''')))

        PYCODE

        git apply --check auth-candidate.patch

        git apply auth-candidate.patch

        sha256sum auth-candidate.patch > candidate-patch-sha256.txt

        git diff --check

        '
    - name: Build Harbour and Linux auth candidate
      shell: bash
      run: "set -euxo pipefail\nsudo apt-get update\nsudo apt-get install -y build-essential cmake ninja-build libncurses-dev python3-cryptography\n git clone https://github.com/harbour/core.git \"$RUNNER_TEMP/harbour\"\ngit -C \"$RUNNER_TEMP/harbour\" checkout 6deac9cf3ad977ae829e5bca543d553b92dd4b6d\nmake -C \"$RUNNER_TEMP/harbour\" -j2 HB_BUILD_CONTRIBS=no HB_BUILD_DYN=no\nH=\"$RUNNER_TEMP/harbour\"\ncmake -S . -B build-auth -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS_DEBUG='-O0 -g0' -DCMAKE_CXX_FLAGS_DEBUG='-O0 -g0' -DOPENADS_WITH_TLS=ON -DOPENADS_WITH_HTTP=OFF -DOPENADS_WITH_HARBOUR_UDF=ON -DOPENADS_AUTH_CAPACITY_TEST_SWITCH=ON -DHARBOUR_INCLUDE_DIR=\"$H/include\" -DHARBOUR_LIB_DIR=\"$H/lib/linux/gcc\" -DHARBOUR_COMPILER=\"$H/bin/linux/gcc/harbour\" '-DOPENADS_HARBOUR_LIBS=hbvmmt;hbrtl;hbmacro;hbpcre;hblang;hbcpage;hbrdd;rddfpt;rddntx;hbsix;hbcommon' -DOPENADS_WARNINGS_AS_ERRORS=OFF -DOPENADS_VERSION_FORCE=1.09.74-auth-mitm-test1\ncmake --build build-auth --target openads_serverd openads_auth_worker openads_ace auth_spike_worker_probe auth_spike_integration_probe auth_spike_abi_probe -j2\nmkdir -p output/proofs output/server\ncp build-auth/tools/serverd/openads_serverd build-auth/tools/serverd/openads_auth_worker output/server/\ncp docs/HRB_TLS_IDENTITY_GUARD.md docs/HRB_AUTH_CAPACITY_TEST.md output/\ncp candidate-patch-sha256.txt output/\n\"$H/bin/linux/gcc/harbour\" tests/hrb/auth-spike/test_only.prg -gh -ooutput/proofs/test_only.hrb\nchmod 600 output/proofs/test_only.hrb\nbuild-auth/tools/serverd/auth_spike_worker_probe \"$PWD/output/server/openads_auth_worker\" \"$PWD/output/proofs/test_only.hrb\" | tee output/proofs/worker.txt\npython3 - <<'CERT'\nfrom cryptography import x509\nfrom cryptography.x509.oid import NameOID\nfrom cryptography.hazmat.primitives import hashes,serialization\nfrom cryptography.hazmat.primitives.asymmetric import ec\nimport datetime,pathlib,hashlib\nk=ec.generate_private_key(ec.SECP256R1());n=x509.Name([x509.NameAttribute(NameOID.COMMON_NAME,'localhost')]);now=datetime.datetime.utcnow()\nc=x509.CertificateBuilder().subject_name(n).issuer_name(n).public_key(k.public_key()).serial_number(x509.random_serial_number()).not_valid_before(now-datetime.timedelta(days=1)).not_valid_after(now+datetime.timedelta(days=5)).add_extension(x509.SubjectAlternativeName([x509.DNSName('localhost')]),False).add_extension(x509.BasicConstraints(ca=True,path_length=None),True).sign(k,hashes.SHA256())\np=pathlib.Path('output/proofs');(p/'localhost.pem').write_bytes(c.public_bytes(serialization.Encoding.PEM));(p/'localhost.key').write_bytes(k.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()));(p/'pin.txt').write_text(hashlib.sha256(k.public_key().public_bytes(serialization.Encoding.DER,serialization.PublicFormat.SubjectPublicKeyInfo)).hexdigest())\nCERT\nbuild-auth/tools/serverd/auth_spike_integration_probe \"$PWD/output/server/openads_auth_worker\" \"$PWD/output/proofs/test_only.hrb\" \"$PWD/output/proofs/localhost.pem\" \"$PWD/output/proofs/localhost.key\" | tee output/proofs/integration.txt\nfor probe in tls_trust_probe tls_trust_auth_probe tls_trust_relay_probe;do\n g++ -std=c++17 -UNDEBUG -DOPENADS_WITH_TLS=1 -Iinclude -Isrc -Ibuild-auth/generated tests/hrb/auth-spike/$probe.cpp build-auth/src/libopenads_core.a build-auth/libopenads_minizip.a build-auth/libopenads_sqlite3.a build-auth/_deps/zlib_src-build/libz.a -Wl,--start-group build-auth/_deps/mbedtls-build/library/*.a build-auth/_deps/mbedtls-build/3rdparty/everest/*.a build-auth/_deps/mbedtls-build/3rdparty/p256-m/*.a \"$H\"/lib/linux/gcc/*.a -Wl,--end-group -lncurses -ltinfo -pthread -ldl -o output/proofs/$probe\ndone\npython3 tests/hrb/auth-spike/tls_trust_negative.py \"$PWD/output/proofs/tls_trust_probe\" | tee output/proofs/trust-negative.txt\nmkdir -p output/proofs/data\noutput/server/openads_serverd --host 127.0.0.1 --port 46591 --data \"$PWD/output/proofs/data\" --auth_user usr:pw --auth_module \"$PWD/output/proofs/test_only.hrb\" --tls_cert \"$PWD/output/proofs/localhost.pem\" --tls_key \"$PWD/output/proofs/localhost.key\" > output/proofs/server.txt 2>&1 &\nsrvpid=$!;trap 'kill \"$srvpid\" 2>/dev/null || true' EXIT\npython3 - <<'WAIT'\nimport pathlib,time\nfor i in range(100):\n if 'listening on' in pathlib.Path('output/proofs/server.txt').read_text():break\n time.sleep(.1)\nelse:raise SystemExit('server not ready')\nWAIT\noutput/proofs/tls_trust_auth_probe \"auth://localhost:46591/$PWD/output/proofs/data\" \"$(cat output/proofs/pin.txt)\" | tee output/proofs/optin-auth.txt\nkill \"$srvpid\";wait \"$srvpid\" || true;trap - EXIT\ncat > output/proofs/relay-proof.py <<'RELAY'\nimport ssl,socket,threading,subprocess,pathlib,time,datetime\nfrom cryptography import x509\nfrom cryptography.x509.oid import NameOID\nfrom cryptography.hazmat.primitives import hashes,serialization\nfrom cryptography.hazmat.primitives.asymmetric import ec\nroot=pathlib.Path('output/proofs/relay-fixtures');root.mkdir(exist_ok=True)\nk=ec.generate_private_key(ec.SECP256R1());n=x509.Name([x509.NameAttribute(NameOID.COMMON_NAME,'localhost')]);now=datetime.datetime.utcnow()\nc=x509.CertificateBuilder().subject_name(n).issuer_name(n).public_key(k.public_key()).serial_number(x509.random_serial_number()).not_valid_before(now-datetime.timedelta(days=1)).not_valid_after(now+datetime.timedelta(days=1)).add_extension(x509.SubjectAlternativeName([x509.DNSName('localhost')]),False).sign(k,hashes.SHA256())\n(root/'cert.pem').write_bytes(c.public_bytes(serialization.Encoding.PEM));(root/'key.pem').write_bytes(k.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()))\nserver=subprocess.Popen(['output/server/openads_serverd','--host','127.0.0.1','--port','46592','--data',str(pathlib.Path('output/proofs/data').resolve()),'--auth_user','usr:pw','--auth_module',str(pathlib.Path('output/proofs/test_only.hrb').resolve()),'--tls_cert','output/proofs/localhost.pem','--tls_key','output/proofs/localhost.key'],stdout=open('output/proofs/relay-server.txt','w'),stderr=subprocess.STDOUT)\ntry:\n for _ in range(60):\n  if 'listening on' in pathlib.Path('output/proofs/relay-server.txt').read_text():break\n  time.sleep(.1)\n listener=socket.socket();listener.bind(('127.0.0.1',0));listener.listen();port=listener.getsockname()[1];observed=[]\n def proxy():\n  conn,_=listener.accept();ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER);ctx.minimum_version=ssl.TLSVersion.TLSv1_3;ctx.load_cert_chain(str(root/'cert.pem'),str(root/'key.pem'))\n  try:\n   with ctx.wrap_socket(conn,server_side=True) as downstream:\n    upstreamctx=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT);upstreamctx.check_hostname=False;upstreamctx.verify_mode=ssl.CERT_NONE;upstreamctx.minimum_version=ssl.TLSVersion.TLSv1_3\n    with upstreamctx.wrap_socket(socket.create_connection(('127.0.0.1',46592)),server_hostname='localhost') as upstream:\n     downstream.settimeout(2);data=downstream.recv(4096);observed.append(len(data))\n     if data:upstream.sendall(data)\n  except (ssl.SSLError,OSError):observed.append(-1)\n  finally:listener.close()\n th=threading.Thread(target=proxy);th.start();r=subprocess.run(['output/proofs/tls_trust_relay_probe',f'auth://localhost:{port}/output/proofs/data',pathlib.Path('output/proofs/pin.txt').read_text()],capture_output=True,text=True,timeout=5);th.join();assert r.returncode==0,(r.stdout,r.stderr);assert not any(n>0 for n in observed),observed;print(r.stdout.strip());print('relay received no application auth frame',observed)\nfinally:server.terminate();server.wait(timeout=5)\n\nRELAY\npython3 output/proofs/relay-proof.py | tee output/proofs/relay.txt\nrm output/proofs/localhost.key output/proofs/relay-fixtures/key.pem\n\nldd output/server/openads_serverd > output/proofs/ldd-server.txt\nldd output/server/openads_auth_worker > output/proofs/ldd-worker.txt\nsha256sum output/server/* > output/SHA256.txt\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: linux-auth-mitm-candidate
        path: output/
        retention-days: 7
  qt492:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
    - uses: actions/checkout@v5
      with:
        ref: 6d5c59f4f91e9603c10231db14691d636f747faf
        fetch-depth: 0
    - name: Apply isolated auth MITM patch
      shell: bash
      run: 'set -euxo pipefail

        python - <<''PYCODE''

        import base64,gzip,pathlib

        pathlib.Path(''auth-candidate.patch'').write_bytes(gzip.decompress(base64.b64decode('''')))

        PYCODE

        git apply --check auth-candidate.patch

        git apply auth-candidate.patch

        sha256sum auth-candidate.patch > candidate-patch-sha256.txt

        git diff --check

        '
    - name: Download exact historical Qt compiler
      shell: pwsh
      run: 'Invoke-WebRequest ''https://download.qt.io/development_releases/prebuilt/mingw_32/i686-4.9.2-release-posix-dwarf-rt_v3-rev1.7z'' -OutFile "$env:RUNNER_TEMP/qt492.7z"

        if((Get-FileHash "$env:RUNNER_TEMP/qt492.7z" -Algorithm SHA256).Hash.ToLower() -ne ''f6de32350a28f4b6c30eec26dbfee65f112300d51e37e4d2007b0598bef9bb79''){throw ''Qt compiler hash mismatch''}

        & 7z x "$env:RUNNER_TEMP/qt492.7z" "-o$env:RUNNER_TEMP/qt492" -y


        Invoke-WebRequest ''https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z'' -OutFile "$env:RUNNER_TEMP/winlibs.7z"

        if((Get-FileHash "$env:RUNNER_TEMP/winlibs.7z" -Algorithm SHA256).Hash.ToLower() -ne ''019ee601c48069b91101a3af923bf2cdd4399c99b9a1c70b5d59da9cfbb8e907''){throw ''Winlibs hash mismatch''}

        & 7z x "$env:RUNNER_TEMP/winlibs.7z" "-o$env:RUNNER_TEMP/winlibs" -y

        '
    - name: Build Harbour with unchanged Qt4.9.2
      shell: bash
      run: 'set -euxo pipefail

        export PATH="$(cygpath -u "$RUNNER_TEMP/qt492/mingw32/bin"):$PATH"

        test "$(gcc -dumpversion)" = 4.9.2

        git clone https://github.com/harbour/core.git "$RUNNER_TEMP/harbour-old"

        git -C "$RUNNER_TEMP/harbour-old" checkout --detach 4ec2e154ed92757418bc30af571ab90240ab3209

        export HB_PLATFORM=win HB_COMPILER=mingw HB_BUILD_CONTRIBS=no HB_BUILD_DYN=no

        mingw32-make -C "$RUNNER_TEMP/harbour-old" -j2

        '
    - name: Build guarded raw client with pinned GCC10.2
      shell: bash
      run: 'set -euxo pipefail

        export PATH="$(cygpath -u "$RUNNER_TEMP/winlibs/mingw32/bin"):$PATH"

        cmake -S . -B build-legacy -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0600 -DOPENADS_BUILD_TESTS=OFF -DOPENADS_WITH_HARBOUR_UDF=ON -DOPENADS_AUTH_CAPACITY_TEST_SWITCH=ON -DHARBOUR_INCLUDE_DIR="$(cygpath -m "$RUNNER_TEMP/harbour-old/include")" -DHARBOUR_LIB_DIR="$(cygpath -m "$RUNNER_TEMP/harbour-old/lib/win/mingw")" ''-DOPENADS_HARBOUR_LIBS=hbvmmt;hbrtl;hbmacro;hbpcre;hblang;hbcpage;hbrdd;rddfpt;rddntx;hbsix;hbcommon''  -DOPENADS_WITH_HTTP=OFF -DOPENADS_WITH_TLS=ON -DOPENADS_WARNINGS_AS_ERRORS=OFF -DOPENADS_VERSION_FORCE=1.09.74-auth-mitm-test1

        cmake --build build-legacy --target openads_ace_static openads_serverd openads_auth_worker -j2

        find "$RUNNER_TEMP/winlibs" -iname ''*copying*'' -o -iname ''*license*'' | sort

        '
    - name: Package one-archive client and old-CRT exit proof
      shell: bash
      run: "set -euxo pipefail\nexport PATH=\"$(cygpath -u \"$RUNNER_TEMP/qt492/mingw32/bin\"):$PATH\"\nHB=\"$(cygpath -u \"$RUNNER_TEMP/harbour-old\")\"\nmkdir -p srv mtdata output kit\n\ncat > output/local_create.prg <<'PRG'\n#include \"ads.ch\"\nREQUEST ADS, ADSCDX\nPROCEDURE Main( cDir )\n   LOCAL cDbf := cDir + \"/TestIndex.dbf\", cIdx := cDir + \"/TestIndex.cdx\"\n   FIELD NAME,CITY,INS\n   OAds_SetLogging( .F. )\n   AdsSetServerType( ADS_LOCAL_SERVER )\n   AdsConnect( \".\" )\n   AdsSetFileType( ADS_CDX )\n   RddSetDefault( \"ADSCDX\" )\n   DbCreate( cDbf, { { \"NAME\", \"C\", 19, 0 }, { \"CITY\", \"C\", 15, 0 }, { \"AGE\", \"N\", 3, 0 }, { \"TS\", \"C\", 23, 0 }, { \"THD\", \"N\", 3, 0 }, { \"INS\", \"N\", 4, 0 }, { \"RDD\", \"C\", 3, 0 } }, \"ADSCDX\" )\n   dbCloseArea()\n   USE ( cDbf ) VIA \"ADSCDX\" ALIAS _STG SHARED NEW\n   INDEX ON NAME TAG \"IDX01\" TO ( cIdx )\n   INDEX ON CITY TAG \"IDX02\" TO ( cIdx )\n   INDEX ON INS TAG \"IDX03\" TO ( cIdx )\n   dbCloseArea()\n   OutStd( \"exact fixture ready\" + hb_eol() )\nRETURN\n\nPRG\ncat > output/probe_mt.prg <<'PRG'\n#include \"ads.ch\"\n#define __HLP__(s) .T.\nREQUEST ADS, ADSCDX\nSTATIC s_hConn := 0\nSTATIC s_cRdd := \"ADSCDX\"\nSTATIC s_nRandom := 1\nPROCEDURE Main( cUri, cDir )\n   LOCAL cChallenge, hPending := 0, i, x, aThreads := {}, cErr := Space(512)\n   ErrorBlock( {| e | OutStd( \"ERROR \" + hb_ValToExp(e) + hb_eol() ), Break(e) } )\n   AdsSetFileType( ADS_CDX )\n   AdsSetServerType( ADS_REMOTE_SERVER )\n   RddSetDefault( s_cRdd )\n   IF ! OAds_SetAuthTrust(cUri,NIL,hb_GetEnv(\"OPENADS_TEST_PIN\"))\n      ErrorLevel(7) ; QUIT\n   ENDIF\n   cChallenge := OAds_BeginAuth(cUri,@hPending)\n   IF Len(cChallenge)!=32\n      ErrorLevel(8) ; QUIT\n   ENDIF\n   s_hConn := OAds_CompleteAuth(hPending,cChallenge+\"test-only\")\n   IF Empty( s_hConn )\n      OutStd( \"CONNECT-FAIL\" + hb_eol() )\n      ErrorLevel(3) ; QUIT\n   ENDIF\n   FOR i := 1 TO 9\n      AAdd(aThreads,hb_threadStart({|| StageExact(cDir)}))\n   NEXT\n   StageExact(cDir)\n   OutStd( \"MAIN-STAGE-PASS\" + hb_eol() )\n   dbGoTop()\n   OutStd( \"MAIN-GOTOP-PASS lastrec=\" + hb_ntos(LastRec()) + hb_eol() )\n   FOR EACH x IN aThreads\n      hb_threadJoin(x)\n   NEXT\n   OutStd( \"EXACT-THREADS-JOINED lastrec=\" + hb_ntos(LastRec()) + hb_eol() )\n   dbCloseArea()\nRETURN\nPROCEDURE StageExact(cDir)\n   BEGIN SEQUENCE\n      IF HeyAddRecords(cDir+\"/TestIndex.dbf\",cDir+\"/TestIndex.cdx\")\n         dbGoTop()\n      ENDIF\n      Mark(\"stage done\")\n   RECOVER\n      Mark(\"RECOVER\")\n      ErrorLevel(4)\n   END SEQUENCE\nRETURN\nPROCEDURE Mark(c)\n   OutStd(\"t\"+hb_ntos(hb_threadId())+\" \"+c+hb_eol())\nRETURN\nPROCEDURE LogEvents(c)\n   Mark(c)\nRETURN\nFUNCTION HeyAddRecords( cDbf, cIdx )\n   LOCAL aRec, aData, lAppended\n   LOCAL lAdded := .T.\n\n   IF .T.\n      Mark( \"before USE\" )\n      USE ( cDbf ) VIA ( s_cRdd ) ALIAS _STG SHARED NEW\n   ENDIF\n   Mark( \"after USE\" )\n   IF ! Alias() == \"_STG\"\n      lAdded := .F.\n      ? \"Could not Open: \", cDbf\n   ELSE\n      IF __HLP__( \"__Switching it ON do not display records in the browser as well as referencing them__\" )\n         Mark( \"before dbSetIndex\" )\n         dbSetIndex( cIdx )\n         Mark( \"after dbSetIndex\" )\n         dbSetOrder( 0 )\n      ENDIF\n      aData := { { \"Alice\"  , \"Madrid\"    }, ;\n                 { \"Bob\"    , \"Barcelona\" }, ;\n                 { \"Phillip\", \"Panipat\"   }, ;\n                 { \"Charlie\", \"Valencia\"  }, ;\n                 { \"Linda\"  , \"Iris\"      }, ;\n                 { \"Finland\", \"Dallas\"    }, ;\n                 { \"Diana\"  , \"Sevilla\"   }, ;\n                 { \"Lucy\"   , \"Sevilla\"   }, ;\n                 { \"Jony\"   , \"Walker\"    }, ;\n                 { \"Edward\" , \"Bilbao\"    } }\n      FOR EACH aRec IN aData\n         Mark( \"before append \" + hb_ntos( aRec:__enumIndex() ) )\n#if 0\n         IF aRec:__enumIndex() > 1\n            EXIT\n         ENDIF\n#endif\n         IF ! lAppended := _STG->( DbAppend() )\n            hb_idleSleep()\n            lAppended := _STG->( DbAppend() )\n         ENDIF\n         Mark( \"after append ok=\" + hb_ValToExp(lAppended) + \" neterr=\" + hb_ValToExp(NetErr()) + \" recno=\" + hb_ntos(RecNo()) )\n         IF lAppended\n            REPLACE _STG->NAME WITH aRec[ 1 ]\n            REPLACE _STG->CITY WITH aRec[ 2 ]\n            REPLACE _STG->AGE  WITH hb_randInt( 20, 120 )\n            REPLACE _STG->TS   WITH hb_TSToStr( hb_DateTime() )\n            REPLACE _STG->THD  WITH hb_threadId()\n            REPLACE _STG->INS  WITH s_nRandom\n            REPLACE _STG->RDD  WITH s_cRdd\n            //\n            Mark( \"before commit\" )\n            _STG->( DbCommit() ) ; _STG->( dbUnlock() )\n            Mark( \"after commit/unlock\" )  /* a must for networked applications */\n         ELSE\n            LogEvents( \"Could not APPEND \" + aRec[ 1 ] )\n         ENDIF\n      NEXT\n   ENDIF\n   RETURN lAdded\n\n\nPRG\nW=\"$(cygpath -m \"$RUNNER_TEMP/winlibs/mingw32\")\"\nQ=\"$(cygpath -m \"$RUNNER_TEMP/qt492/mingw32\")\"\npython - <<'NOTICES'\nimport pathlib,shutil,os\nr=pathlib.Path(os.environ['RUNNER_TEMP'])/'winlibs/mingw32'\nfor name,dst in [('COPYING3','gcc/COPYING3'),('COPYING.RUNTIME','gcc/COPYING.RUNTIME'),('COPYING.MinGW-w64-runtime.txt','crt/COPYING.MinGW-w64-runtime.txt')]:\n hits=[p for p in r.rglob(name) if 'share/licenses' not in str(p)]\n if not hits: raise SystemExit('Exact distribution notice missing: '+name)\n data={p.read_bytes() for p in hits}\n if len(data)!=1: raise SystemExit('Ambiguous notice: '+name)\n out=r/'share/licenses'/dst;out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(next(iter(data)))\nhits=[p for p in r.rglob('COPYING') if 'pthread' in str(p).lower() and 'share/licenses' not in str(p)]\nif not hits: raise SystemExit('Exact winpthreads notice missing')\ndata={p.read_bytes() for p in hits}\nif len(data)!=1: raise SystemExit('Ambiguous winpthreads notice')\nout=r/'share/licenses/winpthreads/COPYING';out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(next(iter(data)))\nNOTICES\npython tools/scripts/package_static_client.py --profile qt492-x86 --engine build-legacy/src/libopenace32.a --runtime-root \"$W\" --link-root \"$Q\" --harbour-include \"$(cygpath -m \"$HB/include\")\" --ace-include \"$(cygpath -m \"$PWD/include/openads\")\" --glue \"$(cygpath -m \"$PWD/contrib/oads_hb/oads_hb.c\")\" --output kit/libopenace32.a | tee output/package-manifest.txt\ncp kit/libopenace32.a kit/libopenace32.manifest.json output/\ncp -r kit/runtime-notices output/\nfor unit in ads1 adsfunc adsmgmnt adsx;do\n gcc -c \"$HB/contrib/rddads/$unit.c\" -I\"$HB/include\" -I\"$HB/contrib/rddads\" -Iinclude/openads -o \"output/$unit.o\"\ndone\nar rcs kit/librddads.a output/ads1.o output/adsfunc.o output/adsmgmnt.o output/adsx.o\nfor name in local_create probe_mt;do\n \"$HB/bin/win/mingw/hbmk2.exe\" \"output/$name.prg\" -Lkit -lrddads -lopenace32 -iinclude/openads -i\"$HB/contrib/rddads\" -mt -gtstd -fullstatic -lws2_32 -lbcrypt -lpsapi -o\"output/$name.exe\"\ndone\ncat > output/tls-proof.c <<'TLSPROOF'\n#include <windows.h>\n#include <process.h>\n#include <stdio.h>\nextern int __cxa_thread_atexit(void (__attribute__((thiscall)) *)(void*), void*, void*);\nstatic volatile LONG count;\nstatic void __attribute__((thiscall)) cleanup(void* p) {\n    LONG n=InterlockedIncrement(&count);\n    printf(\"TLS-DTOR %ld\\n\",n); fflush(stdout);\n}\nstatic unsigned __stdcall worker(void* p) {\n    if(__cxa_thread_atexit(cleanup,p,0)) return 2;\n    return 0;\n}\nint main(void) {\n    HANDLE t[9]; int i; DWORD result;\n    if(__cxa_thread_atexit(cleanup,(void*)1,0)) return 3;\n    for(i=0;i<9;i++) t[i]=(HANDLE)_beginthreadex(0,0,worker,(void*)2,0,0);\n    WaitForMultipleObjects(9,t,TRUE,INFINITE);\n    for(i=0;i<9;i++){GetExitCodeThread(t[i],&result);if(result)return 4;CloseHandle(t[i]);}\n    printf(\"WORKER-DTORS %ld\\n\",count);fflush(stdout);\n    return count==9 ? 0 : 5;\n}\nTLSPROOF\ngcc output/tls-proof.c -Lkit -lopenace32 -static -lws2_32 -lbcrypt -lpsapi -o output/tls-proof.exe\noutput/tls-proof.exe > output/tls-proof.txt\ncat output/tls-proof.txt\ngrep -q \"WORKER-DTORS 9\" output/tls-proof.txt\ngrep -q \"TLS-DTOR 10\" output/tls-proof.txt\n\n\ncp build-legacy/tools/serverd/openads_serverd.exe build-legacy/tools/serverd/openads_auth_worker.exe srv/\n\"$HB/bin/win/mingw/harbour.exe\" tests/hrb/auth-spike/test_only.prg -gh -ooutput/test_only.hrb\ncat > output/check_rows.prg <<'CHECKROWS'\n#include \"ads.ch\"\nREQUEST ADS, ADSCDX\nPROCEDURE Main(cDir)\n LOCAL nRows:=0, nEmpty:=0\n FIELD NAME,CITY\n AdsSetServerType(ADS_LOCAL_SERVER)\n AdsSetFileType(ADS_CDX)\n RddSetDefault(\"ADSCDX\")\n USE (cDir+\"/TestIndex.dbf\") VIA \"ADSCDX\" SHARED NEW\n dbGoTop()\n DO WHILE !Eof()\n   nRows++\n   IF Empty(NAME) .OR. Empty(CITY)\n      nEmpty++\n   ENDIF\n   dbSkip()\n ENDDO\n OutStd(\"STORED rows=\"+hb_ntos(nRows)+\" lastrec=\"+hb_ntos(LastRec())+\" empty=\"+hb_ntos(nEmpty)+hb_eol())\n dbCloseAll()\nRETURN\nCHECKROWS\n\"$HB/bin/win/mingw/hbmk2.exe\" output/check_rows.prg -Lkit -lrddads -lopenace32 -iinclude/openads -i\"$HB/contrib/rddads\" -mt -gtstd -fullstatic -lws2_32 -lbcrypt -lpsapi -ooutput/check_rows.exe\n\n"
    - name: Guarded static threaded integrity and exit fixtures
      shell: bash
      run: "python -m pip install cryptography\npython - <<'PROOF'\nimport pathlib,subprocess,os,time,datetime,hashlib\nfrom cryptography import x509\nfrom cryptography.x509.oid import NameOID\nfrom cryptography.hazmat.primitives import hashes,serialization\nfrom cryptography.hazmat.primitives.asymmetric import ec\nroot=pathlib.Path.cwd();out=root/'output';data=root/'mtdata';data.mkdir(exist_ok=True)\nk=ec.generate_private_key(ec.SECP256R1());n=x509.Name([x509.NameAttribute(NameOID.COMMON_NAME,'localhost')]);now=datetime.datetime.utcnow()\nc=x509.CertificateBuilder().subject_name(n).issuer_name(n).public_key(k.public_key()).serial_number(x509.random_serial_number()).not_valid_before(now-datetime.timedelta(days=1)).not_valid_after(now+datetime.timedelta(days=5)).add_extension(x509.SubjectAlternativeName([x509.DNSName('localhost')]),False).sign(k,hashes.SHA256())\ncp=out/'localhost.pem';kp=out/'localhost.key';cp.write_bytes(c.public_bytes(serialization.Encoding.PEM));kp.write_bytes(k.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()));pin=hashlib.sha256(k.public_key().public_bytes(serialization.Encoding.DER,serialization.PublicFormat.SubjectPublicKeyInfo)).hexdigest()\nhrb=out/'test_only.hrb'\n# Remove inherited broad-read ACL from the synthetic module, permit current runner only.\nsubprocess.run(['icacls',str(hrb),'/inheritance:r','/grant:r',os.environ['USERNAME']+':R','SYSTEM:R','Administrators:R'],check=True)\ncmd=[str(root/'srv/openads_serverd.exe'),'--host','127.0.0.1','--port','46603','--data',data.as_posix(),'--http_port','0','--auth_user','usr:pw','--auth_module',str(hrb),'--tls_cert',str(cp),'--tls_key',str(kp)]\nlog=out/'guarded-server.txt';f=log.open('w');server=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT,cwd=root/'srv')\ntry:\n for i in range(200):\n  if 'listening on' in log.read_text():break\n  if server.poll() is not None:raise RuntimeError(log.read_text())\n  time.sleep(.1)\n else:raise RuntimeError('server not ready')\n env=os.environ.copy();env['OPENADS_TEST_PIN']=pin\n for i in range(20):\n  for x in data.glob('*'):x.unlink()\n  a=subprocess.run([str(out/'local_create.exe'),data.as_posix()],capture_output=True,text=True,timeout=30);assert a.returncode==0,(a.stdout,a.stderr)\n  a=subprocess.run([str(out/'probe_mt.exe'),'auth://localhost:46603/'+data.as_posix(),data.as_posix()],capture_output=True,text=True,timeout=45,env=env)\n  (out/f'guarded-{i}.txt').write_text(a.stdout+a.stderr);assert a.returncode==0 and 'EXACT-THREADS-JOINED' in a.stdout,(a.returncode,a.stdout,a.stderr)\n  a=subprocess.run([str(out/'check_rows.exe'),data.as_posix()],capture_output=True,text=True,timeout=30);assert a.returncode==0 and 'STORED rows=100 lastrec=100 empty=0' in a.stdout,(a.stdout,a.stderr)\n  (out/f'guarded-{i}-rows.txt').write_text(a.stdout)\n print('20 guarded static 10x10 append, stored-row and process-exit fixtures PASS')\nfinally:\n server.terminate();server.wait(timeout=10);f.close();kp.unlink()\nPROOF\n"
