name: Stage 3 RDD correctness review on current parent
on:
  push:
    branches: [stage3/rdd-correctness-review]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Configure
        run: cmake --preset ninja-clang -DOPENADS_WITH_TLS=ON -DOPENADS_WARNINGS_AS_ERRORS=OFF
      - name: Build
        run: cmake --build build/ninja-clang --parallel 2
      - name: List tests
        run: ctest --test-dir build/ninja-clang -N
      - name: Unit suite and integration tests, soak excluded
        run: ctest --test-dir build/ninja-clang --output-on-failure -E soak
      - name: Explicit RDD correctness tests
        shell: bash
        run: |
          set -o pipefail
          build/ninja-clang/tests/openads_unit_tests -tc='*scope*,*Scope*,*keynum*,*deleted*,*index_create_settle*,*index_handle*,*dirty_key*,*aof_index*,*memo_position*,*lock_ledger*,*count*,*Count*,*reccount*,*physical*' -tce='*[slow]*,*flaky*' | tee stage3-rdd.txt
