        \ (optional)\"\n+        description: \"source commit for a new test-build tag (optional)\"\n         required: false\n-        type: string\n-\n\
        \       repack_only:\n         description: \"Repackage existing public assets without rebuilding any binaries\"\n         required: false\n@@ -26,14\
        \ +23,13 @@ permissions:\n \n jobs:\n   build:\n-    if: ${{ !inputs.repack_only }}\n+    # Published mtfix assets are the reviewed bytes, never\
        \ rebuild on tag push.\n+    if: ${{ !inputs.repack_only && (github.event_name == 'workflow_dispatch' || !contains(github.ref, '-mtfix')) }}\n \
        \    name: ${{ matrix.os }} / ${{ matrix.arch }}\n     runs-on: ${{ matrix.os }}\n     # 90: a cold Harbour SDK build (Linux leg) plus the full\
        \ tree can\n     # exceed the old 60-minute cap; cached runs finish far sooner.\n     timeout-minutes: 90\n-    # Every release platform must pass;\
