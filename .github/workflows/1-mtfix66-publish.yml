name: mtfix66 publish verified existing artifacts
permissions:
  contents: write
  actions: read
concurrency:
  group: mtfix66-publish
  cancel-in-progress: false
'on':
  push:
    branches:
    - release/mtfix66-full
    paths:
    - .github/workflows/1-mtfix66-publish.yml
  workflow_dispatch: {}
jobs:
  publish:
    name: Publish combined prerelease
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@v4
      with:
        run-id: '42221589826'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pattern: kit-*
        path: download
    - name: Flatten existing archive assets and verify expected bytes
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PYFLAT'
        from pathlib import Path
        import shutil
        for f in Path('download').rglob('*'):
            if f.is_file():
                dst = Path(f.name)
                assert not dst.exists(), 'duplicate asset ' + f.name
                shutil.copyfile(f, dst)
        PYFLAT
        cat > EXPECTED_SHA256.txt <<'SUMS'
        db4c2305195237c4b1898936be5547c3959812c9c70b434fcb7a85f7331dc5cc  mtfix66-full-qt492-x86.zip
        0c2c09c1eae91abccfffff5bd1a1540df57867be54775761e9c6d4bb8823ed23  mtfix66-full-x64.zip
        5fb565ba6fd79e07ab93912c9f51a815283bd7c496fb437f4e3002c1d22288f2  openads-1.09.75-mtfix66-full-test-linux-x64.tar.gz
        2f632887addf17323de99bc7c63b7fcd88d528ab44c24efc4fa361d016fca1f3  MTFIX66_LINUX_SERVER_TEST.md
        b42c0555f9c988ba35b7299a19334de23fca592402893bc76cee831fcee1a1a9  openads-1.09.75-mtfix66-full-test-linux-x64.tar.gz.sha256
        aff62972f9aa28df355e2886555c893bb5ac98356e1d2802fadf25670dc1f9ee  openads-1.09.75-mtfix66-full-test-macos-universal.tar.gz
        01a712758e53b9c10ad7112e69bc8647b25192193aa76fab0d6732f65b0d5831  openads-1.09.75-mtfix66-full-test-macos-universal.tar.gz.sha256
        SUMS
        sha256sum -c EXPECTED_SHA256.txt
    - name: Write release notes
      shell: bash
      run: |
        cat > RELEASE_NOTES.md <<'NOTES'
        # OpenADS mtfix66 full cumulative test kit

        Pritpal Bedi. Fork bedipritpal/OpenADS from FiveTechSoft/OpenADS.

        Cumulative mtfix66 = frozen mtfix65 plus lazy frame-hook arming for the cli_trace wire log.
        Product source: 44ff9fd4bf18957b7bd57a2f1b6a1fbf78fd37f7.

        What changes: the per-frame wire hook now arms on the first traced call of a session
        (std::call_once inside cli_trace_on) instead of only inside AdsConnect60/OAdsBeginAuth.
        A session whose first connect call is OAdsBeginMutualAuth (the V2 auth:// chain) previously
        produced full cli_trace API lines but zero "wire op=0x" frame lines; an empty trace
        interval therefore could not be read as "no wire round trips". With this kit, frame
        lines appear on every connect path, so empty intervals become proof-grade again.

        Verified at runtime on the shipped Linux binaries of this exact kit against mtfix65
        (mutual-auth-only session against the mock V2 module, wire_trace=1):
        mtfix65: API lines present, 0 frame lines. mtfix66: 6 frame lines
        (open, goto, read, append, write, close); auth frames excluded by design.

        Reading traces: wire-trip totals come from "wire op=0x" frame lines only. The [W] flag
        on API lines attributes those same round trips to APIs; never add both. Compact mode
        (wire_trace_compact=1) still prints both. Coverage: every successful non-auth
        request/reply round trip after arming. Excluded by design: auth frames, failed
        sends/timeouts (already fail loud), the one-way disconnect frame, non-ACE traffic.
        API-line coverage is unchanged (uninstrumented remote-capable calls such as
        AdsAppendRecord leave no API line; frame lines are the complete-trip backstop).

        Known text slip: the Linux kit's MTFIX66_LINUX_SERVER_TEST.md still describes the kit as
        "frozen mtfix64 plus cli_trace wire-trip flags". The correct line is frozen mtfix65 plus
        lazy frame-hook arming. Kit contents, pins and hashes are correct.

        Carried unchanged: the mtfix64 explicit-refresh repair layer (explicit refresh re-reads the
        ordered ABI twin used to pack the response and propagates twin refresh errors) and the
        mtfix65 [W]/[L] flag column and compact mode. No Skip-freshness B, refill optimization,
        Vouch source rewrite, database/wire-format change or browse-speed claim. Shared
        pre-existing relation-child re-seek and stored-descending bottom/EOF gaps remain outside
        this repair. No full relation/descending semantics claim. Not proof of Vouch compiled
        RDDADS/ForceStable chain.

        Full kit build: https://github.com/bedipritpal/OpenADS/actions/runs/42221589826
        All four legs green in one run; the x86 connect-harness trailing-slash spelling from the
        mtfix64/mtfix65 first runs is fixed in this kit line.

        Windows x86 is not a clean unit-suite pass: same197 baseline failing cases with
        identical recorded assertion results/sourcefiles required. 1782 cases must execute,
        zero harness errors; new indexed explicit-refresh regression must pass 113 assertions,
        and prior Tim2e regression must still pass 304 assertions.
        All prior cumulative fixes/toolchains and auth/HRB/diagnostics gates retained.
        Main/upstream and running installations untouched. No automatic deployment.
        Client diagnostics default OFF. Explicit opt-in remains required.
        macOS uses Intel mac15/Xcode16.4, universal slices, minOS14.0 metadata and full tests.
        ARM slice and macOS14 runtime not independently tested; target metadata is not proof.
        Windows x64 has PE/package checks, not a native GCC unit-suite pass.

        All four platform kits together; SHA256 sidecars/manifests and source pins.
        Windows x86 Qt4.9.2/GCC10.2 and owner binutils 2.35.1 unchanged.
        Public mock HRB only, not real customer auth. Test-only, no automatic deployment.
        Use matched client/server for the mtfix64 repair layer. The mtfix65/mtfix66 trace
        changes are client-side only; no server change is required.
        NOTES
    - name: Create prerelease
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      shell: bash
      run: |
        set -euo pipefail
        sha256sum mtfix66-full-qt492-x86.zip mtfix66-full-x64.zip > WINDOWS_SHA256SUMS.txt
        gh release create v1.09.75-mtfix66-full-test \
          --target 44ff9fd4bf18957b7bd57a2f1b6a1fbf78fd37f7 \
          --prerelease --latest=false \
          --title "OpenADS mtfix66 full test kit - Windows x86 + Windows x64 + Linux x64 server + macOS universal" \
          --notes-file RELEASE_NOTES.md \
          WINDOWS_SHA256SUMS.txt \
          mtfix66-full-qt492-x86.zip mtfix66-full-x64.zip \
          openads-1.09.75-mtfix66-full-test-linux-x64.tar.gz openads-1.09.75-mtfix66-full-test-linux-x64.tar.gz.sha256 \
          MTFIX66_LINUX_SERVER_TEST.md \
          openads-1.09.75-mtfix66-full-test-macos-universal.tar.gz openads-1.09.75-mtfix66-full-test-macos-universal.tar.gz.sha256
        gh release view v1.09.75-mtfix66-full-test --json tagName,isPrerelease,url,assets
