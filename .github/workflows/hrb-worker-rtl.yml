name: Qt4.9.2 exact B_BIG append thread repro TEST ONLY
'on':
  push:
    branches:
    - spike-unmerged/hrb-challenge-auth
    paths:
    - .github/workflows/hrb-worker-rtl.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
    - uses: actions/download-artifact@v4
      with:
        name: hrb-auth-capacity-test-x86
        path: input
        run-id: 38274919983
        github-token: ${{ github.token }}
    - name: Download exact historical Qt compiler
      shell: pwsh
      run: 'Invoke-WebRequest ''https://download.qt.io/development_releases/prebuilt/mingw_32/i686-4.9.2-release-posix-dwarf-rt_v3-rev1.7z'' -OutFile "$env:RUNNER_TEMP/qt492.7z"

        if((Get-FileHash "$env:RUNNER_TEMP/qt492.7z" -Algorithm SHA256).Hash.ToLower() -ne ''f6de32350a28f4b6c30eec26dbfee65f112300d51e37e4d2007b0598bef9bb79''){throw ''Qt compiler hash mismatch''}

        & 7z x "$env:RUNNER_TEMP/qt492.7z" "-o$env:RUNNER_TEMP/qt492" -y


        Invoke-WebRequest ''https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z'' -OutFile "$env:RUNNER_TEMP/winlibs.7z"

        if((Get-FileHash "$env:RUNNER_TEMP/winlibs.7z" -Algorithm SHA256).Hash.ToLower() -ne ''019ee601c48069b91101a3af923bf2cdd4399c99b9a1c70b5d59da9cfbb8e907''){throw ''Winlibs hash mismatch''}

        & 7z x "$env:RUNNER_TEMP/winlibs.7z" "-o$env:RUNNER_TEMP/winlibs" -y

        '
    - name: Build Harbour with unchanged Qt4.9.2
      shell: bash
      run: 'set -euxo pipefail

        export PATH="$(cygpath -u "$RUNNER_TEMP/qt492/mingw32/bin"):$PATH"

        test "$(gcc -dumpversion)" = 4.9.2

        git clone https://github.com/harbour/core.git "$RUNNER_TEMP/harbour-old"

        git -C "$RUNNER_TEMP/harbour-old" checkout --detach 4ec2e154ed92757418bc30af571ab90240ab3209

        export HB_PLATFORM=win HB_COMPILER=mingw HB_BUILD_CONTRIBS=no HB_BUILD_DYN=no

        mingw32-make -C "$RUNNER_TEMP/harbour-old" -j2

        '
    - name: Write fixtures and build static probes
      shell: bash
      run: "set -euxo pipefail\nexport PATH=\"$(cygpath -u \"$RUNNER_TEMP/qt492/mingw32/bin\"):$PATH\"\nHB=\"$(cygpath -u \"$RUNNER_TEMP/harbour-old\")\"\nmkdir -p srv mtdata output\ncp input/hrb-auth-UNMERGED-x86/bin/*.exe input/hrb-auth-UNMERGED-x86/bin/*.dll srv/\ntrap 'cat output/*build.txt 2>/dev/null || true' ERR\necho '' | base64 -d > srv/test_only.hrb\necho '' | base64 -d > output/local_create.prg\necho '' | base64 -d > output/probe_mt.prg\nmkdir -p kit\nW=\"$(cygpath -m \"$RUNNER_TEMP/winlibs/mingw32\")\"\nQ=\"$(cygpath -m \"$RUNNER_TEMP/qt492/mingw32\")\"\npython tools/scripts/package_static_client.py --profile qt492-x86 --engine input/hrb-auth-UNMERGED-x86/lib/libopenace32.a --runtime-root \"$W\" --link-root \"$Q\" --harbour-include \"$HB/include\" --ace-include input/hrb-auth-UNMERGED-x86/include --glue input/hrb-auth-UNMERGED-x86/contrib/oads_hb.c --output kit/libopenace32.a | tee output/package-manifest.txt\ncp kit/libopenace32.a kit/libopenace32.manifest.json output/\nfor unit in ads1 adsfunc adsmgmnt adsx;do\n gcc -c \"$HB/contrib/rddads/$unit.c\" -I\"$HB/include\" -I\"$HB/contrib/rddads\" -Iinput/hrb-auth-UNMERGED-x86/include -o \"output/$unit.o\"\ndone\nar rcs kit/librddads.a output/ads1.o output/adsfunc.o output/adsmgmnt.o output/adsx.o\nsha256sum kit/libopenace32.a kit/librddads.a > output/kit-hashes.txt\nsha256sum kit/libopenace32.a > output/candidate-kit-hash.txt\n\"$HB/bin/win/mingw/hbmk2.exe\" output/local_create.prg -Lkit -lrddads -lopenace32 -iinput/hrb-auth-UNMERGED-x86/include -i\"$HB/contrib/rddads\" -mt -gtstd -fullstatic -lws2_32 -lbcrypt -lpsapi -ooutput/local_create.exe > output/local-create-build.txt 2>&1\n\"$HB/bin/win/mingw/hbmk2.exe\" output/probe_mt.prg -Lkit -lrddads -lopenace32 -iinput/hrb-auth-UNMERGED-x86/include -i\"$HB/contrib/rddads\" -mt -gtstd -fullstatic -lws2_32 -lbcrypt -lpsapi -ooutput/probe_mt.exe > output/probe-static-build.txt 2>&1\nmkdir -p lrdd && cp kit/librddads.a lrdd/\n\"$HB/bin/win/mingw/hbmk2.exe\" output/probe_mt.prg input/hrb-auth-UNMERGED-x86/contrib/oads_hb.c -Llrdd -Lsrv -lrddads -lopenace32 -iinput/hrb-auth-UNMERGED-x86/include -i\"$HB/contrib/rddads\" -mt -gtstd -lws2_32 -lbcrypt -lpsapi -ooutput/probe_mt_dll.exe > output/probe-dll-build.txt 2>&1\nD=\"$(cygpath -m \"$PWD/mtdata\")\"\noutput/local_create.exe \"$D\" > output/local-create-run.txt 2>&1\nls -la mtdata > output/mtdata-listing.txt\n\nobjdump -p output/probe_mt.exe > output/static-pe.txt\nobjdump -p output/probe_mt_dll.exe > output/dll-pe.txt\n\ncat > output/tls-proof.c <<'TLSPROOF'\n#include <windows.h>\n#include <process.h>\n#include <stdio.h>\nextern int __cxa_thread_atexit(void (__attribute__((thiscall)) *)(void*), void*, void*);\nstatic volatile LONG count;\nstatic void __attribute__((thiscall)) cleanup(void* p) {\n    LONG n=InterlockedIncrement(&count);\n    printf(\"TLS-DTOR %ld\\n\",n); fflush(stdout);\n}\nstatic unsigned __stdcall worker(void* p) {\n    if(__cxa_thread_atexit(cleanup,p,0)) return 2;\n    return 0;\n}\nint main(void) {\n    HANDLE t[9]; int i; DWORD result;\n    if(__cxa_thread_atexit(cleanup,(void*)1,0)) return 3;\n    for(i=0;i<9;i++) t[i]=(HANDLE)_beginthreadex(0,0,worker,(void*)2,0,0);\n    WaitForMultipleObjects(9,t,TRUE,INFINITE);\n    for(i=0;i<9;i++){GetExitCodeThread(t[i],&result);if(result)return 4;CloseHandle(t[i]);}\n    printf(\"WORKER-DTORS %ld\\n\",count);fflush(stdout);\n    return count==9 ? 0 : 5;\n}\nTLSPROOF\ngcc output/tls-proof.c -Lkit -lopenace32 -static -lws2_32 -lbcrypt -lpsapi -o output/tls-proof.exe\noutput/tls-proof.exe > output/tls-proof.txt\ncat output/tls-proof.txt\ngrep -q \"WORKER-DTORS 9\" output/tls-proof.txt\ngrep -q \"TLS-DTOR 10\" output/tls-proof.txt\n\ncat > output/check_rows.prg <<'CHECKROWS'\n#include \"ads.ch\"\nREQUEST ADS, ADSCDX\nPROCEDURE Main(cDir)\n LOCAL nRows:=0, nEmpty:=0\n FIELD NAME,CITY\n AdsSetServerType(ADS_LOCAL_SERVER)\n AdsSetFileType(ADS_CDX)\n RddSetDefault(\"ADSCDX\")\n USE (cDir+\"/TestIndex.dbf\") VIA \"ADSCDX\" SHARED NEW\n dbGoTop()\n DO WHILE !Eof()\n   nRows++\n   IF Empty(NAME) .OR. Empty(CITY)\n      nEmpty++\n   ENDIF\n   dbSkip()\n ENDDO\n OutStd(\"STORED rows=\"+hb_ntos(nRows)+\" lastrec=\"+hb_ntos(LastRec())+\" empty=\"+hb_ntos(nEmpty)+hb_eol())\n dbCloseAll()\nRETURN\nCHECKROWS\n\"$HB/bin/win/mingw/hbmk2.exe\" output/check_rows.prg -Lkit -lrddads -lopenace32 -iinput/hrb-auth-UNMERGED-x86/include -i\"$HB/contrib/rddads\" -mt -gtstd -fullstatic -lws2_32 -lbcrypt -lpsapi -ooutput/check_rows.exe\n"
    - name: Start auth server and run both probes in same process lifetime
      shell: pwsh
      run: "$hrb=(Resolve-Path srv/test_only.hrb).Path\n$me=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name\nicacls $hrb /inheritance:r /remove:g '*S-1-3-4' /grant:r \"${me}:(F)\" '*S-1-5-18:(F)' '*S-1-5-32-544:(F)'\nif($LASTEXITCODE -ne 0){throw 'ACL failed'}\n$data=(Resolve-Path mtdata).Path\n$srv=(Resolve-Path srv/openads_serverd.exe).Path\n& $srv --help | Out-File srv/help.txt\n& $srv --version | Out-File srv/version.txt\n$argsLine='--port 16262 --data '+$data+' --auth_module '+$hrb\n$argsLine | Out-File srv/args.txt\n$p=Start-Process -FilePath $srv -ArgumentList $argsLine -WorkingDirectory (Split-Path $srv) -RedirectStandardOutput srv/stdout.log -RedirectStandardError srv/stderr.log -PassThru\nGet-CimInstance Win32_Process -Filter \"ProcessId=$($p.Id)\" | Select-Object ProcessId,CommandLine | Format-List | Out-File srv/process.txt\n$ok=$false\nfor($i=0;$i -lt 60;$i++){ $c=Test-NetConnection -ComputerName 127.0.0.1 -Port 16262 -WarningAction SilentlyContinue; if($c.TcpTestSucceeded){$ok=$true;break}; Start-Sleep -Milliseconds 500 }\nif(-not $ok){ Get-Content srv/stdout.log,srv/stderr.log -ErrorAction SilentlyContinue; throw 'server did not listen' }\n\"server pid $($p.Id) listening\" | Out-File srv/server-started.txt\n\n$data=(Resolve-Path mtdata).Path -replace '\\\\','/'\n$url=\"auth://127.0.0.1:16262/$data\"\n$exe=(Resolve-Path output/probe_mt.exe).Path\n$p=Start-Process -FilePath $exe -ArgumentList @($url,$data) -RedirectStandardOutput output/static-stdout.txt -RedirectStandardError output/static-stderr.txt -PassThru\nif(-not $p.WaitForExit(45000)){\n          $dbg=\"$env:RUNNER_TEMP/qt492/mingw32/bin/gdb.exe\"\n          @('set pagination off','info threads','x/8wx 0xd75e60','x/8wx *(unsigned int*)0xd75e60','thread apply all bt','thread apply all info registers esp ebp eip','python','import gdb','owner=int(gdb.parse_and_eval(\"*((unsigned int*)(*(unsigned int*)0xd75e60)+4)\"))','for t in gdb.selected_inferior().threads():','  if owner in t.ptid:','    t.switch()','    gdb.execute(\"x/12wx *(unsigned int*)($esp+4)-4\")','    gdb.execute(\"x/300a $esp\")','for t in gdb.selected_inferior().threads():','  t.switch()','  print(\"RAW THREAD\", t.ptid)','  try: gdb.execute(\"x/24wx *(unsigned int*)($esp+4)-4\")','  except Exception as e: print(e)','  try: gdb.execute(\"x/600a $esp\")','  except Exception as e: print(e)','end','detach','quit') | Set-Content output/gdb-commands.txt\n          $cmd='-batch -p '+$p.Id+' -x '+(Resolve-Path output/gdb-commands.txt).Path\n          $g=Start-Process -FilePath $dbg -ArgumentList $cmd -RedirectStandardOutput output/static-gdb.txt -RedirectStandardError output/static-gdb-error.txt -PassThru\n          if(-not $g.WaitForExit(30000)){$g.Kill()}\n          $p.Kill(); \"STATIC-HUNG after 45s url=$url\" | Out-File output/static-result.txt } else { \"STATIC-EXIT $($p.ExitCode) url=$url\" | Out-File output/static-result.txt }\nGet-Content output/static-result.txt,output/static-stdout.txt,output/static-stderr.txt\n\n$env:Path = (Resolve-Path srv).Path + ';' + $env:Path\n$data=(Resolve-Path mtdata).Path -replace '\\\\','/'\n$url=\"auth://127.0.0.1:16262/$data\"\n$exe=(Resolve-Path output/probe_mt_dll.exe).Path\n$p=Start-Process -FilePath $exe -ArgumentList @($url,$data) -RedirectStandardOutput output/dll-stdout.txt -RedirectStandardError output/dll-stderr.txt -PassThru\nif(-not $p.WaitForExit(45000)){\n          $dbg=\"$env:RUNNER_TEMP/qt492/mingw32/bin/gdb.exe\"\n          @('set pagination off','info threads','x/8wx 0xd75e60','x/8wx *(unsigned int*)0xd75e60','thread apply all bt','thread apply all info registers esp ebp eip','python','import gdb','owner=int(gdb.parse_and_eval(\"*((unsigned int*)(*(unsigned int*)0xd75e60)+4)\"))','for t in gdb.selected_inferior().threads():','  if owner in t.ptid:','    t.switch()','    gdb.execute(\"x/12wx *(unsigned int*)($esp+4)-4\")','    gdb.execute(\"x/300a $esp\")','for t in gdb.selected_inferior().threads():','  t.switch()','  print(\"RAW THREAD\", t.ptid)','  try: gdb.execute(\"x/24wx *(unsigned int*)($esp+4)-4\")','  except Exception as e: print(e)','  try: gdb.execute(\"x/600a $esp\")','  except Exception as e: print(e)','end','detach','quit') | Set-Content output/gdb-commands.txt\n          $cmd='-batch -p '+$p.Id+' -x '+(Resolve-Path output/gdb-commands.txt).Path\n          $g=Start-Process -FilePath $dbg -ArgumentList $cmd -RedirectStandardOutput output/dll-gdb.txt -RedirectStandardError output/dll-gdb-error.txt -PassThru\n          if(-not $g.WaitForExit(30000)){$g.Kill()}\n          $p.Kill(); \"DLL-HUNG after 45s url=$url\" | Out-File output/dll-result.txt } else { \"DLL-EXIT $($p.ExitCode) url=$url\" | Out-File output/dll-result.txt }\nGet-Content output/dll-result.txt,output/dll-stdout.txt,output/dll-stderr.txt,srv/stdout.log,srv/stderr.log\n\nGet-CimInstance Win32_Process -Filter \"Name='openads_serverd.exe'\" | Select-Object ProcessId,CommandLine | Format-List | Out-File srv/process-final.txt\n\nGet-Content output/*gdb*.txt -ErrorAction SilentlyContinue\n        if(-not (Select-String -Path output/static-result.txt -Pattern \"STATIC-EXIT 0\" -Quiet)){throw \"static probe failed\"}\nif(-not (Select-String -Path output/dll-result.txt -Pattern \"DLL-EXIT 0\" -Quiet)){throw \"DLL probe failed\"}\n\nGet-Content output/*gdb*.txt -ErrorAction SilentlyContinue\n\nfor($trial=1;$trial -le 20;$trial++) {\n foreach($mode in @('static','dll')) {\n  $trialDir=Join-Path (Get-Location) \"mtdata/$mode$trial\"\n  New-Item -ItemType Directory -Path $trialDir -Force | Out-Null\n  $trialDir=$trialDir.Replace('\\','/')\n  & output/local_create.exe $trialDir | Out-File \"output/$mode$trial-fixture.txt\"\n  $trialUrl=\"auth://127.0.0.1:16262/$trialDir\"\n  $exe='output/probe_mt.exe';if($mode -eq 'dll'){$exe='output/probe_mt_dll.exe'}\n  $clock=[System.Diagnostics.Stopwatch]::StartNew()\n  $p=Start-Process -FilePath (Resolve-Path $exe).Path -ArgumentList @($trialUrl,$trialDir) -RedirectStandardOutput \"output/$mode$trial-stdout.txt\" -RedirectStandardError \"output/$mode$trial-stderr.txt\" -PassThru\n  if(-not $p.WaitForExit(45000)){$p.Kill();throw \"$mode trial $trial hung\"}\n  if($p.ExitCode -ne 0){throw \"$mode trial $trial failed exit $($p.ExitCode)\"}\n  $clock.Stop()\n  $elapsed=$clock.Elapsed.TotalMilliseconds\n  $end=Select-String -Path \"output/$mode$trial-stdout.txt\" -Pattern 'EXACT-THREADS-JOINED'\n  $fails=@(Select-String -Path \"output/$mode$trial-stdout.txt\" -Pattern 'Could not APPEND').Count\n  $stored=& output/check_rows.exe $trialDir\n  $bytes=[System.IO.File]::ReadAllBytes(\"$trialDir/TestIndex.dbf\")\n  $disk=[BitConverter]::ToUInt32($bytes,4)\n  \"$mode TRIAL $trial PASS $end elapsed_ms=$elapsed failed_appends=$fails disk_header=$disk $stored\" | Tee-Object -FilePath output/repeat-summary.txt -Append\n  if(-not $end){throw \"$mode trial $trial incomplete\"}\n }\n}\nGet-Content output/tls-proof.txt,output/candidate-kit-hash.txt\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qt492-static-append-threads-repro
        path: 'output/

          srv/stdout.log

          srv/stderr.log

          srv/*.txt

          '
        if-no-files-found: warn
        retention-days: 14
