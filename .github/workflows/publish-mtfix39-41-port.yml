          +                      std::size_t, std::uint8_t, std::size_t, long long) {
          +    if (op != gated_opcode.load()) return;
          +    std::unique_lock<std::mutex> lk(gate_mu);
          +    entered = true;
          +    gate_cv.notify_all();
          +    gate_cv.wait(lk, [] { return released; });
          +}
