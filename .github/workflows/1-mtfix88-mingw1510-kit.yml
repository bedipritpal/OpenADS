        gcc -dumpmachine
        echo 'int main(){return 0;}' > t.c && gcc t.c -o t.exe && objdump -p t.exe | grep -i 'msvcrt\|ucrt' | head -5 || true
    - name: Set up a complete MSYS2 perl for OpenSSL Configure
