# Credit: Pritpal Bedi
name: Post-sync TEST kits, artifacts only (review proposal)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2022
          arch: x64
          preset: msvc-x64
          artifact_ext: zip
          cmake_extra: ''
        - os: windows-2022
          arch: x86
          preset: msvc-x86
          artifact_ext: zip
          cmake_extra: ''
        - os: ubuntu-24.04
          arch: x64
          preset: ninja-clang
          artifact_ext: tar.gz
          cmake_extra: ''
        - os: macos-15
          arch: universal
          preset: default
          artifact_ext: tar.gz
          cmake_extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
    steps:
    - uses: actions/checkout@v5
      with:
        ref: a417a6fd3abf8473ef70859c3b4a6e9a50e3065c
        fetch-depth: 1
        persist-credentials: false
    - name: Require exact reviewed source
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "a417a6fd3abf8473ef70859c3b4a6e9a50e3065c"
        test "$(git rev-parse HEAD^{tree})" = "37f375332767566cbeed87e11f5afc7c61eeec3b"
    - name: Native Windows synthetic packaging regression
      if: runner.os == 'Windows'
      shell: pwsh
      run: python tests/static_client_packaging_test.py
    - name: Resolve tag
      id: tag
      shell: bash
      run: |
        echo "tag=local-review-only" >> "$GITHUB_OUTPUT"
        echo "version=1.09.76" >> "$GITHUB_OUTPUT"
    - name: Install Ninja (Linux / macOS)
      if: runner.os != 'Windows'
      uses: seanmiddleditch/gha-setup-ninja@v6
    - name: Cache Harbour SDK (Linux)
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/harbour-udf
        key: harbour-udf-linux-4ec2e154ed92757418bc30af571ab90240ab3209-v1
    - name: Provision Harbour SDK (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        HARBOUR_REF: 4ec2e154ed92757418bc30af571ab90240ab3209
      run: "set -e\nHB=\"$RUNNER_TEMP/harbour-udf\"\necho \"HB_ROOT=$HB/install\" >> \"$GITHUB_ENV\"\nif [ -f \"\
        $HB/install/include/hbvm.h\" ] && \\\n   [ -n \"$(find \"$HB/install\" -name 'libhbvmmt.a' 2>/dev/null |\
        \ head -1)\" ] && \\\n   [ -n \"$(find \"$HB/install\" -name harbour -type f 2>/dev/null | head -1)\" ];\
        \ then\n  echo \"Harbour SDK cached at $HB/install\"\nelse\nsudo apt-get update\nsudo apt-get install -y\
        \ build-essential libncurses-dev libx11-dev\nrm -rf \"$HB\"\nmkdir -p \"$HB\"\ngit clone --depth 1 --branch\
        \ master https://github.com/harbour/core.git \"$HB/src\"\ngit -C \"$HB/src\" fetch --depth 1 origin \"$HARBOUR_REF\"\
        \ngit -C \"$HB/src\" checkout \"$HARBOUR_REF\"\ncd \"$HB/src\"\nmake -j\"$(nproc)\" install HB_INSTALL_PREFIX=\"\
        $HB/install\" HB_BUILD_3RDEXT=no\nfi\n# Resolve exact SDK paths (no layout guessing in CMake):\n# headers,\
        \ MT VM archive, compiler binary.\nHB_INC=\"$(dirname \"$(find \"$HB/install\" -name hbvm.h | head -1)\"\
        )\"\nHB_LIBDIR=\"$(dirname \"$(find \"$HB/install\" -name 'libhbvmmt.a' | head -1)\")\"\nHB_CC=\"$(find\
        \ \"$HB/install\" -name harbour -type f -executable | head -1)\"\necho \"Harbour SDK layout:\"\necho \"\
        \  include: ${HB_INC:-MISSING}\"\necho \"  libdir:  ${HB_LIBDIR:-MISSING}\"\necho \"  compiler:${HB_CC:-MISSING}\"\
        \nif [ -z \"$HB_INC\" ] || [ -z \"$HB_LIBDIR\" ] || [ -z \"$HB_CC\" ]; then\n  echo \"::error::Harbour SDK\
        \ layout unexpected \u2014 full listing:\"\n  find \"$HB/install\" -maxdepth 4 | sort | head -80\n  exit\
        \ 1\nfi\n{\n  echo \"HARBOUR_INCLUDE_DIR=$HB_INC\"\n  echo \"HARBOUR_LIB_DIR=$HB_LIBDIR\"\n  echo \"HARBOUR_COMPILER=$HB_CC\"\
        \n} >> \"$GITHUB_ENV\"\n"
    - name: Configure
      shell: bash
      run: |
        cmake --preset ${{ matrix.preset }} \
              -DOPENADS_WITH_TLS=ON \
              -DOPENADS_WITH_HTTP=ON \
              -DOPENADS_VERSION_FORCE="${{ steps.tag.outputs.version }}" \
              ${{ matrix.cmake_extra }} \
              ${{ runner.os == 'Linux' && format('-DOPENADS_WITH_HARBOUR_UDF=ON -DHARBOUR_INCLUDE_DIR={0} -DHARBOUR_LIB_DIR={1} -DHARBOUR_COMPILER={2}', env.HARBOUR_INCLUDE_DIR, env.HARBOUR_LIB_DIR, env.HARBOUR_COMPILER) || '' }}
    - name: Build
      run: cmake --build build/${{ matrix.preset }} --config Release
    - name: Test
      timeout-minutes: ${{ startsWith(matrix.os, 'macos') && 20 || 30 }}
      continue-on-error: false
      run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure -C Release
    - name: Set up MinGW for the static ACE library
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.arch == 'x64' && 'MINGW64' || 'MINGW32' }}
        release: false
        update: false
        install: ${{ matrix.arch == 'x64' && 'mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake' || 'mingw-w64-i686-toolchain
          mingw-w64-i686-cmake' }} python git make
    - name: Build static ACE library (MinGW)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        set -euo pipefail
        test "$(gcc -dumpversion)" = "16.2.0"
        gcc -v
        cmake -S . -B build/mingw-${{ matrix.arch }} -G "MSYS Makefiles" \
              -DCMAKE_BUILD_TYPE=Release \
              -DOPENADS_BUILD_TESTS=ON \
              -DOPENADS_VERSION_FORCE="${{ steps.tag.outputs.version }}" \
              -DOPENADS_WITH_HTTP=OFF \
              -DOPENADS_WITH_TLS=OFF \
              -DOPENADS_WARNINGS_AS_ERRORS=OFF
        cmake --build build/mingw-${{ matrix.arch }} \
              --target openads_ace_static openads_unit_tests -j"$(nproc)"
        ctest --test-dir build/mingw-${{ matrix.arch }} --output-on-failure -C Release
        ls -la build/mingw-${{ matrix.arch }}/src/libopenace*.a
    - name: Package one-archive static Harbour kit and run smoke
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        bits=32; if [ '${{ matrix.arch }}' = x64 ]; then bits=64; fi
        bash tools/scripts/test_harbour_static_mingw.sh build/mingw-${{ matrix.arch }}/src/libopenace$bits.a $bits
    - name: Build pinned Harbour SDK (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      env:
        HARBOUR_REF: 694428e1c12f726675b19324d62167fa77d68185
      run: |
        set -euo pipefail
        SRC="$RUNNER_TEMP/harbour-sdk-src"
        git clone --no-checkout https://github.com/harbour/core.git "$SRC"
        git -C "$SRC" checkout --detach "$HARBOUR_REF"
        test "$(git -C "$SRC" rev-parse HEAD)" = "$HARBOUR_REF"
        git -C "$SRC" apply --check "$PWD/patches/harbour/rddads-pending-fields.patch"
        git -C "$SRC" apply "$PWD/patches/harbour/rddads-pending-fields.patch"
        export HB_PLATFORM=win HB_COMPILER=mingw HB_BUILD_CONTRIBS=no HB_BUILD_DYN=no HB_BUILD_3RDEXT=no
        mingw32-make -C "$SRC" -j"$(nproc)"
    - name: Assemble librddads.a for the x86 client kit
      if: runner.os == 'Windows' && matrix.arch == 'x86'
      shell: msys2 {0}
      run: |
        set -euo pipefail
        SRC="$RUNNER_TEMP/harbour-sdk-src"
        mkdir -p build/rddads-x86
        for unit in ads1 adsfunc adsmgmnt adsx; do
          gcc -c "$SRC/contrib/rddads/$unit.c" -I"$SRC/include" -I"$SRC/contrib/rddads" -I"$PWD/include/openads" -o "build/rddads-x86/$unit.o"
        done
        gcc -c contrib/oads_hb/oads_hb.c -I"$SRC/include" -I"$PWD/include/openads" -o build/rddads-x86/oads_hb.o
        ar rcs build/rddads-x86/librddads.a build/rddads-x86/ads1.o build/rddads-x86/adsfunc.o build/rddads-x86/adsmgmnt.o build/rddads-x86/adsx.o build/rddads-x86/oads_hb.o
        ls -la build/rddads-x86/librddads.a
    - name: Build TLS auth serverd and worker (Windows x64)
      if: runner.os == 'Windows' && matrix.arch == 'x64'
      shell: msys2 {0}
      run: |
        set -euo pipefail
        SRC="$(cygpath -m "$RUNNER_TEMP/harbour-sdk-src")"
        cmake -S . -B build/auth-x64 -G "MSYS Makefiles" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0600 \
              -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0600 \
              -DCMAKE_SHARED_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
              -DOPENADS_BUILD_TESTS=OFF \
              -DOPENADS_WITH_HTTP=OFF \
              -DOPENADS_WITH_TLS=ON \
              -DOPENADS_WITH_HARBOUR_UDF=ON \
              -DHARBOUR_COMPILER="$SRC/bin/win/mingw/harbour.exe" \
              -DHARBOUR_INCLUDE_DIR="$SRC/include" \
              -DHARBOUR_LIB_DIR="$SRC/lib/win/mingw" \
              -DOPENADS_HARBOUR_LIBS="hbvmmt;hbrtl;hbmacro;hbpcre;hblang;hbcpage;hbrdd;rddfpt;rddntx;hbsix;hbcommon" \
              -DOPENADS_VERSION_FORCE="${{ steps.tag.outputs.version }}" \
              -DOPENADS_WARNINGS_AS_ERRORS=OFF
        cmake --build build/auth-x64 --target openads_serverd openads_auth_worker -j"$(nproc)"
        ls -la build/auth-x64/tools/serverd/openads_serverd.exe build/auth-x64/tools/serverd/openads_auth_worker.exe
    - name: Regenerate MinGW DLL imports and link health probe
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        set -euo pipefail
        BITS="${{ matrix.arch == 'x64' && '64' || '32' }}"
        mkdir -p build/fresh-imports
        python3 tools/scripts/regenerate_mingw_imports.py \
          "build/${{ matrix.preset }}/src/Release/openace${BITS}.dll" \
          "dist/import-libs/${{ matrix.arch }}/mingw/libace${BITS}.a" \
          "build/fresh-imports/libace${BITS}.a" "$BITS"
    - name: Require both macOS architectures
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        for f in build/default/tools/serverd/openads_serverd build/default/tools/bench/openads_bench build/default/src/libopenace64.dylib; do
          lipo "$f" -verify_arch arm64 x86_64
        done
    - name: Stage release files (POSIX)
      if: success() && runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        STAGE="openads-${{ steps.tag.outputs.version }}-${{ runner.os == 'Linux' && 'linux' || 'macos' }}-${{ matrix.arch }}"
        mkdir -p "$STAGE"
        BUILD="build/${{ matrix.preset }}"
        # Engine shared lib is built as libopenace64.{so,dylib}. Ship it,
        # plus a drop-in-named copy libace64.* for apps that load by the
        # canonical ACE name.
        for f in "$BUILD"/src/libopenace64.*; do
          [ -e "$f" ] || continue
          cp "$f" "$STAGE/"
          cp "$f" "$STAGE/$(basename "$f" | sed 's/libopenace64/libace64/')"
        done
        # Server + bench CLIs
        cp "$BUILD"/tools/serverd/openads_serverd "$STAGE/"
        cp "$BUILD"/tools/bench/openads_bench   "$STAGE/"
        cp LICENSE NOTICE README.md openads.ini.sample "$STAGE/"
        mkdir -p "$STAGE/include/openads"
        cp include/openads/ace.h "$STAGE/include/ace.h"
        cp include/openads/{ace,error,openads_sql,platform,version}.h "$STAGE/include/openads/"
        mkdir -p "$STAGE/contrib/oads_hb"
        cp contrib/oads_hb/{oads_hb.c,oads_stats_display.prg,README.md} "$STAGE/contrib/oads_hb/"
        tar czvf "$STAGE.tar.gz" "$STAGE"
        ls -la "$STAGE.tar.gz"
        echo "ASSET=$STAGE.tar.gz" >> "$GITHUB_ENV"
    - name: Stage release files (Windows)
      if: success() && runner.os == 'Windows'
      shell: pwsh
      run: "$stage = \"openads-${{ steps.tag.outputs.version }}-windows-${{ matrix.arch }}\"\nNew-Item -ItemType\
        \ Directory -Path $stage | Out-Null\n$build = \"build/${{ matrix.preset }}\"\n$bits  = if (\"${{ matrix.arch\
        \ }}\" -eq \"x64\") { \"64\" } else { \"32\" }\n$builtDll = \"$build/src/Release/openace$bits.dll\"\n$builtLib\
        \ = \"$build/src/Release/openace$bits.lib\"\nif (-not (Test-Path $builtDll)) {\n    throw \"Engine DLL missing:\
        \ $builtDll\"\n}\nif (-not (Test-Path $builtLib)) {\n    throw \"Import library missing: $builtLib\"\n}\n\
        # Ship BOTH names at the archive root:\n#   openace64.dll / openace32.dll \u2014 OpenADS build product (PHP\
        \ ext,\n#     side-by-side with SAP ACE)\n#   ace64.dll     / ace32.dll     \u2014 drop-in for Harbour rddads\
        \ / FWH\nCopy-Item $builtDll \"$stage/openace$bits.dll\"\nCopy-Item $builtLib \"$stage/openace$bits.lib\"\
        \nCopy-Item \"$build/src/Release/openace$bits.exp\" \"$stage/\" -ErrorAction SilentlyContinue\nCopy-Item\
        \ $builtDll \"$stage/ace$bits.dll\"\nCopy-Item $builtLib \"$stage/ace$bits.lib\"\nforeach ($req in @(\n\
        \    \"openace$bits.dll\", \"openace$bits.lib\",\n    \"ace$bits.dll\",     \"ace$bits.lib\")) {\n    if\
        \ (-not (Test-Path \"$stage/$req\")) {\n        throw \"Release staging incomplete: missing $req\"\n   \
        \ }\n}\n# Per-compiler import libraries (MSVC / MinGW-GCC / Borland) for\n# ace<bits>.dll \u2014 prebuilt\
        \ under dist/import-libs because the CI\n# runners have no Borland toolchain (see dist/import-libs/gen.ps1).\n\
        New-Item -ItemType Directory \"$stage/lib\" | Out-Null\nCopy-Item -Recurse \"dist/import-libs/${{ matrix.arch\
        \ }}/*\" \"$stage/lib/\"\n# Static ACE library (MinGW): link into an hbmk2 -comp=mingw[64]\n# app and no\
        \ ace<bits>.dll is needed at all. Built in the\n# \"Build static ACE library (MinGW)\" step above.\n$staticLib\
        \ = \"build/static-kit-$bits/libopenace$bits.a\"\nif (-not (Test-Path $staticLib)) {\n    throw \"Static\
        \ ACE library missing: $staticLib\"\n}\nCopy-Item $staticLib \"$stage/libopenace$bits.a\"\nCopy-Item \"\
        build/static-kit-$bits/libopenace$bits.manifest.json\" \"$stage/\"\nCopy-Item -Recurse \"build/static-kit-$bits/runtime-notices\"\
        \ \"$stage/\"\nCopy-Item docs/mingw-static-ace.md,docs/static-runtime-notices.md \"$stage/\"\nif (\"${{ matrix.arch }}\" -eq \"x86\") {\n    Copy-Item build/rddads-x86/librddads.a \"$stage/librddads.a\"\n} else {\n    New-Item -ItemType Directory \"$stage/auth\" | Out-Null\n    Copy-Item build/auth-x64/tools/serverd/openads_serverd.exe \"$stage/auth/\"\n    Copy-Item build/auth-x64/tools/serverd/openads_auth_worker.exe \"$stage/auth/\"\n}\nCopy-Item\
        \ \"build/fresh-imports/libace$bits.a\" \"$stage/lib/mingw/libace$bits.a\" -Force\n# Server + bench CLIs\n\
        Copy-Item \"$build/tools/serverd/Release/openads_serverd.exe\" \"$stage/\"\nCopy-Item \"$build/tools/bench/Release/openads_bench.exe\"\
        \     \"$stage/\"\nCopy-Item LICENSE,NOTICE,README.md,openads.ini.sample  $stage/\nCopy-Item QUICKSTART.md\
        \                              \"$stage/\" -ErrorAction SilentlyContinue\nNew-Item -ItemType Directory \"\
        $stage/include/openads\" -Force | Out-Null\nCopy-Item include/openads/ace.h \"$stage/include/ace.h\"\nCopy-Item\
        \ include/openads/ace.h,include/openads/error.h,include/openads/openads_sql.h,include/openads/platform.h,include/openads/version.h\
        \ \"$stage/include/openads/\"\n# Harbour HB_FUNC wrappers for the oads_* VFS API \u2014 compiled\n# into\
        \ the app, not shipped in the DLL. Arch-independent C\n# source: both Windows zips carry it. (Pritpal Bedi.)\n\
        New-Item -ItemType Directory \"$stage/contrib/oads_hb\" -Force | Out-Null\nCopy-Item contrib/oads_hb/oads_hb.c,contrib/oads_hb/oads_stats_display.prg,contrib/oads_hb/README.md\
        \ \"$stage/contrib/oads_hb/\"\nif (\"${{ matrix.arch }}\" -eq \"x86\") {\n    Copy-Item src/openads_ace_x86_stdcall.def\
        \      \"$stage/\"\n    # Ship the 32-bit MinGW import library at the archive root too:\n    # 32-bit Harbour\
        \ (hbmk2 -comp=mingw, rddads) links it directly.\n    # (Reported by Pritpal Bedi.)\n    Copy-Item build/fresh-imports/libace32.a\
        \ \"$stage/\"\n} else {\n    Copy-Item src/openads_ace.def                   \"$stage/\"\n}\nCompress-Archive\
        \ -Path \"$stage/*\" -DestinationPath \"$stage.zip\" -Force\nGet-Item \"$stage.zip\"\n\"ASSET=$stage.zip\"\
        \ | Out-File -FilePath $env:GITHUB_ENV -Append\n"
    - name: Upload artifact (workflow run)
      if: success() && env.ASSET != ''
      uses: actions/upload-artifact@v4
      with:
        name: postsync-test-${{ runner.os }}-${{ matrix.arch }}
        path: ${{ env.ASSET }}
        retention-days: 7
        if-no-files-found: error
  verify:
    name: Verify every test archive and publish checksum report
    runs-on: ubuntu-24.04
    needs:
    - build
    - gcc15-dll-smoke
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: postsync-test-*
        path: out
        merge-multiple: true
    - name: Require all four kits
      shell: bash
      run: |
        set -euo pipefail
        V=1.09.76
        for p in windows-x64.zip windows-x86.zip linux-x64.tar.gz macos-universal.tar.gz; do test -s "out/openads-$V-$p"; done
        test "$(find out -maxdepth 1 -type f | wc -l)" -eq 4
    - name: Inspect archives, hashes, notices and version stamps
      env:
        RELEASE_VERSION: 1.09.76
      shell: bash
      run: |
        python3 - <<'PYVERIFY'
        import os, pathlib, tarfile, zipfile, hashlib
        version = os.environ['RELEASE_VERSION']
        assets = list(pathlib.Path('out').glob('*'))
        assert assets, 'No archives'
        for path in assets:
            if path.suffix == '.zip':
                with zipfile.ZipFile(path) as z:
                    assert z.testzip() is None, 'ZIP CRC failure'
                    files = {n: z.read(n) for n in z.namelist() if not n.endswith('/')}
            else:
                with tarfile.open(path) as t:
                    files = {m.name: t.extractfile(m).read() for m in t.getmembers() if m.isfile()}
            byname = {pathlib.PurePosixPath(n).name: data for n, data in files.items()}
            required = ['LICENSE','NOTICE','README.md','openads.ini.sample','oads_hb.c','oads_stats_display.prg']
            windows = '-windows-' in path.name
            if windows:
                bits = '64' if '-x64.' in path.name else '32'
                required += [f'ace{bits}.dll',f'openace{bits}.dll',f'ace{bits}.lib',f'openace{bits}.lib',f'libopenace{bits}.a',f'libopenace{bits}.manifest.json','openads_serverd.exe','openads_bench.exe','mingw-static-ace.md','static-runtime-notices.md']
                assert byname[f'ace{bits}.dll'] == byname[f'openace{bits}.dll'], 'ACE aliases differ'
                import json
                manifest = json.loads(byname[f'libopenace{bits}.manifest.json'])
                assert manifest['profile'] == 'matching', 'Unexpected release static profile'
                assert manifest['archive_sha256'] == hashlib.sha256(byname[f'libopenace{bits}.a']).hexdigest(), 'Static archive hash mismatch'
                for name, digest in manifest['runtime_notice_sha256'].items():
                    assert any(n.endswith('/runtime-notices/' + name) and hashlib.sha256(data).hexdigest() == digest for n, data in files.items()), f'Missing or mismatched runtime notice {name}'
                assert len(manifest['runtime_notice_sha256']) == 4, 'Missing runtime notices'
                root_bins = [n for n in files if n.endswith('/openads_serverd.exe') and '/auth/' not in n]
                assert len(root_bins) == 1, 'Root serverd missing or ambiguous'
                binary = files[root_bins[0]]
                if bits == '32':
                    assert 'librddads.a' in byname and byname['librddads.a'], 'librddads.a missing from x86 kit'
                else:
                    auth_srv = [n for n in files if n.endswith('/auth/openads_serverd.exe')]
                    auth_wrk = [n for n in files if n.endswith('/auth/openads_auth_worker.exe')]
                    assert auth_srv and auth_wrk, 'auth serverd/worker missing from x64 kit'
                    assert version.encode() in files[auth_srv[0]], 'auth serverd version stamp absent'

            else:
                ext = 'dylib' if '-macos-' in path.name else 'so'
                required += [f'libace64.{ext}',f'libopenace64.{ext}','openads_serverd','openads_bench']
                assert byname[f'libace64.{ext}'] == byname[f'libopenace64.{ext}'], 'ACE aliases differ'
                binary = byname['openads_serverd']
            for name in required:
                assert name in byname and byname[name], f'{path}: missing/empty {name}'
            for header in ['ace','error','openads_sql','platform','version']:
                assert any(n.endswith(f'include/openads/{header}.h') for n in files), f'Missing header {header}'
            assert any(n.endswith('include/ace.h') and data for n, data in files.items()), 'Missing include/ace.h'
            assert version.encode() in binary, f'{path}: server version stamp absent'
            assert version.encode() in byname[('openace'+bits+'.dll') if windows else ('libopenace64.'+ext)], f'{path}: ACE version stamp absent'
            if '-macos-' in path.name:
                assert binary[:4] in [bytes.fromhex('cafebabe'),bytes.fromhex('cafebabf')], 'Not a universal server'
            print(f'VERIFIED {path.name}: {len(files)} files; version {version}; sha256 {hashlib.sha256(path.read_bytes()).hexdigest()}', flush=True)
        PYVERIFY
    - name: Record exact source and archive checksums
      shell: bash
      run: |
        set -euo pipefail
        printf "%s\n" "source=a417a6fd3abf8473ef70859c3b4a6e9a50e3065c" "tree=37f375332767566cbeed87e11f5afc7c61eeec3b" "release 1.09.76 kits; publication authorized by owner 2026-11-23" > out/SOURCE.txt
        (cd out && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)
    - uses: actions/upload-artifact@v4
      with:
        name: postsync-test-verified
        path: out/*
        if-no-files-found: error
        retention-days: 7
  gcc15-dll-smoke:
    name: Pritpal Bedi x86 GCC15.1 MSVCRT DLL-link smoke
    runs-on: windows-2022
    needs: build
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
      with:
        ref: a417a6fd3abf8473ef70859c3b4a6e9a50e3065c
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: postsync-test-Windows-x86
        path: input-kit
    - name: Get exact working-baseline compiler, not older UCRT
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $url = 'https://github.com/brechtsanders/winlibs_mingw/releases/download/15.1.0posix-13.0.0-msvcrt-r2/winlibs-i686-posix-dwarf-gcc-15.1.0-mingw-w64msvcrt-13.0.0-r2.zip'
        Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP/winlibs15.zip"
        if ((Get-FileHash "$env:RUNNER_TEMP/winlibs15.zip" -Algorithm SHA256).Hash.ToLower() -ne '2d8d77a2e7098162992bfaefdecbbf2d12ed2081655b8be5e196d78112e5936e') { throw 'GCC15.1 MSVCRT r2 hash mismatch' }
        & 7z x "$env:RUNNER_TEMP/winlibs15.zip" "-o$env:RUNNER_TEMP/winlibs15" -y
        if ($LASTEXITCODE -ne 0) { throw 'Compiler extraction failed' }
    - name: Build isolated pinned Harbour core, compile current wrapper/RDDADS, link actual DLL and run
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$(cygpath -u "$RUNNER_TEMP/winlibs15/mingw32/bin"):$PATH"
        test "$(gcc -dumpfullversion)" = 15.1.0
        test "$(gcc -dumpmachine)" = i686-w64-mingw32
        printf "Credit: Pritpal Bedi\n"
        SRC="$(cygpath -u "$RUNNER_TEMP/hb-source")"
        HB="$(cygpath -u "$RUNNER_TEMP/hb-install")"
        git clone --no-checkout https://github.com/harbour/core.git "$SRC"
        git -C "$SRC" checkout --detach 694428e1c12f726675b19324d62167fa77d68185
        test "$(git -C "$SRC" rev-parse HEAD)" = 694428e1c12f726675b19324d62167fa77d68185
        # Pristine source plus the reviewed OpenADS RDDADS patch, not owner's local modified tree.
        git -C "$SRC" apply --check "$PWD/patches/harbour/rddads-pending-fields.patch"
        git -C "$SRC" apply "$PWD/patches/harbour/rddads-pending-fields.patch"
        export HB_PLATFORM=win HB_COMPILER=mingw HB_BUILD_CONTRIBS=no HB_BUILD_CONTRIB_DYN=no HB_BUILD_3RDEXT=no HB_BUILD_DYN=no
        export HB_INSTALL_PREFIX="$(cygpath -m "$HB")"
        mingw32-make -C "$SRC" -j2 install
        HBMK="$(find "$HB" -iname hbmk2.exe -type f | head -1)"
        test -n "$HBMK"
        python - <<'UNZIP'
        import pathlib,zipfile
        p=list(pathlib.Path('input-kit').glob('*.zip'));assert len(p)==1
        with zipfile.ZipFile(p[0]) as z:z.extractall('gcc15-dll-smoke')
        UNZIP
        mkdir -p gcc15-dll-smoke/objects
        for unit in ads1 adsfunc adsmgmnt adsx; do
         gcc -c "$SRC/contrib/rddads/$unit.c" -I"$HB/include" -I"$SRC/contrib/rddads" -I"$PWD/include/openads" -o "gcc15-dll-smoke/objects/$unit.o"
        done
        gcc -c contrib/oads_hb/oads_hb.c -I"$HB/include" -Iinclude/openads -o gcc15-dll-smoke/objects/oads_hb.o
        "$HBMK" tests/smoke/harbour_static_ace.prg gcc15-dll-smoke/objects/*.o gcc15-dll-smoke/lib/mingw/libace32.a -comp=mingw -Iinclude/openads -I"$SRC/contrib/rddads" -mt -gtstd -ogcc15-dll-smoke/gcc15-dll-smoke.exe
        objdump -p gcc15-dll-smoke/gcc15-dll-smoke.exe > gcc15-dll-smoke/pe-imports.txt
        grep -Ei "DLL Name:.*msvcrt\.dll" gcc15-dll-smoke/pe-imports.txt
        if grep -Ei "DLL Name:.*(ucrtbase|api-ms-win-crt).*\.dll" gcc15-dll-smoke/pe-imports.txt; then exit 1; fi
        grep -Ei 'DLL Name:.*ace32\.dll' gcc15-dll-smoke/pe-imports.txt
        cd gcc15-dll-smoke
        ./gcc15-dll-smoke.exe | tee gcc15-dll-smoke.log
        # The fixture's legacy static label describes its origin, not this DLL lane.
        grep -F 'Harbour static ACE connect/disconnect OK' gcc15-dll-smoke.log
    - uses: actions/upload-artifact@v4
      with:
        name: postsync-gcc15-dll-smoke-evidence
        path: |-
          gcc15-dll-smoke/*.txt
          gcc15-dll-smoke/*.log
        retention-days: 7
        if-no-files-found: error
