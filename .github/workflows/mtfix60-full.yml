        cp tests/hrb/mutual/ACL-SETUP.txt delivery/mtfix60-full/docs/\ncp output/unit-summary.json output/hrb-crypto-proof.txt output/hrb-resource-proof.txt output/unit-batch-summary.txt\
        \ docs/auth-hrb-pure-functions.txt delivery/mtfix60-full/docs/\n\n cp output/hrb-time-proof.txt delivery/mtfix60-full/docs/\n\
        cp tests/hrb/mutual/time_probe.py delivery/mtfix60-full/docs/\ncp tests/hrb/mutual/*.prg delivery/mtfix60-full/docs/\n\
        cp output/mutual-harbour-proof.txt delivery/mtfix60-full/docs/\ncp output/mutual-native-proof.txt\
        \ delivery/mtfix60-full/docs/\ngit diff 6d5c59f4f91e9603c10231db14691d636f747faf HEAD > delivery/mtfix60-full/docs/source.patch\n\
        find delivery/mtfix60-full -type f -exec sha256sum {} \\; > delivery/SHA256.txt\n7z a -tzip mtfix60-full-qt492-x86.zip\
        \ ./delivery/*\n"
      shell: bash
    - if: always()
