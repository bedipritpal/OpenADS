        \ source-commit.txt MTFIX63_LINUX_SERVER_TEST.md mutual-test-only.hrb run-mock-test.sh SHA256SUMS LICENSE\
        \ NOTICE README.md; do\n  grep -q \"/$req$\" listing.txt || { echo \"::error::missing $req in archive\"\
