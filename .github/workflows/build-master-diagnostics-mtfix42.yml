name: Attach verified mtfix42 macOS package to private draft
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
jobs:
  upload:
    if: github.repository == 'bedipritpal/OpenADS'
    runs-on: ubuntu-latest
    steps:
    - name: Upload exact verified artifact, no rebuild or publication
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: bedipritpal/OpenADS
      shell: bash
      run: 'set -euo pipefail

        gh api repos/bedipritpal/OpenADS/releases > releases.json

        id=$(jq -r ''.[] | select(.draft == true and .name == "OpenADS 1.09.74-mtfix42 - diagnostics OFF by default and MinGW
        static client") | .id'' releases.json)

        test -n "$id"

        test "$(echo "$id" | wc -l)" = 1

        gh api "repos/bedipritpal/OpenADS/releases/$id" > release.json

        jq -e ''.draft == true and .prerelease == true and .target_commitish == "security/master-diagnostics-mtfix42" and
        (.assets|length)==4'' release.json

        curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/bedipritpal/OpenADS/actions/artifacts/11678634378/zip
        -o artifact.zip

        echo "8d1397e44329cb3ae83ab9839031d5cfc8a5f10561d36510d851df36d7f7eb40  artifact.zip" | sha256sum -c --strict

        unzip -q artifact.zip -d out

        asset=out/openads-1.09.74-mtfix42-macos-universal.tar.gz

        echo "494449d03eb04631e423924386d69bf8ecaaf429815bfe6d514828681648166a  $asset" | sha256sum -c --strict

        gh api --method POST -H "Content-Type: application/gzip" "https://uploads.github.com/repos/bedipritpal/OpenADS/releases/$id/assets?name=openads-1.09.74-mtfix42-macos-universal.tar.gz"
        --input "$asset"

        gh api "repos/bedipritpal/OpenADS/releases/$id" --jq ''{id,draft,prerelease,tag_name,target_commitish,assets:[.assets[]|{name,size,digest}]}''

        '
