name: Stage 4 diagnostics gate review on current parent
on:
  push:
    branches: [stage4/diagnostics-gate-trace]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Configure
        run: cmake --preset ninja-clang -DOPENADS_WITH_TLS=ON -DOPENADS_WARNINGS_AS_ERRORS=OFF
      - name: Build
        run: cmake --build build/ninja-clang --parallel 2
      - name: List tests
        run: ctest --test-dir build/ninja-clang -N
      - name: Unit suite and integration tests, soak excluded
        run: ctest --test-dir build/ninja-clang --output-on-failure -E soak
      - name: Explicit diagnostics gate, marker and server contract tests
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/ninja-clang --output-on-failure -R 'diagnostics_gate_contract|trace_marker_contract' | tee stage4-contracts.txt
      - name: Explicit diagnostics surface unit tests
        shell: bash
        run: |
          set -o pipefail
          build/ninja-clang/tests/openads_unit_tests \
            -sf='*util_log_test.cpp,*error_log_test.cpp,*serverd_config_ini_test.cpp,*session_connection_test.cpp,*abi_wire_caller_test.cpp,*network_frame_trace_test.cpp,*network_boundary_pair_test.cpp,*abi_remote_create_table_test.cpp,*abi_remote_file_wait_test.cpp,*abi_remote_only_access_test.cpp' \
            -tce='*[slow]*,*flaky*' | tee stage4-diagnostics-unit.txt
