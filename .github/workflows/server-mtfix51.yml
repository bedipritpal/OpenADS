name: Materialize and verify owner-tested mtfix51 merge tree
'on':
  push:
    branches:
    - test/auth-diagnostic-mtfix50
    paths:
    - .github/workflows/server-mtfix51.yml
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
jobs:
  proof:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        ref: 6d5c59f4f91e9603c10231db14691d636f747faf
    - name: Materialize exact owner-tested source without diagnostic workflows
      shell: bash
      run: 'set -euxo pipefail

        python - <<''PYSRC''

        import base64,pathlib,subprocess,hashlib,json

        patch=base64.b64decode('''');pathlib.Path(''tested-source.patch'').write_bytes(patch)

        subprocess.run([''git'',''apply'',''--check'',''tested-source.patch''],check=True);subprocess.run([''git'',''apply'',''tested-source.patch''],check=True)

        m=json.loads(base64.b64decode(''''))

        for p,h in m.items():assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h,p

        pathlib.Path(''docs/MTFIX51_TESTED_MILESTONE.txt'').write_bytes(base64.b64decode(''''))

        pathlib.Path(''docs/MTFIX51_TESTED_SOURCE_SHA256.json'').write_text(json.dumps(m,indent=2)+''\n'')

        PYSRC

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add CMakeLists.txt src tools tests include contrib docs

        git commit -m ''Merge-ready tested mtfix49 auth,50 errors and51 legacy root restoration''

        git push origin HEAD:refs/heads/merge/mtfix51-owner-tested

        '
