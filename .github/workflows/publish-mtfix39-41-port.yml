name: Publish scoped mtfix39-41 port (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-scoped-mtfix39-41
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'bedipritpal/OpenADS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/mtfix39-41-upstream
          fetch-depth: 0
      - name: Verify base, apply reviewed patch, verify tree, publish one commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "91a63f6e7ac90d4f0b64d7cdafecaabb1548b140"
          cat > "$RUNNER_TEMP/port.patch" <<'OPENADS_REVIEWED_PORT_PATCH'
          diff --git a/docs/builds/mtfix40.md b/docs/builds/mtfix40.md
          new file mode 100644
          index 00000000..bf2c33a6
          --- /dev/null
          +++ b/docs/builds/mtfix40.md
          @@ -0,0 +1,28 @@
          +# mtfix40 test build
          +
          +> Historical fork test-build notes. This document describes the original bedipritpal/OpenADS build, not validation or packaging of the upstream port. See docs/upstream-mtfix39-41-port.md for port scope and validation.
          +
          +Built for Pritpal Bedi - bedipritpal/OpenADS, forked from FiveTechSoft/OpenADS.
          +Pritpal supplied the B_BIG source, remote frame trace, client-storm crash report and application testing that led to this build.
          +
          +This is an isolated test build, not a production recommendation. No fork-main or upstream merge is part of it. Back up data and binaries, and use matching client and server versions.
          +
          +## Changes
          +
          +- Remote AdsFOpen, AdsFCreate, AdsFRead, AdsFWrite, AdsFSeek and AdsFClose no longer hold the process-wide registry mutex while waiting on a remote connection. Per-file operations remain serialized; retained ownership keeps the file record alive during close races. Disconnect still serializes with requests through the connection mutex.
          +- Dedicated session-thread launch failures reject and close the new connection rather than escaping the accept loop. Registry allocation happens before starting a joinable thread. Rejection logging cannot throw out of the failure handler.
          +- No primary-lane routing, table/record lock contract, reactor scheduling or live-server settings change. Application logging changes are not included.
          +
          +## Local validation
          +
          +GCC Debug, SQLite enabled, HTTP disabled: 14 focused cases / 294 assertions passed. The delayed-RPC test checks all six file APIs; concurrent close, double close, disconnected handles, in-flight write/disconnect and injected thread-launch failure are covered.
          +
          +The delayed-RPC regression failed 12 registry-mutex checks on unchanged mtfix39 and passed all 74 assertions on this candidate.
          +
          +The local selected full sweep actually executed 1,710 cases. One existing flaky exclusive-index test returned 6106 instead of 7040; the same failure reproduced on unchanged mtfix39. 24 cases were excluded/skipped. This is not a claim that all local cases passed. Cross-platform CI is a separate release gate.
          +
          +The thread-launch regression injects a constructor failure; it does not force real OS thread exhaustion. Reactor-pool startup exception handling is unchanged.
          +
          +## Application test gate
          +
          +Repeat B_BIG with the intended remote file logging path and compare time to first browse. Confirm file output, same-handle close/write behavior and clean disconnect. Scale the client storm gradually in a non-production environment. When the dedicated-thread ceiling is reached, new sessions should be rejected and the server should remain responsive. Reactor-pool use still needs separate integrity and capacity testing before production use.
          diff --git a/docs/daemon-session-lifetime.md b/docs/daemon-session-lifetime.md
          new file mode 100644
          index 00000000..e15d8007
          --- /dev/null
          +++ b/docs/daemon-session-lifetime.md
          @@ -0,0 +1,52 @@
          +# Daemon session lifetime
          +
          +Reported by Pritpal Bedi during mtfix40 ERP invoice testing: after a tea
          +break, idle modules could no longer use their database sessions. The daemon
          +had treated five minutes without application bytes as a dead connection.
          +
          +With mtfix41, a successfully established database session has no
          +application-inactivity deadline. Reading a screen, taking a call or leaving
          +an invoice module open must not release its physical record/login locks.
          +The same policy applies in the dedicated-thread and reactor-pool paths,
          +including TLS. This upstream port preserves upstream's unconditional
          +handshake and frame safety timers rather than adding the fork's separate
          +daemon-hardening gate. Established DBF inactivity is disabled for every
          +network Server by default, including an embedded network listener. True
          +LOCAL DBF access is not a network session. Client DLL behavior and wire
          +format are unchanged by this idle-policy change.
          +
          +The daemon still closes unfinished handshakes after 30 seconds, stalled
          +partial frames after 30 seconds, and undrained replies after 30 seconds.
          +Management sessions keep their five-minute inactivity limit. Database
          +sessions close on explicit disconnect, EOF/reset/transport failure,
          +admin removal or server shutdown. Accepted-socket TCP keepalive remains
          +in place to detect unreachable peers; its probes are not application bytes.
          +TCP acknowledgement cannot distinguish a wedged application from an idle
          +person, and socket-option calls currently do not report tuning failures.
          +
          +Finite session admission limits bound occupied slots. Do not evict healthy
          +idle lock owners to admit new users. This fix does not address burst queued
          +admission accounting, total memory pressure, OOM, or client recovery after
          +a genuine connection loss. It is not an unconditional crash guarantee.
          +No reconnect, lock resurrection, write replay or commit replay is added.
          +
          +Regression coverage uses an injected steady clock configured before start,
          +with dedicated/pool idle resume and lock ownership tests, abrupt peer
          +cleanup, preserved handshake/management/partial-frame clocks and TLS idle
          +resume. CTest also runs a real 310-second dedicated-mode idle soak. The
          +clock has no runtime configuration or protocol surface; ordinary execution
          +uses the steady clock.
          +
          +## Optional daemon idle policy
          +
          +`established_session_idle_seconds = 0` in the SERVER openads.ini is the
          +safe default: no established database-session idle cutoff. A positive value
          +opts into a cutoff in seconds, for example 3600 for one hour. The matching
          +`--established_session_idle_seconds N` CLI flag overrides the INI value.
          +Restart the server after changing it. Negative, malformed and overflowing
          +values are rejected. No OAds_Settings/client DLL change is required.
          +
          +Enabling this deliberately disconnects inactive database users and releases
          +their workareas/locks. It is not a test for a dead transport. Use it only
          +when that administrative policy is intended. Management and stalled-frame
          +security timers are separate and unchanged.
          diff --git a/docs/upstream-mtfix39-41-port.md b/docs/upstream-mtfix39-41-port.md
          new file mode 100644
          index 00000000..2fa1f7d9
          --- /dev/null
          +++ b/docs/upstream-mtfix39-41-port.md
          @@ -0,0 +1,37 @@
          +# Regenerated scoped mtfix39-41 upstream port
          +
          +Base: FiveTechSoft/OpenADS main 91a63f6e7ac90d4f0b64d7cdafecaabb1548b140 (1.09.73).
          +Private review preparation for Pritpal Bedi. No public branch, PR or package.
          +
          +## Scope and adaptation
          +
          +Fresh current-row contents returned in a negotiated LockRecord acknowledgement; older peers fall back to a real post-lock refresh, retaining acquired-lock ownership before a refresh can fail. Remote file waits release the process-wide registry mutex while per-file serialization and close-race lifetime are retained. Session-thread launch failure rejects the connection without terminating the accept loop.
          +
          +Established DBF sessions keep their locks during healthy idle. Optional INI/CLI established_session_idle_seconds defaults to 0. Handshake, partial-frame, reply-drain and management timers remain. Regression tests and historical fork notes credit Pritpal Bedi's invoice, multithread and idle-session testing.
          +
          +No .github/CI/workflow change, OPENADS_FRESH_COUNTS cached-count policy, earlier metadata setup feature, daemon-hardening gate or later ephemeral TLS-fixture cleanup is imported. Only kCapLockedRow is added, not kCapOpenSetupMetadata. No reconnect/replay or OOM survival guarantee.
          +
          +Upstream's lifecycle safety checks remain unconditional. Unlike the fork, this port has no separate daemon-hardening/embedded-listener exemption: established DBF inactivity is disabled for embedded network listeners too. Unfinished-handshake expiry remains. True LOCAL DBF access is not a network session. The existing upstream static localhost TLS fixture is unchanged; no key is added.
          +
          +## Regeneration provenance
          +
          +The original private cb00b767 build and attachments were lost when the temporary workspace was replaced. This port was reconstructed from the same upstream base, the same seven original commits and the recorded conflict-resolution design. It is a regenerated artifact, not recovered bytes. No intended production/test behavior or scope change was made. Byte-for-byte identity to the lost tree cannot be established. This note differs to identify regeneration and record fresh tests; commit identity and timestamps also differ. Historical fork milestone notes remain explicitly labeled as history, not validation of this port.
          +
          +## Fresh local validation
          +
          +Linux GCC Debug, SQLite ON, HTTP OFF, O0/g0, single-threaded builds:
          +
          +- Normal and TLS unit-test, serverd and CDX benchmark targets built.
          +- TLS focused regressions: 19 cases / 1,036 assertions passed. Normal: 18 cases / 1,021 assertions passed.
          +- Fast-suite bounded ranges completed 1,684 unique TLS cases and 1,681 unique normal cases without assertion failures. Initial bounded commands hit their time cap; interrupted cases were rerun successfully. Executed case names/durations were counted independently because doctest range summaries count all filter matches, not only executed cases.
          +- Slow CTest, SQL URI, SQLite filter/seek and 30 pool-MT repeat CTests passed in both builds.
          +- CDX 1,000-row benchmark smoke passed in both builds.
          +- Strict -Werror syntax checks passed changed network implementation units, changed/new test units and config_ini.cpp. Existing shadow warnings in ace_exports.cpp/serverd/main.cpp failed strict GCC checks both on this port and pristine upstream. Warnings-as-errors was disabled only in local CMake caches, never repository policy.
          +
          +Still owed: uninterrupted whole CTest including the real 310-second idle soak; actual CI preset/HTTP configuration; Windows x64/x86, macOS, PHP/Harbour and live external SQL backends. No hosted CI has run for this private regenerated port. Fork application soak/CI results do not establish that this upstream-specific source is ready for release.
          +
          +## Review title
          +
          +Port mtfix39-41: fresh locked rows, remote file waits and healthy idle sessions
          +
          +The user reviews the final content before any public branch/PR step and creates the FiveTechSoft PR himself. The existing fork mtfix41 branch must not be selected directly: it carries 85 commits/110 files against this upstream base, including excluded earlier work.
          diff --git a/release-notes-1.09.73-mtfix39.md b/release-notes-1.09.73-mtfix39.md
          new file mode 100644
          index 00000000..ec01f08a
          --- /dev/null
          +++ b/release-notes-1.09.73-mtfix39.md
          @@ -0,0 +1,28 @@
          +# OpenADS 1.09.73-mtfix39: locked-row fresh-read test build
          +
          +> Historical fork test-build notes. This document describes the original bedipritpal/OpenADS build, not validation or packaging of the upstream port. See docs/upstream-mtfix39-41-port.md for port scope and validation.
          +
          +Prepared for Pritpal Bedi's bedipritpal/OpenADS fork, based on FiveTechSoft/OpenADS. Thanks to Pritpal for the 50-line invoice stock update log that pinned this regression. No private application source, traces or business data are included.
          +
          +This test branch is fix/mtfix39-lock-row. It is not a merge to fork main and not an upstream submission. Pritpal's billing-counter checks are required before a main merge.
          +
          +## What is in it
          +
          +- mtfix39: a successful dbrLock after another station's write no longer serves the old row. The remote LockRecord ack now carries the freshly locked row (new negotiated wire capability kCapLockedRow, bit 0x00000400), so seek/lock/read/subtract/write/unlock stays at 4 wire frames per invoice line with no extra fetch. Old servers negotiate down: the client falls back to a real refresh after the lock instead.
          +- The client records the acquired lock in its ledger BEFORE any fallback refresh, so a failed refresh can never erase a real held lock.
          +- OPENADS_NO_LOCKED_ROW_CAP=1 makes the server simulate a pre-fix peer (no capability echo, no row trailer) for old-server negotiation testing.
          +- New regression coverage in tests/unit/abi_remote_locked_row_test.cpp: two-station stale-read repro, 50-line invoice replay at 4 frames/line, repeated lock/release, contended lock failure with no cache poisoning and no lock theft, old-server negotiation fallback, and lock freshness when the row sat stale in the read-ahead prefetch block.
          +
          +## What to test
          +
          +- Two billing counters on one stock table: counter A locks a line item right after counter B updates it; A must see B's committed qty, subtract, and write - the lost update is gone.
          +- Busy counter replay: many seek/lock/subtract/write/unlock cycles against openads_serverd from this build; wire frames per line stay at 4.
          +
          +## Known findings held for later (not in this build)
          +
          +- Speed candidates reviewed and deferred by design: single-record commit-and-release op (4->3 frames/line) and cross-line pipelining. Both need separate scoping; this is a correctness release.
          +- Pre-existing, unrelated to mtfix39: natural-order cross-session visibility lags. A plain skip-walk/goto read can serve rows cached before another station's commit, and a natural-order SetField+UnlockTable commit is not visible to peer sessions as promptly as the index-order write path. Lock and RefreshRecord reads are not affected. Repro available; recommend a separate fix branch.
          +
          +## Packages
          +
          +- openads-test-1.09.73-mtfix39-windows-x86.zip, windows-x64.zip, linux-x64.tar.gz, macos-universal.tar.gz
