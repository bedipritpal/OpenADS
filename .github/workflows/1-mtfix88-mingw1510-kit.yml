name: mtfix88 mingw1510 x86 kit and modernized deps family
permissions:
  contents: write
concurrency:
  group: mtfix88-mingw1510
  cancel-in-progress: false
env:
  KIT_VERSION: 1.09.75-mtfix88-mingw1510
  PINNED_SOURCE: b0b66c49c404b6fa4055d98cf7fe7a1f53776161
  HARBOUR_PIN: 4ec2e154ed92757418bc30af571ab90240ab3209
'on':
  push:
    branches:
    - kit/mtfix88-mingw1510
    paths:
    - .github/workflows/1-mtfix88-mingw1510-kit.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Create the prerelease after the candidate has been inspected
        required: false
        default: false
        type: boolean
jobs:
  kitx86:
    name: Build and prove x86 client kit with GCC 15.1 UCRT
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: kit/mtfix88-mingw1510
    - name: Verify cumulative candidate pin and workflow-only build recipe
      run: |
        set -euxo pipefail
        test "$GITHUB_REF" = refs/heads/kit/mtfix88-mingw1510
        git merge-base --is-ancestor $PINNED_SOURCE HEAD
        test -z "$(git diff --name-only $PINNED_SOURCE HEAD -- . ':!.github/workflows')"
      shell: bash
    - name: Prefetch identical hash-pinned dependency archives via alternate transport
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PYDEPS'
        import hashlib,pathlib,tarfile,urllib.request,time
        items=[('zlib','https://zlib.net/fossils/zlib-1.3.1.tar.gz','9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23'),('nlohmann_json','https://codeload.github.com/nlohmann/json/tar.gz/refs/tags/v3.11.3','0d8ef5af7f9794e3263480193c491549b2ba6cc74bb018906202ada498a79406'),('cpp_httplib','https://codeload.github.com/yhirose/cpp-httplib/tar.gz/refs/tags/v0.18.5','731190e97acd63edce57cc3dacd496f57e7743bfc7933da7137cb3e93ec6c9a0')]
        for name,url,sha in items:
         for attempt in range(3):
          try:
           source=url if attempt==0 else url+'?openads_mtfix88_retry='+str(attempt)
           body=urllib.request.urlopen(source,timeout=60).read();actual=hashlib.sha256(body).hexdigest()
           if actual!=sha:raise RuntimeError(name+' hash mismatch: expected '+sha+' got '+actual+' bytes='+str(len(body)))
           break
          except Exception as error:
           print(name,str(error),flush=True)
           if attempt==2:raise
           time.sleep(3*(attempt+1))
         archive=pathlib.Path(name+'.tar.gz');archive.write_bytes(body)
         dest=pathlib.Path('third_party')/name;dest.mkdir(parents=True,exist_ok=True)
         with tarfile.open(archive) as z:
          for member in z.getmembers():
           parts=pathlib.PurePosixPath(member.name).parts[1:]
           if not parts:continue
           assert '..' not in parts
           member.name=str(pathlib.PurePosixPath(*parts));z.extract(member,dest)
         print(name,sha,'verified')
        PYDEPS
    - name: Download exact GCC 15.1 UCRT toolchain and owner-tested Harbour archive
      run: |
        function Download-Exact($url,$out) {
         for($i=0;$i -lt 4;$i++) {
          try { Invoke-WebRequest $url -OutFile $out; return }
          catch { if($i -eq 3){throw}; Start-Sleep -Seconds (5*($i+1)) }
         }
        }
        Download-Exact 'https://github.com/brechtsanders/winlibs_mingw/releases/download/15.1.0posix-12.0.0-ucrt-r1/winlibs-i686-posix-dwarf-gcc-15.1.0-mingw-w64ucrt-12.0.0-r1.zip' "$env:RUNNER_TEMP/winlibs15.zip"
        if((Get-FileHash "$env:RUNNER_TEMP/winlibs15.zip" -Algorithm SHA256).Hash.ToLower() -ne '869fa6c0e17ef9581a9b796bd8a965a34d1ec1e2746528bc1067caadf2aa04c2'){throw 'Winlibs 15.1 hash mismatch'}
        & 7z x "$env:RUNNER_TEMP/winlibs15.zip" "-o$env:RUNNER_TEMP/winlibs15" -y
        Download-Exact 'https://github.com/FiveTechSoft/harbour_and_xharbour_builds/raw/master/harbour_mingw1510_32_20260404.zip' "$env:RUNNER_TEMP/harbour1510.zip"
        if((Get-FileHash "$env:RUNNER_TEMP/harbour1510.zip" -Algorithm SHA256).Hash.ToLower() -ne 'e90b249a48c553b967b452f0edd6b31e7a705a7df7cc8423b5bd163bdc330998'){throw 'Harbour 1510 hash mismatch'}
        & 7z x "$env:RUNNER_TEMP/harbour1510.zip" "-o$env:RUNNER_TEMP/hb1510" -y
      shell: pwsh
    - name: Build engine, DLL, server and auth worker with pinned GCC 15.1
      run: |
        set -euxo pipefail
        export PATH="/c/Program Files/CMake/bin:$(cygpath -u "$RUNNER_TEMP/winlibs15/mingw32/bin"):$PATH"
        test "$(gcc -dumpversion)" = 15.1.0
        HB="$(cygpath -m "$RUNNER_TEMP/hb1510")"
        printf '\nif(WIN32 AND MINGW)\n set_target_properties(openads_ace PROPERTIES PREFIX "")\nendif()\n' >> src/CMakeLists.txt
        cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DFETCHCONTENT_SOURCE_DIR_NLOHMANN_JSON="$PWD/third_party/nlohmann_json" -DFETCHCONTENT_SOURCE_DIR_CPP_HTTPLIB="$PWD/third_party/cpp_httplib" -S . -B build-legacy -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_SHARED_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" -DOPENADS_BUILD_TESTS=OFF -DOPENADS_WITH_HTTP=OFF -DOPENADS_WITH_TLS=ON -DOPENADS_VERSION_FORCE=$KIT_VERSION -DOPENADS_AUTH_CAPACITY_TEST_SWITCH=OFF -DOPENADS_WITH_HARBOUR_UDF=ON -DHARBOUR_COMPILER="$HB/bin/win/mingw/harbour.exe" -DHARBOUR_INCLUDE_DIR="$HB/include" -DHARBOUR_LIB_DIR="$HB/lib/win/mingw" -DOPENADS_HARBOUR_LIBS="hbvmmt;hbrtl;hbmacro;hbpcre;hblang;hbcpage;hbrdd;rddfpt;rddntx;hbsix;hbcommon" -DOPENADS_WARNINGS_AS_ERRORS=OFF
        cmake --build build-legacy --target openads_ace_static openads_ace openads_serverd openads_auth_worker -j2
      shell: bash
    - name: Provision pinned Harbour source for rddads units and fixtures
      run: |
        set -euxo pipefail
        git clone https://github.com/harbour/core.git "$RUNNER_TEMP/hbsrc"
        git -C "$RUNNER_TEMP/hbsrc" checkout --detach $HARBOUR_PIN
        git -C "$RUNNER_TEMP/hbsrc" apply "$PWD/patches/harbour/rddads-pending-fields.patch"
      shell: bash
    - name: Exact GCC 15.1 and mingw-w64 12 runtime notices (Winlibs omits them)
      run: |
        set -euxo pipefail
        W="$(cygpath -u "$RUNNER_TEMP/winlibs15/mingw32")"
        mkdir -p "$W/share/licenses/gcc" "$W/share/licenses/crt" "$W/share/licenses/winpthreads"
        curl -fL https://raw.githubusercontent.com/gcc-mirror/gcc/ee5c3db6c5b2c3332912fb4c9cfa2864569ebd9a/COPYING3 -o "$W/share/licenses/gcc/COPYING3"
        echo '8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903  '"$W/share/licenses/gcc/COPYING3" | sha256sum -c -
        curl -fL https://raw.githubusercontent.com/gcc-mirror/gcc/ee5c3db6c5b2c3332912fb4c9cfa2864569ebd9a/COPYING.RUNTIME -o "$W/share/licenses/gcc/COPYING.RUNTIME"
        echo '9d6b43ce4d8de0c878bf16b54d8e7a10d9bd42b75178153e3af6a815bdc90f74  '"$W/share/licenses/gcc/COPYING.RUNTIME" | sha256sum -c -
        curl -fL https://raw.githubusercontent.com/mingw-w64/mingw-w64/98dad1fefed2a07ade0b37ca6c610ad66739631a/COPYING.MinGW-w64-runtime/COPYING.MinGW-w64-runtime.txt -o "$W/share/licenses/crt/COPYING.MinGW-w64-runtime.txt"
        echo 'e9b2dc02451ea29092a1f25fa0f3c07207ed421f1807dffb0c4e6dce69dee7bd  '"$W/share/licenses/crt/COPYING.MinGW-w64-runtime.txt" | sha256sum -c -
        curl -fL https://raw.githubusercontent.com/mingw-w64/mingw-w64/98dad1fefed2a07ade0b37ca6c610ad66739631a/mingw-w64-libraries/winpthreads/COPYING -o "$W/share/licenses/winpthreads/COPYING"
        echo '63263614cdd29f2f93cba85e992f041b31f9fc7b4033692f31269489a8a1b177  '"$W/share/licenses/winpthreads/COPYING" | sha256sum -c -
        mkdir -p kit/runtime-notices
        cp "$W/share/licenses/gcc/COPYING3" kit/runtime-notices/gcc-COPYING3.txt
        cp "$W/share/licenses/gcc/COPYING.RUNTIME" kit/runtime-notices/gcc-COPYING.RUNTIME.txt
        cp "$W/share/licenses/crt/COPYING.MinGW-w64-runtime.txt" kit/runtime-notices/MinGW-w64-runtime.txt
        cp "$W/share/licenses/winpthreads/COPYING" kit/runtime-notices/winpthreads-COPYING.txt
      shell: bash
    - name: Build DLL import RDDADS and threaded fixtures with owner toolchain
      run: |
        set -euxo pipefail
        export PATH="$(cygpath -u "$RUNNER_TEMP/winlibs15/mingw32/bin"):$PATH"
        test "$(gcc -dumpversion)" = 15.1.0
        HB="$(cygpath -u "$RUNNER_TEMP/hbsrc")"
        HBMK="$(cygpath -u "$RUNNER_TEMP/hb1510/bin/win/mingw/hbmk2.exe")"
        export HB_INSTALL_PREFIX="$(cygpath -m "$RUNNER_TEMP/hb1510")"
        mkdir -p srv mtdata output kit
        rm -f "$RUNNER_TEMP/hb1510/lib/win/mingw/librddads.a"
        cp build-legacy/src/*.dll build-legacy/tools/serverd/openads_serverd.exe build-legacy/tools/serverd/openads_auth_worker.exe srv/
        cat > output/local_create.prg <<'PRG'
        #include "ads.ch"
        REQUEST ADS, ADSCDX
        PROCEDURE Main( cDir )
           LOCAL cDbf := cDir + "/TestIndex.dbf", cIdx := cDir + "/TestIndex.cdx"
           FIELD NAME,CITY,INS
           OAds_SetLogging( .F. )
           AdsSetServerType( ADS_LOCAL_SERVER )
           AdsConnect( "." )
           AdsSetFileType( ADS_CDX )
           RddSetDefault( "ADSCDX" )
           DbCreate( cDbf, { { "NAME", "C", 19, 0 }, { "CITY", "C", 15, 0 }, { "AGE", "N", 3, 0 }, { "TS", "C", 23, 0 }, { "THD", "N", 3, 0 }, { "INS", "N", 4, 0 }, { "RDD", "C", 3, 0 } }, "ADSCDX" )
           dbCloseArea()
           USE ( cDbf ) VIA "ADSCDX" ALIAS _STG SHARED NEW
           INDEX ON NAME TAG "IDX01" TO ( cIdx )
           INDEX ON CITY TAG "IDX02" TO ( cIdx )
           INDEX ON INS TAG "IDX03" TO ( cIdx )
           dbCloseArea()
           OutStd( "exact fixture ready" + hb_eol() )
        RETURN

        PRG
        cat > output/probe_mt.prg <<'PRG'
        #include "ads.ch"
        #define __HLP__(s) .T.
        REQUEST ADS, ADSCDX
        STATIC s_hConn := 0
        STATIC s_cRdd := "ADSCDX"
        STATIC s_nRandom := 1
        PROCEDURE Main( cUri, cDir )
           LOCAL cChallenge, hPending := 0, i, x, aThreads := {}, cErr := Space(512)
           ErrorBlock( {| e | OutStd( "ERROR " + hb_ValToExp(e) + hb_eol() ), Break(e) } )
           AdsSetFileType( ADS_CDX )
           AdsSetServerType( ADS_REMOTE_SERVER )
           RddSetDefault( s_cRdd )
           s_hConn := AdsConnect( cUri )
           IF Empty( s_hConn )
              OutStd( "CONNECT-FAIL" + hb_eol() )
              ErrorLevel(3) ; QUIT
           ENDIF
           FOR i := 1 TO 9
              AAdd(aThreads,hb_threadStart({|| StageExact(cDir)}))
           NEXT
           StageExact(cDir)
           OutStd( "MAIN-STAGE-PASS" + hb_eol() )
           dbGoTop()
           OutStd( "MAIN-GOTOP-PASS lastrec=" + hb_ntos(LastRec()) + hb_eol() )
           FOR EACH x IN aThreads
              hb_threadJoin(x)
           NEXT
           OutStd( "EXACT-THREADS-JOINED lastrec=" + hb_ntos(LastRec()) + hb_eol() )
           dbCloseArea()
        RETURN
        PROCEDURE StageExact(cDir)
           BEGIN SEQUENCE
              IF HeyAddRecords(cDir+"/TestIndex.dbf",cDir+"/TestIndex.cdx")
         dbGoTop()
              ENDIF
              Mark("stage done")
           RECOVER
              Mark("RECOVER")
              ErrorLevel(4)
           END SEQUENCE
        RETURN
        PROCEDURE Mark(c)
           OutStd("t"+hb_ntos(hb_threadId())+" "+c+hb_eol())
        RETURN
        PROCEDURE LogEvents(c)
           Mark(c)
        RETURN
        FUNCTION HeyAddRecords( cDbf, cIdx )
           LOCAL aRec, aData, lAppended
           LOCAL lAdded := .T.

           IF .T.
              Mark( "before USE" )
              USE ( cDbf ) VIA ( s_cRdd ) ALIAS _STG SHARED NEW
           ENDIF
           Mark( "after USE" )
           IF ! Alias() == "_STG"
              lAdded := .F.
              ? "Could not Open: ", cDbf
           ELSE
              IF __HLP__( "__Switching it ON do not display records in the browser as well as referencing them__" )
         Mark( "before dbSetIndex" )
         dbSetIndex( cIdx )
         Mark( "after dbSetIndex" )
         dbSetOrder( 0 )
              ENDIF
              aData := { { "Alice"  , "Madrid"    }, ;
                 { "Bob"    , "Barcelona" }, ;
                 { "Phillip", "Panipat"   }, ;
                 { "Charlie", "Valencia"  }, ;
                 { "Linda"  , "Iris"      }, ;
                 { "Finland", "Dallas"    }, ;
                 { "Diana"  , "Sevilla"   }, ;
                 { "Lucy"   , "Sevilla"   }, ;
                 { "Jony"   , "Walker"    }, ;
                 { "Edward" , "Bilbao"    } }
              FOR EACH aRec IN aData
         Mark( "before append " + hb_ntos( aRec:__enumIndex() ) )
        #if 0
         IF aRec:__enumIndex() > 1
            EXIT
         ENDIF
        #endif
         IF ! lAppended := _STG->( DbAppend() )
            hb_idleSleep()
            lAppended := _STG->( DbAppend() )
         ENDIF
         Mark( "after append ok=" + hb_ValToExp(lAppended) + " neterr=" + hb_ValToExp(NetErr()) + " recno=" + hb_ntos(RecNo()) )
         IF lAppended
            REPLACE _STG->NAME WITH aRec[ 1 ]
            REPLACE _STG->CITY WITH aRec[ 2 ]
            REPLACE _STG->AGE  WITH hb_randInt( 20, 120 )
            REPLACE _STG->TS   WITH hb_TSToStr( hb_DateTime() )
            REPLACE _STG->THD  WITH hb_threadId()
            REPLACE _STG->INS  WITH s_nRandom
            REPLACE _STG->RDD  WITH s_cRdd
            //
            Mark( "before commit" )
            _STG->( DbCommit() ) ; _STG->( dbUnlock() )
            Mark( "after commit/unlock" )  /* a must for networked applications */
         ELSE
            LogEvents( "Could not APPEND " + aRec[ 1 ] )
         ENDIF
              NEXT
           ENDIF
           RETURN lAdded


        PRG
        # DLL import library only. Never place a combined archive in kit.
        cp build-legacy/src/libopenace32.dll.a kit/libopenace32.dll.a
        cp build-legacy/src/openace32.dll output/openace32.dll
        objdump -p output/openace32.dll > output/dll-pe.txt
        if grep -Ei 'DLL Name:.*(libstdc|libgcc|libwinpthread|libssl|libcrypto|mbedtls|zlib).*\.dll' output/dll-pe.txt;then exit 1;fi
        for unit in ads1 adsfunc adsmgmnt adsx;do
         gcc -std=gnu99 -c "$HB/contrib/rddads/$unit.c" -I"$HB/include" -I"$HB/contrib/rddads" -Iinclude/openads -o "output/$unit.o"
        done
        gcc -std=gnu99 -c contrib/oads_hb/oads_hb.c -I"$HB/include" -Iinclude/openads -o output/oads_hb.o
        for member in oads_vf oads_vf_driver oads_vf_socket; do
         gcc -std=gnu99 -c "contrib/oads_hb/$member.c" -I"$HB/include" -Iinclude/openads -o "output/$member.o"
        done
        ar rcs kit/librddads.a output/ads1.o output/adsfunc.o output/adsmgmnt.o output/adsx.o output/oads_hb.o output/oads_vf.o output/oads_vf_driver.o output/oads_vf_socket.o
        for name in local_create probe_mt;do
         "$HBMK" "output/$name.prg" -plat=win -comp=mingw -Lkit -lrddads -lopenace32 -iinclude/openads -i"$HB/contrib/rddads" -mt -gtstd -o"output/$name.exe"
        done
        cp output/probe_mt.exe output/probe_mt_dll.exe
        "$HBMK" tests/smoke/harbour/copy_socket86.prg tests/smoke/harbour/copy_transport86.c -plat=win -comp=mingw -Lkit -lrddads -lopenace32 -iinclude/openads -mt -gtstd -ooutput/copy_socket86.exe
        cat > output/check_rows.prg <<'CHECKROWS'
        #include "ads.ch"
        REQUEST ADS, ADSCDX
        PROCEDURE Main(cDir)
         LOCAL nRows:=0, nEmpty:=0
         FIELD NAME,CITY
         AdsSetServerType(ADS_LOCAL_SERVER)
         AdsSetFileType(ADS_CDX)
         RddSetDefault("ADSCDX")
         USE (cDir+"/TestIndex.dbf") VIA "ADSCDX" SHARED NEW
         dbGoTop()
         DO WHILE !Eof()
           nRows++
           IF Empty(NAME) .OR. Empty(CITY)
              nEmpty++
           ENDIF
           dbSkip()
         ENDDO
         OutStd("STORED rows="+hb_ntos(nRows)+" lastrec="+hb_ntos(LastRec())+" empty="+hb_ntos(nEmpty)+hb_eol())
         dbCloseAll()
        RETURN
        CHECKROWS
        "$HBMK" output/check_rows.prg -plat=win -comp=mingw -Lkit -lrddads -lopenace32 -iinclude/openads -i"$HB/contrib/rddads" -mt -gtstd  -lws2_32 -lbcrypt -lpsapi -ooutput/check_rows.exe
        cat > output/auth_static.prg <<'PRG'
        #include "ads.ch"
        REQUEST ADS, ADSCDX
        PROCEDURE Main(cUrl)
         LOCAL cChallenge,hPending:=0,hConn:=0,cBlob
         IF !OAds_SetLogging(.T.)
          OutStd("LOGGING-OPTIN-FAIL"+hb_eol())
          ErrorLevel(6);QUIT
         ENDIF
         cChallenge:=OAds_BeginAuth(cUrl,@hPending)
         IF Len(cChallenge)!=32
          OutStd("AUTH-BEGIN-FAIL"+hb_eol())
          ErrorLevel(3);QUIT
         ENDIF
         cBlob:=cChallenge+"test-only"
         hConn:=OAds_CompleteAuth(hPending,cBlob)
         IF Empty(hConn)
          OutStd("AUTH-COMPLETE-FAIL"+hb_eol())
          ErrorLevel(4);QUIT
         ENDIF
         OAds_SetConnection(hConn)
         dbUseArea(.T.,"ADSCDX","TestIndex.dbf","TRACEPROBE",.T.,.F.)
         IF !Used()
          ErrorLevel(5);QUIT
         ENDIF
         dbCloseAll()
         AdsDisconnect(hConn)
         OAds_SetLogging(.F.)
         OutStd("STATIC-AUTH-PASS"+hb_eol())
        RETURN
        PRG
        "$HBMK" output/auth_static.prg -plat=win -comp=mingw -Lkit -lrddads -lopenace32 -iinclude/openads -i"$HB/contrib/rddads" -mt -gtstd  -lws2_32 -lbcrypt -lpsapi -ooutput/auth_static.exe
        objdump -p output/auth_static.exe > output/static-auth-pe.txt
        grep -qi 'DLL Name: openace32.dll' output/static-auth-pe.txt
        "$HBMK" tests/smoke/harbour/refresh_peer.prg -plat=win -comp=mingw -Lkit -lrddads -lopenace32 -iinclude/openads -i"$HB/contrib/rddads" -mt -gtstd -ooutput/refresh_peer.exe
        objdump -p output/refresh_peer.exe > output/refresh-peer-pe.txt
        grep -qi 'DLL Name: openace32.dll' output/refresh-peer-pe.txt
        echo "$PINNED_SOURCE" > output/source-commit.txt
        objdump -p output/openace32.dll | sed -n '/\[Ordinal\/Name Pointer\] Table/,$p' > output/dll-exports.txt
        if grep -E '^.*\][[:space:]]+(_Z|\?)[^[:space:]]+' output/dll-exports.txt;then exit 1;fi
      shell: bash
    - name: Run twenty threaded B_BIG integrity fixtures through the GCC 15.1 client
      run: |+
        $data=(Resolve-Path mtdata).Path
        $srv=(Resolve-Path srv/openads_serverd.exe).Path
        & $srv --help | Out-File srv/help.txt
        & $srv --version | Out-File srv/version.txt
        $p=Start-Process -FilePath $srv -ArgumentList ('--port 16262 --data '+$data) -WorkingDirectory (Split-Path $srv) -RedirectStandardOutput srv/stdout.log -RedirectStandardError srv/stderr.log -PassThru
        $ok=$false
        for($i=0;$i -lt 60;$i++){ $c=Test-NetConnection -ComputerName 127.0.0.1 -Port 16262 -WarningAction SilentlyContinue; if($c.TcpTestSucceeded){$ok=$true;break}; Start-Sleep -Milliseconds 500 }
        if(-not $ok){throw 'server did not listen'}
        $env:Path = (Resolve-Path srv).Path + ';' + $env:Path
        for($trial=1;$trial -le 20;$trial++) {
         $trialDir=Join-Path (Get-Location) "mtdata/dll$trial"
         New-Item -ItemType Directory -Path $trialDir -Force | Out-Null
         $trialDir=$trialDir.Replace('\','/')
         & output/local_create.exe $trialDir | Out-File "output/dll$trial-fixture.txt"
         $trialUrl="tcp://127.0.0.1:16262/$trialDir"
         $clock=[System.Diagnostics.Stopwatch]::StartNew()
         $p=Start-Process -FilePath (Resolve-Path output/probe_mt_dll.exe).Path -ArgumentList @($trialUrl,$trialDir) -RedirectStandardOutput "output/dll$trial-stdout.txt" -RedirectStandardError "output/dll$trial-stderr.txt" -PassThru
         if(-not $p.WaitForExit(45000)){$p.Kill();throw "dll trial $trial hung"}
         if($p.ExitCode -ne 0){throw "dll trial $trial failed exit $($p.ExitCode)"}
         $clock.Stop()
         $elapsed=$clock.Elapsed.TotalMilliseconds
         $end=Select-String -Path "output/dll$trial-stdout.txt" -Pattern 'EXACT-THREADS-JOINED'
         $fails=@(Select-String -Path "output/dll$trial-stdout.txt" -Pattern 'Could not APPEND').Count
         $stored=& output/check_rows.exe $trialDir
         $bytes=[System.IO.File]::ReadAllBytes("$trialDir/TestIndex.dbf")
         $disk=[BitConverter]::ToUInt32($bytes,4)
         "dll TRIAL $trial PASS $end elapsed_ms=$elapsed failed_appends=$fails disk_header=$disk $stored" | Tee-Object -FilePath output/repeat-summary.txt -Append
         if(-not $end){throw "dll trial $trial incomplete"}
         if($fails -ne 0 -or $disk -ne 100 -or $stored -notmatch 'rows=100 lastrec=100 empty=0'){throw "dll integrity mismatch"}
        }
        Get-Content output/dll-pe.txt
      shell: pwsh
    - name: Actual TCP CopyFile and FCopyFile through the packaged MinGW glue
      shell: pwsh
      run: |
        python tests/copy_socket86.py --client output/openace32.dll --server srv/openads_serverd.exe --harbour-probe output/copy_socket86.exe --harbour-only | Tee-Object -FilePath output/copy86-tcp.txt
        if($LASTEXITCODE -ne 0){throw 'actual socket CopyFile regression failed'}
    - name: Exact Harbour vf family through the packaged MinGW archive
      shell: bash
      run: |
        set -euxo pipefail
        export PATH="$(cygpath -u "$RUNNER_TEMP/winlibs15/mingw32/bin"):$PWD/output:$PWD/srv:$PATH"
        HB="$(cygpath -u "$RUNNER_TEMP/hbsrc")"
        HBMK="$(cygpath -u "$RUNNER_TEMP/hb1510/bin/win/mingw/hbmk2.exe")"
        export HB_INSTALL_PREFIX="$(cygpath -m "$RUNNER_TEMP/hb1510")"
        bash tests/build_vf87.sh "$HBMK" "$HB" "output" openace32 output/vf87 kit
        bash tests/build_fsargs88.sh "$HBMK" "$HB" "output" openace32 output/vf87 kit
        failed=0
        frontend_diff=0
        : > output/vf87-proof.txt
        # Original unmodified reproducer: kept and recorded. Under inherited stdin it shows the
        # startup hb_fsError=109 state (see ferr_order diagnostic); that run is recorded, not gated.
        echo '--- original vf_frontend87, inherited stdin (recorded, see matched harness below) ---' | tee -a output/vf87-proof.txt
        output/vf87/vf_frontend87.exe 2>&1 | tee output/vf87-original-inherited.txt | tee -a output/vf87-proof.txt || true
        echo '--- original vf_frontend87, NUL stdin (gated) ---' | tee -a output/vf87-proof.txt
        set +e; output/vf87/vf_frontend87.exe < /dev/null 2>&1 | tee -a output/vf87-proof.txt; rc=${PIPESTATUS[0]}; set -e; test "$rc" = 0 || { frontend_diff=1; echo 'VF87-READONLY difference under NUL stdin' > output/READINESS-BLOCKED-vf-frontend.txt; }
        echo '--- original vf_frontend87, pipe stdin (gated) ---' | tee -a output/vf87-proof.txt
        set +e; echo | output/vf87/vf_frontend87.exe 2>&1 | tee -a output/vf87-proof.txt; rc=${PIPESTATUS[1]}; set -e; test "$rc" = 0 || { frontend_diff=1; echo 'VF87-READONLY difference under pipe stdin' > output/READINESS-BLOCKED-vf-frontend.txt; }
        # Matched-initial-state harness: same 18 cases (probe functions extracted unchanged from the
        # original file), each probe preceded by an established and verified hb_fsError state (0 and
        # a nonzero 2), in both call orders. Differences or an unestablished state fail the gate.
        {
        cat <<'MATCHED'
        #include "fileio.ch"
        PROCEDURE Main()
           LOCAL nBad := 0, nState := 0, nRuns := 0, nS, cOrd, a, b, n
           FOR EACH nS IN { 0, 2 }
              FOR EACH cOrd IN { "native-first", "wrapper-first" }
                 IF cOrd == "native-first"
                    IF ! Prime( nS ); nState++; ENDIF
                    a := NativeProbe()
                    IF ! Prime( nS ); nState++; ENDIF
                    b := OadsProbe()
                 ELSE
                    IF ! Prime( nS ); nState++; ENDIF
                    b := OadsProbe()
                    IF ! Prime( nS ); nState++; ENDIF
                    a := NativeProbe()
                 ENDIF
                 nRuns++
                 FOR n := 1 TO Len( a )
                    IF hb_ValToExp( a[ n ] ) != hb_ValToExp( b[ n ] )
                       OutStd( "DIFF state=" + hb_ntos( nS ) + " order=" + cOrd + " case=" + hb_ntos( n ) + " " + hb_ValToExp( a[ n ] ) + " / " + hb_ValToExp( b[ n ] ) + hb_eol() )
                       nBad++
                    ENDIF
                 NEXT
              NEXT
           NEXT
           OutStd( "VF87-MATCHED runs=" + hb_ntos( nRuns ) + " cases=" + hb_ntos( Len( a ) ) + " differences=" + hb_ntos( nBad ) + " state_not_established=" + hb_ntos( nState ) + hb_eol() )
           ErrorLevel( nBad + nState )
           RETURN
        STATIC FUNCTION Prime( nWant )
           IF nWant == 0
              hb_vfLoad( "include/openads/ace.h", 17 )
           ELSE
              hb_vfLoad( "include/openads/no-such-file-87.h", 17 )
           ENDIF
           RETURN DIAG_FSERROR() == nWant
        #pragma BEGINDUMP
        #include "hbapi.h"
        #include "hbapifs.h"
        HB_FUNC( DIAG_FSERROR ) { hb_retni( ( int ) hb_fsError() ); }
        #pragma ENDDUMP
        MATCHED
        sed -n '/^FUNCTION NativeProbe/,$p' tests/smoke/harbour/vf_frontend87.prg
        } > output/vf_frontend87_matched.prg
        "$HBMK" output/vf_frontend87_matched.prg tests/smoke/harbour/vf_transport87.c -plat=win -comp=mingw -Lkit -lrddads -Loutput -lopenace32 -iinclude/openads -mt -gtstd -ooutput/vf87/vf_frontend87_matched 2>&1 | tail -3
        for mode in inherited nul pipe; do
          echo "--- matched harness, $mode stdin (gated) ---" | tee -a output/vf87-proof.txt
          set +e
          case $mode in
            nul) output/vf87/vf_frontend87_matched.exe < /dev/null 2>&1 | tee -a output/vf87-proof.txt; rc=${PIPESTATUS[0]};;
            pipe) echo | output/vf87/vf_frontend87_matched.exe 2>&1 | tee -a output/vf87-proof.txt; rc=${PIPESTATUS[1]};;
            *) output/vf87/vf_frontend87_matched.exe 2>&1 | tee -a output/vf87-proof.txt; rc=${PIPESTATUS[0]};;
          esac
          set -e
          if [ "$rc" != 0 ]; then frontend_diff=1; echo "VF87 matched-state harness failed under $mode stdin" > output/READINESS-BLOCKED-vf-frontend.txt; fi
        done
        output/vf87/vf_local87.exe | tee -a output/vf87-proof.txt || failed=1
        output/vf87/vf_socket_member87.exe | tee -a output/vf87-proof.txt || failed=1
        python tests/vf_socket87.py --server srv/openads_serverd.exe --large-directory --probe output/vf87/vf_compare87.exe --probe output/vf87/vf_locks87.exe --probe output/vf87/vf_extra87.exe --probe output/vf87/vf_bulk87.exe --probe output/vf87/vf_flags87.exe --probe output/vf87/vf_pairs87.exe --probe output/vf87/vf_boundary87.exe | tee -a output/vf87-proof.txt || failed=1
        python tests/vf_socket87.py --server srv/openads_serverd.exe --probe output/vf87/fs_args88.exe | tee -a output/vf87-proof.txt || failed=1
        echo "frontend_diff=$frontend_diff" | tee -a output/vf87-proof.txt
        echo '--- diagnostic: same probe with different stdin states ---' | tee -a output/vf87-diag.txt
        for i in 1 2 3; do echo "inherited-stdin run $i" | tee -a output/vf87-diag.txt; output/vf87/vf_frontend87.exe 2>&1 | tee -a output/vf87-diag.txt || true; done
        awk '/LOCAL a := NativeProbe\(\), b := OadsProbe\(\), nBad := 0, n/ {print "   LOCAL a, b, nBad := 0, n"; print "   OutStd(\"MAIN-ENTRY FError=\"+hb_ntos(FError())+hb_eol())"; print "   a := NativeProbe(); OutStd(\"AFTER-NATIVE FError=\"+hb_ntos(FError())+hb_eol()); b := OadsProbe()"; next} /LOCAL cName := "include\/openads\/ace.h", cDest/ && !d {print; print "   OutStd(\"NATIVE-ENTRY FError=\"+hb_ntos(FError())+hb_eol())"; d=1; next} {print}' tests/smoke/harbour/vf_frontend87.prg > output/vf_frontend87_diag.prg
        "$HBMK" output/vf_frontend87_diag.prg tests/smoke/harbour/vf_transport87.c -plat=win -comp=mingw -Lkit -lrddads -Loutput -lopenace32 -iinclude/openads -mt -gtstd -ooutput/vf87/vf_frontend87_diag 2>&1 | tail -2
        for mode in inherited nul; do echo "== frontend87 diag copy stdin=$mode" | tee -a output/vf87-diag.txt; if [ $mode = nul ]; then output/vf87/vf_frontend87_diag.exe < /dev/null 2>&1 | tee -a output/vf87-diag.txt || true; else output/vf87/vf_frontend87_diag.exe 2>&1 | tee -a output/vf87-diag.txt || true; fi; done
        cat > output/ferr_order.prg <<'ORD'
        PROCEDURE Main( cOrder )
           LOCAL aS := {}, c := "include/openads/ace.h", d, x
           AAdd( aS, { "entry", FError(), DIAG_FSERROR(), DIAG_FSOSERROR() } )
           DO CASE
           CASE cOrder == "native-first"
              x := hb_vfExists( c, @d ); AAdd( aS, { "native-exists", FError(), DIAG_FSERROR(), DIAG_FSOSERROR() } )
              x := OAds_vfExists( c, @d ); AAdd( aS, { "wrapper-exists", FError(), DIAG_FSERROR(), DIAG_FSOSERROR() } )
           CASE cOrder == "wrapper-first"
              x := OAds_vfExists( c, @d ); AAdd( aS, { "wrapper-exists", FError(), DIAG_FSERROR(), DIAG_FSOSERROR() } )
              x := hb_vfExists( c, @d ); AAdd( aS, { "native-exists", FError(), DIAG_FSERROR(), DIAG_FSOSERROR() } )
           CASE cOrder == "load-then-native"
              x := hb_vfLoad( c, 17 ); AAdd( aS, { "native-load", FError(), DIAG_FSERROR(), DIAG_FSOSERROR() } )
              x := hb_vfExists( c, @d ); AAdd( aS, { "native-exists", FError(), DIAG_FSERROR(), DIAG_FSOSERROR() } )
              x := OAds_vfExists( c, @d ); AAdd( aS, { "wrapper-exists", FError(), DIAG_FSERROR(), DIAG_FSOSERROR() } )
           ENDCASE
           OutStd( "ORDER " + cOrder + hb_eol() )
           FOR EACH x IN aS
              OutStd( "  " + PadR( x[ 1 ], 16 ) + " FError=" + hb_ntos( x[ 2 ] ) + " hb_fsError=" + hb_ntos( x[ 3 ] ) + " hb_fsOsError=" + hb_ntos( x[ 4 ] ) + hb_eol() )
           NEXT
           RETURN
        #pragma BEGINDUMP
        #include "hbapi.h"
        #include "hbapifs.h"
        HB_FUNC( DIAG_FSERROR ) { hb_retni( ( int ) hb_fsError() ); }
        HB_FUNC( DIAG_FSOSERROR ) { hb_retni( ( int ) hb_fsOsError() ); }
        #pragma ENDDUMP
        ORD
        "$HBMK" output/ferr_order.prg tests/smoke/harbour/vf_transport87.c -plat=win -comp=mingw -Lkit -lrddads -Loutput -lopenace32 -iinclude/openads -mt -gtstd -ooutput/vf87/ferr_order 2>&1 | tail -2
        for mode in inherited nul pipe; do for ord in native-first wrapper-first load-then-native; do echo "== ferr_order $ord stdin=$mode" | tee -a output/vf87-diag.txt; case $mode in nul) output/vf87/ferr_order.exe $ord < /dev/null 2>&1 | tee -a output/vf87-diag.txt || true;; pipe) echo | output/vf87/ferr_order.exe $ord 2>&1 | tee -a output/vf87-diag.txt || true;; *) output/vf87/ferr_order.exe $ord 2>&1 | tee -a output/vf87-diag.txt || true;; esac; done; done
        cat > output/ferr_trace.prg <<'TRACE'
        PROCEDURE Main( cOrder )
           LOCAL c := "include/openads/ace.h", d, x
           OutStd( "TRACE order=" + cOrder + " START FError=" + hb_ntos( FError() ) + hb_eol() )
           x := hb_vfIsLocal( c ); OutStd( "after hb_vfIsLocal FError=" + hb_ntos( FError() ) + hb_eol() )
           x := hb_vfExists( c, @d ); OutStd( "after hb_vfExists FError=" + hb_ntos( FError() ) + hb_eol() )
           x := { hb_vfIsLocal( c ), hb_vfExists( c, @d ), d, FError() }; OutStd( "array form FError element=" + hb_ntos( x[ 4 ] ) + hb_eol() )
           FOR x := 1 TO 2
              IF cOrder == "native-first"
                 hb_vfExists( c, @d ); OutStd( "hb_vfExists #" + hb_ntos( x ) + " FError=" + hb_ntos( FError() ) + hb_eol() )
                 OAds_vfExists( c, @d ); OutStd( "OAds_vfExists #" + hb_ntos( x ) + " FError=" + hb_ntos( FError() ) + hb_eol() )
              ELSE
                 OAds_vfExists( c, @d ); OutStd( "OAds_vfExists #" + hb_ntos( x ) + " FError=" + hb_ntos( FError() ) + hb_eol() )
                 hb_vfExists( c, @d ); OutStd( "hb_vfExists #" + hb_ntos( x ) + " FError=" + hb_ntos( FError() ) + hb_eol() )
              ENDIF
           NEXT
           RETURN
        TRACE
        "$HBMK" output/ferr_trace.prg tests/smoke/harbour/vf_transport87.c -plat=win -comp=mingw -Lkit -lrddads -Loutput -lopenace32 -iinclude/openads -mt -gtstd -ooutput/vf87/ferr_trace 2>&1 | tail -2
        for mode in inherited nul; do for ord in native-first wrapper-first; do echo "== trace $ord stdin=$mode" | tee -a output/vf87-diag.txt; if [ $mode = nul ]; then output/vf87/ferr_trace.exe $ord < /dev/null 2>&1 | tee -a output/vf87-diag.txt || true; else output/vf87/ferr_trace.exe $ord 2>&1 | tee -a output/vf87-diag.txt || true; fi; done; done
        echo "direct to file" | tee -a output/vf87-diag.txt; output/vf87/vf_frontend87.exe > output/vf87-direct.txt 2>&1 || true; cat output/vf87-direct.txt | tee -a output/vf87-diag.txt
        output/vf87/vf_frontend87.exe < /dev/null 2>&1 | tee -a output/vf87-diag.txt || true
        echo | output/vf87/vf_frontend87.exe 2>&1 | tee -a output/vf87-diag.txt || true
        cat > output/ferr_diag.prg <<'DIAG'
        PROCEDURE Main()
           OutStd( "FERROR-AT-START " + hb_ntos( FError() ) + hb_eol() )
           hb_vfExists( "include/openads/ace.h" )
           OutStd( "FERROR-AFTER-1ST-hb_vfExists " + hb_ntos( FError() ) + hb_eol() )
           hb_vfExists( "include/openads/ace.h" )
           OutStd( "FERROR-AFTER-2ND-hb_vfExists " + hb_ntos( FError() ) + hb_eol() )
           RETURN
        DIAG
        "$HBMK" output/ferr_diag.prg -plat=win -comp=mingw -gtstd -mt -ooutput/ferr_diag.exe | tail -1
        output/ferr_diag.exe < /dev/null 2>&1 | tee -a output/vf87-diag.txt
        echo | output/ferr_diag.exe 2>&1 | tee -a output/vf87-diag.txt
        output/ferr_diag.exe 2>&1 | tee -a output/vf87-diag.txt || true
        exit "$failed"
    - name: Compile the auth probe module with the owner Harbour
      run: |
        set -euxo pipefail
        HBC="$(cygpath -u "$RUNNER_TEMP/hb1510/bin/win/mingw/harbour.exe")"
        "$HBC" tests/hrb/auth-spike/test_only.prg -gh -oauth-probe.hrb
        MSYS_NO_PATHCONV=1 icacls.exe auth-probe.hrb /inheritance:r /grant "$USERNAME:R" /grant 'SYSTEM:R' /grant 'Administrators:R'
      shell: bash
    - name: DLL Harbour BeginAuth CompleteAuth native smoke
      run: |
        $env:OPENADS_WIRE_TRACE="1"
        $env:OPENADS_WIRE_TRACE_FILE=(Join-Path $PWD "output/auth-wire-trace.txt")
        $data=(Resolve-Path mtdata).Path
        & output/local_create.exe $data | Out-File output/auth-trace-fixture.txt
        if($LASTEXITCODE -ne 0){throw "auth trace fixture create failed"}
        $mod=(Resolve-Path auth-probe.hrb).Path
        $srv=(Resolve-Path srv/openads_serverd.exe).Path
        $args='--port 17262 --data "'+$data+'" --auth_user usr:pw --auth_module "'+$mod+'"'
        $p=Start-Process -FilePath $srv -ArgumentList $args -WorkingDirectory (Split-Path $srv) -RedirectStandardOutput output/auth-server-stdout.txt -RedirectStandardError output/auth-server-stderr.txt -PassThru
        try {
         $ok=$false
         for($i=0;$i -lt 60;$i++){ $c=Test-NetConnection -ComputerName 127.0.0.1 -Port 17262 -WarningAction SilentlyContinue;if($c.TcpTestSucceeded){$ok=$true;break};Start-Sleep -Milliseconds 500 }
         if(-not $ok){throw 'auth server did not listen'}
         $uri='auth://127.0.0.1:17262/'+$data.Replace('\','/')
         $q=Start-Process -FilePath (Resolve-Path output/auth_static.exe).Path -ArgumentList $uri -RedirectStandardOutput output/static-auth-stdout.txt -RedirectStandardError output/static-auth-stderr.txt -PassThru
         if(-not $q.WaitForExit(45000)){$q.Kill();throw 'static auth hung'}
         if($q.ExitCode -ne 0){throw "static auth failed $($q.ExitCode)"}
         if(-not (Select-String output/static-auth-stdout.txt -Pattern STATIC-AUTH-PASS)){throw 'static auth proof missing'}
        } finally {if(-not $p.HasExited){$p.Kill()}}
        if(-not (Select-String output/auth-wire-trace.txt -Pattern "wire  op[.]")){throw "auth wire trace missing"}
        if(Select-String output/auth-wire-trace.txt -Pattern "wire  op[.]0x(3D|3F) "){throw "auth handshake leaked to wire trace"}
        Get-Content output/static-auth-stdout.txt
      shell: pwsh
    - name: Actual GCC 15.1 Harbour peer refresh with staged matched DLL and daemon
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $data=(Resolve-Path mtdata).Path
        $testdata=Join-Path $data 'refresh-peer'
        New-Item -ItemType Directory -Force $testdata | Out-Null
        $srv=(Resolve-Path srv/openads_serverd.exe).Path
        $p=Start-Process $srv -ArgumentList @('--host','127.0.0.1','--allow_anonymous','--port','17264','--data',$testdata) -WorkingDirectory (Split-Path $srv) -RedirectStandardOutput output/refresh-server.txt -RedirectStandardError output/refresh-server-error.txt -PassThru
        try {
         $ready=$false
         for($i=0;$i -lt 60;$i++) {
          if($p.HasExited){throw 'refresh daemon exited'}
          $c=New-Object System.Net.Sockets.TcpClient
          try {$c.Connect('127.0.0.1',17264);$ready=$true} catch {} finally {$c.Dispose()}
          if($ready){break};Start-Sleep -Milliseconds 500
         }
         if(-not $ready){throw 'refresh readiness timeout'}
         & output/refresh_peer.exe reader ('tcp://127.0.0.1:17264/'+$testdata.Replace('\','/')) ($testdata+'\') *> output/refresh-peer-gcc-proof.txt
         $rc=$LASTEXITCODE
         Get-Content output/refresh-peer-gcc-proof.txt
         if($rc -ne 0 -or -not(Select-String output/refresh-peer-gcc-proof.txt -Pattern REFRESH-PEER-HARBOUR-PASS -Quiet)){throw 'GCC x86 refresh proof failed'}
        } finally {Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
    - name: Matched DLL import library and unsupported old-DLL guard
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euxo pipefail
        export PATH="$(cygpath -u "$RUNNER_TEMP/winlibs15/mingw32/bin"):$PATH"
        mkdir -p output/import-new output/import-old
        nm kit/librddads.a | grep ' U _AdsFlushPendingFields' | tee output/rdd-symbol.txt
        nm kit/libopenace32.dll.a | grep AdsFlushPendingFields | tee output/import-symbol.txt
        objdump -p output/openace32.dll | grep AdsFlushPendingFields | tee output/export-symbol.txt
        gcc tests/harbour_batch/abi_probe.c -Iinclude -Lkit -lopenace32 -o output/import-new/probe.exe
        cp output/openace32.dll output/import-new/
        (cd output/import-new && ./probe.exe) | tee output/import-proof.txt
        python - <<'PYOLD'
        import hashlib,pathlib,urllib.request,zipfile,io,os
        u='https://api.github.com/repos/bedipritpal/OpenADS/releases/assets/722812042'
        b=urllib.request.urlopen(urllib.request.Request(u,headers={'Accept':'application/octet-stream','Authorization':'Bearer '+os.environ['GH_TOKEN']}),timeout=120).read()
        assert hashlib.sha256(b).hexdigest()=='f1281ea85425288b0bcf470183dd6d7ee6a7030ea82dff9a673a095e04cf8ee0'
        z=zipfile.ZipFile(io.BytesIO(b));n=[n for n in z.namelist() if n.endswith('/bin/openace32.dll')];assert len(n)==1,n
        pathlib.Path('output/import-old/openace32.dll').write_bytes(z.read(n[0]))
        PYOLD
        cp output/import-new/probe.exe output/import-old/
        python - <<'PYLOAD'
        import ctypes,pathlib,subprocess
        ctypes.windll.kernel32.SetErrorMode(3)
        p=pathlib.Path('output/import-old').resolve()
        r=subprocess.run([str(p/'probe.exe')],cwd=p,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=20)
        assert r.returncode!=0,(r.returncode,r.stdout)
        pathlib.Path('output/old-dll-guard.txt').write_text('Unsupported oldDLL/newimport missing-export failure: '+str(r.returncode)+'\n')
        print('OLD-DLL-MISSING-EXPORT-PASS',r.returncode)
        PYLOAD
