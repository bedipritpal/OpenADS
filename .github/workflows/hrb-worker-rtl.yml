name: Qt4.9.2 static capacity compatibility proof TEST ONLY
'on':
  push:
    branches:
    - spike-unmerged/hrb-challenge-auth
    paths:
    - .github/workflows/hrb-worker-rtl.yml
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
      with:
        ref: 98cebae99719c5283b33a06b32903e27ff617720
    - uses: actions/download-artifact@v4
      with:
        name: hrb-auth-capacity-test-x86
        path: input
        run-id: 38274919983
        github-token: ${{ github.token }}
    - name: Download exact historical Qt compiler and pinned Winlibs runtime
      shell: pwsh
      run: |
        Invoke-WebRequest 'https://download.qt.io/development_releases/prebuilt/mingw_32/i686-4.9.2-release-posix-dwarf-rt_v3-rev1.7z' -OutFile "$env:RUNNER_TEMP/qt492.7z"
        if((Get-FileHash "$env:RUNNER_TEMP/qt492.7z" -Algorithm SHA256).Hash.ToLower() -ne 'f6de32350a28f4b6c30eec26dbfee65f112300d51e37e4d2007b0598bef9bb79'){throw 'Qt compiler hash mismatch'}
        & 7z x "$env:RUNNER_TEMP/qt492.7z" "-o$env:RUNNER_TEMP/qt492" -y
        Invoke-WebRequest 'https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z' -OutFile "$env:RUNNER_TEMP/winlibs.7z"
        if((Get-FileHash "$env:RUNNER_TEMP/winlibs.7z" -Algorithm SHA256).Hash.ToLower() -ne '019ee601c48069b91101a3af923bf2cdd4399c99b9a1c70b5d59da9cfbb8e907'){throw 'Winlibs hash mismatch'}
        & 7z x "$env:RUNNER_TEMP/winlibs.7z" "-o$env:RUNNER_TEMP/winlibs" -y
    - name: Convert only object container and merge matching static runtime
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p output work
        W="$(cygpath -m "$RUNNER_TEMP/winlibs/mingw32")"
        P="$(cygpath -m "$PWD")"
        A="$PWD/input/hrb-auth-UNMERGED-x86/lib/libopenace32.a"
        echo '46c98a073872f81d169189a1d941ffb7ac4ed18078d82e11187d8f7eda5d9ec7  '"$A" | sha256sum -c -
        cp "$A" output/libopenace32.a
        cp "$W/lib/libstdc++.a" work/stdcpp.a
        cat > work/merge.mri <<EOF
        create $P/output/libopenace32-runtime.a
        addlib $P/output/libopenace32.a
        addlib $P/work/stdcpp.a
        addlib $W/lib/gcc/i686-w64-mingw32/10.2.0/libgcc.a
        addlib $W/lib/gcc/i686-w64-mingw32/10.2.0/libgcc_eh.a
        addlib $W/i686-w64-mingw32/lib/libwinpthread.a
        save
        end
        EOF
        "$W/bin/ar.exe" -M < work/merge.mri
        mv output/libopenace32-runtime.a output/libopenace32.a
        "$W/bin/ar.exe" t output/libopenace32.a > output/member-inventory.txt
        # Preserve duplicate member names and archive ordering: replace only BigObj members.
        python - <<'PYTHON'
        import pathlib,subprocess,struct,json,os
        w=pathlib.Path(os.environ['RUNNER_TEMP'])/'winlibs/mingw32/bin'
        a=pathlib.Path('output/libopenace32.a').resolve();changed=[]
        for name in subprocess.check_output([str(w/'ar.exe'),'t',str(a)],text=True).splitlines():
         subprocess.run([str(w/'ar.exe'),'x',str(a),name],cwd='work',check=True)
         data=(pathlib.Path('work')/name).read_bytes()
         if data[:4]==b'\x00\x00\xff\xff' and len(data)>56 and data[4:6]==b'\x02\x00':
          p=pathlib.Path('work')/name;p.write_bytes(data);out=p.with_suffix('.normal')
          subprocess.run([str(w/'objcopy.exe'),'-O','pe-i386',str(p),str(out)],check=True);out.replace(p)
          subprocess.run([str(w/'ar.exe'),'r',str(a),str(p)],check=True);changed.append(name)
        pathlib.Path('output/converted-members.json').write_text(json.dumps(changed))
        assert 'ace_exports.cpp.obj' in changed
        PYTHON
        # Include only the missing modern MinGW CRT support, not modern startup objects.
        for spec in 'libmingw32.a lib32_libmingw32_a-cxa_thread_atexit.o' 'libmingw32.a lib32_libmingw32_a-tls_atexit.o' 'libmsvcrt.a lib32_libmsvcrt_os_a-acrt_iob_func.o' 'libmsvcrt.a lib32_libmsvcrt_os_a-register_tls_atexit.o' 'libmsvcrt.a dembbs01050.o' 'libmsvcrt.a dembbh.o' 'libmsvcrt.a dembbt.o';do
         read -r lib member <<< "$spec"
         (cd work && "$W/bin/ar.exe" x "$W/i686-w64-mingw32/lib/$lib" "$member")
         "$W/bin/ar.exe" r output/libopenace32.a "work/$member"
        done
        "$W/bin/nm.exe" output/libopenace32.a > output/static-symbols.txt
        sha256sum output/libopenace32.a > output/SHA256.txt
    - name: Build Harbour with unchanged Qt4.9.2 and link real RDD plus glue
      shell: bash
      run: |
        set -euxo pipefail
        export PATH="$RUNNER_TEMP/qt492/mingw32/bin:$PATH"
        gcc --version > output/old-compiler.txt
        ld --version > output/old-linker.txt
        test "$(gcc -dumpversion)" = 4.9.2
        # Prove the original archive fails while converted format resolves on old linker.
        nm input/hrb-auth-UNMERGED-x86/lib/libopenace32.a > output/original-old-nm.txt 2>&1 || true
        nm output/libopenace32.a > output/converted-old-nm.txt
        git clone https://github.com/harbour/core.git "$RUNNER_TEMP/harbour-old"
        git -C "$RUNNER_TEMP/harbour-old" checkout --detach 4ec2e154ed92757418bc30af571ab90240ab3209
        export HB_PLATFORM=win HB_COMPILER=mingw HB_BUILD_CONTRIBS=no HB_BUILD_DYN=no
        mingw32-make -C "$RUNNER_TEMP/harbour-old" -j2
        HB="$RUNNER_TEMP/harbour-old"
        for unit in ads1 adsfunc adsmgmnt adsx;do
         gcc -c "$HB/contrib/rddads/$unit.c" -I"$HB/include" -I"$HB/contrib/rddads" -Iinput/hrb-auth-UNMERGED-x86/include -o "output/$unit.o"
        done
        # Old startup lacks this modern CRT flag. This is an executable-only compatibility definition.
        echo 'int __mingw_module_is_dll = 0;' > output/crt_compat.c
        gcc -c output/crt_compat.c -o output/crt_compat.o
        ar rcs output/libopenace32.a output/crt_compat.o
        ar rcs output/librddads_openads_static.a output/ads1.o output/adsfunc.o output/adsmgmnt.o output/adsx.o
        cat > output/probe.prg <<'PRG'
        #include "ads.ch"
        REQUEST ADS
        PROCEDURE Main()
         LOCAL hConn,nErr,cChallenge
         OAds_SetLogging(.F.)
         AdsSetServerType(ADS_LOCAL_SERVER)
         hConn:=AdsConnect(".")
         IF Empty(hConn)
          ErrorLevel(1)
          RETURN
         ENDIF
         AdsDisconnect()
         cChallenge:=OAds_BeginAuth("ads://127.0.0.1:1",@nErr)
         IF !Empty(cChallenge)
          ErrorLevel(2)
          RETURN
         ENDIF
         ? "Qt4.9.2 Harbour RDD static connect/disconnect and auth denial OK"
        RETURN
        PRG
        "$HB/bin/win/mingw/hbmk2.exe" output/probe.prg input/hrb-auth-UNMERGED-x86/contrib/oads_hb.c -Loutput -lrddads_openads_static -lopenace32 -iinput/hrb-auth-UNMERGED-x86/include -i"$HB/contrib/rddads" -mt -gtstd -fullstatic -lws2_32 -lbcrypt -lpsapi -trace -ooutput/probe.exe > output/link-trace.txt 2>&1
        objdump -p output/probe.exe > output/imports.txt
        ! grep -Ei 'DLL Name:.*(ace32|openace|libstdc|libgcc|libwinpthread)' output/imports.txt
        output/probe.exe > output/run-proof.txt
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qt492-capacity-static-proof
        path: output
        retention-days: 14
