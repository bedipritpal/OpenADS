name: GCC10.2 native temp raw versus trimmed fixture proof (Pritpal Bedi)
'on':
  push:
    branches:
    - spike-unmerged/hrb-challenge-auth
    paths:
    - .github/workflows/hrb-worker-rtl.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86
          bits: 32
          checksum: 019ee601c48069b91101a3af923bf2cdd4399c99b9a1c70b5d59da9cfbb8e907
          folder: mingw32
          url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z
          checksum_url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z.sha256
        - arch: x64
          bits: 64
          checksum: 1e525afc8a3362a1054d7a9a44c8f496a7a652b224b79dbf4b6e5ca8c1012b74
          folder: mingw64
          url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-x86_64-posix-seh-gcc-10.2.0-mingw-w64-8.0.0-r8.7z
          checksum_url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-x86_64-posix-seh-gcc-10.2.0-mingw-w64-8.0.0-r8.7z.sha256
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ae85a71f7f72962d0d817c016e4615f194b24707
        persist-credentials: false
    - name: Download and verify Winlibs GCC10.2
      shell: pwsh
      run: |
        Invoke-WebRequest '${{ matrix.url }}' -OutFile "$env:RUNNER_TEMP/winlibs.7z"
        $sum = (Invoke-WebRequest '${{ matrix.checksum_url }}').Content
        $expected = '${{ matrix.checksum }}'
        Write-Host "Expected: $expected"
        $actual = (Get-FileHash "$env:RUNNER_TEMP/winlibs.7z" -Algorithm SHA256).Hash.ToLower()
        Write-Host "Actual: $actual"
        if ($actual -ne $expected) { throw 'Toolchain digest mismatch' }
        & 7z x "$env:RUNNER_TEMP/winlibs.7z" "-o$env:RUNNER_TEMP/winlibs" -y
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "$env:RUNNER_TEMP/winlibs/${{ matrix.folder }}/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Compile standalone native path probe only
      shell: bash
      run: |
        mkdir -p output
        cat > probe.cpp <<'CPPEOF'
        #include <filesystem>
        #include <windows.h>
        #include <iostream>
        #include <string>
        int main(){wchar_t b[4096]{};GetTempPathW(4096,b);std::wstring raw=b,trim=raw;while(trim.size()>3&&(trim.back()==L'\\'||trim.back()==L'/'))trim.pop_back();std::error_code ec;auto rs=std::filesystem::status(raw,ec);std::cout<<"raw="<<std::filesystem::path(raw)<<" type="<<int(rs.type())<<" error="<<ec.message()<<"\n";ec.clear();auto ts=std::filesystem::status(trim,ec);std::cout<<"trim="<<std::filesystem::path(trim)<<" type="<<int(ts.type())<<" error="<<ec.message()<<"\n";return ec||!std::filesystem::is_directory(ts)?1:0;}
        CPPEOF
        g++ -std=c++17 probe.cpp -o output/temp-trim-probe.exe
    - name: Run raw vs trimmed native path proof
      shell: pwsh
      run: |
        $tmp=Join-Path $env:RUNNER_TEMP 'raw-trim-proof'
        New-Item -ItemType Directory -Force $tmp | Out-Null
        $env:TMP=$tmp;$env:TEMP=$tmp
        & output/temp-trim-probe.exe | Tee-Object output/trim-proof.txt
        if($LASTEXITCODE -ne 0){throw 'trimmed path still failed'}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: temp-trim-proof-${{ matrix.arch }}
        path: output/
        if-no-files-found: error
        retention-days: 14
