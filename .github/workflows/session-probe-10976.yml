name: session-probe-10976

# Session regression probe for the 1.09.76 one-session bug, against the
# SHIPPED kits (mtfix88 control vs 1.09.76), on real Windows.
# Pattern per leg: A login, B concurrent login, close A, C login.
# Legs 1-4 use challenge auth (auth:// + test_only.hrb, same as production),
# with the server run as a Windows service (his production mode; also avoids
# the runner job object constraining the auth worker's job assignment).
# Legs 5-6: same challenge auth in console mode (service-vs-console check).
# Legs 7-8 use plain --auth_user TCP auth in console mode (no HRB worker)
# to isolate the auth-worker/HRB lane from the core session lifecycle.
# Job bisect-toolchain rebuilds release-1.09.76 source with the pinned
# mtfix88 toolchain (winlibs GCC 10.2 + Harbour 6deac9cf) and runs the same
# challenge-auth leg: PASS means the shipped 1.09.76 toolchain/Harbour is the
# cause; FAIL means a source delta between mtfix88 and 1.09.76 is.

on:
  workflow_dispatch:
  push:
    branches:
      - 'test/10976-session-probe'

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            unzip

      - name: Download and extract the shipped kits
        run: |
          set -ex
          T=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$T/kits" && cd "$T/kits"
          curl -fL --retry 3 -o mtfix88.zip "https://github.com/bedipritpal/OpenADS/releases/download/v1.09.75-mtfix88-full-test/mtfix88-full-x64.zip"
          curl -fL --retry 3 -o 10976.zip "https://github.com/bedipritpal/OpenADS/releases/download/release-1.09.76/openads-1.09.76-windows-x64.zip"
          sha256sum mtfix88.zip 10976.zip
          mkdir -p x88 x76
          unzip -q mtfix88.zip -d x88
          unzip -q 10976.zip -d x76
          ls -la x88/mtfix88-x64/bin x76/auth x76

      - name: Write the test-only HRB auth module
        run: |
          set -ex
          T=$(cygpath -u "$RUNNER_TEMP")
          echo '' | base64 -d > "$T/test_only.hrb"
          HRBW=$(cygpath -m "$T/test_only.hrb")
          icacls "$HRBW" //inheritance:r //grant:r "Administrators:F" "SYSTEM:F"
          icacls "$HRBW"

      - name: Diagnose auth worker spawn on this runner
        run: |
          set -x
          T=$(cygpath -u "$RUNNER_TEMP")
          HRBW=$(cygpath -m "$T/test_only.hrb")
          cd "$T/kits/x88/mtfix88-x64/bin"
          printf 'P' | ./openads_auth_worker.exe "$HRBW"; echo " worker88 rc=$?"
          cd "$T/kits/x76/auth"
          printf 'P' | ./openads_auth_worker.exe "$HRBW"; echo " worker76 rc=$?"

      - name: Build the probe clients against each kit's own import lib
        run: |
          set -ex
          T=$(cygpath -u "$RUNNER_TEMP")
          K="$T/kits"
          mkdir -p "$T/p88/include/openads" "$T/p88/lib" "$T/p76/include" "$T/p76/lib"
          cp "$K/x88/mtfix88-x64/include/ace.h" "$T/p88/include/openads/ace.h"
          cp "$K/x88/mtfix88-x64/lib/libopenace64.dll.a" "$T/p88/lib/"
          cp -r "$K/x76/include/." "$T/p76/include/"
          cp "$K/x76/lib/mingw/libace64.a" "$T/p76/lib/"
          CXXFLAGS="-O1 -static-libgcc -static-libstdc++ -D_WIN32_WINNT=0x0600"
          for src in daemon_probe daemon_probe_plain; do
            g++ $CXXFLAGS -I"$T/p88/include" "tests/ci/session-probe/$src.cpp" -o "$T/p88/$src.exe" -L"$T/p88/lib" -lopenace64
            g++ $CXXFLAGS -I"$T/p76/include" "tests/ci/session-probe/$src.cpp" -o "$T/p76/$src.exe" -L"$T/p76/lib" -lace64
          done
          ls -la "$T/p88" "$T/p76"

      - name: Run the session matrix
        run: |
          set -u
          set +e
          T=$(cygpath -u "$RUNNER_TEMP")
          K="$T/kits"
          HRB="$T/test_only.hrb"
          L=$(cygpath -u "$GITHUB_WORKSPACE")/logs
          mkdir -p "$L"
          SUMMARY="$L/summary.txt"; : > "$SUMMARY"

          wait_port () {
            local port="$1" tries="$2" i
            for i in $(seq 1 "$tries"); do
              if netstat -ano | grep "TCP" | grep "LISTENING" | grep -q ":$port "; then return 0; fi
              sleep 1
            done
            return 1
          }

          run_leg () {
            name="$1"; srvdir="$2"; probedir="$3"; probe="$4"; dllsrc="$5"; dllname="$6"; port="$7"; mode="$8"
            work="$T/run/$name"; rm -rf "$work"; mkdir -p "$work/data"
            cp "$probedir/$probe" "$work/probe.exe"
            cp "$dllsrc" "$work/$dllname"
            cp "$srvdir/openads_serverd.exe" "$work/"
            [ -f "$srvdir/openads_auth_worker.exe" ] && cp "$srvdir/openads_auth_worker.exe" "$work/"
            WM=$(cygpath -m "$work")
            HRBW=$(cygpath -m "$HRB")
            args="--host 127.0.0.1 --port $port --data $WM/data --auth_user usr:pw"
            url="tcp://127.0.0.1:$port/$WM/data"
            if [ "$mode" != "plain" ]; then
              args="$args --auth_module $HRBW"
              url="auth://127.0.0.1:$port/$WM/data"
            fi
            echo "=== $name : server=$srvdir probe=$probe dll=$dllname($dllsrc) mode=$mode port=$port"
            started=0
            if [ "$mode" = "hrb" ]; then
              sc stop openads_serverd > /dev/null 2>&1
              sc delete openads_serverd > /dev/null 2>&1
              sleep 1
              ( cd "$work" && ./openads_serverd.exe --install_service $args > install.log 2>&1 )
              sc start openads_serverd >> "$work/install.log" 2>&1
              wait_port "$port" 60 && started=1
            else
              pushd "$work" > /dev/null
              ./openads_serverd.exe $args > server.log 2>&1 &
              SPID=$!
              popd > /dev/null
              wait_port "$port" 45 && started=1
            fi
            if [ "$started" = "1" ]; then
              ( cd "$work" && ./probe.exe "$url" > probe.log 2>&1 ); rc=$?
            else
              echo "SERVER FAILED TO START" > "$work/probe.log"; rc=3
            fi
            if [ "$mode" = "hrb" ]; then
              sc stop openads_serverd > /dev/null 2>&1
              sleep 3
              ( cd "$work" && ./openads_serverd.exe --uninstall_service >> install.log 2>&1 )
              sleep 1
              echo "--- $name install.log:"
              cat "$work/install.log"
              cp "$work/install.log" "$L/$name-install.log"
            else
              taskkill //F //T //IM openads_serverd.exe > /dev/null 2>&1
              taskkill //F //T //IM openads_auth_worker.exe > /dev/null 2>&1
              sleep 2
              echo "--- $name server.log tail:"
              tail -30 "$work/server.log"
              cp "$work/server.log" "$L/$name-server.log"
            fi
            tail -1 "$work/probe.log" | grep -q "ALL PASS" && verdict=ALL-PASS || verdict=FAIL-OR-INCOMPLETE
            echo "$name rc=$rc verdict=$verdict" | tee -a "$SUMMARY"
            echo "--- $name probe.log:"
            cat "$work/probe.log"
            cp "$work/probe.log" "$L/$name-probe.log"
          }

          SRV88="$K/x88/mtfix88-x64/bin"
          SRV76="$K/x76/auth"
          DLL88="$K/x88/mtfix88-x64/bin/openace64.dll"
          DLL76="$K/x76/ace64.dll"

          run_leg leg88-hrb-control   "$SRV88" "$T/p88" daemon_probe.exe "$DLL88" openace64.dll 16271 hrb
          run_leg leg76-hrb-repro     "$SRV76" "$T/p76" daemon_probe.exe "$DLL76" ace64.dll     16272 hrb
          run_leg leg76-hrb-clidll88  "$SRV76" "$T/p88" daemon_probe.exe "$DLL88" openace64.dll 16273 hrb
          run_leg leg88-hrb-clidll76  "$SRV88" "$T/p76" daemon_probe.exe "$DLL76" ace64.dll     16274 hrb
          run_leg leg88-hrb-console   "$SRV88" "$T/p88" daemon_probe.exe "$DLL88" openace64.dll 16275 hrbcon
          run_leg leg76-hrb-console   "$SRV76" "$T/p76" daemon_probe.exe "$DLL76" ace64.dll     16276 hrbcon
          run_leg leg88-plain-control "$SRV88" "$T/p88" daemon_probe_plain.exe "$DLL88" openace64.dll 16281 plain
          run_leg leg76-plain         "$SRV76" "$T/p76" daemon_probe_plain.exe "$DLL76" ace64.dll     16282 plain

          echo "=== SUMMARY ==="
          cat "$SUMMARY"

      - name: Step summary
        if: always()
        run: |
          L=$(cygpath -u "$GITHUB_WORKSPACE")/logs
          { echo "# Session probe matrix results"; echo; echo '```'; cat "$L/summary.txt" 2>/dev/null || echo "no summary"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-probe-logs
          path: logs/
          if-no-files-found: warn

  bisect-toolchain:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f31f051c457ae197709bc44106ca0b1c52aaa7d2

      - name: Download pinned winlibs GCC 10.2 (the mtfix88 toolchain)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Download-Exact($url,$out) {
           for($i=0;$i -lt 4;$i++) {
            try {
             $headers=@{Accept='application/octet-stream'}
             if(([uri]$url).Host -eq 'api.github.com'){$headers.Authorization="Bearer $env:GH_TOKEN"}
             Invoke-WebRequest -Headers $headers $url -OutFile $out; return
            }
            catch { if($i -eq 3){throw}; Start-Sleep -Seconds (5*($i+1)) }
           }
          }
          Download-Exact 'https://api.github.com/repos/brechtsanders/winlibs_mingw/releases/assets/32966370' "$env:RUNNER_TEMP/winlibs.7z"
          if((Get-FileHash "$env:RUNNER_TEMP/winlibs.7z" -Algorithm SHA256).Hash.ToLower() -ne '019ee601c48069b91101a3af923bf2cdd4399c99b9a1c70b5d59da9cfbb8e907'){throw 'Winlibs hash mismatch'}
          & 7z x "$env:RUNNER_TEMP/winlibs.7z" "-o$env:RUNNER_TEMP/winlibs" -y

      - name: Build Harbour 6deac9cf (the mtfix88 server Harbour)
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(cygpath -u "$RUNNER_TEMP/winlibs/mingw32/bin"):$PATH"
          test "$(gcc -dumpversion)" = 10.2.0
          mkdir "$RUNNER_TEMP/harbour-server"
          git -C "$RUNNER_TEMP/harbour-server" init -q
          git -C "$RUNNER_TEMP/harbour-server" remote add origin https://github.com/harbour/core.git
          git -C "$RUNNER_TEMP/harbour-server" fetch -q --depth 1 origin 6deac9cf3ad977ae829e5bca543d553b92dd4b6d
          git -C "$RUNNER_TEMP/harbour-server" checkout -q --detach FETCH_HEAD
          export HB_PLATFORM=win HB_COMPILER=mingw HB_BUILD_CONTRIBS=no HB_BUILD_DYN=no
          mingw32-make -C "$RUNNER_TEMP/harbour-server" -j2

      - name: Build 1.09.76 serverd + worker with the mtfix88 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(cygpath -u "$RUNNER_TEMP/winlibs/mingw32/bin"):$PATH"
          HB="$(cygpath -m "$RUNNER_TEMP/harbour-server")"
          cmake -S . -B build-bisect -G Ninja \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0600 \
            -DCMAKE_SHARED_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DOPENADS_BUILD_TESTS=OFF \
            -DOPENADS_WITH_HTTP=OFF \
            -DOPENADS_WITH_TLS=ON \
            -DOPENADS_VERSION_FORCE=1.09.76-bisect-tc88 \
            -DOPENADS_WITH_HARBOUR_UDF=ON \
            -DHARBOUR_COMPILER="$HB/bin/win/mingw/harbour.exe" \
            -DHARBOUR_INCLUDE_DIR="$HB/include" \
            -DHARBOUR_LIB_DIR="$HB/lib/win/mingw" \
            -DOPENADS_HARBOUR_LIBS="hbvmmt;hbrtl;hbmacro;hbpcre;hblang;hbcpage;hbrdd;rddfpt;rddntx;hbsix;hbcommon" \
            -DOPENADS_WARNINGS_AS_ERRORS=OFF
          cmake --build build-bisect --target openads_serverd openads_auth_worker -j2
          ls -la build-bisect/tools/serverd/openads_serverd.exe build-bisect/tools/serverd/openads_auth_worker.exe

      - name: Fetch mtfix88 kit (probe import lib + client DLL)
        shell: bash
        run: |
          set -euxo pipefail
          T=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$T/kits" && cd "$T/kits"
          curl -fL --retry 3 -o mtfix88.zip "https://github.com/bedipritpal/OpenADS/releases/download/v1.09.75-mtfix88-full-test/mtfix88-full-x64.zip"
          unzip -q mtfix88.zip -d x88

      - name: Build probe client against the mtfix88 import lib
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(cygpath -u "$RUNNER_TEMP/winlibs/mingw32/bin"):$PATH"
          T=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$T/p88/include/openads" "$T/p88/lib"
          cp "$T/kits/x88/mtfix88-x64/include/ace.h" "$T/p88/include/openads/ace.h"
          cp "$T/kits/x88/mtfix88-x64/lib/libopenace64.dll.a" "$T/p88/lib/"
          curl -fL -o "$T/daemon_probe.cpp" "https://raw.githubusercontent.com/bedipritpal/OpenADS/test/10976-session-probe/tests/ci/session-probe/daemon_probe.cpp"
          g++ -O1 -static-libgcc -static-libstdc++ -D_WIN32_WINNT=0x0600 -I"$T/p88/include" "$T/daemon_probe.cpp" -o "$T/p88/daemon_probe.exe" -L"$T/p88/lib" -lopenace64

      - name: Run challenge-auth leg against the bisect server (service mode)
        shell: bash
        run: |
          set -u
          set +e
          T=$(cygpath -u "$RUNNER_TEMP")
          echo '' | base64 -d > "$T/test_only.hrb"
          HRBW=$(cygpath -m "$T/test_only.hrb")
          icacls "$HRBW" //inheritance:r //grant:r "Administrators:F" "SYSTEM:F"
          work="$T/run/bisect"; rm -rf "$work"; mkdir -p "$work/data"
          WM=$(cygpath -m "$work")
          cp "$T/p88/daemon_probe.exe" "$work/probe.exe"
          cp "$T/kits/x88/mtfix88-x64/bin/openace64.dll" "$work/"
          cp build-bisect/tools/serverd/openads_serverd.exe "$work/"
          cp build-bisect/tools/serverd/openads_auth_worker.exe "$work/"
          args="--host 127.0.0.1 --port 16291 --data $WM/data --auth_user usr:pw --auth_module $HRBW"
          url="auth://127.0.0.1:16291/$WM/data"
          sc stop openads_serverd > /dev/null 2>&1
          sc delete openads_serverd > /dev/null 2>&1
          sleep 1
          ( cd "$work" && ./openads_serverd.exe --install_service $args > install.log 2>&1 )
          sc start openads_serverd >> "$work/install.log" 2>&1
          started=0
          for i in $(seq 1 60); do
            netstat -ano | grep "TCP" | grep "LISTENING" | grep -q ":16291 " && { started=1; break; }
            sleep 1
          done
          if [ "$started" = "1" ]; then
            ( cd "$work" && ./probe.exe "$url" > probe.log 2>&1 ); rc=$?
          else
            echo "SERVER FAILED TO START" > "$work/probe.log"; rc=3
          fi
          sc stop openads_serverd > /dev/null 2>&1
          sleep 3
          ( cd "$work" && ./openads_serverd.exe --uninstall_service >> install.log 2>&1 )
          echo "--- install.log:"
          cat "$work/install.log"
          echo "--- probe.log:"
          cat "$work/probe.log"
          if tail -1 "$work/probe.log" | grep -q "ALL PASS"; then
            verdict="BISECT PASS: 1.09.76 source + mtfix88 toolchain works -> the shipped 1.09.76 toolchain/Harbour is the cause"
          else
            verdict="BISECT FAIL: 1.09.76 source + mtfix88 toolchain also fails -> a source delta is the cause"
          fi
          echo "$verdict"
          { echo "# Bisect result"; echo; echo "$verdict"; } >> "$GITHUB_STEP_SUMMARY"
