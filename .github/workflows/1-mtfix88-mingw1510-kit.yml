        #include "hbcurl.ch"
        PROCEDURE Main()
           LOCAL h
           curl_global_init()
           h := curl_easy_init()
           curl_easy_setopt( h, HB_CURLOPT_URL, "https://example.com/" )
           curl_easy_setopt( h, HB_CURLOPT_DL_BUFF_SETUP )
           ? curl_easy_perform( h )
           ? SSL_INIT(), OpenSSL_version()
           RETURN
        PRG
        WHOLE="$(cygpath -m "$PWD/../hbssl-old/libhbssl-x86.a")"
        "$HBMK" t1.prg -plat=win -comp=mingw -ot1 -L../hbssl-old -L"$P/lib" -lhbssl-x86 -lssl -lcrypto -lz "-ldflag=-Wl,--whole-archive,$WHOLE,--no-whole-archive" -lws2_32 -lcrypt32
        ./t1.exe | tee t1-proof.txt
        grep -q "OpenSSL 3.5.9" t1-proof.txt
        grep -q 419 t1-proof.txt
        "$HBMK" t2.prg -plat=win -comp=mingw -ot2 -I../work/hbsrc/contrib/hbcurl -L../hbcurl-out -L../hbssl-old -L"$P/lib" -lhbcurls -lhbssl-x86 -lcurl -lssh2 -lssl -lcrypto -lnghttp2 -lbrotlidec-static -lbrotlienc-static -lbrotlicommon-static -lzstd -lz "-ldflag=-Wl,--whole-archive,$WHOLE,--no-whole-archive" -lws2_32 -lcrypt32 -lwldap32 -lbcrypt
        objdump -p t2.exe | grep -i 'DLL Name' | tee t2-pe.txt
        if grep -Ei 'DLL Name:.*(libssl|libcrypto|libcurl|nghttp2|ssh2|brotli|zstd|libstdc|libgcc|libwinpthread).*\.dll' t2-pe.txt;then exit 1;fi
        ./t2.exe | tee t2-proof.txt
        head -1 t2-proof.txt | grep -q '^ *0'
        grep -q "OpenSSL 3.5.9" t2-proof.txt
    - name: Package the family kit
      shell: bash
      run: |
        set -euxo pipefail
        P="$(cygpath -u "$PWD/out")"
        K="$(cygpath -u "$PWD/openssl-curl-mingw10-x86")"
        mkdir -p "$K/lib" "$K/include" "$K/harbour-hbcurl" "$K/test" "$K/bin"
        cp "$P/lib/"*.a "$K/lib/"
        cp -r "$P/include/"* "$K/include/"
        rm -rf "$K/include/nghttp2/"*.in 2>/dev/null || true
        cp hbcurl-out/libhbcurls.a "$K/harbour-hbcurl/"
        cp work/hbsrc/contrib/hbcurl/hbcurl.ch work/hbsrc/contrib/hbcurl/hbcurl.hbx "$K/harbour-hbcurl/"
        cp "$P/LEGACY-SYMBOLS.txt" "$K/"
        cp lt/t1.prg "$K/test/test_hbssl.prg"; cp lt/t2.prg "$K/test/test_https.prg"
        cp lt/t1-proof.txt lt/t2-proof.txt lt/missing.txt "$K/test/" 2>/dev/null || true
        cp "$P/bin/curl.exe" "$K/bin/" || true
        cat > "$K/README.txt" <<'NOTES'
        Static OpenSSL + CURL kit for MinGW-w64 x86 - modernized rebuild
        Versions: OpenSSL 3.5.9 (latest release of the 3.5 LTS line, the same line the
        2026-10-10 kit was built on; upstream release list checked 2026-11-21),
        curl 8.23.0, libssh2 1.11.1, nghttp2 1.71.0, brotli 1.2.1 (plain and -static names),
        zstd 1.5.7, zlib 1.4. Built with GCC 10.2.0 i686 MSVCRT posix dwarf (winlibs 10.2.0, the mtfix88 CI pin).
        Use this set with the existing world: HbQt static builds via MinGW 4.9.2,
        Vouch on D:\mingw32 (GCC 10.2). These libraries are MSVCRT, the same CRT
        family and the same recipe as the 2026-10-10 kit, with modernized versions.
        Same CRT plus same recipe is necessary, not sufficient: CI proves old-hbssl
        symbol coverage and a live HTTPS fetch on a clean runner, but your actual
        Vouch/HbQt link is the final proof and is yours. Keep the backup of the
        replaced files.

        The stock libhbssl.a keeps working: OpenSSL 3.x no longer exports the old function
        names it calls (EVP_CIPHER_nid, EVP_MD_size, EVP_PKEY_size, ...), so libcrypto.a in
        this kit carries a small merged compat object (ossl_legacy.o) that provides them as
        tail-jump wrappers to the renamed 3.x functions. No hbssl recompile, no link-line
        change. The exact symbol list is in LEGACY-SYMBOLS.txt. The old->new pairs are
        not invented: they are copied from OpenSSL 3.5.9's own headers (its
        include/openssl/evp.h itself defines EVP_CIPHER_nid as EVP_CIPHER_get_nid,
        EVP_MD_size as EVP_MD_get_size, EVP_PKEY_size as EVP_PKEY_get_size, and so
        on); the merged object only materializes those header aliases as linkable
        symbols, filtered to pairs whose new name exists in the built libraries.
        The semantics are OpenSSL's own.

        Install: copy lib\*.a and include\* into the toolchain's lib/include folders (keep
        a backup of the replaced files). Link exactly as your current working build links.
        For reference, the CI proof invoked hbmk2 with: -lhbcurls -lhbssl-x86 -lcurl
        -lssh2 -lssl -lcrypto -lnghttp2 -lbrotlidec-static -lbrotlienc-static
        -lbrotlicommon-static -lzstd -lz -lws2_32 -lcrypt32 -lwldap32 -lbcrypt (that
        tested invocation needed -lbcrypt for curl's BCryptGenRandom; hbmk2 adds the
        other Windows libs itself). Define CURL_STATICLIB when compiling against
        include\curl (harbour-hbcurl\libhbcurls.a is already built with it; hbcurl.ch and
        hbcurl.hbx included). bin\curl.exe is the static curl tool. test\ holds the two
        sample programs CI linked AND RAN against this exact kit: test_hbssl.prg prints the
        OpenSSL version through the old-name shim; test_https.prg fetches https://example.com/
        through hbcurl with the whole family linked in.

        CI proof (this kit): old-style hbssl (compiled against OpenSSL 1.1.1w headers, the
        same raw old-name references as the stock libhbssl.a) links with zero undefined
        OpenSSL symbols; both sample programs ran on the GitHub Windows runner against this
        exact build. First run inside a real Vouch/B_BIG build is still yours.

        NOTES
        (cd "$K" && find . -type f -exec sha256sum {} \;) > "$K/SHA256.txt"
        7z a -tzip "openssl-curl-mingw10-x86-ossl35.zip" "./openssl-curl-mingw10-x86"
        sha256sum "openssl-curl-mingw10-x86-ossl35.zip"
    - uses: actions/upload-artifact@v4
      with:
        name: part-deps-mingw10
        path: openssl-curl-mingw10-x86-ossl35.zip
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        if-no-files-found: warn
        name: deps-mingw10-proof
        path: |
          lt/
          legacy2.txt
          u.txt
          d2.txt
          missing.txt
        retention-days: 14
  publish:
    name: Publish the prerelease with the three kits
    runs-on: windows-2022
    needs: [kitx86, depsucrt, depsmsvcrt]
    if: ${{ inputs.publish }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: part-*
        path: dist
        merge-multiple: true
    - name: Draft the release notes
      shell: bash
      run: |
        set -euxo pipefail
        cat > notes.md <<'NOTES'
        Prerelease: mtfix88 x86 client kit rebuilt on MinGW GCC 15.1 UCRT, plus the
        modernized static OpenSSL/CURL dependency family in both CRT worlds.

        Assets:
        - mtfix88-mingw1510-x86.zip: the mtfix88 x86 client kit (openace32.dll,
          import library, librddads.a, headers, docs, fixtures, runtime notices)
          built with winlibs GCC 15.1.0 UCRT + Antonio's harbour_mingw1510_32_20260404.
          CI proofs: twenty threaded B_BIG integrity fixtures PASS, TCP
          CopyFile/FCopyFile PASS, vf87 family + fs_args88 PASS, BeginAuth/
          CompleteAuth smoke + auth static fixture PASS, auth-probe.hrb compiled,
          Harbour peer refresh PASS, matched DLL export check + old-DLL guard PASS.
          The full unit suite is NOT rerun under GCC 15.1; qt492 mtfix88 stays the
          published verified runtime.
        - openssl-curl-mingw1510-x86-ossl35.zip: static OpenSSL 3.5.9 + curl 8.23.0
          family built with GCC 15.1 UCRT, for the C:\mingw32_15 + C:\harbour-bin
          world. Includes the merged legacy-symbol shim so stock libhbssl.a keeps
          linking (see README + LEGACY-SYMBOLS.txt inside). Do not mix into Qt 4.9.
        - openssl-curl-mingw10-x86-ossl35.zip: the same family built with the mtfix88
          CI toolchain (GCC 10.2 MSVCRT): same CRT family and same recipe as the
          2026-10-10 kit with modernized versions, for the HbQt static / Qt 4.9 /
          Vouch world. CI proves old-hbssl symbol coverage and a live HTTPS fetch;
          the actual Vouch link is the final proof and stays with the owner.

        Reproducibility: every dependency is a hash-pinned download; the workflow
        file is the recipe.
        NOTES
        sed -i 's/^        //' notes.md
        (cd dist && sha256sum *.zip) | tee dist/SHA256SUMS.txt
    - name: Create the prerelease
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euxo pipefail
        gh release create v1.09.75-mtfix88-mingw1510 --prerelease --latest=false --target ${{ github.sha }} --title 'mtfix88 mingw1510 (GCC 15.1 UCRT) kit + modernized OpenSSL/CURL deps' --notes-file notes.md dist/*.zip dist/SHA256SUMS.txt
        gh release view v1.09.75-mtfix88-mingw1510
