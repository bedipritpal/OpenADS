        seen={};errors=[]
        for first in range(1,count+1,25):
         xml=out/('unit-'+str(first)+'.xml');log=out/('unit-'+str(first)+'.txt')
         args=[exe,'-tce=*[slow]*,*flaky*','--first='+str(first),'--last='+str(first+24),'--reporters=xml','--out='+str(xml.resolve())]
         try:
          with log.open('w',encoding='utf-8') as f:r=subprocess.run(args,stdout=f,stderr=subprocess.STDOUT,timeout=180)
          doc=ET.parse(xml)
          cases=[c for c in doc.iter('TestCase') if c.get('skipped')!='true']
          assert cases,(first,'No executed cases')
          for c in cases:
           result=c.find('OverallResultsAsserts');ok=result is not None and result.get('test_case_success')=='true'
           name=c.get('name');assert name not in seen,(first,'duplicate',name)
           seen[name]={'passed':ok,'assertions':dict(result.attrib) if result is not None else {},'file':pathlib.Path(c.get('filename')).name}
          if r.returncode and all(v['passed'] for c in cases for v in [seen[c.get('name')]]):errors.append('Nonzero batch exit '+str(first))
         except Exception as e:errors.append(str(first)+': '+repr(e))
         print('Batch',first,'complete; cases',len(seen),'errors',len(errors),flush=True)
        summary={'count':count,'executed':len(seen),'failed':sorted(n for n,v in seen.items() if not v['passed']),'errors':errors,'cases':seen}
        if len(seen)!=count:summary['errors'].append('Coverage mismatch')
        (out/'unit-summary.json').write_text(json.dumps(summary,indent=2))
        (out/'unit-batch-summary.txt').write_text('registered='+str(count)+' executed='+str(len(seen))+' failed='+str(len(summary['failed']))+' harness_errors='+str(len(summary['errors']))+'\n'+'\n'.join(summary['failed'])+'\n'+'\n'.join(summary['errors']),encoding='utf-8')
        print((out/'unit-batch-summary.txt').read_text(encoding='utf-8'),flush=True)
        import base64,zlib
        expected=json.loads(zlib.decompress(base64.b64decode('')))
        assert not summary['errors'],summary['errors']
        # Gate: zero failing cases and zero harness errors on the GCC 15.1 binaries.
        # The old mtfix62 197-name failure set is kept only as a non-gating historical diagnostic.
        assert not summary['failed'],summary['failed']
