name: Publish UNMERGED external PSK spike for owner review
on:
  push:
    branches: [security/tls13-psk-native]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: spike-unmerged/tls13-external-psk
          fetch-depth: 0
      - name: Apply exact isolated spike, never main
        shell: bash
        run: |
          set -euo pipefail
          echo  > /tmp/spike.b64
          python3 -c "import base64,gzip,pathlib;pathlib.Path('/tmp/spike.patch').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path('/tmp/spike.b64').read_text())))"
          echo '4cee781f2356f67114c5c0047fd0362a1b74965bd66376f7159a449ba0465def  /tmp/spike.patch' | sha256sum -c -
          test "$(git rev-parse HEAD)" = 66b50546939e74916cee845b09ed6fab2fcf82df
          git apply --check --index /tmp/spike.patch
          git apply --index /tmp/spike.patch
          git checkout -B spike-unmerged/tls13-external-psk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'UNMERGED PSK spike: native protected-file proof and matched timings; no release'
          git push origin HEAD:refs/heads/spike-unmerged/tls13-external-psk
