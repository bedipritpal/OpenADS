        cp output/openace32.dll output/import-new/
        (cd output/import-new && ./probe.exe) | tee output/import-proof.txt
        python - <<'PYOLD'
        import hashlib,pathlib,urllib.request,zipfile,io,os
        u='https://api.github.com/repos/bedipritpal/OpenADS/releases/assets/722812042'
        b=urllib.request.urlopen(urllib.request.Request(u,headers={'Accept':'application/octet-stream','Authorization':'Bearer '+os.environ['GH_TOKEN']}),timeout=120).read()
        assert hashlib.sha256(b).hexdigest()=='f1281ea85425288b0bcf470183dd6d7ee6a7030ea82dff9a673a095e04cf8ee0'
        z=zipfile.ZipFile(io.BytesIO(b));n=[n for n in z.namelist() if n.endswith('/bin/openace32.dll')];assert len(n)==1,n
        pathlib.Path('output/import-old/openace32.dll').write_bytes(z.read(n[0]))
        PYOLD
        cp output/import-new/probe.exe output/import-old/
        python - <<'PYLOAD'
        import ctypes,pathlib,subprocess
        ctypes.windll.kernel32.SetErrorMode(3)
        p=pathlib.Path('output/import-old').resolve()
        r=subprocess.run([str(p/'probe.exe')],cwd=p,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=20)
        assert r.returncode!=0,(r.returncode,r.stdout)
        pathlib.Path('output/old-dll-guard.txt').write_text('Unsupported oldDLL/newimport missing-export failure: '+str(r.returncode)+'\n')
        print('OLD-DLL-MISSING-EXPORT-PASS',r.returncode)
        PYLOAD
