    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: release/mtfix70-full
    - name: Verify cumulative candidate pin and workflow-only build recipe
      shell: bash
      run: |
        set -euxo pipefail
        test "$GITHUB_REF" = refs/heads/release/mtfix70-full
        git merge-base --is-ancestor 933288c10e09f3a8008ccaab02724c87a2171a49 HEAD
        test -z "$(git diff --name-only 933288c10e09f3a8008ccaab02724c87a2171a49 HEAD -- . ':!.github/workflows')"
    - name: Prefetch identical hash-pinned dependency archives via alternate transport
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PYDEPS'
        import hashlib,pathlib,tarfile,urllib.request,time
        items=[('zlib','https://zlib.net/fossils/zlib-1.3.1.tar.gz','9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23'),('nlohmann_json','https://codeload.github.com/nlohmann/json/tar.gz/refs/tags/v3.11.3','0d8ef5af7f9794e3263480193c491549b2ba6cc74bb018906202ada498a79406'),('cpp_httplib','https://codeload.github.com/yhirose/cpp-httplib/tar.gz/refs/tags/v0.18.5','731190e97acd63edce57cc3dacd496f57e7743bfc7933da7137cb3e93ec6c9a0')]
        for name,url,sha in items:
         for attempt in range(3):
          try:
           body=urllib.request.urlopen(url,timeout=60).read();assert hashlib.sha256(body).hexdigest()==sha;break
          except Exception:
           if attempt==2:raise
           time.sleep(3)
         archive=pathlib.Path(name+'.tar.gz');archive.write_bytes(body)
         dest=pathlib.Path('third_party')/name;dest.mkdir(parents=True,exist_ok=True)
         with tarfile.open(archive) as z:
          for member in z.getmembers():
           parts=pathlib.PurePosixPath(member.name).parts[1:]
           if not parts:continue
           assert '..' not in parts
           member.name=str(pathlib.PurePosixPath(*parts));z.extract(member,dest)
         print(name,sha,'verified')
        PYDEPS
    - name: Download pinned Winlibs GCC 10.2 x86_64 (same GCC version as the x86 kit)
      env:
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: |
        Invoke-WebRequest -Headers @{Accept='application/octet-stream';Authorization="Bearer $env:GH_TOKEN"} 'https://api.github.com/repos/brechtsanders/winlibs_mingw/releases/assets/32966472' -OutFile "$env:RUNNER_TEMP/winlibs64.7z"
        if((Get-FileHash "$env:RUNNER_TEMP/winlibs64.7z" -Algorithm SHA256).Hash.ToLower() -ne '1e525afc8a3362a1054d7a9a44c8f496a7a652b224b79dbf4b6e5ca8c1012b74'){throw 'Winlibs x64 hash mismatch'}
        & 7z x "$env:RUNNER_TEMP/winlibs64.7z" "-o$env:RUNNER_TEMP/winlibs64" -y
    - name: Build Harbour (x64) and the x64 engine, DLL, server and auth worker
      shell: bash
      run: |
        set -euxo pipefail
        export PATH="$(cygpath -u "$RUNNER_TEMP/winlibs64/mingw64/bin"):$PATH"
        test "$(gcc -dumpversion)" = 10.2.0
        gcc -dumpmachine
        git clone https://github.com/harbour/core.git "$RUNNER_TEMP/harbour-x64"
        git -C "$RUNNER_TEMP/harbour-x64" checkout --detach 6deac9cf3ad977ae829e5bca543d553b92dd4b6d
        export HB_PLATFORM=win HB_COMPILER=mingw64 HB_BUILD_CONTRIBS=no HB_BUILD_DYN=no
        mingw32-make -C "$RUNNER_TEMP/harbour-x64" -j2
        HB="$(cygpath -m "$RUNNER_TEMP/harbour-x64")"
        ls "$HB/lib/win/" || true
        HBLIB="$RUNNER_TEMP/harbour-x64/lib/win/mingw64"
        HBBIN="$RUNNER_TEMP/harbour-x64/bin/win/mingw64"
        test -f "$HBBIN/harbour.exe"
        printf '\nif(WIN32 AND MINGW)\n set_target_properties(openads_ace PROPERTIES PREFIX "")\nendif()\n' >> src/CMakeLists.txt
        cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DFETCHCONTENT_SOURCE_DIR_NLOHMANN_JSON="$PWD/third_party/nlohmann_json" -DFETCHCONTENT_SOURCE_DIR_CPP_HTTPLIB="$PWD/third_party/cpp_httplib" -S . -B build-x64 -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0600 \
          -DCMAKE_SHARED_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
          -DOPENADS_BUILD_TESTS=OFF -DOPENADS_WITH_HTTP=OFF -DOPENADS_WITH_TLS=ON \
          -DOPENADS_VERSION_FORCE=1.09.75-mtfix75-full-test -DOPENADS_AUTH_CAPACITY_TEST_SWITCH=OFF \
          -DOPENADS_WITH_HARBOUR_UDF=ON -DHARBOUR_COMPILER="$(cygpath -m "$HBBIN")/harbour.exe" \
          -DHARBOUR_INCLUDE_DIR="$HB/include" -DHARBOUR_LIB_DIR="$(cygpath -m "$HBLIB")" \
          -DOPENADS_HARBOUR_LIBS="hbvmmt;hbrtl;hbmacro;hbpcre;hblang;hbcpage;hbrdd;rddfpt;rddntx;hbsix;hbcommon" \
          -DOPENADS_WARNINGS_AS_ERRORS=OFF
        cmake --build build-x64 --target openads_ace openads_serverd openads_auth_worker -j2
        find build-x64 -name '*.dll' -o -name '*.exe' -o -name '*.dll.a' | sort
    - name: Verify the binaries are 64-bit and the server starts
      shell: bash
      run: |
        set -euxo pipefail
        export PATH="$(cygpath -u "$RUNNER_TEMP/winlibs64/mingw64/bin"):$PATH"
        mkdir -p output
        for f in build-x64/src/openace64.dll build-x64/tools/serverd/openads_serverd.exe build-x64/tools/serverd/openads_auth_worker.exe; do
          test -f "$f"
          objdump -f "$f" | tee -a output/pe-check.txt
