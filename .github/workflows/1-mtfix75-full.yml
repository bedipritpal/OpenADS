    name: Build macOS universal server kit
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: release/mtfix70-full
    - name: Verify cumulative candidate pin and workflow-only build recipe
      run: |
        set -euxo pipefail
        test "$GITHUB_REF" = refs/heads/release/mtfix70-full
        git merge-base --is-ancestor 933288c10e09f3a8008ccaab02724c87a2171a49 HEAD
        test -z "$(git diff --name-only 933288c10e09f3a8008ccaab02724c87a2171a49 HEAD -- . ':!.github/workflows')"
      shell: bash
    - name: Prefetch identical hash-pinned dependency archives via alternate transport
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PYDEPS'
        import hashlib,pathlib,tarfile,urllib.request,time
        items=[('zlib','https://zlib.net/fossils/zlib-1.3.1.tar.gz','9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23'),('nlohmann_json','https://codeload.github.com/nlohmann/json/tar.gz/refs/tags/v3.11.3','0d8ef5af7f9794e3263480193c491549b2ba6cc74bb018906202ada498a79406'),('cpp_httplib','https://codeload.github.com/yhirose/cpp-httplib/tar.gz/refs/tags/v0.18.5','731190e97acd63edce57cc3dacd496f57e7743bfc7933da7137cb3e93ec6c9a0')]
        for name,url,sha in items:
         for attempt in range(3):
          try:
           body=urllib.request.urlopen(url,timeout=60).read();assert hashlib.sha256(body).hexdigest()==sha;break
          except Exception:
           if attempt==2:raise
           time.sleep(3)
         archive=pathlib.Path(name+'.tar.gz');archive.write_bytes(body)
         dest=pathlib.Path('third_party')/name;dest.mkdir(parents=True,exist_ok=True)
         with tarfile.open(archive) as z:
          for member in z.getmembers():
           parts=pathlib.PurePosixPath(member.name).parts[1:]
           if not parts:continue
           assert '..' not in parts
           member.name=str(pathlib.PurePosixPath(*parts));z.extract(member,dest)
         print(name,sha,'verified')
        PYDEPS
    - name: Record supported runner and compiler provenance
      run: |
        set -euo pipefail
        sw_vers
        xcodebuild -version
        clang --version
        xcrun --show-sdk-path
        test "$(uname -m)" = x86_64
        test -f third_party/minizip/zip.h
        printf '#include "zip.h"\n' | clang++ -x c++ -E -I"$PWD/third_party/minizip" - | grep "third_party/minizip/zip.h"
      shell: bash
    - name: Install exact Ninja1.12.1 via verified API asset
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        curl --fail --location --retry 3 --header 'Accept: application/octet-stream' --header "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/ninja-build/ninja/releases/assets/167333196 -o "$RUNNER_TEMP/ninja.zip"
        echo '89a287444b5b3e98f88a945afa50ce937b8ffd1dcc59c555ad9b1baf855298c9  '"$RUNNER_TEMP/ninja.zip" | shasum -a 256 -c -
        mkdir -p "$RUNNER_TEMP/ninja-exact"
        unzip "$RUNNER_TEMP/ninja.zip" -d "$RUNNER_TEMP/ninja-exact"
        chmod +x "$RUNNER_TEMP/ninja-exact/ninja"
        test "$("$RUNNER_TEMP/ninja-exact/ninja" --version)" = 1.12.1
        echo "$RUNNER_TEMP/ninja-exact" >> "$GITHUB_PATH"
    - name: Configure
      run: |+
        cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DFETCHCONTENT_SOURCE_DIR_NLOHMANN_JSON="$PWD/third_party/nlohmann_json" -DFETCHCONTENT_SOURCE_DIR_CPP_HTTPLIB="$PWD/third_party/cpp_httplib" --preset default \
              -DOPENADS_WITH_TLS=ON \
              -DOPENADS_WITH_HTTP=ON \
              -DOPENADS_VERSION_FORCE=$KIT_VERSION \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_CXX_FLAGS="-I$PWD/third_party/minizip"

      shell: bash
    - name: Build
      run: cmake --build build/default --config Release --parallel 3
      shell: bash
    - name: Test
      run: ctest --test-dir build/default --output-on-failure -C Release
      shell: bash
      timeout-minutes: 25
    - name: Stage and verify macOS kit
      run: |
        set -euxo pipefail
        STAGE="openads-$KIT_VERSION-macos-universal"
        B=build/default
        mkdir -p "$STAGE"
        for f in "$B"/src/libopenace64*.dylib; do
          [ -e "$f" ] || continue
          cp "$f" "$STAGE/"
          cp "$f" "$STAGE/$(basename "$f" | sed 's/libopenace64/libace64/')"
        done
        cp "$B"/tools/serverd/openads_serverd "$STAGE/"
        if [ -e "$B"/tools/serverd/openads_auth_worker ]; then cp "$B"/tools/serverd/openads_auth_worker "$STAGE/"; fi
        cp "$B"/tools/bench/openads_bench "$STAGE/"
        cp LICENSE NOTICE README.md openads.ini.sample "$STAGE/"
        mkdir -p "$STAGE/include/openads"
        cp include/openads/ace.h "$STAGE/include/ace.h"
        cp include/openads/ace.h include/openads/error.h include/openads/openads_sql.h include/openads/platform.h include/openads/version.h "$STAGE/include/openads/"
        mkdir -p "$STAGE/contrib/oads_hb"
        cp contrib/oads_hb/oads_hb.c contrib/oads_hb/oads_stats_display.prg contrib/oads_hb/README.md "$STAGE/contrib/oads_hb/"
        cp docs/diagnostics-gate.md "$STAGE/"
        echo "$PINNED_SOURCE" > "$STAGE/source-commit.txt"
        { sw_vers; xcodebuild -version; clang --version; echo "deployment target: $MACOSX_DEPLOYMENT_TARGET; universal arm64+x86_64"; } > "$STAGE/build-provenance.txt"
        for bin in "$STAGE/openads_serverd" "$STAGE/openads_bench" "$STAGE"/*.dylib; do
          lipo "$bin" -verify_arch arm64 x86_64
          for arch in arm64 x86_64; do
            xcrun vtool -show-build -arch "$arch" "$bin" | tee /tmp/build-command.txt
            grep -Eq 'minos[[:space:]]+14\.0' /tmp/build-command.txt
            otool -arch "$arch" -L "$bin" | tee /tmp/dependencies.txt
            if grep -E '/(opt/homebrew|usr/local|Users/runner|Applications/Xcode)' /tmp/dependencies.txt; then exit 1; fi
          done
        done
        nm -gU "$STAGE/libopenace64.dylib" | grep AdsFlushPendingFields
        cp release-notes-1.09.75-mtfix75.md "$STAGE/"
        (cd "$STAGE" && find . -type f ! -name SHA256SUMS | sort | xargs shasum -a 256 > SHA256SUMS)
        tar czf "$STAGE.tar.gz" "$STAGE"
        shasum -a 256 "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
        cat "$STAGE.tar.gz.sha256"
        tar tzf "$STAGE.tar.gz" | grep -q "/openads_serverd$"
        "$STAGE/openads_serverd" --version | tee server-version.txt
        grep -q "$KIT_VERSION" server-version.txt
        lipo -info "$STAGE/openads_serverd" | tee lipo.txt
        grep -q arm64 lipo.txt
        grep -q x86_64 lipo.txt
      shell: bash
    - uses: actions/upload-artifact@v4
      with:
        name: kit-macos
        path: |
          openads-1.09.75-mtfix75-full-test-macos-universal.tar.gz
          openads-1.09.75-mtfix75-full-test-macos-universal.tar.gz.sha256
