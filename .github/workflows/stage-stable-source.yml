name: Stage reviewed stable source (no tag or release)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'bedipritpal/OpenADS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage exact candidate with workflows preserved pending web review
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-remote origin refs/heads/release/1.09.74-stable)"
          test -z "$(git ls-remote origin refs/tags/v1.09.74)"
          fork=$(git rev-parse HEAD)
          git fetch https://github.com/FiveTechSoft/OpenADS.git 383dac64933db2e8eba0efaa0f96967f1ae4c99f
          git checkout -b release/1.09.74-stable 383dac64933db2e8eba0efaa0f96967f1ae4c99f
          base64 -d > "$RUNNER_TEMP/candidate.patch" <<'REVIEWED_PATCH'
          
          REVIEWED_PATCH
          echo "c10697ff4b4305128e91c3376955720c975b22629ba126b61470573da27de593  $RUNNER_TEMP/candidate.patch" | sha256sum -c --strict
          git apply --index "$RUNNER_TEMP/candidate.patch"
          test "$(git write-tree)" = c160c4587a29ae8952431231cd81d38ee52e71b6
          git reset --hard "$fork"
          git read-tree --reset -u c160c4587a29ae8952431231cd81d38ee52e71b6
          git restore --source "$fork" --staged --worktree .github/workflows
          git config user.name 'Pritpal Bedi'
          git config user.email 'bedipritpal@users.noreply.github.com'
          git commit -m 'Stage reviewed 1.09.74 source; workflow alignment pending'
          git push origin HEAD:refs/heads/release/1.09.74-stable
