name: Windows TLS portability review TEST ONLY
on:
  push:
    branches: [stage6/windows-tls-min-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-tls:
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [msvc-x86, msvc-x64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Configure release-route TLS and HTTP
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset '${{ matrix.preset }}' \
            -DOPENADS_WITH_TLS=ON -DOPENADS_WITH_HTTP=ON \
            -DOPENADS_VERSION_FORCE="1.09.75-windows-tls-review"
      - name: Build release-route targets
        run: cmake --build build/${{ matrix.preset }} --config Release --parallel 2
      - name: Existing CTest selection without added exclusions
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/${{ matrix.preset }} --output-on-failure -C Release 2>&1 | tee windows-tls-ctest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-tls-${{ matrix.preset }}
          path: |
            windows-tls-ctest.txt
            build/${{ matrix.preset }}/Testing/Temporary/
            build/${{ matrix.preset }}/CMakeCache.txt
            build/${{ matrix.preset }}/src/Release/openace*.dll
