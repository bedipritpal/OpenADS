        \ \\\n  -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0600 \\\n  -DCMAKE_SHARED_LINKER_FLAGS=\"\
