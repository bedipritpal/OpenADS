name: temporary mtfix21 header packaging repair
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mtfix21-header-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/safe-local-answers
          fetch-depth: 0
      - name: Verify, land packaging fix, refresh existing archives
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expected=adf8aa5eb0b5602b7fa21e46d48e702d610eedb5
          tag=v1.09.70-mtfix21
          test "$(git rev-parse HEAD^)" = "$expected"
          test "$(git ls-remote origin refs/tags/$tag | cut -f1)" = "$expected"
          gh release view "$tag" --json isPrerelease,isDraft --jq 'select(.isPrerelease == true and .isDraft == false)' > before.json
          test -s before.json
          test "$(git rev-parse HEAD^{tree})" = 80bb40178a8a9064daf6a9c3522f3ca37995c8a8
          mkdir assets
          gh release download "$tag" --dir assets --pattern 'openads-*'
          sha256sum assets/*
          printf '%s' '' | base64 -d > /tmp/repack.py
          python3 /tmp/repack.py
          gh release upload "$tag" repacked/openads-1.09.70-mtfix21-windows-x86.zip --clobber
          for asset in repacked/*; do
            [[ "$asset" == *windows-x86.zip ]] && continue
            gh release upload "$tag" "$asset" --clobber
          done
          gh release view "$tag" --json isPrerelease,isDraft --jq 'select(.isPrerelease == true and .isDraft == false)' > after.json
          test -s after.json
          test "$(git ls-remote origin refs/tags/$tag | cut -f1)" = "$expected"
          sha256sum repacked/*
