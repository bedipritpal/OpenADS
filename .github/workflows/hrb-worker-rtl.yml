name: Qt4.9.2 static append threads repro TEST ONLY
'on':
  push:
    branches:
    - spike-unmerged/hrb-challenge-auth
    paths:
    - .github/workflows/hrb-worker-rtl.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
      with:
        ref: 98cebae99719c5283b33a06b32903e27ff617720
    - uses: actions/download-artifact@v4
      with:
        name: qt492-capacity-static-proof
        path: kit
        run-id: 38361406991
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@v4
      with:
        name: hrb-auth-capacity-test-x86
        path: input
        run-id: 38274919983
        github-token: ${{ github.token }}
    - name: Download exact historical Qt compiler
      shell: pwsh
      run: 'Invoke-WebRequest ''https://download.qt.io/development_releases/prebuilt/mingw_32/i686-4.9.2-release-posix-dwarf-rt_v3-rev1.7z'' -OutFile "$env:RUNNER_TEMP/qt492.7z"

        if((Get-FileHash "$env:RUNNER_TEMP/qt492.7z" -Algorithm SHA256).Hash.ToLower() -ne ''f6de32350a28f4b6c30eec26dbfee65f112300d51e37e4d2007b0598bef9bb79''){throw ''Qt compiler hash mismatch''}

        & 7z x "$env:RUNNER_TEMP/qt492.7z" "-o$env:RUNNER_TEMP/qt492" -y

        '
    - name: Build Harbour with unchanged Qt4.9.2
      shell: bash
      run: 'set -euxo pipefail

        export PATH="$(cygpath -u "$RUNNER_TEMP/qt492/mingw32/bin"):$PATH"

        test "$(gcc -dumpversion)" = 4.9.2

        git clone https://github.com/harbour/core.git "$RUNNER_TEMP/harbour-old"

        git -C "$RUNNER_TEMP/harbour-old" checkout --detach 4ec2e154ed92757418bc30af571ab90240ab3209

        export HB_PLATFORM=win HB_COMPILER=mingw HB_BUILD_CONTRIBS=no HB_BUILD_DYN=no

        mingw32-make -C "$RUNNER_TEMP/harbour-old" -j2

        '
    - name: Write fixtures and build static probes
      shell: bash
      run: 'set -euxo pipefail

        export PATH="$(cygpath -u "$RUNNER_TEMP/qt492/mingw32/bin"):$PATH"

        HB="$(cygpath -u "$RUNNER_TEMP/harbour-old")"

        mkdir -p srv mtdata output

        cp input/hrb-auth-UNMERGED-x86/bin/*.exe input/hrb-auth-UNMERGED-x86/bin/*.dll srv/

        trap ''cat output/*build.txt 2>/dev/null || true'' ERR

        echo '''' | base64 -d > srv/test_only.hrb

        echo '''' | base64 -d > output/local_create.prg

        echo '''' | base64 -d > output/probe_mt.prg

        echo ''fd90424d94c995657b023d3427a2bd690eca35e80a4543850ec28cbcd9930526  kit/libopenace32.a'' | sha256sum -c -

        echo ''6cc3ae72c9b04c384b3f53b0e884c1715c67d4039633381cdec8c6d80d2f8eb8  kit/librddads.a'' | sha256sum -c -

        sha256sum kit/libopenace32.a kit/librddads.a > output/kit-hashes.txt

        "$HB/bin/win/mingw/hbmk2.exe" output/local_create.prg -Lkit -lrddads -lopenace32 -iinput/hrb-auth-UNMERGED-x86/include -i"$HB/contrib/rddads" -mt -gtstd -fullstatic -lws2_32 -lbcrypt -lpsapi -ooutput/local_create.exe > output/local-create-build.txt 2>&1

        "$HB/bin/win/mingw/hbmk2.exe" output/probe_mt.prg -Lkit -lrddads -lopenace32 -iinput/hrb-auth-UNMERGED-x86/include -i"$HB/contrib/rddads" -mt -gtstd -fullstatic -lws2_32 -lbcrypt -lpsapi -ooutput/probe_mt.exe > output/probe-static-build.txt 2>&1

        mkdir -p lrdd && cp kit/librddads.a lrdd/

        "$HB/bin/win/mingw/hbmk2.exe" output/probe_mt.prg input/hrb-auth-UNMERGED-x86/contrib/oads_hb.c -Llrdd -Lsrv -lrddads -lopenace32 -iinput/hrb-auth-UNMERGED-x86/include -i"$HB/contrib/rddads" -mt -gtstd -lws2_32 -lbcrypt -lpsapi -ooutput/probe_mt_dll.exe > output/probe-dll-build.txt 2>&1

        D="$(cygpath -m "$PWD/mtdata")"

        output/local_create.exe "$D" > output/local-create-run.txt 2>&1

        ls -la mtdata > output/mtdata-listing.txt

        '
    - name: Start auth server and run both probes in same process lifetime
      shell: pwsh
      run: '$hrb=(Resolve-Path srv/test_only.hrb).Path

        $me=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name

        icacls $hrb /inheritance:r /remove:g ''*S-1-3-4'' /grant:r "${me}:(F)" ''*S-1-5-18:(F)'' ''*S-1-5-32-544:(F)''

        if($LASTEXITCODE -ne 0){throw ''ACL failed''}

        $data=(Resolve-Path mtdata).Path

        $srv=(Resolve-Path srv/openads_serverd.exe).Path

        & $srv --help | Out-File srv/help.txt

        & $srv --version | Out-File srv/version.txt

        $argsLine=''--port 16262 --data ''+$data+'' --auth_module ''+$hrb

        $argsLine | Out-File srv/args.txt

        $p=Start-Process -FilePath $srv -ArgumentList $argsLine -WorkingDirectory (Split-Path $srv) -RedirectStandardOutput srv/stdout.log -RedirectStandardError srv/stderr.log -PassThru

        Get-CimInstance Win32_Process -Filter "ProcessId=$($p.Id)" | Select-Object ProcessId,CommandLine | Format-List | Out-File srv/process.txt

        $ok=$false

        for($i=0;$i -lt 60;$i++){ $c=Test-NetConnection -ComputerName 127.0.0.1 -Port 16262 -WarningAction SilentlyContinue; if($c.TcpTestSucceeded){$ok=$true;break}; Start-Sleep -Milliseconds 500 }

        if(-not $ok){ Get-Content srv/stdout.log,srv/stderr.log -ErrorAction SilentlyContinue; throw ''server did not listen'' }

        "server pid $($p.Id) listening" | Out-File srv/server-started.txt


        $data=(Resolve-Path mtdata).Path -replace ''\\'',''/''

        $url="auth://127.0.0.1:16262/$data"

        $exe=(Resolve-Path output/probe_mt.exe).Path

        $p=Start-Process -FilePath $exe -ArgumentList @($url) -RedirectStandardOutput output/static-stdout.txt -RedirectStandardError output/static-stderr.txt -PassThru

        if(-not $p.WaitForExit(240000)){ $p.Kill(); "STATIC-HUNG after 240s url=$url" | Out-File output/static-result.txt } else { "STATIC-EXIT $($p.ExitCode) url=$url" | Out-File output/static-result.txt }

        Get-Content output/static-result.txt,output/static-stdout.txt,output/static-stderr.txt


        $env:Path = (Resolve-Path srv).Path + '';'' + $env:Path

        $data=(Resolve-Path mtdata).Path -replace ''\\'',''/''

        $url="auth://127.0.0.1:16262/$data"

        $exe=(Resolve-Path output/probe_mt_dll.exe).Path

        $p=Start-Process -FilePath $exe -ArgumentList @($url) -RedirectStandardOutput output/dll-stdout.txt -RedirectStandardError output/dll-stderr.txt -PassThru

        if(-not $p.WaitForExit(240000)){ $p.Kill(); "DLL-HUNG after 240s url=$url" | Out-File output/dll-result.txt } else { "DLL-EXIT $($p.ExitCode) url=$url" | Out-File output/dll-result.txt }

        Get-Content output/dll-result.txt,output/dll-stdout.txt,output/dll-stderr.txt,srv/stdout.log,srv/stderr.log


        Get-CimInstance Win32_Process -Filter "Name=''openads_serverd.exe''" | Select-Object ProcessId,CommandLine | Format-List | Out-File srv/process-final.txt

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qt492-static-append-threads-repro
        path: 'output/

          srv/stdout.log

          srv/stderr.log

          srv/*.txt

          '
        if-no-files-found: warn
        retention-days: 14
