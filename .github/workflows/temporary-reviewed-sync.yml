name: temporary reviewed upstream sync
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reviewed-openads-working-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/safe-local-answers
          fetch-depth: 0
      - name: Merge pinned upstream and verify reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 807f0694282f65cf1876dbae5634c15e5f3d8f29
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch https://github.com/FiveTechSoft/OpenADS.git 54e237b18ebbbae5b9b93fc1dd2a8c2f81502429
          test "$(git rev-parse FETCH_HEAD)" = 54e237b18ebbbae5b9b93fc1dd2a8c2f81502429
          set +e
          git merge --no-commit --no-ff 54e237b18ebbbae5b9b93fc1dd2a8c2f81502429
          status=$?
          set -e
          test "$status" = 1
          expected=$(printf '%s\n' .github/workflows/apply-patch.yml .github/workflows/ci.yml src/abi/ace_exports.cpp src/engine/table.cpp src/network/session.cpp tests/unit/abi_remote_lock_introspection_test.cpp | sort)
          test "$(git diff --name-only --diff-filter=U | sort)" = "$expected"
          git checkout --ours .github/workflows/apply-patch.yml
          python3 - <<'PYCODE'
          import base64,zlib
          exec(zlib.decompress(base64.b64decode('')))
          PYCODE
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = 24726b65cfeb8d95562f91516d67303135de8a7a
          git commit -m 'Sync upstream main 54e237b1 into test branch; preserve mtfix20 and repair duplicate ADT source (Pritpal Bedi)'
          test "$(git rev-parse HEAD^1)" = 807f0694282f65cf1876dbae5634c15e5f3d8f29
          test "$(git rev-parse HEAD^2)" = 54e237b18ebbbae5b9b93fc1dd2a8c2f81502429
          test "$(git ls-remote origin refs/heads/perf/safe-local-answers | cut -f1)" = 807f0694282f65cf1876dbae5634c15e5f3d8f29
          git push origin HEAD:refs/heads/perf/safe-local-answers
