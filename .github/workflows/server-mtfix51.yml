name: MTFIX51 drive-only connection root test server
'on':
  push:
    branches:
    - test/auth-diagnostic-mtfix50
    paths:
    - .github/workflows/server-mtfix51.yml
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
jobs:
  proof:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
      with:
        ref: 45752b9ab4b11d7b8efb7cdea1909894006c8a6c
    - name: Reuse exact successful DLL build and proofs
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: '$ErrorActionPreference=''Stop''

        gh run download 38919695226 --repo bedipritpal/OpenADS --name mtfix50-diagnostic-results --dir output

        if($LASTEXITCODE -ne 0){throw ''build outputs download failed''}

        Invoke-WebRequest ''https://github.com/bedipritpal/OpenADS/releases/download/v1.09.74-mtfix49-mutual-auth-test/mtfix49-mutual-auth-qt492-x86.zip''
        -OutFile kit49.zip

        if((Get-FileHash kit49.zip -Algorithm SHA256).Hash.ToLower() -ne ''0dcb6fecc720eb894639e8aeeb2d1c6c2898b1e5b4e9306d9bb5e03f91c0cbf7''){throw
        ''49 kit hash mismatch''}

        Expand-Archive kit49.zip -DestinationPath matrix-kit49

        New-Item -ItemType Directory -Force kit,srv,mtdata,build-legacy/tools/serverd,matrix-client | Out-Null

        Copy-Item matrix-kit49/mtfix49-mutual-auth/lib/* kit/

        Copy-Item -Recurse matrix-kit49/mtfix49-mutual-auth/runtime-notices kit/

        Copy-Item matrix-kit49/mtfix49-mutual-auth/bin/*.exe srv/

        Copy-Item matrix-kit49/mtfix49-mutual-auth/bin/openads_auth_worker.exe build-legacy/tools/serverd/

        Copy-Item output/openace32.dll srv/

        Invoke-WebRequest ''https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z''
        -OutFile compiler.7z

        & 7z x compiler.7z (''-o''+$env:RUNNER_TEMP+''/winlibs'') -y

        if($LASTEXITCODE -ne 0){throw ''compiler extraction failed''}


        exit 0

        '
    - name: Prepare same public V1 fixture and proof sources
      shell: pwsh
      run: "$ErrorActionPreference='Stop'\n[IO.File]::WriteAllBytes((Join-Path $PWD 'auth-probe.hrb'),[Convert]::FromBase64String('wEhSQgIAAwAAAE9BRFNfQVVUSF9WMQAFAUxFTgAAAlJFUExJQ0FURQAAAgEAAABPQURTX0FVVEhfVjEAhgAAAA0AAyQCAF8CagVoYW5nAAgcByQDABn9JAYAXwJqCm1hbGZvcm1lZAAIHAgkBwB4bgckCQBfAl8Bagp0ZXN0LW9ubHkASAgcJbABAF8DDAF5DxwaJAoAahFPQVVUSAEBAwB1c3ICAHB3AG4HJAwAaghPQVVUSAEAALACAGoCAABcBAwCSG4H'))\n\
        [IO.File]::WriteAllBytes((Join-Path $PWD 'fix-hrb-acl.cmd'),[Convert]::FromBase64String(''))\n\
        [IO.File]::WriteAllBytes((Join-Path $PWD 'mtfix50-client.patch'),[Convert]::FromBase64String(''))\n\
        [IO.File]::WriteAllBytes((Join-Path $PWD 'root-table-matrix.cpp'),[Convert]::FromBase64String(''))\n\
        $path=(Resolve-Path auth-probe.hrb).Path\n$acl=New-Object System.Security.AccessControl.FileSecurity;$acl.SetAccessRuleProtection($true,$false)\n\
        $me=[System.Security.Principal.WindowsIdentity]::GetCurrent().User\nforeach($sid in @($me.Value,'S-1-5-18','S-1-5-32-544')){\n\
        \ $id=New-Object System.Security.Principal.SecurityIdentifier($sid)\n $rule=New-Object System.Security.AccessControl.FileSystemAccessRule($id,'Read','Allow');$acl.AddAccessRule($rule)\n\
        }\nSet-Acl $path $acl\nCopy-Item auth-probe.hrb matrix-test-only.hrb\nSet-Acl matrix-test-only.hrb $acl\n\
        Copy-Item output/openace32.dll matrix-client/\n& output/local_create.exe (Resolve-Path mtdata).Path\nif($LASTEXITCODE\
        \ -ne 0){throw 'table fixture setup failed'}\n\nexit 0\n"
    - name: Compile diagnostic import client
      shell: bash
      run: "set -euxo pipefail\nexport PATH=\"$(cygpath -u \"$RUNNER_TEMP/winlibs/mingw32/bin\"):$PATH\"\ncat >\
        \ output/auth-diagnostic.cpp <<'CPP'\n#include \"openads/ace.h\"\n#include <windows.h>\n#include <iostream>\n\
        #include <string>\nint main(int n,char** v){\n if(n!=4)return 2;\n HMODULE m=GetModuleHandleA(\"openace32.dll\"\
        );char path[32768]{};\n if(!m||!GetModuleFileNameA(m,path,sizeof(path)))return 3;\n std::cout<<\"LOADED-DLL=\"\
        <<path<<std::endl;\n ADSHANDLE p=0;UNSIGNED8 c[32]{};auto rc=OAdsBeginAuth(v[1],&p,c);\n UNSIGNED32 code=0;UNSIGNED8\
        \ msg[1024]{};UNSIGNED16 len=1023;\n if(rc)AdsGetLastError(&code,msg,&len);\n std::cout<<\"BEGIN=\"<<rc<<\"\
        \ MESSAGE=\"<<msg<<std::endl;\n if(rc!=static_cast<UNSIGNED32>(std::stoul(v[2])))return 4;\n if(std::string(v[3])!=\"\
        PASS\" && std::string(reinterpret_cast<char*>(msg)).find(v[3])==std::string::npos)return 5;\n if(p)OAdsCancelAuth(p);return\
        \ 0;\n}\nCPP\ng++ -std=c++17 -static -static-libgcc -static-libstdc++ -Iinclude output/auth-diagnostic.cpp\
        \ kit/libopenace32.dll.a -o output/auth-diagnostic.exe\nobjdump -p output/auth-diagnostic.exe > output/diagnostic-client-pe.txt\n\
        grep -qi 'DLL Name: openace32.dll' output/diagnostic-client-pe.txt\n\ng++ -std=c++17 -static -static-libgcc\
        \ -static-libstdc++ -Imatrix-kit49/mtfix49-mutual-auth/include root-table-matrix.cpp kit/libopenace32.dll.a\
        \ -o matrix-client/root-table-matrix.exe\n"
    - name: Apply only diagnostic base and drive-only server change
      shell: bash
      run: "set -euxo pipefail\npython - <<'PY51'\nimport base64,pathlib,subprocess\nfor n,b in [('mtfix50-client.patch',''),('mtfix51-drive-root.patch','')]:\n\
        \ pathlib.Path(n).write_bytes(base64.b64decode(b));subprocess.run(['git','apply','--check',n],check=True);subprocess.run(['git','apply',n],check=True)\n\
        PY51\n"
    - name: Build pinned Windows mtfix51 server and unit tests
      run: 'set -euxo pipefail

        export PATH="$(cygpath -u "$RUNNER_TEMP/winlibs/mingw32/bin"):$PATH"

        test "$(gcc -dumpversion)" = 10.2.0

        find "$RUNNER_TEMP/winlibs" -iname ''*copying*'' -o -iname ''*license*'' | sort

        git clone https://github.com/harbour/core.git "$RUNNER_TEMP/harbour-server"

        git -C "$RUNNER_TEMP/harbour-server" checkout --detach 6deac9cf3ad977ae829e5bca543d553b92dd4b6d

        export HB_PLATFORM=win HB_COMPILER=mingw HB_BUILD_CONTRIBS=no HB_BUILD_DYN=no

        mingw32-make -C "$RUNNER_TEMP/harbour-server" -j2

        HB="$(cygpath -m "$RUNNER_TEMP/harbour-server")"

        printf ''\nif(WIN32 AND MINGW)\n set_target_properties(openads_ace PROPERTIES PREFIX "")\nendif()\n'' >>
        src/CMakeLists.txt

        cmake -S . -B build-legacy -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_SHARED_LINKER_FLAGS="-static
        -static-libgcc -static-libstdc++" -DOPENADS_BUILD_TESTS=ON -DOPENADS_WITH_HTTP=OFF -DOPENADS_WITH_TLS=ON
        -DOPENADS_VERSION_FORCE=1.09.74-mtfix51-drive-root-test -DOPENADS_AUTH_CAPACITY_TEST_SWITCH=OFF -DOPENADS_WITH_HARBOUR_UDF=ON
        -DHARBOUR_COMPILER="$HB/bin/win/mingw/harbour.exe" -DHARBOUR_INCLUDE_DIR="$HB/include" -DHARBOUR_LIB_DIR="$HB/lib/win/mingw"
        -DOPENADS_HARBOUR_LIBS="hbvmmt;hbrtl;hbmacro;hbpcre;hblang;hbcpage;hbrdd;rddfpt;rddntx;hbsix;hbcommon" -DOPENADS_WARNINGS_AS_ERRORS=OFF

        cmake --build build-legacy --target openads_serverd openads_unit_tests -j2

        build-legacy/tests/openads_unit_tests.exe --test-case="*connection drive root*,*resolve_under_root*,*root*,*traversal*"
        > output/mtfix51-unit-proof.txt

        '
      shell: bash
    - name: Prepare released comparison44 and unchanged49 worker
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        Invoke-WebRequest ''https://github.com/bedipritpal/OpenADS/releases/download/v1.09.74-mtfix44-static-auth-test/mtfix44-static-auth-qt492-x86.zip''
        -OutFile mtfix44.zip

        if((Get-FileHash mtfix44.zip).Hash.ToLower() -ne ''da56bd37dcf51997f339c4cff421fbcc3c2364b0f18a42f751bc12741cd1eb7e''){throw
        ''44 hash mismatch''}

        Expand-Archive mtfix44.zip comparison44

        Copy-Item matrix-kit49/mtfix49-mutual-auth/bin/openads_auth_worker.exe build-legacy/tools/serverd/

        exit 0

        '
    - name: Drive folder control traversal and unchanged behavior Windows proof
      shell: pwsh
      run: "$ErrorActionPreference='Stop'\n$servers=@(@('44',(Resolve-Path comparison44/mtfix44-static-auth/bin/openads_serverd.exe).Path),@('49',(Resolve-Path\
        \ matrix-kit49/mtfix49-mutual-auth/bin/openads_serverd.exe).Path),@('51',(Resolve-Path build-legacy/tools/serverd/openads_serverd.exe).Path))\n\
        $rows=@();$data='C:/Temp/mtfix51-data';New-Item -ItemType Directory -Force $data,($data+'/MyDataFolder/Creative.acd'),($data+'/Creative.acd'),($data+'/MyDataFolder/MyDataFolder/Creative.acd')\
        \ | Out-Null\nforeach($sv in $servers){foreach($legacy in @(0,1)){foreach($scheme in @('tcp','auth')){\n\
        \ $case=$sv[0]+'-'+$legacy+'-'+$scheme\n $a='--host 127.0.0.1 --port 17268 --data \"'+$data+'\" --auth_user\
        \ usr:pw';if($legacy -eq 1){$a+=' --legacy_paths'};if($scheme -eq 'auth'){$a+=' --auth_module \"'+(Resolve-Path\
        \ auth-probe.hrb).Path+'\"'}\n $o='output/mtfix51-'+$case+'.out';$e='output/mtfix51-'+$case+'.err';$p=Start-Process\
        \ $sv[1] -ArgumentList $a -WorkingDirectory (Split-Path $sv[1]) -RedirectStandardOutput $o -RedirectStandardError\
        \ $e -PassThru\n try{\n  $ready=$false;for($i=0;$i -lt 100;$i++){if(Select-String $o -Pattern 'listening\
        \ on' -Quiet){$ready=$true;break};if($p.HasExited){throw ('server exited '+(Get-Content $e -Raw))};Start-Sleep\
        \ -Milliseconds 200};if(-not $ready){throw 'not listening'}\n  foreach($root in @('C:/','D:/','e:/','C:/MyDataFolder',$data,'C:/../outside','C:/../../outside','../outside','C:/NotMapped','C:','C:/,D:/','')){\n\
        \   Get-ChildItem $data -Recurse -Filter 00001.dbf | Remove-Item -Force\n   $url=$scheme+'://127.0.0.1:17268/'+$root;$file='C:/MyDataFolder/Creative.acd/00001.dbf';$watch=[Diagnostics.Stopwatch]::StartNew()\n\
        \   $r=& matrix-client/root-table-matrix.exe $url $file ($data+'/MyDataFolder/Creative.acd/00001.dbf') 2>&1;$rc=$LASTEXITCODE;$watch.Stop();if($rc\
        \ -ne 0){throw 'client crash'}\n   $text=$r -join \"`n\";$connected=($text -match '(CONNECT|COMPLETE)=0');$actual=@(Get-ChildItem\
        \ $data -Recurse -Filter 00001.dbf | ForEach-Object {$_.FullName.Replace('\\','/')})\n   if($sv[0] -eq '51'\
        \ -and $root -match '^[A-Za-z]:/$'){\n    if(-not $connected -or $text -notmatch 'CREATE=0' -or $text -notmatch\
        \ 'OPEN=0' -or $actual.Count -ne 1 -or $actual[0] -ine ($data+'/MyDataFolder/Creative.acd/00001.dbf')){throw\
        \ ('drive root failed '+$text+' '+($actual -join ';'))}\n   }\n   if($root.Contains('..') -and $connected){throw\
        \ 'traversal admitted'}\n   $row=@{version=$sv[0];legacy=$legacy;scheme=$scheme;root=$root;result=$text;actual=$actual;elapsed_ms=$watch.Elapsed.TotalMilliseconds};$rows+=$row\n\
        \   \"SERVER=$($sv[0]) LEGACY=$legacy SCHEME=$scheme ROOT=$root MS=$($watch.Elapsed.TotalMilliseconds)\"\
        \ | Tee-Object -FilePath output/mtfix51-results.txt -Append;$r | Tee-Object -FilePath output/mtfix51-results.txt\
        \ -Append\n  }\n }finally{if(-not $p.HasExited){$p.Kill();$p.WaitForExit()}}\n}}}\n$rows | ConvertTo-Json\
        \ -Depth 5 | Set-Content output/mtfix51-results.json -Encoding utf8\n# All non-drive inputs must retain\
        \ 49 behavior and physical paths.\nforeach($row in @($rows | Where-Object {$_.version -eq '51' -and $_.root\
        \ -notmatch '^[A-Za-z]:/$'})){\n $b=@($rows | Where-Object {$_.version -eq '49' -and $_.legacy -eq $row.legacy\
        \ -and $_.scheme -eq $row.scheme -and $_.root -eq $row.root})[0]\n if($row.result -ne $b.result -or ($row.actual\
        \ -join ';') -ne ($b.actual -join ';')){throw ('non-drive behavior changed '+$row.root)}\n}\n'PASS: drive-only\
        \ alias; non-drive49 parity; traversal refusal' | Tee-Object -FilePath output/mtfix51-results.txt -Append\n\
        exit 0\n"
    - name: Package test server only
      shell: bash
      run: 'set -euxo pipefail

        mkdir -p delivery/mtfix51-server-only/{bin,docs}

        cp build-legacy/tools/serverd/openads_serverd.exe delivery/mtfix51-server-only/bin/

        cp mtfix51-drive-root.patch output/mtfix51-*txt output/mtfix51-results.json delivery/mtfix51-server-only/docs/

        cat > delivery/mtfix51-server-only/docs/README.txt <<''TXT''

        MTFIX51 TEST SERVER ONLY, WINDOWS X86

        Replace only serverd after stopping the test server and backing it up.

        Keep matched mtfix49 auth worker and mtfix50 client DLL. No worker or client

        binary is shipped. No production deployment, main merge or upstream change.

        Exactly drive-only client connection roots X:/ or X:\ now select first

        --data root in plain TCP and auth. ASCII letters only, case-insensitive.

        C:, C:/folder, empty, lists, extra slashes and traversal are NOT this alias.

        All other inputs retain strict/legacy resolution and all filesystem checks.

        Folder case1 remains a recorded existing mismatch, NOT silently fixed here.

        This patch changes connection-root resolution only, not file remapping.

        Case2 drive root + C:/MyDataFolder/Creative.acd/00001.dbf resolves to

        --data/MyDataFolder/Creative.acd/00001.dbf. Local literal-path semantics and

        multi-root client lookup remain separate unresolved implementation work.

        Extra work per connection: length check, ASCII drive test, and existing jail

        resolution of first root. No extra network round trip or table-operation work.

        Elapsed Windows whole-flow samples are in results JSON; they include auth,

        process scheduling and create/open, not an isolated network benchmark.

        Legacy_paths remains available and tested; non-drive behavior must match49.

        Vouch multi-instance acceptance still gates main merge.

        TXT

        (cd delivery && find mtfix51-server-only -type f -exec sha256sum {} \; > SHA256.txt)

        7z a -tzip mtfix51-server-only-qt492-x86.zip ./delivery/*

        gh release create v1.09.74-mtfix51-drive-root-test mtfix51-server-only-qt492-x86.zip --target "$GITHUB_SHA"
        --prerelease --title ''OpenADS mtfix51 drive-only root test server'' --notes ''Server-only test candidate.
        Exact drive-only connection roots select first --data root for TCP/auth. Other path policy unchanged. Read
        included Windows observations; no main or deployment.''

        '
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mtfix51-windows-proof
        path: 'output/

          build-legacy/tools/serverd/openads_serverd.exe'
