name: HRB auth UNMERGED native proof (Pritpal Bedi)
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86
          bits: 32
          checksum: 019ee601c48069b91101a3af923bf2cdd4399c99b9a1c70b5d59da9cfbb8e907
          folder: mingw32
          url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z
          checksum_url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z.sha256
        - arch: x64
          bits: 64
          checksum: 1e525afc8a3362a1054d7a9a44c8f496a7a652b224b79dbf4b6e5ca8c1012b74
          folder: mingw64
          url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-x86_64-posix-seh-gcc-10.2.0-mingw-w64-8.0.0-r8.7z
          checksum_url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-x86_64-posix-seh-gcc-10.2.0-mingw-w64-8.0.0-r8.7z.sha256
    steps:
    - uses: actions/checkout@v5
      with:
        ref: 50d51a5e64f62b6f980df0d6aaa4b2df9fc8868f
        persist-credentials: false
    - name: Download and verify Winlibs GCC10.2
      shell: pwsh
      run: 'Invoke-WebRequest ''${{ matrix.url }}'' -OutFile "$env:RUNNER_TEMP/winlibs.7z"

        $sum = (Invoke-WebRequest ''${{ matrix.checksum_url }}'').Content

        $expected = ''${{ matrix.checksum }}''

        Write-Host "Expected: $expected"

        $actual = (Get-FileHash "$env:RUNNER_TEMP/winlibs.7z" -Algorithm SHA256).Hash.ToLower()

        Write-Host "Actual: $actual"

        if ($actual -ne $expected) { throw ''Toolchain digest mismatch'' }

        & 7z x "$env:RUNNER_TEMP/winlibs.7z" "-o$env:RUNNER_TEMP/winlibs" -y

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        "$env:RUNNER_TEMP/winlibs/${{ matrix.folder }}/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        '
    - &id001
      name: Apply exact unmerged auth spike
      shell: bash
      run: 'set -euxo pipefail

        echo '''' > spike.b64

        python -c "import base64,gzip,pathlib;pathlib.Path(''spike.patch'').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path(''spike.b64'').read_text())))"

        echo ''b8d8cf71f50b94dc9c25f76cb3bee96e894ab84b4a210b5d86850dcb3636ab0a  spike.patch'' | sha256sum -c -

        git apply --check spike.patch

        git apply spike.patch

        '
    - name: Build matching Harbour and native isolated worker proofs
      shell: bash
      run: 'set -euxo pipefail

        mkdir -p output

        gcc -v 2> output/toolchain.txt

        test "$(gcc -dumpfullversion)" = 10.2.0

        git clone https://github.com/harbour/core.git "$RUNNER_TEMP/harbour-auth"

        cd "$RUNNER_TEMP/harbour-auth"

        git checkout 6deac9cf3ad977ae829e5bca543d553b92dd4b6d

        export HB_COMPILER=${{ matrix.bits == 32 && ''mingw'' || ''mingw64'' }}

        export HB_BUILD_CONTRIBS=no

        export HB_BUILD_DYN=no

        mingw32-make -j2

        cd "$GITHUB_WORKSPACE"

        HBROOT="$RUNNER_TEMP/harbour-auth"

        HBINC="$HBROOT/include"

        HBLIB="$HBROOT/lib/win/$HB_COMPILER"

        HBCC="$HBROOT/bin/win/$HB_COMPILER/harbour.exe"

        cmake -S . -B build-auth -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0600 -DOPENADS_BUILD_TESTS=OFF -DOPENADS_WITH_HTTP=OFF -DOPENADS_WITH_TLS=ON -DOPENADS_WARNINGS_AS_ERRORS=OFF -DOPENADS_WITH_HARBOUR_UDF=ON -DHARBOUR_INCLUDE_DIR="$HBINC" -DHARBOUR_LIB_DIR="$HBLIB" ''-DOPENADS_HARBOUR_LIBS=hbvmmt;hbrtl;hbmacro;hbpcre;hblang;hbcpage;hbrdd;rddfpt;rddntx;hbsix;hbcommon''

        cmake --build build-auth --target openads_auth_worker openads_serverd openads_ace auth_spike_worker_probe auth_spike_integration_probe -j2

        "$HBCC" tests/hrb/auth-spike/test_only.prg -gh -ooutput/test_only.hrb

        '
    - name: Protect test-only module and run worker/DB proofs
      shell: pwsh
      run: '$hrb=(Resolve-Path output/test_only.hrb).Path

        $me=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name

        icacls $hrb /inheritance:r /remove:g ''*S-1-3-4'' /grant:r "${me}:(F)" ''*S-1-5-18:(F)'' ''*S-1-5-32-544:(F)''

        if($LASTEXITCODE -ne 0){throw ''ACL failed''}

        $worker=(Resolve-Path build-auth/tools/serverd/openads_auth_worker.exe).Path

        & build-auth/tools/serverd/auth_spike_worker_probe.exe $worker $hrb | Tee-Object output/worker-proof.txt

        if($LASTEXITCODE -ne 0){throw ''worker proof failed''}

        & build-auth/tools/serverd/auth_spike_integration_probe.exe $worker $hrb | Tee-Object output/db-proof.txt

        if($LASTEXITCODE -ne 0){throw ''DB proof failed''}

        objdump -p (Get-Item build-auth/src/ace*.dll).FullName > output/exports.txt

        Select-String -Path output/exports.txt -Pattern ''OAdsBeginAuth|OAdsCompleteAuth|OAdsCancelAuth''

        Get-Item build-auth/src/ace*.dll,build-auth/tools/serverd/openads_auth_worker.exe,build-auth/tools/serverd/openads_serverd.exe | Select-Object Name,Length | Out-File output/sizes.txt

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: hrb-auth-unmerged-${{ matrix.arch }}
        path: output/
        if-no-files-found: error
        retention-days: 14
  publish-source:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        ref: 50d51a5e64f62b6f980df0d6aaa4b2df9fc8868f
        fetch-depth: 0
    - *id001
    - name: Publish unmerged source only
      shell: bash
      run: 'set -euxo pipefail

        git switch -c spike-unmerged/hrb-challenge-auth

        git config user.name ''Pritpal Bedi''

        git config user.email ''bedipritpal@users.noreply.github.com''

        git add src include contrib tools tests docs

        git commit -m ''UNMERGED HRB auth spike for owner testing, no production release''

        git push origin HEAD:refs/heads/spike-unmerged/hrb-challenge-auth

        '
'on':
  push:
    branches:
    - spike-unmerged/hrb-auth-native
