name: mtfix75 full kit (x86 + x64 + linux + macos)
permissions:
  contents: write
concurrency:
  group: mtfix75-full-kit
  cancel-in-progress: false
env:
  KIT_VERSION: 1.09.75-mtfix75-full-test
  PINNED_SOURCE: 933288c10e09f3a8008ccaab02724c87a2171a49
jobs:
  x86kit:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: release/mtfix70-full
    - name: Verify cumulative candidate pin and workflow-only build recipe
      run: |
        set -euxo pipefail
        test "$GITHUB_REF" = refs/heads/release/mtfix70-full
        git merge-base --is-ancestor 933288c10e09f3a8008ccaab02724c87a2171a49 HEAD
        test -z "$(git diff --name-only 933288c10e09f3a8008ccaab02724c87a2171a49 HEAD -- . ':!.github/workflows')"
      shell: bash
    - name: Prefetch identical hash-pinned dependency archives via alternate transport
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PYDEPS'
        import hashlib,pathlib,tarfile,urllib.request,time
        items=[('zlib','https://zlib.net/fossils/zlib-1.3.1.tar.gz','9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23'),('nlohmann_json','https://codeload.github.com/nlohmann/json/tar.gz/refs/tags/v3.11.3','0d8ef5af7f9794e3263480193c491549b2ba6cc74bb018906202ada498a79406'),('cpp_httplib','https://codeload.github.com/yhirose/cpp-httplib/tar.gz/refs/tags/v0.18.5','731190e97acd63edce57cc3dacd496f57e7743bfc7933da7137cb3e93ec6c9a0')]
        for name,url,sha in items:
         for attempt in range(3):
          try:
           body=urllib.request.urlopen(url,timeout=60).read();assert hashlib.sha256(body).hexdigest()==sha;break
          except Exception:
           if attempt==2:raise
           time.sleep(3)
         archive=pathlib.Path(name+'.tar.gz');archive.write_bytes(body)
         dest=pathlib.Path('third_party')/name;dest.mkdir(parents=True,exist_ok=True)
         with tarfile.open(archive) as z:
          for member in z.getmembers():
           parts=pathlib.PurePosixPath(member.name).parts[1:]
           if not parts:continue
           assert '..' not in parts
           member.name=str(pathlib.PurePosixPath(*parts));z.extract(member,dest)
         print(name,sha,'verified')
        PYDEPS
    - name: Download exact historical Qt compiler
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        function Download-Exact($url,$out) {
         for($i=0;$i -lt 4;$i++) {
          try {
            $headers=@{Accept='application/octet-stream'}
            if(([uri]$url).Host -eq 'api.github.com'){$headers.Authorization="Bearer $env:GH_TOKEN"}
            Invoke-WebRequest -Headers $headers $url -OutFile $out; return
          }
          catch { if($i -eq 3){throw}; Start-Sleep -Seconds (5*($i+1)) }
         }
        }
        Download-Exact 'https://download.qt.io/development_releases/prebuilt/mingw_32/i686-4.9.2-release-posix-dwarf-rt_v3-rev1.7z' "$env:RUNNER_TEMP/qt492.7z"
        if((Get-FileHash "$env:RUNNER_TEMP/qt492.7z" -Algorithm SHA256).Hash.ToLower() -ne 'f6de32350a28f4b6c30eec26dbfee65f112300d51e37e4d2007b0598bef9bb79'){throw 'Qt compiler hash mismatch'}
        & 7z x "$env:RUNNER_TEMP/qt492.7z" "-o$env:RUNNER_TEMP/qt492" -y

        Download-Exact 'https://api.github.com/repos/brechtsanders/winlibs_mingw/releases/assets/32966370' "$env:RUNNER_TEMP/winlibs.7z"
        if((Get-FileHash "$env:RUNNER_TEMP/winlibs.7z" -Algorithm SHA256).Hash.ToLower() -ne '019ee601c48069b91101a3af923bf2cdd4399c99b9a1c70b5d59da9cfbb8e907'){throw 'Winlibs hash mismatch'}
        & 7z x "$env:RUNNER_TEMP/winlibs.7z" "-o$env:RUNNER_TEMP/winlibs" -y

        Download-Exact 'https://api.github.com/repos/brechtsanders/winlibs_mingw/releases/assets/29234401' "$env:RUNNER_TEMP/owner2351.7z"
        if((Get-FileHash "$env:RUNNER_TEMP/owner2351.7z" -Algorithm SHA256).Hash.ToLower() -ne '5e18f786047c52b40392fe57f966bcb1a8acbc95d61da10796b13df63b9a1d95'){throw 'Owner2351 compiler hash mismatch'}
        & 7z x "$env:RUNNER_TEMP/owner2351.7z" "-o$env:RUNNER_TEMP/owner2351" -y
      shell: pwsh
    - name: Build TLS auth daemon and raw static kit with pinned GCC10.2
      run: |
        set -euxo pipefail
        export PATH="$(cygpath -u "$RUNNER_TEMP/winlibs/mingw32/bin"):$PATH"
        test "$(gcc -dumpversion)" = 10.2.0
        find "$RUNNER_TEMP/winlibs" -iname '*copying*' -o -iname '*license*' | sort
        git clone https://github.com/harbour/core.git "$RUNNER_TEMP/harbour-server"
        git -C "$RUNNER_TEMP/harbour-server" checkout --detach 6deac9cf3ad977ae829e5bca543d553b92dd4b6d
        export HB_PLATFORM=win HB_COMPILER=mingw HB_BUILD_CONTRIBS=no HB_BUILD_DYN=no
        mingw32-make -C "$RUNNER_TEMP/harbour-server" -j2
        HB="$(cygpath -m "$RUNNER_TEMP/harbour-server")"
        printf '\nif(WIN32 AND MINGW)\n set_target_properties(openads_ace PROPERTIES PREFIX "")\nendif()\n' >> src/CMakeLists.txt
        python - <<'PYHARNESS'
        import pathlib,re,base64
        root=pathlib.Path('.')
        header=root/'tests/legacy-native-temp.h'
        header.write_bytes(base64.b64decode(''))
        changes=[]
        for p in (root/'tests').rglob('*.cpp'):
         s=p.read_text(encoding='utf-8',errors='strict')
         n=re.sub(r'\b(?:std::filesystem|fs)::temp_directory_path\b','openads_test::temp_directory_path',s)
         if n!=s:p.write_text(n,encoding='utf-8');changes.append(str(p))
        with open(root/'tests/CMakeLists.txt','a') as f:f.write('\n# CI-only pinned MinGW test temp helper. Not linked into shipped targets.\ntarget_compile_options(openads_trace_gate_probe PRIVATE -include "${CMAKE_CURRENT_SOURCE_DIR}/legacy-native-temp.h")\ntarget_compile_options(openads_unit_tests PRIVATE -include "${CMAKE_CURRENT_SOURCE_DIR}/legacy-native-temp.h")\n')
        print('Test-only native temp helper applied:',len(changes),'test files')
        pathlib.Path('unit-harness-changes.txt').write_text('\n'.join(changes))

        PYHARNESS

        cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DFETCHCONTENT_SOURCE_DIR_NLOHMANN_JSON="$PWD/third_party/nlohmann_json" -DFETCHCONTENT_SOURCE_DIR_CPP_HTTPLIB="$PWD/third_party/cpp_httplib" -S . -B build-legacy -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_SHARED_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" -DOPENADS_BUILD_TESTS=ON -DOPENADS_WITH_HTTP=OFF -DOPENADS_WITH_TLS=ON -DOPENADS_VERSION_FORCE=1.09.75-mtfix75-full-test -DOPENADS_AUTH_CAPACITY_TEST_SWITCH=OFF -DOPENADS_WITH_HARBOUR_UDF=ON -DHARBOUR_COMPILER="$HB/bin/win/mingw/harbour.exe" -DHARBOUR_INCLUDE_DIR="$HB/include" -DHARBOUR_LIB_DIR="$HB/lib/win/mingw" -DOPENADS_HARBOUR_LIBS="hbvmmt;hbrtl;hbmacro;hbpcre;hblang;hbcpage;hbrdd;rddfpt;rddntx;hbsix;hbcommon" -DOPENADS_WARNINGS_AS_ERRORS=OFF
        cmake --build build-legacy --target openads_ace_static openads_ace openads_serverd openads_auth_worker auth_spike_worker_probe auth_spike_integration_probe auth_spike_abi_probe auth_spike_transport_probe auth_mutual_probe auth_resource_probe openads_unit_tests -j2
      shell: bash
    - name: Build Harbour with unchanged Qt4.9.2
      run: |
        set -euxo pipefail
        export PATH="$(cygpath -u "$RUNNER_TEMP/qt492/mingw32/bin"):$PATH"
        test "$(gcc -dumpversion)" = 4.9.2
        git clone https://github.com/harbour/core.git "$RUNNER_TEMP/harbour-old"
        git -C "$RUNNER_TEMP/harbour-old" checkout --detach 4ec2e154ed92757418bc30af571ab90240ab3209
        git -C "$RUNNER_TEMP/harbour-old" apply "$PWD/patches/harbour/rddads-pending-fields.patch"
        export HB_PLATFORM=win HB_COMPILER=mingw HB_BUILD_CONTRIBS=no HB_BUILD_DYN=no
        mingw32-make -C "$RUNNER_TEMP/harbour-old" -j2
      shell: bash
    - name: Exact GCC10.2 and mingw-w64 8 runtime notices (Winlibs omits them)
      run: |
        set -euxo pipefail
        W="$(cygpath -u "$RUNNER_TEMP/winlibs/mingw32")"
        mkdir -p "$W/share/licenses/gcc" "$W/share/licenses/crt" "$W/share/licenses/winpthreads"
        curl -fL https://raw.githubusercontent.com/gcc-mirror/gcc/ee5c3db6c5b2c3332912fb4c9cfa2864569ebd9a/COPYING3 -o "$W/share/licenses/gcc/COPYING3"
        echo '8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903  '"$W/share/licenses/gcc/COPYING3" | sha256sum -c -
        curl -fL https://raw.githubusercontent.com/gcc-mirror/gcc/ee5c3db6c5b2c3332912fb4c9cfa2864569ebd9a/COPYING.RUNTIME -o "$W/share/licenses/gcc/COPYING.RUNTIME"
        echo '9d6b43ce4d8de0c878bf16b54d8e7a10d9bd42b75178153e3af6a815bdc90f74  '"$W/share/licenses/gcc/COPYING.RUNTIME" | sha256sum -c -
        curl -fL https://raw.githubusercontent.com/mingw-w64/mingw-w64/98dad1fefed2a07ade0b37ca6c610ad66739631a/COPYING.MinGW-w64-runtime/COPYING.MinGW-w64-runtime.txt -o "$W/share/licenses/crt/COPYING.MinGW-w64-runtime.txt"
        echo 'e9b2dc02451ea29092a1f25fa0f3c07207ed421f1807dffb0c4e6dce69dee7bd  '"$W/share/licenses/crt/COPYING.MinGW-w64-runtime.txt" | sha256sum -c -
        curl -fL https://raw.githubusercontent.com/mingw-w64/mingw-w64/98dad1fefed2a07ade0b37ca6c610ad66739631a/mingw-w64-libraries/winpthreads/COPYING -o "$W/share/licenses/winpthreads/COPYING"
        echo '63263614cdd29f2f93cba85e992f041b31f9fc7b4033692f31269489a8a1b177  '"$W/share/licenses/winpthreads/COPYING" | sha256sum -c -

        mkdir -p kit/runtime-notices
        cp "$W/share/licenses/gcc/COPYING3" kit/runtime-notices/gcc-COPYING3.txt
        cp "$W/share/licenses/gcc/COPYING.RUNTIME" kit/runtime-notices/gcc-COPYING.RUNTIME.txt
        cp "$W/share/licenses/crt/COPYING.MinGW-w64-runtime.txt" kit/runtime-notices/MinGW-w64-runtime.txt
        cp "$W/share/licenses/winpthreads/COPYING" kit/runtime-notices/winpthreads-COPYING.txt
      shell: bash
    - name: Build DLL import RDDADS and B_BIG threaded fixtures
      run: |
        set -euxo pipefail
        export PATH="$(cygpath -u "$RUNNER_TEMP/qt492/mingw32/bin"):$PATH"
        HB="$(cygpath -u "$RUNNER_TEMP/harbour-old")"
        mkdir -p srv mtdata output kit
        cp build-legacy/src/*.dll build-legacy/tools/serverd/openads_serverd.exe build-legacy/tools/serverd/openads_auth_worker.exe srv/
        cat > output/local_create.prg <<'PRG'
        #include "ads.ch"
        REQUEST ADS, ADSCDX
        PROCEDURE Main( cDir )
           LOCAL cDbf := cDir + "/TestIndex.dbf", cIdx := cDir + "/TestIndex.cdx"
           FIELD NAME,CITY,INS
           OAds_SetLogging( .F. )
           AdsSetServerType( ADS_LOCAL_SERVER )
           AdsConnect( "." )
           AdsSetFileType( ADS_CDX )
           RddSetDefault( "ADSCDX" )
           DbCreate( cDbf, { { "NAME", "C", 19, 0 }, { "CITY", "C", 15, 0 }, { "AGE", "N", 3, 0 }, { "TS", "C", 23, 0 }, { "THD", "N", 3, 0 }, { "INS", "N", 4, 0 }, { "RDD", "C", 3, 0 } }, "ADSCDX" )
           dbCloseArea()
           USE ( cDbf ) VIA "ADSCDX" ALIAS _STG SHARED NEW
           INDEX ON NAME TAG "IDX01" TO ( cIdx )
           INDEX ON CITY TAG "IDX02" TO ( cIdx )
           INDEX ON INS TAG "IDX03" TO ( cIdx )
           dbCloseArea()
           OutStd( "exact fixture ready" + hb_eol() )
        RETURN

        PRG
        cat > output/probe_mt.prg <<'PRG'
        #include "ads.ch"
        #define __HLP__(s) .T.
        REQUEST ADS, ADSCDX
        STATIC s_hConn := 0
        STATIC s_cRdd := "ADSCDX"
        STATIC s_nRandom := 1
        PROCEDURE Main( cUri, cDir )
           LOCAL cChallenge, hPending := 0, i, x, aThreads := {}, cErr := Space(512)
           ErrorBlock( {| e | OutStd( "ERROR " + hb_ValToExp(e) + hb_eol() ), Break(e) } )
           AdsSetFileType( ADS_CDX )
           AdsSetServerType( ADS_REMOTE_SERVER )
           RddSetDefault( s_cRdd )
           s_hConn := AdsConnect( cUri )
           IF Empty( s_hConn )
              OutStd( "CONNECT-FAIL" + hb_eol() )
              ErrorLevel(3) ; QUIT
           ENDIF
           FOR i := 1 TO 9
              AAdd(aThreads,hb_threadStart({|| StageExact(cDir)}))
           NEXT
           StageExact(cDir)
           OutStd( "MAIN-STAGE-PASS" + hb_eol() )
           dbGoTop()
           OutStd( "MAIN-GOTOP-PASS lastrec=" + hb_ntos(LastRec()) + hb_eol() )
           FOR EACH x IN aThreads
              hb_threadJoin(x)
           NEXT
           OutStd( "EXACT-THREADS-JOINED lastrec=" + hb_ntos(LastRec()) + hb_eol() )
           dbCloseArea()
        RETURN
        PROCEDURE StageExact(cDir)
           BEGIN SEQUENCE
              IF HeyAddRecords(cDir+"/TestIndex.dbf",cDir+"/TestIndex.cdx")
                 dbGoTop()
              ENDIF
              Mark("stage done")
           RECOVER
              Mark("RECOVER")
              ErrorLevel(4)
           END SEQUENCE
        RETURN
        PROCEDURE Mark(c)
           OutStd("t"+hb_ntos(hb_threadId())+" "+c+hb_eol())
        RETURN
        PROCEDURE LogEvents(c)
           Mark(c)
        RETURN
        FUNCTION HeyAddRecords( cDbf, cIdx )
           LOCAL aRec, aData, lAppended
           LOCAL lAdded := .T.

           IF .T.
              Mark( "before USE" )
              USE ( cDbf ) VIA ( s_cRdd ) ALIAS _STG SHARED NEW
           ENDIF
           Mark( "after USE" )
           IF ! Alias() == "_STG"
              lAdded := .F.
              ? "Could not Open: ", cDbf
           ELSE
              IF __HLP__( "__Switching it ON do not display records in the browser as well as referencing them__" )
                 Mark( "before dbSetIndex" )
                 dbSetIndex( cIdx )
                 Mark( "after dbSetIndex" )
                 dbSetOrder( 0 )
              ENDIF
              aData := { { "Alice"  , "Madrid"    }, ;
                         { "Bob"    , "Barcelona" }, ;
                         { "Phillip", "Panipat"   }, ;
                         { "Charlie", "Valencia"  }, ;
                         { "Linda"  , "Iris"      }, ;
                         { "Finland", "Dallas"    }, ;
                         { "Diana"  , "Sevilla"   }, ;
                         { "Lucy"   , "Sevilla"   }, ;
                         { "Jony"   , "Walker"    }, ;
                         { "Edward" , "Bilbao"    } }
              FOR EACH aRec IN aData
                 Mark( "before append " + hb_ntos( aRec:__enumIndex() ) )
        #if 0
                 IF aRec:__enumIndex() > 1
                    EXIT
                 ENDIF
        #endif
                 IF ! lAppended := _STG->( DbAppend() )
                    hb_idleSleep()
                    lAppended := _STG->( DbAppend() )
                 ENDIF
                 Mark( "after append ok=" + hb_ValToExp(lAppended) + " neterr=" + hb_ValToExp(NetErr()) + " recno=" + hb_ntos(RecNo()) )
                 IF lAppended
                    REPLACE _STG->NAME WITH aRec[ 1 ]
                    REPLACE _STG->CITY WITH aRec[ 2 ]
                    REPLACE _STG->AGE  WITH hb_randInt( 20, 120 )
                    REPLACE _STG->TS   WITH hb_TSToStr( hb_DateTime() )
                    REPLACE _STG->THD  WITH hb_threadId()
                    REPLACE _STG->INS  WITH s_nRandom
                    REPLACE _STG->RDD  WITH s_cRdd
                    //
                    Mark( "before commit" )
                    _STG->( DbCommit() ) ; _STG->( dbUnlock() )
                    Mark( "after commit/unlock" )  /* a must for networked applications */
                 ELSE
                    LogEvents( "Could not APPEND " + aRec[ 1 ] )
                 ENDIF
              NEXT
           ENDIF
           RETURN lAdded


        PRG

        # DLL import library only. Never place a combined archive in kit.
        cp build-legacy/src/libopenace32.dll.a kit/libopenace32.dll.a
        cp build-legacy/src/openace32.dll output/openace32.dll
        objdump -p output/openace32.dll > output/dll-pe.txt
        if grep -Ei 'DLL Name:.*(libstdc|libgcc|libwinpthread|libssl|libcrypto|mbedtls|zlib).*\.dll' output/dll-pe.txt;then exit 1;fi
        for unit in ads1 adsfunc adsmgmnt adsx;do
         gcc -c "$HB/contrib/rddads/$unit.c" -I"$HB/include" -I"$HB/contrib/rddads" -Iinclude/openads -o "output/$unit.o"
        done
        gcc -c contrib/oads_hb/oads_hb.c -I"$HB/include" -Iinclude/openads -o output/oads_hb.o
        ar rcs kit/librddads.a output/ads1.o output/adsfunc.o output/adsmgmnt.o output/adsx.o output/oads_hb.o
        for name in local_create probe_mt;do
         "$HB/bin/win/mingw/hbmk2.exe" "output/$name.prg" -Lkit -lrddads -lopenace32 -iinclude/openads -i"$HB/contrib/rddads" -mt -gtstd -o"output/$name.exe"
        done
        cp output/probe_mt.exe output/probe_mt_dll.exe
        cat > output/check_rows.prg <<'CHECKROWS'
        #include "ads.ch"
        REQUEST ADS, ADSCDX
        PROCEDURE Main(cDir)
         LOCAL nRows:=0, nEmpty:=0
         FIELD NAME,CITY
         AdsSetServerType(ADS_LOCAL_SERVER)
         AdsSetFileType(ADS_CDX)
         RddSetDefault("ADSCDX")
         USE (cDir+"/TestIndex.dbf") VIA "ADSCDX" SHARED NEW
         dbGoTop()
         DO WHILE !Eof()
           nRows++
           IF Empty(NAME) .OR. Empty(CITY)
              nEmpty++
           ENDIF
           dbSkip()
         ENDDO
         OutStd("STORED rows="+hb_ntos(nRows)+" lastrec="+hb_ntos(LastRec())+" empty="+hb_ntos(nEmpty)+hb_eol())
         dbCloseAll()
        RETURN
        CHECKROWS
        "$HB/bin/win/mingw/hbmk2.exe" output/check_rows.prg -Lkit -lrddads -lopenace32 -iinclude/openads -i"$HB/contrib/rddads" -mt -gtstd  -lws2_32 -lbcrypt -lpsapi -ooutput/check_rows.exe

        cat > output/auth_static.prg <<'PRG'
        #include "ads.ch"
        REQUEST ADS, ADSCDX
        PROCEDURE Main(cUrl)
         LOCAL cChallenge,hPending:=0,hConn:=0,cBlob
         IF !OAds_SetLogging(.T.)
          OutStd("LOGGING-OPTIN-FAIL"+hb_eol())
          ErrorLevel(6);QUIT
         ENDIF
         cChallenge:=OAds_BeginAuth(cUrl,@hPending)
         IF Len(cChallenge)!=32
          OutStd("AUTH-BEGIN-FAIL"+hb_eol())
          ErrorLevel(3);QUIT
         ENDIF
         cBlob:=cChallenge+"test-only"
         hConn:=OAds_CompleteAuth(hPending,cBlob)
         IF Empty(hConn)
          OutStd("AUTH-COMPLETE-FAIL"+hb_eol())
          ErrorLevel(4);QUIT
         ENDIF
         OAds_SetConnection(hConn)
         dbUseArea(.T.,"ADSCDX","TestIndex.dbf","TRACEPROBE",.T.,.F.)
         IF !Used()
          ErrorLevel(5);QUIT
         ENDIF
         dbCloseAll()
         AdsDisconnect(hConn)
         OAds_SetLogging(.F.)
         OutStd("STATIC-AUTH-PASS"+hb_eol())
        RETURN
        PRG
        "$HB/bin/win/mingw/hbmk2.exe" output/auth_static.prg -Lkit -lrddads -lopenace32 -iinclude/openads -i"$HB/contrib/rddads" -mt -gtstd  -lws2_32 -lbcrypt -lpsapi -ooutput/auth_static.exe
        objdump -p output/auth_static.exe > output/static-auth-pe.txt
        grep -qi 'DLL Name: openace32.dll' output/static-auth-pe.txt


        # Actual GCC x86 Harbour RDDADS reader / independent DBFCDX writer.
        "$HB/bin/win/mingw/hbmk2.exe" tests/smoke/harbour/refresh_peer.prg -Lkit -lrddads -lopenace32 -iinclude/openads -i"$HB/contrib/rddads" -mt -gtstd -ooutput/refresh_peer.exe
        objdump -p output/refresh_peer.exe > output/refresh-peer-pe.txt
        grep -qi 'DLL Name: openace32.dll' output/refresh-peer-pe.txt

        # Same generated Harbour objects, link under owner's exact pinned ld2.35.1.
        export PATH="$(cygpath -u "$RUNNER_TEMP/owner2351/mingw32/bin"):$PATH"
        test "$(gcc -dumpversion)" = 10.2.0
        ld --version | tee output/owner-ld-version.txt
        grep -q '2.35.1' output/owner-ld-version.txt
        "$HB/bin/win/mingw/hbmk2.exe" output/probe_mt.prg -Lkit -lrddads -lopenace32 -iinclude/openads -i"$HB/contrib/rddads" -mt -gtstd -ooutput/probe_mt_owner.exe -workdir=output/vouchobjs -inc -trace > output/owner-link.txt 2>&1
        objdump -p output/probe_mt_owner.exe > output/owner-client-pe.txt
        grep -qi 'DLL Name: openace32.dll' output/owner-client-pe.txt
        echo "$PINNED_SOURCE" > output/source-commit.txt

        objdump -p output/openace32.dll | sed -n '/\[Ordinal\/Name Pointer\] Table/,$p' > output/dll-exports.txt
        if grep -E '^.*\][[:space:]]+(_Z|\?)[^[:space:]]+' output/dll-exports.txt;then exit 1;fi

        # Vouch link-shape proof: preserve every library position, use empty stand-in
        # archives ONLY for unavailable third-party libs. Real Harbour GUI/MT/system libs.
        python - <<'PYPROOF'
        import pathlib,subprocess
        HB=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'harbour-old'
        libs="gtwvg v32lib gtnet hbnf hbmxml mxml hbhpdf libhpdf png hbzebra hbssl ssl crypto crypt32 hbtip hbziparc hbmzip minizip hbnetio hbmemio hbwin hbjrpc hbzsock hbcurls curl ssh2 hbjrpc dbrmap hbcloud hbtelegram xhb freewin eztwain3 hbct wininet mapi32 rasapi32 tapi32 comctl32 Image2PDF crypto ssl ssh2 nghttp2 brotlicommon-static brotlidec-static brotlienc-static zstd wldap32 bcrypt rddads openace32 ws2_32 bcrypt psapi hbextern hbdebug hbvmmt hbrtl hblang hbcpage gtcgi gtpca gtstd gtwin gtwvt gtgui hbrdd hbuddall hbusrrdd rddntx rddcdx rddnsx rddfpt hbrdd hbhsx hbsix hbmacro hbcplr hbpp hbcommon hbmainwin winmm kernel32 user32 gdi32 advapi32 ws2_32 iphlpapi winspool comctl32 comdlg32 shell32 uuid ole32 oleaut32 mpr mapi32 imm32 msimg32 wininet hbpcre hbzlib".split()
        pathlib.Path('output/standins').mkdir(exist_ok=True)
        for n in libs:
