name: MTFIX51 legacy proof with explicit test fixture directory
'on':
  push:
    branches:
    - test/auth-diagnostic-mtfix50
    paths:
    - .github/workflows/server-mtfix51.yml
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
jobs:
  proof:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
      with:
        ref: 45752b9ab4b11d7b8efb7cdea1909894006c8a6c
    - name: Reuse exact successful DLL build and proofs
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: '$ErrorActionPreference=''Stop''

        gh run download 38919695226 --repo bedipritpal/OpenADS --name mtfix50-diagnostic-results --dir output

        if($LASTEXITCODE -ne 0){throw ''build outputs download failed''}

        Invoke-WebRequest ''https://github.com/bedipritpal/OpenADS/releases/download/v1.09.74-mtfix49-mutual-auth-test/mtfix49-mutual-auth-qt492-x86.zip''
        -OutFile kit49.zip

        if((Get-FileHash kit49.zip -Algorithm SHA256).Hash.ToLower() -ne ''0dcb6fecc720eb894639e8aeeb2d1c6c2898b1e5b4e9306d9bb5e03f91c0cbf7''){throw
        ''49 kit hash mismatch''}

        Expand-Archive kit49.zip -DestinationPath matrix-kit49

        New-Item -ItemType Directory -Force kit,srv,mtdata,build-legacy/tools/serverd,matrix-client | Out-Null

        Copy-Item matrix-kit49/mtfix49-mutual-auth/lib/* kit/

        Copy-Item -Recurse matrix-kit49/mtfix49-mutual-auth/runtime-notices kit/

        Copy-Item matrix-kit49/mtfix49-mutual-auth/bin/*.exe srv/

        Copy-Item matrix-kit49/mtfix49-mutual-auth/bin/openads_auth_worker.exe build-legacy/tools/serverd/

        Copy-Item output/openace32.dll srv/

        Invoke-WebRequest ''https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z''
        -OutFile compiler.7z

        & 7z x compiler.7z (''-o''+$env:RUNNER_TEMP+''/winlibs'') -y

        if($LASTEXITCODE -ne 0){throw ''compiler extraction failed''}


        exit 0

        '
    - name: Prepare same public V1 fixture and proof sources
      shell: pwsh
      run: "$ErrorActionPreference='Stop'\n[IO.File]::WriteAllBytes((Join-Path $PWD 'auth-probe.hrb'),[Convert]::FromBase64String('wEhSQgIAAwAAAE9BRFNfQVVUSF9WMQAFAUxFTgAAAlJFUExJQ0FURQAAAgEAAABPQURTX0FVVEhfVjEAhgAAAA0AAyQCAF8CagVoYW5nAAgcByQDABn9JAYAXwJqCm1hbGZvcm1lZAAIHAgkBwB4bgckCQBfAl8Bagp0ZXN0LW9ubHkASAgcJbABAF8DDAF5DxwaJAoAahFPQVVUSAEBAwB1c3ICAHB3AG4HJAwAaghPQVVUSAEAALACAGoCAABcBAwCSG4H'))\n\
        [IO.File]::WriteAllBytes((Join-Path $PWD 'fix-hrb-acl.cmd'),[Convert]::FromBase64String(''))\n\
        [IO.File]::WriteAllBytes((Join-Path $PWD 'mtfix50-client.patch'),[Convert]::FromBase64String(''))\n\
        [IO.File]::WriteAllBytes((Join-Path $PWD 'root-table-matrix.cpp'),[Convert]::FromBase64String(''))\n\
        $path=(Resolve-Path auth-probe.hrb).Path\n$acl=New-Object System.Security.AccessControl.FileSecurity;$acl.SetAccessRuleProtection($true,$false)\n\
        $me=[System.Security.Principal.WindowsIdentity]::GetCurrent().User\nforeach($sid in @($me.Value,'S-1-5-18','S-1-5-32-544')){\n\
        \ $id=New-Object System.Security.Principal.SecurityIdentifier($sid)\n $rule=New-Object System.Security.AccessControl.FileSystemAccessRule($id,'Read','Allow');$acl.AddAccessRule($rule)\n\
        }\nSet-Acl $path $acl\nCopy-Item auth-probe.hrb matrix-test-only.hrb\nSet-Acl matrix-test-only.hrb $acl\n\
        Copy-Item output/openace32.dll matrix-client/\n& output/local_create.exe (Resolve-Path mtdata).Path\nif($LASTEXITCODE\
        \ -ne 0){throw 'table fixture setup failed'}\n\nexit 0\n"
    - name: Compile diagnostic import client
      shell: bash
      run: "set -euxo pipefail\nexport PATH=\"$(cygpath -u \"$RUNNER_TEMP/winlibs/mingw32/bin\"):$PATH\"\ncat >\
        \ output/auth-diagnostic.cpp <<'CPP'\n#include \"openads/ace.h\"\n#include <windows.h>\n#include <iostream>\n\
        #include <string>\nint main(int n,char** v){\n if(n!=4)return 2;\n HMODULE m=GetModuleHandleA(\"openace32.dll\"\
        );char path[32768]{};\n if(!m||!GetModuleFileNameA(m,path,sizeof(path)))return 3;\n std::cout<<\"LOADED-DLL=\"\
        <<path<<std::endl;\n ADSHANDLE p=0;UNSIGNED8 c[32]{};auto rc=OAdsBeginAuth(v[1],&p,c);\n UNSIGNED32 code=0;UNSIGNED8\
        \ msg[1024]{};UNSIGNED16 len=1023;\n if(rc)AdsGetLastError(&code,msg,&len);\n std::cout<<\"BEGIN=\"<<rc<<\"\
        \ MESSAGE=\"<<msg<<std::endl;\n if(rc!=static_cast<UNSIGNED32>(std::stoul(v[2])))return 4;\n if(std::string(v[3])!=\"\
        PASS\" && std::string(reinterpret_cast<char*>(msg)).find(v[3])==std::string::npos)return 5;\n if(p)OAdsCancelAuth(p);return\
        \ 0;\n}\nCPP\ng++ -std=c++17 -static -static-libgcc -static-libstdc++ -Iinclude output/auth-diagnostic.cpp\
        \ kit/libopenace32.dll.a -o output/auth-diagnostic.exe\nobjdump -p output/auth-diagnostic.exe > output/diagnostic-client-pe.txt\n\
        grep -qi 'DLL Name: openace32.dll' output/diagnostic-client-pe.txt\n\ng++ -std=c++17 -static -static-libgcc\
        \ -static-libstdc++ -Imatrix-kit49/mtfix49-mutual-auth/include root-table-matrix.cpp kit/libopenace32.dll.a\
        \ -o matrix-client/root-table-matrix.exe\n"
    - name: Apply diagnostic client base and minimal legacy self-root server fix
      shell: bash
      run: "set -euxo pipefail\npython - <<'PY51'\nimport base64,pathlib,subprocess\nfor n,b in [('mtfix50-client.patch',''),('mtfix51-legacy-self-root.patch','')]:\n\
        \ pathlib.Path(n).write_bytes(base64.b64decode(b));subprocess.run(['git','apply','--check',n],check=True);subprocess.run(['git','apply',n],check=True)\n\
        PY51\n"
    - name: Reuse exact newly compiled legacy candidate and compile focused unit runner
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euxo pipefail\nexport PATH=\"$(cygpath -u \"$RUNNER_TEMP/winlibs/mingw32/bin\"):$PATH\"\ngh run\
        \ download 38938650173 --repo bedipritpal/OpenADS --name mtfix51-server-candidate --dir recovered51\nmkdir\
        \ -p build-legacy/tools/serverd\ncp recovered51/build-legacy/tools/serverd/openads_serverd.exe build-legacy/tools/serverd/\n\
        # Test-fixture-only replacement: pinned GCC temp_directory_path also fails.\n# Product resolver and server\
        \ remain byte-identical to the compiled candidate.\npython - <<'PYFIX'\nimport pathlib\nfor n in ['platform_path_test.cpp','fs_sandbox_test.cpp','file_jail_test.cpp']:\n\
        \ p=pathlib.Path('tests/unit')/n\n p.write_text(p.read_text().replace('fs::temp_directory_path()', 'fs::path(\"\
        C:/Temp/\")'))\nPYFIX\ng++ -std=c++17 -static -static-libgcc -static-libstdc++ -D_WIN32_WINNT=0x0600 -Isrc\
        \ -Ithird_party/doctest tests/unit/doctest_main.cpp tests/unit/platform_path_test.cpp tests/unit/fs_sandbox_test.cpp\
        \ tests/unit/file_jail_test.cpp src/platform/path.cpp src/platform/fs_sandbox.cpp src/platform/file_win32.cpp\
        \ src/platform/lock_win32.cpp -o output/mtfix51-path-tests.exe\n"
    - name: Run focused Windows tests with native Windows temp setup
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        New-Item -ItemType Directory -Force C:/Temp | Out-Null

        $env:TMP=''C:\Temp'';$env:TEMP=''C:\Temp'';$env:TMPDIR=''C:\Temp''

        ./output/mtfix51-path-tests.exe | Tee-Object output/mtfix51-unit-proof.txt

        if($LASTEXITCODE -ne 0){throw ''focused tests failed''}

        '
    - name: Prepare released comparison44 and unchanged49 worker
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        Invoke-WebRequest ''https://github.com/bedipritpal/OpenADS/releases/download/v1.09.74-mtfix44-static-auth-test/mtfix44-static-auth-qt492-x86.zip''
        -OutFile mtfix44.zip

        if((Get-FileHash mtfix44.zip).Hash.ToLower() -ne ''da56bd37dcf51997f339c4cff421fbcc3c2364b0f18a42f751bc12741cd1eb7e''){throw
        ''44 hash mismatch''}

        Expand-Archive mtfix44.zip comparison44

        Copy-Item matrix-kit49/mtfix49-mutual-auth/bin/openads_auth_worker.exe build-legacy/tools/serverd/

        exit 0

        '
    - name: Legacy root restoration strict parity containment and speed Windows proof
      shell: pwsh
      run: "$ErrorActionPreference='Stop'\n$servers=@(@('44',(Resolve-Path comparison44/mtfix44-static-auth/bin/openads_serverd.exe).Path),@('49',(Resolve-Path\
        \ matrix-kit49/mtfix49-mutual-auth/bin/openads_serverd.exe).Path),@('51',(Resolve-Path build-legacy/tools/serverd/openads_serverd.exe).Path))\n\
        $rows=@();$speed=@();$data='C:/Temp'\nNew-Item -ItemType Directory -Force $data,($data+'/Creative.acd'),($data+'/MyDataFolder/Creative.acd'),($data+'/MyDataFolder/MyDataFolder/Creative.acd'),'C:/Creative.acd','C:/mtfix51-outside'\
        \ | Out-Null\ncmd /c 'mklink /J C:\\Temp\\outside-link C:\\mtfix51-outside'\nif($LASTEXITCODE -ne 0){throw\
        \ 'junction fixture failed'}\ncmd /c 'mklink /J C:\\Temp\\inside-link C:\\Temp\\Creative.acd'\nif($LASTEXITCODE\
        \ -ne 0){throw 'in-root junction fixture failed'}\nforeach($sv in $servers){foreach($legacy in @(0,1)){foreach($scheme\
        \ in @('tcp','auth')){\n $case=$sv[0]+'-'+$legacy+'-'+$scheme\n $a='--host 127.0.0.1 --port 6262 --data\
        \ C:/Temp --auth_user usr:pw';if($legacy -eq 1){$a+=' --legacy_paths'};if($scheme -eq 'auth'){$a+=' --auth_module\
        \ \"'+(Resolve-Path auth-probe.hrb).Path+'\"'}\n $o='output/mtfix51-'+$case+'.out';$e='output/mtfix51-'+$case+'.err';$p=Start-Process\
        \ $sv[1] -ArgumentList $a -WorkingDirectory (Split-Path $sv[1]) -RedirectStandardOutput $o -RedirectStandardError\
        \ $e -PassThru\n try{\n  $ready=$false;for($i=0;$i -lt 100;$i++){if(Select-String $o -Pattern 'listening\
        \ on' -Quiet){$ready=$true;break};if($p.HasExited){throw ('server exited '+(Get-Content $e -Raw))};Start-Sleep\
        \ -Milliseconds 200};if(-not $ready){throw 'not listening'}\n  foreach($root in @('C:/','D:/','C:/Temp','C:/MyDataFolder','C:/../mtfix51-outside','C:/../../mtfix51-outside','../mtfix51-outside','C:/NotMapped','C:','C:/,D:/','')){\n\
        \   Remove-Item 'C:/Temp/Creative.acd/x.dbf','C:/Creative.acd/x.dbf' -Force -ErrorAction SilentlyContinue\n\
        \   Get-ChildItem $data -Recurse -Filter 00001.dbf | Remove-Item -Force\n   $url=$scheme+'://127.0.0.1:6262/'+$root;$file='C:\\\
        Creative.acd\\x.dbf';$watch=[Diagnostics.Stopwatch]::StartNew()\n   $r=& matrix-client/root-table-matrix.exe\
        \ $url $file 'C:/Temp/Creative.acd/x.dbf' 2>&1;$rc=$LASTEXITCODE;$watch.Stop();if($rc -ne 0){throw 'client\
        \ crash'}\n   $text=$r -join \"`n\";$connected=($text -match '(CONNECT|COMPLETE)=0');$actual=@(Get-ChildItem\
        \ $data -Recurse -Filter x.dbf | ForEach-Object {$_.FullName.Replace('\\','/')})\n   if($sv[0] -eq '51'\
        \ -and $legacy -eq 1 -and $root -in @('C:/','D:/','C:/Temp')){\n    if(-not $connected -or $text -notmatch\
        \ 'CREATE=0' -or $text -notmatch 'OPEN=0' -or $actual.Count -ne 1 -or $actual[0] -ine 'C:/Temp/Creative.acd/x.dbf'){throw\
        \ ('legacy root failed '+$text+' '+($actual -join ';'))}\n   }\n   if($sv[0] -eq '51' -and $legacy -eq 0\
        \ -and $root -eq 'C:/' -and $connected){throw 'strict root relaxed'}\n   if($root.Contains('..') -and $connected){throw\
        \ 'traversal admitted'}\n   if(Test-Path 'C:/Creative.acd/x.dbf'){throw 'literal outside file created'}\n\
        \   $row=@{version=$sv[0];legacy=$legacy;scheme=$scheme;root=$root;result=$text;actual=$actual;elapsed_ms=$watch.Elapsed.TotalMilliseconds};$rows+=$row\n\
        \   \"SERVER=$($sv[0]) LEGACY=$legacy SCHEME=$scheme ROOT=$root\" | Tee-Object -FilePath output/mtfix51-results.txt\
        \ -Append;$r | Tee-Object -FilePath output/mtfix51-results.txt -Append\n  }\n  if($sv[0] -eq '51'){\n  \
        \ foreach($leaf in @('C:/outside-link/escape.dbf','C:/inside-link/escape.dbf','C:/outside-link/../Creative.acd/escape.dbf','C:/../mtfix51-outside/escape.dbf')){\n\
        \    $url=$scheme+'://127.0.0.1:6262/'+$(if($legacy){'C:/'}else{'C:/Temp'})\n    $r=& matrix-client/root-table-matrix.exe\
        \ $url $leaf 'C:/mtfix51-outside/escape.dbf' 2>&1\n    $t=$r -join \"`n\";if($t -match 'CREATE=0' -or (Test-Path\
        \ 'C:/mtfix51-outside/escape.dbf')){throw ('jail escape '+$leaf+' '+$t)}\n    \"JAIL $case $leaf`n$t\" |\
        \ Tee-Object output/mtfix51-jail-proof.txt -Append\n   }\n  }\n  if($sv[0] -in @('49','51') -and $legacy\
        \ -eq 0 -and $scheme -eq 'tcp'){\n   foreach($i in 1..30){Remove-Item 'C:/Temp/Creative.acd/speed.dbf' -ErrorAction\
        \ SilentlyContinue;$w=[Diagnostics.Stopwatch]::StartNew();$rr=& matrix-client/root-table-matrix.exe 'tcp://127.0.0.1:6262/C:/Temp'\
        \ 'C:/Creative.acd/speed.dbf' 'C:/Temp/Creative.acd/speed.dbf' 2>&1;$w.Stop();if(($rr -join ' ') -notmatch\
        \ 'OPEN=0'){throw 'speed control failed'};$speed+=@{version=$sv[0];iteration=$i;elapsed_ms=$w.Elapsed.TotalMilliseconds}}\n\
        \  }\n }finally{if(-not $p.HasExited){$p.Kill();$p.WaitForExit()}}\n}}}\n$rows | ConvertTo-Json -Depth 5\
        \ | Set-Content output/mtfix51-results.json -Encoding utf8\n$speed | ConvertTo-Json -Depth 5 | Set-Content\
        \ output/mtfix51-speed.json -Encoding utf8\nforeach($row in @($rows | Where-Object {$_.version -eq '51'\
        \ -and -not ($_.legacy -eq 1 -and $_.root -in @('C:/','D:/','C:/Temp',''))})){\n $b=@($rows | Where-Object\
        \ {$_.version -eq '49' -and $_.legacy -eq $row.legacy -and $_.scheme -eq $row.scheme -and $_.root -eq $row.root})[0]\n\
        \ if($row.result -ne $b.result -or ($row.actual -join ';') -ne ($b.actual -join ';')){throw ('unexpected49\
        \ parity change '+$row.root+' '+$row.result+' vs '+$b.result)}\n $c=@($rows | Where-Object {$_.version -eq\
        \ '44' -and $_.legacy -eq $row.legacy -and $_.scheme -eq $row.scheme -and $_.root -eq $row.root})[0]\n if($b.result\
        \ -ne $c.result){throw ('44/49 mismatch '+$row.root)}\n}\n'PASS: legacy self-root restored; strict policy\
        \ unchanged;49 parity elsewhere; junction and traversal refusal' | Tee-Object -FilePath output/mtfix51-results.txt\
        \ -Append\nexit 0\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mtfix51-windows-proof
        path: 'output/

          build-legacy/tools/serverd/openads_serverd.exe'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mtfix51-server-candidate
        path: 'build-legacy/tools/serverd/openads_serverd.exe

          mtfix51-legacy-self-root.patch'
