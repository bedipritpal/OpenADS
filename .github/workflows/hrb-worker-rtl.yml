name: 1.09.74 reconciliation native baseline comparison TEST (Pritpal Bedi)
'on':
  push:
    branches:
    - spike-unmerged/hrb-challenge-auth
    paths:
    - .github/workflows/hrb-worker-rtl.yml
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.stage.outputs.sha }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: test-reconcile/1.09.74-main42-43
        fetch-depth: 0
    - name: Stage exact selective candidate on new TEST branch only
      id: stage
      shell: bash
      run: |
        set -euxo pipefail
        test "$GITHUB_REF" = refs/heads/spike-unmerged/hrb-challenge-auth
        test "$(git rev-parse HEAD)" = 0b92b60bba39305489f7bb2c3e6fe69d872f4506
        python - <<'PYTHON'
        import base64,gzip,pathlib,hashlib
        p=gzip.decompress(base64.b64decode(''))
        assert hashlib.sha256(p).hexdigest()=='888fb2d8356c7ea4180a6dca904aa0de8e5cc106fe1ebe9ad22050a6884aaa9c'
        pathlib.Path('fixture.patch').write_bytes(p)
        PYTHON
        git apply --check fixture.patch
        git apply fixture.patch
        rm fixture.patch
        git add .
        git -c user.name='Pritpal Bedi test assistant' -c user.email='bedipritpal@users.noreply.github.com' commit -m '1.09.74 TEST fix diagnostics fixtures for master gate and masked identities'
        git push origin HEAD:refs/heads/test-reconcile/1.09.74-main42-43
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86
          bits: 32
          checksum: 019ee601c48069b91101a3af923bf2cdd4399c99b9a1c70b5d59da9cfbb8e907
          folder: mingw32
          url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z
          checksum_url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z.sha256
        - arch: x64
          bits: 64
          checksum: 1e525afc8a3362a1054d7a9a44c8f496a7a652b224b79dbf4b6e5ca8c1012b74
          folder: mingw64
          url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-x86_64-posix-seh-gcc-10.2.0-mingw-w64-8.0.0-r8.7z
          checksum_url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-x86_64-posix-seh-gcc-10.2.0-mingw-w64-8.0.0-r8.7z.sha256
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.prepare.outputs.sha }}
        persist-credentials: false
    - name: Download and verify Winlibs GCC10.2
      shell: pwsh
      run: |
        Invoke-WebRequest '${{ matrix.url }}' -OutFile "$env:RUNNER_TEMP/winlibs.7z"
        $sum = (Invoke-WebRequest '${{ matrix.checksum_url }}').Content
        $expected = '${{ matrix.checksum }}'
        Write-Host "Expected: $expected"
        $actual = (Get-FileHash "$env:RUNNER_TEMP/winlibs.7z" -Algorithm SHA256).Hash.ToLower()
        Write-Host "Actual: $actual"
        if ($actual -ne $expected) { throw 'Toolchain digest mismatch' }
        & 7z x "$env:RUNNER_TEMP/winlibs.7z" "-o$env:RUNNER_TEMP/winlibs" -y
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "$env:RUNNER_TEMP/winlibs/${{ matrix.folder }}/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Compile candidate and exact unchanged-main baseline
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p output
        cat > native-temp-probe.cpp <<'CPPEOF'
        #include <filesystem>
        #include <windows.h>
        #include <cstdlib>
        #include <iostream>
        int main(){for(auto n:{"TMP","TEMP","TMPDIR"})std::cout<<n<<"="<<(std::getenv(n)?std::getenv(n):"NULL")<<"\n";char b[4096]{};GetTempPathA(sizeof(b),b);std::cout<<"GetTempPathA="<<b<<"\n";std::error_code ec;auto p=std::filesystem::temp_directory_path(ec);std::cout<<"temp="<<p<<" err="<<ec.message()<<"\n";for(auto path:{b,"C:/Windows/Temp"}){ec.clear();auto s=std::filesystem::status(path,ec);std::cout<<path<<" type="<<int(s.type())<<" err="<<ec.message()<<"\n";}return ec?1:0;}
        CPPEOF
        g++ -std=c++17 native-temp-probe.cpp -o output/native-temp-probe.exe
        cmake -S . -B build-test -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0600 -DOPENADS_BUILD_TESTS=ON -DOPENADS_WITH_HTTP=OFF -DOPENADS_WITH_TLS=OFF -DOPENADS_WITH_HARBOUR_UDF=OFF -DOPENADS_WARNINGS_AS_ERRORS=OFF -DOPENADS_VERSION_FORCE=1.09.74-reconcile-test
        cmake --build build-test --target openads_ace openads_ace_static openads_serverd openads_unit_tests openads_static_archive_smoke -j2
        git fetch origin c450a220570e0fe7036a91aee66fe27ae3bee36d
        git worktree add --detach baseline c450a220570e0fe7036a91aee66fe27ae3bee36d
        cmake -S baseline -B build-baseline -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0600 -DOPENADS_BUILD_TESTS=ON -DOPENADS_WITH_HTTP=OFF -DOPENADS_WITH_TLS=OFF -DOPENADS_WITH_HARBOUR_UDF=OFF -DOPENADS_WARNINGS_AS_ERRORS=OFF -DOPENADS_VERSION_FORCE=1.09.74-reconcile-test
        cmake --build build-baseline --target openads_serverd openads_unit_tests -j2
        git rev-parse HEAD > output/source-commit.txt
    - name: Run native suites from PowerShell with same temp environment
      shell: pwsh
      run: |
        $tmp=Join-Path $env:RUNNER_TEMP 'openads-native-valid-temp'
        New-Item -ItemType Directory -Force $tmp | Out-Null
        $env:TMP=$tmp; $env:TEMP=$tmp; $env:TMPDIR=$tmp
        & output/native-temp-probe.exe | Tee-Object output/native-temp-proof.txt
        $env:OPENADS_TEST_SERVERD=(Resolve-Path build-baseline/tools/serverd/openads_serverd.exe).Path
        & build-baseline/tests/openads_unit_tests.exe '--test-case-exclude=*soak*,*bench*,*5000*' > output/baseline-proof.txt
        $baselineStatus=$LASTEXITCODE
        & build-baseline/tests/openads_unit_tests.exe '--test-case=*5000*,*mtfix35*' > output/baseline-count-proof.txt
        $env:OPENADS_TEST_SERVERD=(Resolve-Path build-test/tools/serverd/openads_serverd.exe).Path
        & build-test/tests/openads_unit_tests.exe '--test-case-exclude=*soak*,*bench*,*5000*' > output/unit-proof.txt
        $candidateStatus=$LASTEXITCODE
        "baseline_status=$baselineStatus candidate_status=$candidateStatus" | Out-File output/unit-status.txt
        & build-test/tests/openads_unit_tests.exe '--test-case=*5000*,*mtfix35*' > output/count-proof.txt
        "count_status=$LASTEXITCODE" | Out-File output/count-status.txt
        & build-test/tools/serverd/openads_serverd.exe --version > output/version.txt
        & ctest --test-dir build-test -R 'master_diagnostics_integration|static_archive_link_run|serverd_help_default|portal_health' --output-on-failure > output/ctest-proof.txt
        if($LASTEXITCODE -ne 0){throw 'Focused CTest failed'}
    - name: Gate on zero new failures and package test candidate
      shell: bash
      run: |
        set -euxo pipefail
        python - <<'PYTHON'
        import pathlib,re,json
        root=pathlib.Path('output')
        def failed(name):
         raw=(root/name).read_bytes()
         s=raw.decode('utf-16') if raw[:2] in (b'\xff\xfe',b'\xfe\xff') else raw.decode('utf-8-sig',errors='replace')
         (root/(name+'.utf8')).write_text(s)
         failures={}
         for c in s.split('==============================================================================='):
          match=re.search(r'TEST CASE:\s+([^\n]+)',c)
          if match and (' ERROR:' in c or ' FATAL' in c):
           # Compare error count too; no new assertions inside a known-failing case.
           failures[match.group(1)]=c.count(' ERROR:')+c.count(' FATAL')
         return failures,s
        b,bs=failed('baseline-proof.txt');a,cs=failed('unit-proof.txt')
        new={k:v for k,v in a.items() if v>b.get(k,0)}
        (root/'baseline-comparison.json').write_text(json.dumps({'baseline_failed_cases':len(b),'candidate_failed_cases':len(a),'new_or_increased_failures':new},indent=2))
        print((root/'baseline-comparison.json').read_text())
        assert '[doctest] Status:' in bs and '[doctest] Status:' in cs
        assert not new, 'New or increased candidate failures'
        assert 'temp_directory_path: No such file or directory' not in cs, 'Native temp environment still unusable'
        assert len(a)<300, 'Suite is not exercising enough product behavior'
        bc,_=failed('baseline-count-proof.txt');ac,_=failed('count-proof.txt')
        assert not {k:v for k,v in ac.items() if v>bc.get(k,0)}, 'New count regression'
        version=(root/'version.txt').read_text(encoding='utf-8-sig')
        assert '1.09.74-reconcile-test' in version
        # The baseline is visibly not a clean suite. Never label this comparison a full pass.
        PYTHON
        BITS=${{ matrix.bits }}
        g++ -std=c++17 -Iinclude tests/smoke/mingw_static_ace.cpp "build-test/src/libopenace$BITS.a" -static -lws2_32 -lpsapi -o output/static-smoke.exe
        output/static-smoke.exe > output/static-proof.txt
        mkdir -p output/client-kit/bin output/client-kit/lib output/client-kit/include output/client-kit/contrib
        cp build-test/src/*ace*.dll build-test/tools/serverd/openads_serverd.exe output/client-kit/bin/
        cp build-test/src/*openace*.a output/client-kit/lib/
        cp include/openads/ace.h output/client-kit/include/
        cp contrib/oads_hb/oads_hb.c output/client-kit/contrib/
        git clone https://github.com/harbour/core.git "$RUNNER_TEMP/harbour-rdd-matched"
        git -C "$RUNNER_TEMP/harbour-rdd-matched" checkout --detach 4ec2e154ed92757418bc30af571ab90240ab3209
        for unit in ads1 adsfunc adsmgmnt adsx; do
         gcc -c "$RUNNER_TEMP/harbour-rdd-matched/contrib/rddads/$unit.c" -I"$RUNNER_TEMP/harbour-rdd-matched/include" -I"$RUNNER_TEMP/harbour-rdd-matched/contrib/rddads" -Iinclude/openads -o "output/$unit.o"
        done
        ar rcs output/client-kit/lib/librddads_openads_static.a output/ads1.o output/adsfunc.o output/adsmgmnt.o output/adsx.o
        cp "$RUNNER_TEMP/harbour-rdd-matched/contrib/rddads/ads.ch" output/client-kit/include/
        cp docs/master-diagnostics.md docs/MAIN_1_09_74_RECONCILE_TEST.md output/
        (cd output/client-kit; sha256sum bin/* lib/* include/* contrib/* > SHA256.txt)
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: 1.09.74-reconcile-test-${{ matrix.arch }}
        path: output/
        if-no-files-found: error
        retention-days: 14
