name: Stage 5a remote file transport review on current parent
on:
  push:
    branches: [stage5a/vf-file-transport, stage5a/vf-file-transport-v2]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Configure
        run: cmake --preset ninja-clang -DOPENADS_WITH_TLS=ON -DOPENADS_WARNINGS_AS_ERRORS=OFF
      - name: Build
        run: cmake --build build/ninja-clang --parallel 2
      - name: List tests
        run: ctest --test-dir build/ninja-clang -N
      - name: Unit suite and integration tests, soak excluded
        run: ctest --test-dir build/ninja-clang --output-on-failure -E soak
      - name: Explicit remote file transport tests
        shell: bash
        run: |
          set -o pipefail
          build/ninja-clang/tests/openads_unit_tests -tc='oads_* local:*,oads_* remote embedded:*' -tce='*[slow]*,*flaky*' | tee stage5a-file-transport.txt
