        \ \"1.09.74\"\ndiff --git a/release-notes-1.09.74.md b/release-notes-1.09.74.md\nnew file mode 100644\nindex 00000000..dc3619f6\n--- /dev/null\n\
        +++ b/release-notes-1.09.74.md\n@@ -0,0 +1,97 @@\n+# OpenADS 1.09.74 - upstream-based integration candidate\n+\n+DRAFT NOTES. Version name is proposed.\
        \ This build has not been created.\n+STABLE RELEASE CANDIDATE. Not published or cleared yet.\n+\n+The candidate starts from upstream main after\
        \ the focused port queue, PR192,\n+commit 383dac64933db2e8eba0efaa0f96967f1ae4c99f. It keeps upstream's stronger\n+login, management authentication,\
        \ malformed-frame checks and resource limits.\n+It does not restore older fork network behavior.\n+\n+Thanks to Pritpal Bedi for the multi-instance\
        \ Vouch tests, billing-counter\n+traces, stale-read reports and tea-break idle-session report behind these ports.\n+\n+## Changes in the upstream-based\
        \ candidate\n+\n+- CDX bottom navigation reaches the rightmost index leaf directly and refreshes\n+  it for peer changes. Physical record counts\
        \ and ordered-position counts use\n+  their correct contracts; ordered-position SET behavior is unchanged.\n+- Open replies carry bounded production-index\
        \ metadata, with a matching-bag\n+  check before the client uses it. Server table paths reject symlink escapes.\n+- The mtfix39 lock-row refresh,\
        \ mtfix40 remote-file wait handling and mtfix41\n+  healthy-idle session policy are retained in the upstream line.\n+- OAdsGetServerStats supplies\
        \ bounded JSON health data for local or authenticated\n+  remote management handles. Harbour wrappers and a bounded text/GT display,\n+  Studio\
        \ health GET and DA-Web health display consume it.\n+- DA-Web management credentials are kept in a server-side PHP session, scoped\n+  to the endpoint\
        \ and expired after 20 minutes. Reconnect/disconnect, logout,\n+  expiry and endpoint changes clear them. Non-loopback credential entry needs\n\
        +  HTTPS. All management JSON POST actions require the session CSRF token.\n+\n+Existing clients that POST directly to DA-Web management endpoints\
        \ must obtain\n+and send that CSRF token. The health display is read-only; management actions\n+still require their own authentication. Studio uses\
        \ its existing auth gate,\n+no-store responses and manual refresh.\n+\n+Management sockets remain plain TCP, including credentials. HTTPS between\n\
        +the browser and PHP does not encrypt PHP-to-daemon management traffic. Use\n+a trusted management network or TLS proxy and protected PHP session\
        \ storage.\n+DA-Web files are deployed separately from the binary archives.\n+\n+## Compatibility and limits\n+\n+Default remote record-count caching\
        \ remains. The fork's opt-in\n+OPENADS_FRESH_COUNTS switch was parked during upstream review and is not in this\n+candidate. Do not treat a cached\
        \ count as a peer-fresh count.\n+\n+The daemon's established database-session idle cutoff remains disabled by\n+default. A positive established_session_idle_seconds\
        \ server INI setting or\n+matching CLI flag opts into disconnecting inactive database sessions and\n+releasing their workareas and locks. Handshake,\
        \ partial-frame, reply-drain and\n+management-session timers remain separate. Real disconnects still clean up.\n+\n+Harbour remote health accepts\
        \ a hostname or IPv4 address, not a URI or IPv6\n+literal. Its fixed 8192-byte buffer fails on a larger reply rather than showing\n+truncated JSON.\
        \ App code must compile the matching OAds glue and use matching\n+DLL/import/static libraries. TLS and local-process health are separate from\n\
        +whether a particular application reconnects safely after a real failure.\n+\n+No automatic reconnect or replay is added. This does not guarantee\
        \ survival of\n+host OOM/SIGKILL or unlimited client sessions. No fresh Vouch application test\n+of this candidate has been claimed.\n+\n+## Validation\
        \ before publication\n+\n+The reviewed upstream head with the same code tree passed all 11 source CI\n+checks: Windows x86/x64, macOS, Linux normal/TLS,\
        \ Harbour, PHP and SQL gates.\n+https://github.com/FiveTechSoft/OpenADS/actions/runs/38024837993\n+\n+Fresh local Linux normal builds of ACE and\
        \ the daemon report 1.09.74.\n+A selected 50-case/1,027-assertion health, path-jail, open-budget, management,\n+idle-policy, CDX and encryption\
        \ regression run passes. The PHP management\n+sandbox and renderer contracts also pass. These are selected local checks,\n+not full CTest or new\
        \ cross-platform release validation.\n+\n+That source CI is not validation of the new packaging patch. The candidate's\n+five package builds, MinGW\
        \ static/import probes, archive integrity/version\n+checks and application test clearance remain pending. These notes must be\n+updated with the\
        \ actual candidate build result before publication.\n+\n+## Planned packages\n+\n+Windows x86 and x64 ZIPs carry both ACE DLL names, MSVC imports,\
        \ refreshed\n+MinGW DLL imports and MinGW static ACE libraries. Linux x64 and glibc2.31\n+archives, plus macOS universal, carry both shared-library\
        \ names. All carry\n+matching headers, OAds glue and stats display source, license, notices and\n+sample server INI. The glibc2.31 package is for\
        \ older Linux systems that cannot\n+load the Ubuntu24-built library. Check the actual package before choosing it.\n+\n+## Application check\n+\n\
        +The stable release remains blocked on Pritpal's review of the exact content and\n+his Vouch clearance. Use an isolated installation for that clearance.\
        \ Match DLL/import libraries/glue to this build.\n+Test multi-instance billing paths, record-lock exclusion and refresh after lock,\n+peer append/bottom\
        \ navigation, module open/close, healthy idle longer than five\n+minutes, real disconnect cleanup and login-lock reacquisition. Exercise local\n\
        +and authenticated remote health, HTTPS management entry, logout/expiry and\n+legacy actions with CSRF. Confirm the intended count-cache behavior.\n\
        diff --git a/tests/mingw_import_parser_test.py b/tests/mingw_import_parser_test.py\nnew file mode 100644\nindex 00000000..1ffd9e2f\n--- /dev/null\n\
        +++ b/tests/mingw_import_parser_test.py\n@@ -0,0 +1,12 @@\n+\"\"\"Binutils export output formats seen locally and on current MSYS2.\"\"\"\n+from\
        \ importlib.util import spec_from_file_location, module_from_spec\n+from pathlib import Path\n+spec = spec_from_file_location(\"imports\", Path(__file__).resolve().parents[1]\
        \ / \"tools/scripts/regenerate_mingw_imports.py\")\n+module = module_from_spec(spec)\n+spec.loader.exec_module(module)\n+expected = [\"OAdsGetServerStats\"\
        , \"_OAdsGetServerStats@12\"]\n+for text in [\"\\t[ 123] OAdsGetServerStats\\n\\t[124] _OAdsGetServerStats@12\\n\",\n+             \"\\t[ 123] +base[\
        \ 124] 007b OAdsGetServerStats\\n\\t[124] +base[125] 007c _OAdsGetServerStats@12\\n\"]:\n+    assert module.parse_export_names(text) == expected\n\
        +assert module.parse_export_names(\"\\t[ 123] +base[124] 000ffff Export RVA\\n\") == []\n+print(\"MinGW export parser contracts passed\")\ndiff\
        \ --git a/tools/scripts/regenerate_mingw_imports.py b/tools/scripts/regenerate_mingw_imports.py\nnew file mode 100644\nindex 00000000..bbed56c4\n\
        --- /dev/null\n+++ b/tools/scripts/regenerate_mingw_imports.py\n@@ -0,0 +1,62 @@\n+\"\"\"Regenerate MinGW ACE imports from the just-built DLL, not\
        \ stale exports.\n+Run in the matching MinGW environment: python3 script DLL OLD_LIB OUTPUT BITS.\n+Retain the old symbols for legacy shims, add\
        \ every actual ACE/VFS export,\n+and require a PE link probe for the new health function before staging.\n+\"\"\"\n+import pathlib, re, shutil,\
        \ subprocess, sys, tempfile\n+\n+def run(*args, **kwargs):\n+    return subprocess.run(args, check=True, text=True, **kwargs)\n+\n+def parse_export_names(text):\n\
        +    # Binutils before 2.44 prints [ordinal] name; newer versions print\n+    # [ordinal] +base[base] name-index name. Match only name-table lines.\n\
        +    return re.findall(r'^\\s*\\[\\s*\\d+\\]\\s+(?:\\+base\\[\\s*\\d+\\]\\s+[0-9a-fA-F]+\\s+)?(\\S+)\\s*$', text, re.M)\n+\n+\n+def main():\n+ \
        \   dll, old, output, bits = sys.argv[1:]\n+    dll, old, output = map(lambda p: pathlib.Path(p).resolve(), (dll, old, output))\n+    text = run('objdump',\
        \ '-p', str(dll), capture_output=True).stdout\n+    names = parse_export_names(text)\n+    plain = [n for n in names if re.match(r'^(Ads|OAds|oads_)',\
        \ n)]\n+    std = [n for n in names if re.match(r'^_(Ads|OAds|oads_)', n)] if bits == '32' else []\n+    assert 'OAdsGetServerStats' in plain, 'Built\
        \ DLL lacks health export'\n+    if bits == '32':\n+        assert '_OAdsGetServerStats@12' in std, 'Built DLL lacks stdcall health export'\n+ \
        \   with tempfile.TemporaryDirectory() as temp:\n+        work = pathlib.Path(temp)\n+        libs = [old] if old.exists() else []\n+        for\
        \ kind, exports in [('cdecl', plain), ('stdcall', std)]:\n+            if not exports:\n+                continue\n+            definition = work\
        \ / (kind + '.def')\n+            definition.write_text('LIBRARY ace' + bits + '.dll\\nEXPORTS\\n' + '\\n'.join(exports) + '\\n', encoding='ascii')\n\
        +            library = work / (kind + '.a')\n+            flags = ['--no-leading-underscore'] if kind == 'stdcall' else []\n+            run('dlltool',\
        \ *flags, '--input-def', str(definition), '--dllname', 'ace' + bits + '.dll', '--output-lib', str(library))\n+            libs.append(library)\n\
        +        output.parent.mkdir(parents=True, exist_ok=True)\n+        # MRI scripts accept forward-slash paths; CI paths have no spaces.\n+      \
        \  def mri_path(path):\n+            if shutil.which('cygpath'):\n+                return run('cygpath', '-m', str(path), capture_output=True).stdout.strip()\n\
        +            return path.as_posix()\n+        script = 'CREATE ' + mri_path(output) + '\\n' + ''.join('ADDLIB ' + mri_path(p) + '\\n' for p in libs)\
        \ + 'SAVE\\nEND\\n'\n+        run('ar', '-M', input=script)\n+        symbols = run('nm', '-g', str(output), capture_output=True).stdout\n+    \
        \    required = ['_OAdsGetServerStats', '_OAdsGetServerStats@12'] if bits == '32' else ['OAdsGetServerStats']\n+        for name in required:\n\
        +            assert re.search(r'\\bT ' + re.escape(name) + r'$', symbols, re.M), 'Missing import: ' + name\n+        # Linking both conventions\
        \ checks more than symbol-string presence.\n+        source = '.text\\n.globl probe_entry\\nprobe_entry:\\n' + ''.join(' call ' + n + '\\n' for\
        \ n in required) + ' ret\\n'\n+        asm, obj, exe = work / 'probe.s', work / 'probe.o', work / 'probe.exe'\n+        asm.write_text(source, encoding='ascii')\n\
        +        run('as', str(asm), '-o', str(obj))\n+        run('ld', str(obj), str(output), '-e', 'probe_entry', '-o', str(exe))\n+        imports =\
        \ run('objdump', '-p', str(exe), capture_output=True).stdout\n+        assert 'ace' + bits + '.dll' in imports and 'OAdsGetServerStats' in imports\n\
        +        print('Fresh import library and health link probe passed:', output)\n+\n+if __name__ == \"__main__\":\n+    main()\nREVIEWED_CANDIDATE_PATCH\n\
        echo \"c10697ff4b4305128e91c3376955720c975b22629ba126b61470573da27de593  $RUNNER_TEMP/candidate.patch\" | sha256sum --check --strict\ngit apply\
        \ --check \"$RUNNER_TEMP/candidate.patch\"\ngit apply \"$RUNNER_TEMP/candidate.patch\"\ngit add .github/workflows/release.yml CMakeLists.txt include/openads/version.h\
        \ release-notes-1.09.74.md tests/mingw_import_parser_test.py tools/scripts/regenerate_mingw_imports.py\ntest \"$(git write-tree)\" = \"c160c4587a29ae8952431231cd81d38ee52e71b6\"\
        \ngit config user.name 'Pritpal Bedi'\ngit config user.email 'bedipritpal@users.noreply.github.com'\ngit commit -m 'Prepare reviewed OpenADS1.09.74\
        \ stable candidate'\ntest \"$(git ls-remote https://github.com/FiveTechSoft/OpenADS.git refs/heads/main | cut -f1)\" = \"$base\"\ngit push origin\
        \ HEAD:refs/heads/release/1.09.74-candidate\necho \"head=$(git rev-parse HEAD)\" >> \"$GITHUB_OUTPUT\"\n"
  source-build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}${{ matrix.tls && ' / TLS' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2022
          preset: msvc-x64
          tls: false
        - os: windows-2022
          preset: msvc-x86
          tls: false
        - os: ubuntu-24.04
          preset: ninja-clang
          tls: false
        - os: macos-14
          preset: default
          tls: false
        - os: ubuntu-24.04
          preset: ninja-clang
          tls: true
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-tags: true
        fetch-depth: 0
        ref: ${{ needs.candidate.outputs.head }}
    - name: Install Ninja (Linux / macOS)
      if: runner.os != 'Windows'
      uses: seanmiddleditch/gha-setup-ninja@v6
    - name: Configure
      run: "cmake --preset ${{ matrix.preset }} \\\n      ${{ matrix.tls && '-DOPENADS_WITH_TLS=ON' || '' }}\n"
      shell: bash
    - name: Build
      run: cmake --build build/${{ matrix.preset }} --config Release --target dbf_cdx_bench openads_unit_tests
    - name: Test
      run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure -C Release
    - name: Bench smoke (CDX multi-tag create)
      run: "BENCH=\"build/${{ matrix.preset }}/tests/Release/dbf_cdx_bench${{ runner.os == 'Windows' && '.exe' || '' }}\"\nif [ -f \"$BENCH\" ]; then\n\
        \  \"$BENCH\" 1000 || true\nfi\n"
      shell: bash
    needs: candidate
  source-php-binding:
    name: PHP binding
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.candidate.outputs.head }}
    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@v6
    - name: Build OpenADS ACE library
      run: 'cmake --preset ninja-clang

        cmake --build build/ninja-clang --config Release --target openads_ace

        '
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: ffi
        ini-values: ffi.enable=1
    - name: Install PHP dependencies
      working-directory: bindings/php
      run: composer install --no-interaction
    - name: Run PHP binding tests
      working-directory: bindings/php
      env:
        OPENADS_ACE_LIB: ${{ github.workspace }}/build/ninja-clang/src/libace64.so
      run: composer test
    needs: candidate
  source-sql-uri-smoke:
    name: SQL URI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.candidate.outputs.head }}
    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@v6
    - name: Configure
      run: cmake --preset ninja-clang
      shell: bash
    - name: Build unit tests
      run: cmake --build build/ninja-clang --config Release --target openads_unit_tests
      shell: bash
    - name: Run SQL URI smoke tests
      run: "ctest --test-dir build/ninja-clang -C Release --output-on-failure \\\n  -R \"sql_uri_smoke|sqlite_filter_pushdown|sqlite_seek_smoke\"\n"
      shell: bash
    needs: candidate
  source-sql-live-pg-maria:
    name: SQL live PG + Maria
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: test
        ports:
        - 3306:3306
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.candidate.outputs.head }}
    - name: Install build deps
      run: 'sudo apt-get update

        sudo apt-get install -y ninja-build libpq-dev libmariadb-dev

        '
    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@v6
    - name: Configure (PostgreSQL + MariaDB)
      run: "cmake --preset ninja-clang \\\n  -DOPENADS_WITH_POSTGRESQL=ON \\\n  -DOPENADS_WITH_MARIADB=ON\n"
      shell: bash
    - name: Build unit tests
      run: cmake --build build/ninja-clang --config Release --target openads_unit_tests
      shell: bash
    - name: Run live PG + Maria smoke tests
      env:
        OPENADS_TEST_PG_URI: postgresql://postgres@127.0.0.1:5432/postgres
        OPENADS_TEST_MARIADB_URI: mariadb://root@127.0.0.1:3306/test
      run: "ctest --test-dir build/ninja-clang -C Release --output-on-failure \\\n  -R \"pg_live_smoke|maria_live_smoke\"\n"
      shell: bash
    needs: candidate
  source-sql-live-mssql:
    name: SQL live MSSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: OpenADS_CI_Passw0rd!
        ports:
        - 1433:1433
        options: --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P OpenADS_CI_Passw0rd! -Q 'SELECT 1' || exit 1" --health-interval 10s
          --health-timeout 5s --health-retries 10 --health-start-period 30s
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.candidate.outputs.head }}
    - name: Install build deps
      run: sudo apt-get update && sudo apt-get install -y ninja-build
    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@v6
    - name: Configure (MSSQL)
      run: cmake --preset ninja-clang -DOPENADS_WITH_MSSQL=ON -DOPENADS_WITH_TLS=ON
      shell: bash
    - name: Build unit tests
      run: cmake --build build/ninja-clang --config Release --target openads_unit_tests
      shell: bash
    - name: Run live MSSQL smoke test
      env:
