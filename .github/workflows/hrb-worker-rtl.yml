name: HRB auth capacity TEST ONLY (Pritpal Bedi)
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86
          bits: 32
          checksum: 019ee601c48069b91101a3af923bf2cdd4399c99b9a1c70b5d59da9cfbb8e907
          folder: mingw32
          url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z
          checksum_url: https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z.sha256
    steps:
    - uses: actions/checkout@v5
      with:
        ref: spike-unmerged/hrb-challenge-auth
        fetch-depth: 0
        persist-credentials: true
    - name: Apply exact approved capacity patch on test branch only
      shell: bash
      run: |
        set -euxo pipefail
        test "$GITHUB_REF" = refs/heads/spike-unmerged/hrb-challenge-auth
        git diff --quiet 6c65f64495871590096f278c892edc4284cf4c03 HEAD -- src/network/auth_worker.cpp src/network/auth_worker.h src/network/session.cpp tools/serverd/config_ini.cpp tools/serverd/config_ini.h tools/serverd/main.cpp tools/serverd/CMakeLists.txt tests/unit/serverd_config_ini_test.cpp
        python - <<'PYTHON'
        import base64,gzip,pathlib
        pathlib.Path('capacity.patch').write_bytes(gzip.decompress(base64.b64decode('')))
        PYTHON
        git apply --check capacity.patch
        git apply capacity.patch
        rm capacity.patch
        git add src/network/auth_worker.cpp src/network/auth_worker.h src/network/session.cpp tools/serverd/config_ini.cpp tools/serverd/config_ini.h tools/serverd/main.cpp tools/serverd/CMakeLists.txt tests/unit/serverd_config_ini_test.cpp docs/HRB_AUTH_CAPACITY_TEST.md
        git -c user.name='Pritpal Bedi test assistant' -c user.email='bedipritpal@users.noreply.github.com' commit -m 'TEST ONLY auth capacity INI gate and busy without login penalty (owner approved)'
        git push origin HEAD:refs/heads/spike-unmerged/hrb-challenge-auth
        mkdir -p output
        git rev-parse HEAD > output/source-commit.txt
        cp docs/HRB_AUTH_CAPACITY_TEST.md output/
    - name: Download and verify Winlibs GCC10.2
      shell: pwsh
      run: |
        Invoke-WebRequest '${{ matrix.url }}' -OutFile "$env:RUNNER_TEMP/winlibs.7z"
        $sum = (Invoke-WebRequest '${{ matrix.checksum_url }}').Content
        $expected = '${{ matrix.checksum }}'
        Write-Host "Expected: $expected"
        $actual = (Get-FileHash "$env:RUNNER_TEMP/winlibs.7z" -Algorithm SHA256).Hash.ToLower()
        Write-Host "Actual: $actual"
        if ($actual -ne $expected) { throw 'Toolchain digest mismatch' }
        & 7z x "$env:RUNNER_TEMP/winlibs.7z" "-o$env:RUNNER_TEMP/winlibs" -y
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "$env:RUNNER_TEMP/winlibs/${{ matrix.folder }}/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Build matching Harbour and native isolated worker proofs
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p output
        gcc -v 2> output/toolchain.txt
        test "$(gcc -dumpfullversion)" = 10.2.0
        git clone https://github.com/harbour/core.git "$RUNNER_TEMP/harbour-auth"
        cd "$RUNNER_TEMP/harbour-auth"
        git checkout 6deac9cf3ad977ae829e5bca543d553b92dd4b6d
        export HB_COMPILER=${{ matrix.bits == 32 && 'mingw' || 'mingw64' }}
        export HB_BUILD_CONTRIBS=no
        export HB_BUILD_DYN=no
        mingw32-make -j2
        cd "$GITHUB_WORKSPACE"
        HBROOT="$RUNNER_TEMP/harbour-auth"
        HBINC="$HBROOT/include"
        HBLIB="$HBROOT/lib/win/$HB_COMPILER"
        HBCC="$HBROOT/bin/win/$HB_COMPILER/harbour.exe"
        cmake -S . -B build-auth -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0600 -DOPENADS_AUTH_CAPACITY_TEST_SWITCH=ON -DOPENADS_BUILD_TESTS=OFF -DOPENADS_BUILD_ACE_STATIC=ON -DOPENADS_WITH_HTTP=OFF -DOPENADS_WITH_TLS=ON -DOPENADS_WARNINGS_AS_ERRORS=OFF -DOPENADS_WITH_HARBOUR_UDF=ON -DHARBOUR_INCLUDE_DIR="$HBINC" -DHARBOUR_LIB_DIR="$HBLIB" '-DOPENADS_HARBOUR_LIBS=hbvmmt;hbrtl;hbmacro;hbpcre;hblang;hbcpage;hbrdd;rddfpt;rddntx;hbsix;hbcommon'
        cmake --build build-auth --target openads_auth_worker openads_serverd openads_ace openads_ace_static auth_spike_worker_probe auth_spike_integration_probe -j2
        "$HBCC" tests/hrb/auth-spike/test_only.prg -gh -ooutput/test_only.hrb
        cat > output/config-test.cpp <<'EOF'
        #define DOCTEST_CONFIG_IMPLEMENT_WITH_MAIN
        #include "doctest.h"
        #include "tests/unit/serverd_config_ini_test.cpp"
        EOF
        g++ -std=c++17 -DOPENADS_AUTH_CAPACITY_TEST_SWITCH=1 -I. -Ithird_party/doctest output/config-test.cpp tools/serverd/config_ini.cpp -o output/config-test-on.exe
        output/config-test-on.exe > output/config-test-on.txt
        g++ -std=c++17 -I. -Ithird_party/doctest output/config-test.cpp tools/serverd/config_ini.cpp -o output/config-test-off.exe
        output/config-test-off.exe > output/config-test-off.txt
        printf 'auth_worker_concurrency=0\n' > output/invalid.ini
        set +e
        build-auth/tools/serverd/openads_serverd.exe --config output/invalid.ini > output/invalid-startup.txt 2>&1
        status=$?
        set -e
        test "$status" = 2
        grep 'auth_worker_concurrency must be 1..256' output/invalid-startup.txt

        cat > output/rtl_family.prg <<'EOF'
        FUNCTION OADS_AUTH_V1(cChallenge,cBlob,cContext)
           LOCAL a := hb_ATokens("a|b", "|"), nPos := 0, cTok, cJson, aJson, cName, cBin := "A"+Chr(0)+Chr(255)+"B"
           IF cBlob == "__link_only_never_sent"
              ALLTRIM(NIL)
              ASC(NIL)
              AT(NIL,NIL)
              BIN2I(NIL)
              BIN2L(NIL)
              BIN2W(NIL)
              CHR(NIL)
              DESCEND(NIL)
              HARDCR(NIL)
              HB_ANSITOOEM(NIL)
              HB_ASCIIISALPHA(NIL)
              HB_ASCIIISDIGIT(NIL)
              HB_ASCIIISLOWER(NIL)
              HB_ASCIIISUPPER(NIL)
              HB_ASCIILOWER(NIL)
              HB_ASCIIUPPER(NIL)
              HB_AT(NIL)
              HB_ATI(NIL)
              HB_ATOKENS(NIL)
              HB_ATX(NIL)
              HB_BASE64DECODE(NIL)
              HB_BASE64ENCODE(NIL)
              HB_BAT(NIL)
              HB_BCHAR(NIL)
              HB_BCODE(NIL)
              HB_BLEFT(NIL)
              HB_BLEN(NIL)
              HB_BPADC(NIL)
              HB_BPADL(NIL)
              HB_BPADR(NIL)
              HB_BPEEK(NIL)
              HB_BPOKE(NIL)
              HB_BRAT(NIL)
              HB_BRIGHT(NIL)
              HB_BSTUFF(NIL)
              HB_BSUBSTR(NIL)
              HB_HEXTONUM(NIL)
              HB_HEXTOSTR(NIL)
              HB_ISREGEX(NIL)
              HB_JSONDECODE(NIL)
              HB_JSONENCODE(NIL)
              HB_LEFTEQ(NIL)
              HB_LEFTEQI(NIL)
              HB_MLEVAL(NIL)
              HB_NTOC(NIL)
              HB_NTOS(NIL)
              HB_NUMTOHEX(NIL)
              HB_OEMTOANSI(NIL)
              HB_RAT(NIL)
              HB_REGEX(NIL)
              HB_REGEXALL(NIL)
              HB_REGEXATX(NIL)
              HB_REGEXCOMP(NIL)
              HB_REGEXHAS(NIL)
              HB_REGEXLIKE(NIL)
              HB_REGEXMATCH(NIL)
              HB_REGEXSPLIT(NIL)
              HB_STRCDECODE(NIL)
              HB_STRCLEAR(NIL)
              HB_STRDECODESCAPE(NIL)
              HB_STRFORMAT(NIL)
              HB_STRISUTF8(NIL)
              HB_STRREPLACE(NIL)
              HB_STRSHRINK(NIL)
              HB_STRTOEXP(NIL)
              HB_STRTOHEX(NIL)
              HB_STRTOUTF8(NIL)
              HB_STRXOR(NIL)
              HB_TOKENCOUNT(NIL)
              HB_TOKENGET(NIL)
              HB_TOKENPTR(NIL)
              HB_TRANSLATE(NIL)
              HB_UAT(NIL)
              HB_UCHAR(NIL)
              HB_UCODE(NIL)
              HB_ULEFT(NIL)
              HB_ULEN(NIL)
              HB_UPADC(NIL)
              HB_UPADL(NIL)
              HB_UPADR(NIL)
              HB_UPEEK(NIL)
              HB_UPOKE(NIL)
              HB_URIGHT(NIL)
              HB_USTUFF(NIL)
              HB_USUBSTR(NIL)
              HB_UTF8ASC(NIL)
              HB_UTF8AT(NIL)
              HB_UTF8CHR(NIL)
              HB_UTF8LEFT(NIL)
              HB_UTF8LEN(NIL)
              HB_UTF8PEEK(NIL)
              HB_UTF8POKE(NIL)
              HB_UTF8RAT(NIL)
              HB_UTF8RIGHT(NIL)
              HB_UTF8STRTRAN(NIL)
              HB_UTF8STUFF(NIL)
              HB_UTF8SUBSTR(NIL)
              HB_UTF8TOSTR(NIL)
              HB_VAL(NIL)
              HB_VALTOSTR(NIL)
              HB_WILDMATCH(NIL)
              HB_WILDMATCHI(NIL)
              I2BIN(NIL)
              ISALPHA(NIL)
              ISDIGIT(NIL)
              ISLOWER(NIL)
              ISUPPER(NIL)
              L2BIN(NIL)
              LEFT(NIL,NIL)
              LEN(NIL)
              LOWER(NIL)
              LTRIM(NIL)
              MEMOLINE(NIL)
              MEMOTRAN(NIL)
              MLCOUNT(NIL)
              MLCTOPOS(NIL)
              MLPOS(NIL)
              MPOSTOLC(NIL)
              PAD(NIL)
              PADC(NIL)
              PADL(NIL)
              PADR(NIL)
              RAT(NIL)
              REPLICATE(NIL,NIL)
              RIGHT(NIL)
              RTRIM(NIL)
              SOUNDEX(NIL)
              SPACE(NIL)
              STR(NIL)
              STRTRAN(NIL)
              STRZERO(NIL)
              STUFF(NIL)
              SUBSTR(NIL,NIL)
              TRANSFORM(NIL,NIL)
              TRIM(NIL)
              UPPER(NIL)
              VAL(NIL)
              REVERSE(NIL)
           ENDIF
           cTok := hb_TokenPtr("a|b",@nPos,"|")
           IF Len(a) != 2 .OR. a[2] != "b" .OR. hb_TokenCount("a|b","|") != 2 .OR. ;
              hb_TokenGet("a|b",2,"|") != "b" .OR. cTok != "a" .OR. ;
              Reverse("A"+Chr(0)+"B") != "B"+Chr(0)+"A" .OR. Reverse("") != ""
              RETURN "BAD"
           ENDIF
           IF Right("abcd",2) != "cd" .OR. PadR("a",3,"x") != "axx" .OR. ;
              PadL("a",3,"x") != "xxa" .OR. PadC("a",3,"x") != "xax" .OR. ;
              hb_Utf8Len(hb_Utf8Chr(233)) != 1 .OR. hb_StrToHex("A"+Chr(0)) != "4100"
              RETURN "BADSTR"
           ENDIF
           cJson := hb_JsonEncode({"alpha",123,.T.})
           IF hb_JsonDecode(cJson,@aJson) != Len(cJson)
              RETURN "BADJSON"
           ENDIF
           IF Len(aJson) != 3 .OR. aJson[1] != "alpha" .OR. aJson[2] != 123 .OR. !aJson[3] .OR. ;
              hb_Base64Decode(hb_Base64Encode(cBin)) != cBin
              RETURN "BADCODEC"
           ENDIF
           RETURN "OAUTH"+Chr(1)+Chr(0)+Replicate(Chr(0),4)
        EOF
        "$HBCC" output/rtl_family.prg -gh -ooutput/rtl_family.hrb
    - name: Protect test-only module and run worker/DB proofs
      shell: pwsh
      run: |
        $hrb=(Resolve-Path output/test_only.hrb).Path
        $me=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name
        icacls $hrb /inheritance:r /remove:g '*S-1-3-4' /grant:r "${me}:(F)" '*S-1-5-18:(F)' '*S-1-5-32-544:(F)'
        if($LASTEXITCODE -ne 0){throw 'ACL failed'}
        $worker=(Resolve-Path build-auth/tools/serverd/openads_auth_worker.exe).Path
        & build-auth/tools/serverd/auth_spike_worker_probe.exe $worker $hrb | Tee-Object output/worker-proof.txt
        if($LASTEXITCODE -ne 0){throw 'worker proof failed'}
        & build-auth/tools/serverd/auth_spike_integration_probe.exe $worker $hrb | Tee-Object output/db-proof.txt
        if($LASTEXITCODE -ne 0){throw 'DB proof failed'}
        $dll=@(Get-ChildItem build-auth/src/*ace*.dll)
        if($dll.Count -ne 1){throw 'Expected one matching ACE DLL'}
        & objdump -p $dll[0].FullName > output/exports.txt
        if($LASTEXITCODE -ne 0){throw 'Export dump failed'}
        foreach($symbol in @('OAdsBeginAuth','OAdsCompleteAuth','OAdsCancelAuth')) {
         if(-not (Select-String -Path output/exports.txt -Pattern $symbol)){throw "Missing export $symbol"}
        }
        Get-Item build-auth/src/*ace*.dll,build-auth/tools/serverd/openads_auth_worker.exe,build-auth/tools/serverd/openads_serverd.exe | Select-Object Name,Length | Out-File output/sizes.txt
    - name: Verify enumerated RTL strings, JSON, Base64 and REVERSE in native worker
      shell: pwsh
      run: |
        $hrb=(Resolve-Path output/rtl_family.hrb).Path
        $me=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name
        icacls $hrb /inheritance:r /remove:g '*S-1-3-4' /grant:r "${me}:(F)" '*S-1-5-18:(F)' '*S-1-5-32-544:(F)'
        if($LASTEXITCODE -ne 0){throw 'ACL failed'}
        & objdump -t build-auth/tools/serverd/openads_auth_worker.exe > output/worker-symbols.txt
        if($LASTEXITCODE -ne 0){throw 'symbol dump failed'}
        foreach($symbol in @('ALLTRIM','ASC','AT','BIN2I','BIN2L','BIN2W','CHR','DESCEND','HARDCR','HB_ANSITOOEM','HB_ASCIIISALPHA','HB_ASCIIISDIGIT','HB_ASCIIISLOWER','HB_ASCIIISUPPER','HB_ASCIILOWER','HB_ASCIIUPPER','HB_AT','HB_ATI','HB_ATOKENS','HB_ATX','HB_BASE64DECODE','HB_BASE64ENCODE','HB_BAT','HB_BCHAR','HB_BCODE','HB_BLEFT','HB_BLEN','HB_BPADC','HB_BPADL','HB_BPADR','HB_BPEEK','HB_BPOKE','HB_BRAT','HB_BRIGHT','HB_BSTUFF','HB_BSUBSTR','HB_HEXTONUM','HB_HEXTOSTR','HB_ISREGEX','HB_JSONDECODE','HB_JSONENCODE','HB_LEFTEQ','HB_LEFTEQI','HB_MLEVAL','HB_NTOC','HB_NTOS','HB_NUMTOHEX','HB_OEMTOANSI','HB_RAT','HB_REGEX','HB_REGEXALL','HB_REGEXATX','HB_REGEXCOMP','HB_REGEXHAS','HB_REGEXLIKE','HB_REGEXMATCH','HB_REGEXSPLIT','HB_STRCDECODE','HB_STRCLEAR','HB_STRDECODESCAPE','HB_STRFORMAT','HB_STRISUTF8','HB_STRREPLACE','HB_STRSHRINK','HB_STRTOEXP','HB_STRTOHEX','HB_STRTOUTF8','HB_STRXOR','HB_TOKENCOUNT','HB_TOKENGET','HB_TOKENPTR','HB_TRANSLATE','HB_UAT','HB_UCHAR','HB_UCODE','HB_ULEFT','HB_ULEN','HB_UPADC','HB_UPADL','HB_UPADR','HB_UPEEK','HB_UPOKE','HB_URIGHT','HB_USTUFF','HB_USUBSTR','HB_UTF8ASC','HB_UTF8AT','HB_UTF8CHR','HB_UTF8LEFT','HB_UTF8LEN','HB_UTF8PEEK','HB_UTF8POKE','HB_UTF8RAT','HB_UTF8RIGHT','HB_UTF8STRTRAN','HB_UTF8STUFF','HB_UTF8SUBSTR','HB_UTF8TOSTR','HB_VAL','HB_VALTOSTR','HB_WILDMATCH','HB_WILDMATCHI','I2BIN','ISALPHA','ISDIGIT','ISLOWER','ISUPPER','L2BIN','LEFT','LEN','LOWER','LTRIM','MEMOLINE','MEMOTRAN','MLCOUNT','MLCTOPOS','MLPOS','MPOSTOLC','PAD','PADC','PADL','PADR','RAT','REPLICATE','RIGHT','RTRIM','SOUNDEX','SPACE','STR','STRTRAN','STRZERO','STUFF','SUBSTR','TRANSFORM','TRIM','UPPER','VAL','REVERSE')) {
         if(-not (Select-String -Path output/worker-symbols.txt -Pattern "HB_FUN_${symbol}$")){throw "Missing worker function $symbol"}
        }
        python -c "import subprocess,struct; w='build-auth/tools/serverd/openads_auth_worker.exe'; m='output/rtl_family.hrb'; p=subprocess.run([w,m],input=b'P',capture_output=True,timeout=5); assert p.returncode==0 and p.stdout==b'READY',(p.returncode,p.stdout,p.stderr); print('READY probe PASS'); f=b'A'+bytes(range(32))+struct.pack('<I',1)+b'x'+struct.pack('<I',0); p=subprocess.run([w,m],input=f,capture_output=True,timeout=5); assert p.returncode==0 and p.stdout==b'OAUTH'+bytes([1,0])+bytes(4),(p.returncode,p.stdout,p.stderr); print('token-family, padding, UTF8, JSON, binary-Base64 and REVERSE live calls PASS')" | Tee-Object output/rtl-live-proof.txt
        if($LASTEXITCODE -ne 0){throw 'RTL live proof failed'}
        Get-FileHash build-auth/tools/serverd/openads_auth_worker.exe -Algorithm SHA256 | Format-List | Out-File output/worker-sha256.txt
    - name: Package UNMERGED owner-test binaries only
      shell: pwsh
      run: |
        $root='output/hrb-auth-UNMERGED-${{ matrix.arch }}'
        New-Item -ItemType Directory -Force "$root/bin","$root/lib","$root/include","$root/contrib","$root/docs" | Out-Null
        Copy-Item build-auth/src/*ace*.dll "$root/bin/"
        Copy-Item build-auth/src/*openace*.a "$root/lib/"
        Copy-Item build-auth/tools/serverd/openads_serverd.exe,build-auth/tools/serverd/openads_auth_worker.exe "$root/bin/"
        $gccdir=Split-Path (Get-Command gcc.exe).Source
        Get-ChildItem "$gccdir/*.dll" | Where-Object { $_.Name -match '^lib(gcc_s|stdc\+\+|winpthread)' } | Copy-Item -Destination "$root/bin/"
        Copy-Item include/openads/ace.h "$root/include/"
        Copy-Item contrib/oads_hb/oads_hb.c "$root/contrib/"
        Copy-Item docs/HRB_CHALLENGE_AUTH_SPIKE.md "$root/docs/"
        @'
        UNMERGED TEST ONLY - Pritpal Bedi owner testing. No release/main/PR.
        Use matching x86/x64 files. Compiler stays Winlibs GCC10.2, Qt unchanged.
        Server: openads_serverd.exe --port 6262 --data <root> --auth_module <absolute own.hrb>
        The .hrb must have OADS_AUTH_V1(cChallenge,cBlob,cContext), exact result contract in docs.
        Protect own.hrb ACL to service identity/SYSTEM/Administrators only; inheritance off.
        Keep worker executable beside server. It loads the .hrb fresh per request.
        Client URL: auth://host:port/path. Add matching oads_hb.c glue, ace.h, import or static archive.
        cChallenge := OAds_BeginAuth(cUrl,@hPending)
        cBlob := VouchBuildCredentials(cChallenge)
        hConn := OAds_CompleteAuth(hPending,cBlob)
        No private crypto included. Do NOT deploy synthetic test_only.hrb from proof artifacts.
        TLS1.3 encrypted but SERVER UNVERIFIED: ACTIVE TERMINATION RELAY SUCCEEDS.
        No pooling of extra authenticated sessions; challenge blob4096 bytes, lifetime30s.
        TEST BUILD ONLY: INI auth_worker_concurrency=1..256, default4. Busy no login penalty. No queue;2s timeout.
        Native worker/normal DD login/wrong-password/DBFCDX record-lock proof passed.
        Full138 RTL worker retained; daemon adds guarded test-only capacity switch. Native owner storm measurement required.
        Test on copies/backups, not production data. Owner's tested pass required before any merge.
        '@ | Set-Content "$root/TEST_ONLY_README.txt"
        $hashes=Get-ChildItem "$root" -File -Recurse | Where-Object { $_.Name -ne 'SHA256.txt' } | Get-FileHash -Algorithm SHA256
        $hashes | ForEach-Object { $_.Hash.ToLower()+'  '+$_.Path.Substring((Resolve-Path $root).Path.Length+1) } | Set-Content "$root/SHA256.txt"
        Compress-Archive -Path "$root/*" -DestinationPath "output/hrb-auth-UNMERGED-${{ matrix.arch }}.zip"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: hrb-auth-capacity-test-x86
        path: output/
        if-no-files-found: error
        retention-days: 14
'on':
  push:
    branches:
    - spike-unmerged/hrb-challenge-auth
    paths:
    - .github/workflows/hrb-worker-rtl.yml
  workflow_dispatch: {}
