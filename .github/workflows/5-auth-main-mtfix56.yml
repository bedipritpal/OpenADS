jobs:
  proof:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: test/item6-index-order
    - name: Verify clean main-based source
      run: "set -euxo pipefail\ntest \"$GITHUB_REF\" = refs/heads/test/item6-index-order\ngit merge-base --is-ancestor 0ca61c3f5c4a31851f079e2125d878fd3dffc4fa HEAD\ntest -z \"$(git diff --name-only 0ca61c3f5c4a31851f079e2125d878fd3dffc4fa HEAD -- . ':!.github/workflows' ':!src/abi/ace_exports.cpp' ':!tests/CMakeLists.txt' ':!tests/unit/abi_index_handle_out_of_range_test.cpp')\"\n"
      shell: bash
    - name: Download exact historical Qt compiler
      run: 'Invoke-WebRequest ''https://download.qt.io/development_releases/prebuilt/mingw_32/i686-4.9.2-release-posix-dwarf-rt_v3-rev1.7z''
        -OutFile "$env:RUNNER_TEMP/qt492.7z"

        if((Get-FileHash "$env:RUNNER_TEMP/qt492.7z" -Algorithm SHA256).Hash.ToLower() -ne ''f6de32350a28f4b6c30eec26dbfee65f112300d51e37e4d2007b0598bef9bb79''){throw
        ''Qt compiler hash mismatch''}

        & 7z x "$env:RUNNER_TEMP/qt492.7z" "-o$env:RUNNER_TEMP/qt492" -y


        Invoke-WebRequest ''https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r8/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r8.7z''
        -OutFile "$env:RUNNER_TEMP/winlibs.7z"

        if((Get-FileHash "$env:RUNNER_TEMP/winlibs.7z" -Algorithm SHA256).Hash.ToLower() -ne ''019ee601c48069b91101a3af923bf2cdd4399c99b9a1c70b5d59da9cfbb8e907''){throw
        ''Winlibs hash mismatch''}

        & 7z x "$env:RUNNER_TEMP/winlibs.7z" "-o$env:RUNNER_TEMP/winlibs" -y


        Invoke-WebRequest ''https://github.com/brechtsanders/winlibs_mingw/releases/download/10.2.0-11.0.0-8.0.0-r4nvptx/winlibs-i686-posix-dwarf-gcc-10.2.0-mingw-w64-8.0.0-r4nvptx.7z''
        -OutFile "$env:RUNNER_TEMP/owner2351.7z"

        if((Get-FileHash "$env:RUNNER_TEMP/owner2351.7z" -Algorithm SHA256).Hash.ToLower() -ne ''5e18f786047c52b40392fe57f966bcb1a8acbc95d61da10796b13df63b9a1d95''){throw
        ''Owner2351 compiler hash mismatch''}

        & 7z x "$env:RUNNER_TEMP/owner2351.7z" "-o$env:RUNNER_TEMP/owner2351" -y

        '
      shell: pwsh
    - name: Build TLS auth daemon and raw static kit with pinned GCC10.2
      run: "set -euxo pipefail\nexport PATH=\"$(cygpath -u \"$RUNNER_TEMP/winlibs/mingw32/bin\"):$PATH\"\ntest \"\
        $(gcc -dumpversion)\" = 10.2.0\nfind \"$RUNNER_TEMP/winlibs\" -iname '*copying*' -o -iname '*license*' |\
        \ sort\ngit clone https://github.com/harbour/core.git \"$RUNNER_TEMP/harbour-server\"\ngit -C \"$RUNNER_TEMP/harbour-server\"\
        \ checkout --detach 6deac9cf3ad977ae829e5bca543d553b92dd4b6d\nexport HB_PLATFORM=win HB_COMPILER=mingw HB_BUILD_CONTRIBS=no\
        \ HB_BUILD_DYN=no\nmingw32-make -C \"$RUNNER_TEMP/harbour-server\" -j2\nHB=\"$(cygpath -m \"$RUNNER_TEMP/harbour-server\"\
        )\"\nprintf '\\nif(WIN32 AND MINGW)\\n set_target_properties(openads_ace PROPERTIES PREFIX \"\")\\nendif()\\\
        n' >> src/CMakeLists.txt\npython - <<'PYHARNESS'\nimport pathlib,re,base64\nroot=pathlib.Path('.')\nheader=root/'tests/legacy-native-temp.h'\n\
        header.write_bytes(base64.b64decode(''))\n\
        changes=[]\nfor p in (root/'tests').rglob('*.cpp'):\n s=p.read_text(encoding='utf-8',errors='strict')\n\
        \ n=re.sub(r'\\b(?:std::filesystem|fs)::temp_directory_path\\b','openads_test::temp_directory_path',s)\n\
        \ if n!=s:p.write_text(n,encoding='utf-8');changes.append(str(p))\nwith open(root/'tests/CMakeLists.txt','a')\
        \ as f:f.write('\\n# CI-only pinned MinGW test temp helper. Not linked into shipped targets.\\ntarget_compile_options(openads_unit_tests\
        \ PRIVATE -include \"${CMAKE_CURRENT_SOURCE_DIR}/legacy-native-temp.h\")\\n')\nprint('Test-only native temp\
        \ helper applied:',len(changes),'test files')\npathlib.Path('unit-harness-changes.txt').write_text('\\n'.join(changes))\n\
        \nPYHARNESS\n\ncmake -S . -B build-legacy -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release\
        \ -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0600 -DCMAKE_SHARED_LINKER_FLAGS=\"\
        -static -static-libgcc -static-libstdc++\" -DOPENADS_BUILD_TESTS=ON -DOPENADS_WITH_HTTP=OFF -DOPENADS_WITH_TLS=ON\
        \ -DOPENADS_VERSION_FORCE=1.09.74-mtfix56-mutual-auth-test -DOPENADS_AUTH_CAPACITY_TEST_SWITCH=OFF -DOPENADS_WITH_HARBOUR_UDF=ON\
        \ -DHARBOUR_COMPILER=\"$HB/bin/win/mingw/harbour.exe\" -DHARBOUR_INCLUDE_DIR=\"$HB/include\" -DHARBOUR_LIB_DIR=\"\
        $HB/lib/win/mingw\" -DOPENADS_HARBOUR_LIBS=\"hbvmmt;hbrtl;hbmacro;hbpcre;hblang;hbcpage;hbrdd;rddfpt;rddntx;hbsix;hbcommon\"\
        \ -DOPENADS_WARNINGS_AS_ERRORS=OFF\ncmake --build build-legacy --target openads_ace_static openads_ace openads_serverd\
        \ openads_auth_worker auth_spike_worker_probe auth_spike_integration_probe auth_spike_abi_probe auth_spike_transport_probe\
        \ auth_mutual_probe auth_resource_probe openads_unit_tests -j2\n"
      shell: bash
    - name: Build Harbour with unchanged Qt4.9.2
      run: 'set -euxo pipefail

        export PATH="$(cygpath -u "$RUNNER_TEMP/qt492/mingw32/bin"):$PATH"

        test "$(gcc -dumpversion)" = 4.9.2

        git clone https://github.com/harbour/core.git "$RUNNER_TEMP/harbour-old"

        git -C "$RUNNER_TEMP/harbour-old" checkout --detach 4ec2e154ed92757418bc30af571ab90240ab3209

        export HB_PLATFORM=win HB_COMPILER=mingw HB_BUILD_CONTRIBS=no HB_BUILD_DYN=no

        mingw32-make -C "$RUNNER_TEMP/harbour-old" -j2

        '
      shell: bash
    - name: Exact GCC10.2 and mingw-w64 8 runtime notices (Winlibs omits them)
      run: 'set -euxo pipefail

        W="$(cygpath -u "$RUNNER_TEMP/winlibs/mingw32")"

        mkdir -p "$W/share/licenses/gcc" "$W/share/licenses/crt" "$W/share/licenses/winpthreads"

        curl -fL https://raw.githubusercontent.com/gcc-mirror/gcc/ee5c3db6c5b2c3332912fb4c9cfa2864569ebd9a/COPYING3
        -o "$W/share/licenses/gcc/COPYING3"

        echo ''8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903  ''"$W/share/licenses/gcc/COPYING3"
        | sha256sum -c -

        curl -fL https://raw.githubusercontent.com/gcc-mirror/gcc/ee5c3db6c5b2c3332912fb4c9cfa2864569ebd9a/COPYING.RUNTIME
        -o "$W/share/licenses/gcc/COPYING.RUNTIME"

        echo ''9d6b43ce4d8de0c878bf16b54d8e7a10d9bd42b75178153e3af6a815bdc90f74  ''"$W/share/licenses/gcc/COPYING.RUNTIME"
        | sha256sum -c -

        curl -fL https://raw.githubusercontent.com/mingw-w64/mingw-w64/98dad1fefed2a07ade0b37ca6c610ad66739631a/COPYING.MinGW-w64-runtime/COPYING.MinGW-w64-runtime.txt
        -o "$W/share/licenses/crt/COPYING.MinGW-w64-runtime.txt"

        echo ''e9b2dc02451ea29092a1f25fa0f3c07207ed421f1807dffb0c4e6dce69dee7bd  ''"$W/share/licenses/crt/COPYING.MinGW-w64-runtime.txt"
        | sha256sum -c -

        curl -fL https://raw.githubusercontent.com/mingw-w64/mingw-w64/98dad1fefed2a07ade0b37ca6c610ad66739631a/mingw-w64-libraries/winpthreads/COPYING
        -o "$W/share/licenses/winpthreads/COPYING"

        echo ''63263614cdd29f2f93cba85e992f041b31f9fc7b4033692f31269489a8a1b177  ''"$W/share/licenses/winpthreads/COPYING"
        | sha256sum -c -


        mkdir -p kit/runtime-notices

        cp "$W/share/licenses/gcc/COPYING3" kit/runtime-notices/gcc-COPYING3.txt

        cp "$W/share/licenses/gcc/COPYING.RUNTIME" kit/runtime-notices/gcc-COPYING.RUNTIME.txt

        cp "$W/share/licenses/crt/COPYING.MinGW-w64-runtime.txt" kit/runtime-notices/MinGW-w64-runtime.txt

        cp "$W/share/licenses/winpthreads/COPYING" kit/runtime-notices/winpthreads-COPYING.txt

        '
      shell: bash
    - name: Build DLL import RDDADS and B_BIG threaded fixtures
      run: "set -euxo pipefail\nexport PATH=\"$(cygpath -u \"$RUNNER_TEMP/qt492/mingw32/bin\"):$PATH\"\nHB=\"$(cygpath\
        \ -u \"$RUNNER_TEMP/harbour-old\")\"\nmkdir -p srv mtdata output kit\ncp build-legacy/src/*.dll build-legacy/tools/serverd/openads_serverd.exe\
        \ build-legacy/tools/serverd/openads_auth_worker.exe srv/\ncat > output/local_create.prg <<'PRG'\n#include\
        \ \"ads.ch\"\nREQUEST ADS, ADSCDX\nPROCEDURE Main( cDir )\n   LOCAL cDbf := cDir + \"/TestIndex.dbf\", cIdx\
        \ := cDir + \"/TestIndex.cdx\"\n   FIELD NAME,CITY,INS\n   OAds_SetLogging( .F. )\n   AdsSetServerType(\
        \ ADS_LOCAL_SERVER )\n   AdsConnect( \".\" )\n   AdsSetFileType( ADS_CDX )\n   RddSetDefault( \"ADSCDX\"\
        \ )\n   DbCreate( cDbf, { { \"NAME\", \"C\", 19, 0 }, { \"CITY\", \"C\", 15, 0 }, { \"AGE\", \"N\", 3, 0\
        \ }, { \"TS\", \"C\", 23, 0 }, { \"THD\", \"N\", 3, 0 }, { \"INS\", \"N\", 4, 0 }, { \"RDD\", \"C\", 3,\
        \ 0 } }, \"ADSCDX\" )\n   dbCloseArea()\n   USE ( cDbf ) VIA \"ADSCDX\" ALIAS _STG SHARED NEW\n   INDEX\
        \ ON NAME TAG \"IDX01\" TO ( cIdx )\n   INDEX ON CITY TAG \"IDX02\" TO ( cIdx )\n   INDEX ON INS TAG \"\
        IDX03\" TO ( cIdx )\n   dbCloseArea()\n   OutStd( \"exact fixture ready\" + hb_eol() )\nRETURN\n\nPRG\n\
        cat > output/probe_mt.prg <<'PRG'\n#include \"ads.ch\"\n#define __HLP__(s) .T.\nREQUEST ADS, ADSCDX\nSTATIC\
        \ s_hConn := 0\nSTATIC s_cRdd := \"ADSCDX\"\nSTATIC s_nRandom := 1\nPROCEDURE Main( cUri, cDir )\n   LOCAL\
        \ cChallenge, hPending := 0, i, x, aThreads := {}, cErr := Space(512)\n   ErrorBlock( {| e | OutStd( \"\
        ERROR \" + hb_ValToExp(e) + hb_eol() ), Break(e) } )\n   AdsSetFileType( ADS_CDX )\n   AdsSetServerType(\
        \ ADS_REMOTE_SERVER )\n   RddSetDefault( s_cRdd )\n   s_hConn := AdsConnect( cUri )\n   IF Empty( s_hConn\
        \ )\n      OutStd( \"CONNECT-FAIL\" + hb_eol() )\n      ErrorLevel(3) ; QUIT\n   ENDIF\n   FOR i := 1 TO\
        \ 9\n      AAdd(aThreads,hb_threadStart({|| StageExact(cDir)}))\n   NEXT\n   StageExact(cDir)\n   OutStd(\
        \ \"MAIN-STAGE-PASS\" + hb_eol() )\n   dbGoTop()\n   OutStd( \"MAIN-GOTOP-PASS lastrec=\" + hb_ntos(LastRec())\
        \ + hb_eol() )\n   FOR EACH x IN aThreads\n      hb_threadJoin(x)\n   NEXT\n   OutStd( \"EXACT-THREADS-JOINED\
        \ lastrec=\" + hb_ntos(LastRec()) + hb_eol() )\n   dbCloseArea()\nRETURN\nPROCEDURE StageExact(cDir)\n \
        \  BEGIN SEQUENCE\n      IF HeyAddRecords(cDir+\"/TestIndex.dbf\",cDir+\"/TestIndex.cdx\")\n         dbGoTop()\n\
        \      ENDIF\n      Mark(\"stage done\")\n   RECOVER\n      Mark(\"RECOVER\")\n      ErrorLevel(4)\n   END\
        \ SEQUENCE\nRETURN\nPROCEDURE Mark(c)\n   OutStd(\"t\"+hb_ntos(hb_threadId())+\" \"+c+hb_eol())\nRETURN\n\
        PROCEDURE LogEvents(c)\n   Mark(c)\nRETURN\nFUNCTION HeyAddRecords( cDbf, cIdx )\n   LOCAL aRec, aData,\
        \ lAppended\n   LOCAL lAdded := .T.\n\n   IF .T.\n      Mark( \"before USE\" )\n      USE ( cDbf ) VIA (\
        \ s_cRdd ) ALIAS _STG SHARED NEW\n   ENDIF\n   Mark( \"after USE\" )\n   IF ! Alias() == \"_STG\"\n    \
        \  lAdded := .F.\n      ? \"Could not Open: \", cDbf\n   ELSE\n      IF __HLP__( \"__Switching it ON do\
        \ not display records in the browser as well as referencing them__\" )\n         Mark( \"before dbSetIndex\"\
        \ )\n         dbSetIndex( cIdx )\n         Mark( \"after dbSetIndex\" )\n         dbSetOrder( 0 )\n    \
        \  ENDIF\n      aData := { { \"Alice\"  , \"Madrid\"    }, ;\n                 { \"Bob\"    , \"Barcelona\"\
        \ }, ;\n                 { \"Phillip\", \"Panipat\"   }, ;\n                 { \"Charlie\", \"Valencia\"\
        \  }, ;\n                 { \"Linda\"  , \"Iris\"      }, ;\n                 { \"Finland\", \"Dallas\"\
        \    }, ;\n                 { \"Diana\"  , \"Sevilla\"   }, ;\n                 { \"Lucy\"   , \"Sevilla\"\
        \   }, ;\n                 { \"Jony\"   , \"Walker\"    }, ;\n                 { \"Edward\" , \"Bilbao\"\
        \    } }\n      FOR EACH aRec IN aData\n         Mark( \"before append \" + hb_ntos( aRec:__enumIndex()\
        \ ) )\n#if 0\n         IF aRec:__enumIndex() > 1\n            EXIT\n         ENDIF\n#endif\n         IF\
        \ ! lAppended := _STG->( DbAppend() )\n            hb_idleSleep()\n            lAppended := _STG->( DbAppend()\
        \ )\n         ENDIF\n         Mark( \"after append ok=\" + hb_ValToExp(lAppended) + \" neterr=\" + hb_ValToExp(NetErr())\
        \ + \" recno=\" + hb_ntos(RecNo()) )\n         IF lAppended\n            REPLACE _STG->NAME WITH aRec[ 1\
        \ ]\n            REPLACE _STG->CITY WITH aRec[ 2 ]\n            REPLACE _STG->AGE  WITH hb_randInt( 20,\
        \ 120 )\n            REPLACE _STG->TS   WITH hb_TSToStr( hb_DateTime() )\n            REPLACE _STG->THD\
        \  WITH hb_threadId()\n            REPLACE _STG->INS  WITH s_nRandom\n            REPLACE _STG->RDD  WITH\
        \ s_cRdd\n            //\n            Mark( \"before commit\" )\n            _STG->( DbCommit() ) ; _STG->(\
        \ dbUnlock() )\n            Mark( \"after commit/unlock\" )  /* a must for networked applications */\n \
        \        ELSE\n            LogEvents( \"Could not APPEND \" + aRec[ 1 ] )\n         ENDIF\n      NEXT\n\
        \   ENDIF\n   RETURN lAdded\n\n\nPRG\n\n# DLL import library only. Never place a combined archive in kit.\n\
        cp build-legacy/src/libopenace32.dll.a kit/libopenace32.dll.a\ncp build-legacy/src/openace32.dll output/openace32.dll\n\
        objdump -p output/openace32.dll > output/dll-pe.txt\nif grep -Ei 'DLL Name:.*(libstdc|libgcc|libwinpthread|libssl|libcrypto|mbedtls|zlib).*\\\
        .dll' output/dll-pe.txt;then exit 1;fi\nfor unit in ads1 adsfunc adsmgmnt adsx;do\n gcc -c \"$HB/contrib/rddads/$unit.c\"\
        \ -I\"$HB/include\" -I\"$HB/contrib/rddads\" -Iinclude/openads -o \"output/$unit.o\"\ndone\ngcc -c contrib/oads_hb/oads_hb.c\
        \ -I\"$HB/include\" -Iinclude/openads -o output/oads_hb.o\nar rcs kit/librddads.a output/ads1.o output/adsfunc.o\
        \ output/adsmgmnt.o output/adsx.o output/oads_hb.o\nfor name in local_create probe_mt;do\n \"$HB/bin/win/mingw/hbmk2.exe\"\
        \ \"output/$name.prg\" -Lkit -lrddads -lopenace32 -iinclude/openads -i\"$HB/contrib/rddads\" -mt -gtstd\
        \ -o\"output/$name.exe\"\ndone\ncp output/probe_mt.exe output/probe_mt_dll.exe\ncat > output/check_rows.prg\
        \ <<'CHECKROWS'\n#include \"ads.ch\"\nREQUEST ADS, ADSCDX\nPROCEDURE Main(cDir)\n LOCAL nRows:=0, nEmpty:=0\n\
        \ FIELD NAME,CITY\n AdsSetServerType(ADS_LOCAL_SERVER)\n AdsSetFileType(ADS_CDX)\n RddSetDefault(\"ADSCDX\"\
        )\n USE (cDir+\"/TestIndex.dbf\") VIA \"ADSCDX\" SHARED NEW\n dbGoTop()\n DO WHILE !Eof()\n   nRows++\n\
        \   IF Empty(NAME) .OR. Empty(CITY)\n      nEmpty++\n   ENDIF\n   dbSkip()\n ENDDO\n OutStd(\"STORED rows=\"\
        +hb_ntos(nRows)+\" lastrec=\"+hb_ntos(LastRec())+\" empty=\"+hb_ntos(nEmpty)+hb_eol())\n dbCloseAll()\n\
        RETURN\nCHECKROWS\n\"$HB/bin/win/mingw/hbmk2.exe\" output/check_rows.prg -Lkit -lrddads -lopenace32 -iinclude/openads\
        \ -i\"$HB/contrib/rddads\" -mt -gtstd  -lws2_32 -lbcrypt -lpsapi -ooutput/check_rows.exe\n\ncat > output/auth_static.prg\
        \ <<'PRG'\n#include \"ads.ch\"\nREQUEST ADS, ADSCDX\nPROCEDURE Main(cUrl)\n LOCAL cChallenge,hPending:=0,hConn:=0,cBlob\n\
        \ cChallenge:=OAds_BeginAuth(cUrl,@hPending)\n IF Len(cChallenge)!=32\n  OutStd(\"AUTH-BEGIN-FAIL\"+hb_eol())\n\
        \  ErrorLevel(3);QUIT\n ENDIF\n cBlob:=cChallenge+\"test-only\"\n hConn:=OAds_CompleteAuth(hPending,cBlob)\n\
        \ IF Empty(hConn)\n  OutStd(\"AUTH-COMPLETE-FAIL\"+hb_eol())\n  ErrorLevel(4);QUIT\n ENDIF\n OAds_SetConnection(hConn)\n\
        \ dbUseArea(.T.,\"ADSCDX\",\"TestIndex.dbf\",\"TRACEPROBE\",.T.,.F.)\n IF !Used()\n  ErrorLevel(5);QUIT\n\
        \ ENDIF\n dbCloseAll()\n AdsDisconnect(hConn)\n OutStd(\"STATIC-AUTH-PASS\"+hb_eol())\nRETURN\nPRG\n\"$HB/bin/win/mingw/hbmk2.exe\"\
        \ output/auth_static.prg -Lkit -lrddads -lopenace32 -iinclude/openads -i\"$HB/contrib/rddads\" -mt -gtstd\
        \  -lws2_32 -lbcrypt -lpsapi -ooutput/auth_static.exe\nobjdump -p output/auth_static.exe > output/static-auth-pe.txt\n\
        grep -qi 'DLL Name: openace32.dll' output/static-auth-pe.txt\n\n\n# Same generated Harbour objects, link\
        \ under owner's exact pinned ld2.35.1.\nexport PATH=\"$(cygpath -u \"$RUNNER_TEMP/owner2351/mingw32/bin\"\
        ):$PATH\"\ntest \"$(gcc -dumpversion)\" = 10.2.0\nld --version | tee output/owner-ld-version.txt\ngrep -q\
        \ '2.35.1' output/owner-ld-version.txt\n\"$HB/bin/win/mingw/hbmk2.exe\" output/probe_mt.prg -Lkit -lrddads\
        \ -lopenace32 -iinclude/openads -i\"$HB/contrib/rddads\" -mt -gtstd -ooutput/probe_mt_owner.exe -workdir=output/vouchobjs\
        \ -inc -trace > output/owner-link.txt 2>&1\nobjdump -p output/probe_mt_owner.exe > output/owner-client-pe.txt\n\
        grep -qi 'DLL Name: openace32.dll' output/owner-client-pe.txt\ngit rev-parse HEAD > output/source-commit.txt\n\
        \nobjdump -p output/openace32.dll | sed -n '/\\[Ordinal\\/Name Pointer\\] Table/,$p' > output/dll-exports.txt\n\
        if grep -E '^.*\\][[:space:]]+(_Z|\\?)[^[:space:]]+' output/dll-exports.txt;then exit 1;fi\n\n# Vouch link-shape\
        \ proof: preserve every library position, use empty stand-in\n# archives ONLY for unavailable third-party\
        \ libs. Real Harbour GUI/MT/system libs.\npython - <<'PYPROOF'\nimport pathlib,subprocess\nHB=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'harbour-old'\n\
        libs=\"gtwvg v32lib gtnet hbnf hbmxml mxml hbhpdf libhpdf png hbzebra hbssl ssl crypto crypt32 hbtip hbziparc\
        \ hbmzip minizip hbnetio hbmemio hbwin hbjrpc hbzsock hbcurls curl ssh2 hbjrpc dbrmap hbcloud hbtelegram\
        \ xhb freewin eztwain3 hbct wininet mapi32 rasapi32 tapi32 comctl32 Image2PDF crypto ssl ssh2 nghttp2 brotlicommon-static\
        \ brotlidec-static brotlienc-static zstd wldap32 bcrypt rddads openace32 ws2_32 bcrypt psapi hbextern hbdebug\
        \ hbvmmt hbrtl hblang hbcpage gtcgi gtpca gtstd gtwin gtwvt gtgui hbrdd hbuddall hbusrrdd rddntx rddcdx\
        \ rddnsx rddfpt hbrdd hbhsx hbsix hbmacro hbcplr hbpp hbcommon hbmainwin winmm kernel32 user32 gdi32 advapi32\
        \ ws2_32 iphlpapi winspool comctl32 comdlg32 shell32 uuid ole32 oleaut32 mpr mapi32 imm32 msimg32 wininet\
        \ hbpcre hbzlib\".split()\npathlib.Path('output/standins').mkdir(exist_ok=True)\nfor n in libs:\n if n in\
        \ ('rddads','openace32'):continue\n r=subprocess.check_output(['gcc','-print-file-name=lib'+n+'.a'],text=True).strip()\n\
        \ if pathlib.Path(r).is_file() or (HB/'lib/win/mingw'/('lib'+n+'.a')).is_file():continue\n subprocess.run(['ar','rcs','output/standins/lib'+n+'.a'],check=True)\n\
        objs=list(pathlib.Path('output/vouchobjs').glob('*.o'))\nassert objs, 'No hbmk2 retained objects'\ncmd=['gcc',*map(str,objs),'-mwindows','-Wl,--start-group',*['-l'+n\
        \ for n in libs],'-Wl,--end-group','-Lkit','-L'+str(HB/'lib/win/mingw'),'-Loutput/standins','-o','output/vouch-shaped.exe']\n\
        pathlib.Path('output/vouch-shaped-command.txt').write_text(' '.join(cmd))\nsubprocess.run(cmd,check=True)\n\
        PYPROOF\nobjdump -p output/vouch-shaped.exe > output/vouch-shaped-pe.txt\ngrep -qi 'DLL Name: openace32.dll'\
        \ output/vouch-shaped-pe.txt\n"
      shell: bash
    - name: Run twenty DLL and owner-GCC B_BIG integrity fixtures
      run: "$data=(Resolve-Path mtdata).Path\n$srv=(Resolve-Path srv/openads_serverd.exe).Path\n& $srv --help |\
        \ Out-File srv/help.txt\n& $srv --version | Out-File srv/version.txt\n$p=Start-Process -FilePath $srv -ArgumentList\
        \ ('--port 16262 --data '+$data) -WorkingDirectory (Split-Path $srv) -RedirectStandardOutput srv/stdout.log\
        \ -RedirectStandardError srv/stderr.log -PassThru\n$ok=$false\nfor($i=0;$i -lt 60;$i++){ $c=Test-NetConnection\
        \ -ComputerName 127.0.0.1 -Port 16262 -WarningAction SilentlyContinue; if($c.TcpTestSucceeded){$ok=$true;break};\
        \ Start-Sleep -Milliseconds 500 }\nif(-not $ok){throw 'server did not listen'}\n$env:Path = (Resolve-Path\
        \ srv).Path + ';' + $env:Path\nfor($trial=1;$trial -le 20;$trial++) {\n foreach($mode in @('dll','owner'))\
        \ {\n  $trialDir=Join-Path (Get-Location) \"mtdata/$mode$trial\"\n  New-Item -ItemType Directory -Path $trialDir\
        \ -Force | Out-Null\n  $trialDir=$trialDir.Replace('\\','/')\n  & output/local_create.exe $trialDir | Out-File\
        \ \"output/$mode$trial-fixture.txt\"\n  $trialUrl=\"tcp://127.0.0.1:16262/$trialDir\"\n  $exe='output/probe_mt_dll.exe';if($mode\
        \ -eq 'owner'){$exe='output/probe_mt_owner.exe'}\n  $clock=[System.Diagnostics.Stopwatch]::StartNew()\n\
        \  $p=Start-Process -FilePath (Resolve-Path $exe).Path -ArgumentList @($trialUrl,$trialDir) -RedirectStandardOutput\
        \ \"output/$mode$trial-stdout.txt\" -RedirectStandardError \"output/$mode$trial-stderr.txt\" -PassThru\n\
        \  if(-not $p.WaitForExit(45000)){$p.Kill();throw \"$mode trial $trial hung\"}\n  if($p.ExitCode -ne 0){throw\
        \ \"$mode trial $trial failed exit $($p.ExitCode)\"}\n  $clock.Stop()\n  $elapsed=$clock.Elapsed.TotalMilliseconds\n\
        \  $end=Select-String -Path \"output/$mode$trial-stdout.txt\" -Pattern 'EXACT-THREADS-JOINED'\n  $fails=@(Select-String\
        \ -Path \"output/$mode$trial-stdout.txt\" -Pattern 'Could not APPEND').Count\n  $stored=& output/check_rows.exe\
        \ $trialDir\n  $bytes=[System.IO.File]::ReadAllBytes(\"$trialDir/TestIndex.dbf\")\n  $disk=[BitConverter]::ToUInt32($bytes,4)\n\
        \  \"$mode TRIAL $trial PASS $end elapsed_ms=$elapsed failed_appends=$fails disk_header=$disk $stored\"\
        \ | Tee-Object -FilePath output/repeat-summary.txt -Append\n  if(-not $end){throw \"$mode trial $trial incomplete\"\
        }\n  if($fails -ne 0 -or $disk -ne 100 -or $stored -notmatch 'rows=100 lastrec=100 empty=0'){throw \"$mode\
        \ integrity mismatch\"}\n }\n}\nGet-Content output/dll-pe.txt\n\n"
