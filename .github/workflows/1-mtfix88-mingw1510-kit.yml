        bin\curl.exe was built but not run by CI.

        NOTES
        (cd "$K" && find . -type f -exec sha256sum {} \;) > "$K/SHA256.txt"
        7z a -tzip "openssl-curl-mingw1510-x86-ossl35.zip" "./openssl-curl-mingw1510-x86"
