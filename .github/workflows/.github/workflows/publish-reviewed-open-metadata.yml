name: Publish reviewed open-metadata port (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-reviewed-open-metadata
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'bedipritpal/OpenADS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify upstream, apply reviewed patch, verify tree, publish
        shell: bash
        run: |
          set -euo pipefail
          base=8a5812af2b8a4efc7c015cbd809ae5c4b97a4714
          test "$(git ls-remote https://github.com/FiveTechSoft/OpenADS.git refs/heads/main | cut -f1)" = "$base"
          test -z "$(git ls-remote origin refs/heads/port/open-metadata-upstream)"
          git fetch https://github.com/FiveTechSoft/OpenADS.git "$base"
          git checkout -b port/open-metadata-upstream "$base"
          cat > "$RUNNER_TEMP/port.patch" <<'OPENADS_REVIEWED_PORT_PATCH'
