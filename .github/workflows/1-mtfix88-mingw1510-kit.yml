  depsmsvcrt:
    name: Modernized static OpenSSL/CURL family x86 (mingw10)
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      EXPECT_GCC: 10.2.0
    steps:
    - name: Download exact Winlibs GCC 10.2 MSVCRT toolchain
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $headers=@{Accept='application/octet-stream';Authorization="Bearer $env:GH_TOKEN"}
        Invoke-WebRequest -Headers $headers 'https://api.github.com/repos/brechtsanders/winlibs_mingw/releases/assets/32966370' -OutFile "$env:RUNNER_TEMP/winlibs10.7z"
        if((Get-FileHash "$env:RUNNER_TEMP/winlibs10.7z" -Algorithm SHA256).Hash.ToLower() -ne '019ee601c48069b91101a3af923bf2cdd4399c99b9a1c70b5d59da9cfbb8e907'){throw 'Winlibs 10.2 hash mismatch'}
        & 7z x "$env:RUNNER_TEMP/winlibs10.7z" "-o$env:RUNNER_TEMP/toolchain" -y
      shell: pwsh

    - name: Build pinned Harbour with the MSVCRT toolchain as fixture compiler
      shell: bash
      run: |
        set -euxo pipefail
        export PATH="$(cygpath -u "$RUNNER_TEMP/toolchain/mingw32/bin"):$PATH"
        test "$(gcc -dumpversion)" = 10.2.0
        git clone https://github.com/harbour/core.git "$RUNNER_TEMP/hb10src"
        git -C "$RUNNER_TEMP/hb10src" checkout --detach $HARBOUR_PIN
        export HB_PLATFORM=win HB_COMPILER=mingw HB_BUILD_CONTRIBS=no HB_BUILD_DYN=no
        mingw32-make -C "$RUNNER_TEMP/hb10src" -j2
        echo "HBROOT=$(cygpath -u "$RUNNER_TEMP/hb10src")" >> "$GITHUB_ENV"
        "$(cygpath -u "$RUNNER_TEMP/hb10src/bin/win/mingw/hbmk2.exe")" --version | head -2
    - name: Record toolchain identity
      shell: bash
      run: |
        set -euxo pipefail
        export PATH="$(cygpath -u "$RUNNER_TEMP/toolchain/mingw32/bin"):$PATH"
        gcc -dumpversion
        gcc -dumpmachine
        echo 'int main(){return 0;}' > t.c && gcc t.c -o t.exe && objdump -p t.exe | grep -i 'msvcrt\|ucrt' | head -5 || true
    - name: Set up a complete MSYS2 perl for OpenSSL Configure
      id: msys
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0, upstream tag v2.33.0, checked 2026-11-21
      with:
        msystem: MSYS
        update: false
        install: perl
    - name: Locate and verify the complete perl (modules Configure needs)
      shell: bash
      run: |
        set -euxo pipefail
        PERLX="$(cygpath -u "${{ steps.msys.outputs.msys2-location }}")/usr/bin/perl.exe"
        echo "PERLX=$PERLX" >> "$GITHUB_ENV"
        "$PERLX" -v | head -2
        "$PERLX" -MIPC::Cmd -MExtUtils::MakeMaker -MLocale::Maketext::Simple -MFile::Spec -e 'print "perl modules OK\n"'
    - name: Download hash-pinned dependency sources
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p dl work && cd dl
        dl() { curl -fL --retry 3 -o "$2" "$1"; echo "$3  $2" | sha256sum -c -; }
        dl https://github.com/madler/zlib/releases/download/v1.4/zlib-1.4.tar.xz zlib-1.4.tar.xz 4f11c512053d7bab8d9e9b89bde3575add3e4c50a383b42ef6cb837035fc5a7c
        dl https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz zstd-1.5.7.tar.gz eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3
        dl https://github.com/google/brotli/archive/refs/tags/v1.2.1.tar.gz brotli-1.2.1.tar.gz 98d35d11a78dc453aebb7d10c3748f3f73ff78c8267c0dc697b8631f67bf7e8f
        dl https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz openssl-3.5.9.tar.gz 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
        dl https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz openssl-1.1.1w.tar.gz cf3098950cb4d853ad95c0841f1f9c6d3dc102dccfcacd521d93925208b76ac8
        dl https://github.com/libssh2/libssh2/releases/download/libssh2-1.11.1/libssh2-1.11.1.tar.xz libssh2-1.11.1.tar.xz 9954cb54c4f548198a7cbebad248bdc87dd64bd26185708a294b2b50771e3769
        dl https://github.com/nghttp2/nghttp2/releases/download/v1.71.0/nghttp2-1.71.0.tar.xz nghttp2-1.71.0.tar.xz c0f55121d88650e4b9227aec28cebaf664d2417ca60fe70be0f8d38829f52116
        dl https://github.com/curl/curl/releases/download/curl-8_23_0/curl-8.23.0.tar.xz curl-8.23.0.tar.xz 8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5
    - name: Build the static family with the pinned toolchain
      shell: bash
      run: |
        set -euxo pipefail
        WL="$(cygpath -u "$RUNNER_TEMP/toolchain/mingw32")"
        export PATH="$WL/bin:$PATH"
        test "$(gcc -dumpversion)" = "$EXPECT_GCC"
        P="$(cygpath -u "$PWD/out")"; mkdir -p "$P/lib" "$P/include"
        MK="$(command -v mingw32-make)"
        cd work
        tar xf ../dl/zlib-1.4.tar.xz; cd zlib-1.4
        mingw32-make -f win32/Makefile.gcc PREFIX= libz.a -j2
        cp libz.a "$P/lib"; cp zlib.h zconf.h "$P/include"; cd ..
        tar xf ../dl/zstd-1.5.7.tar.gz --exclude='zstd-1.5.7/tests' --exclude='zstd-1.5.7/contrib'; cd zstd-1.5.7/lib
        mingw32-make libzstd.a CC=gcc AR=ar RANLIB=ranlib LIB_SRCDIR="$(cygpath -m "$PWD")" -j2
        cp libzstd.a "$P/lib"; cp zstd.h zdict.h zstd_errors.h "$P/include"; cd ../..
        tar xf ../dl/brotli-1.2.1.tar.gz
        cmake -S brotli-1.2.1 -B brotli-b -G "MinGW Makefiles" -DCMAKE_MAKE_PROGRAM="$MK" -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$P" -DBROTLI_DISABLE_TESTS=ON -DBUILD_SHARED_LIBS=OFF
        cmake --build brotli-b -j2; cmake --install brotli-b
        for b in common dec enc; do cp "$P/lib/libbrotli$b.a" "$P/lib/libbrotli$b-static.a"; done
        tar xf ../dl/openssl-3.5.9.tar.gz; cd openssl-3.5.9
        "$PERLX" ./Configure mingw --prefix="$(cygpath -m "$P")" --openssldir="$(cygpath -m "$P")/ssl" --libdir=lib no-shared no-tests no-docs
        mingw32-make PERL="$PERLX" -j2 build_libs; mingw32-make PERL="$PERLX" install_dev; cd ..
        tar xf ../dl/libssh2-1.11.1.tar.xz
        cmake -S libssh2-1.11.1 -B ssh2-b -G "MinGW Makefiles" -DCMAKE_MAKE_PROGRAM="$MK" -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$P" -DCMAKE_PREFIX_PATH="$P" -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0601 -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DCRYPTO_BACKEND=OpenSSL -DOPENSSL_ROOT_DIR="$P" -DOPENSSL_USE_STATIC_LIBS=ON -DENABLE_ZLIB_COMPRESSION=ON
        cmake --build ssh2-b -j2; cmake --install ssh2-b
        tar xf ../dl/nghttp2-1.71.0.tar.xz
        cmake -S nghttp2-1.71.0 -B ng-b -G "MinGW Makefiles" -DCMAKE_MAKE_PROGRAM="$MK" -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$P" -DCMAKE_PREFIX_PATH="$P" -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0601 -DENABLE_LIB_ONLY=ON -DBUILD_STATIC_LIBS=ON -DBUILD_SHARED_LIBS=OFF -DENABLE_STATIC_LIB=ON -DENABLE_SHARED_LIB=OFF -DBUILD_TESTING=OFF
        cmake --build ng-b -j2; cmake --install ng-b
        tar xf ../dl/curl-8.23.0.tar.xz
        cmake -S curl-8.23.0 -B curl-b -G "MinGW Makefiles" -DCMAKE_MAKE_PROGRAM="$MK" -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_COMPILER_WORKS=1 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$P" -DCMAKE_PREFIX_PATH="$P" "-DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0601 -DNGHTTP2_STATICLIB" -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_LIBS=ON -DCURL_STATICLIB=ON -DBUILD_CURL_EXE=ON -DBUILD_TESTING=OFF -DCURL_USE_OPENSSL=ON -DOPENSSL_ROOT_DIR="$P" -DOPENSSL_USE_STATIC_LIBS=ON -DCURL_USE_LIBSSH2=ON -DUSE_NGHTTP2=ON -DCURL_BROTLI=ON -DCURL_ZSTD=ON -DCURL_ZLIB=ON -DCURL_USE_LIBPSL=OFF -DUSE_LIBIDN2=OFF -DCURL_USE_SCHANNEL=OFF -DENABLE_WEBSOCKETS=ON
        cmake --build curl-b -j2; cmake --install curl-b
        echo FAMILY_BUILD_DONE
    - name: Generate and merge the legacy OpenSSL symbol shim
      shell: bash
      run: |
        set -euxo pipefail
        WL="$(cygpath -u "$RUNNER_TEMP/toolchain/mingw32")"
        export PATH="$WL/bin:$PATH"
        P="$(cygpath -u "$PWD/out")"
        H="$P/include/openssl"
        grep -hE '^[[:space:]]*#[[:space:]]*define[[:space:]]+[A-Za-z0-9_]+[[:space:]]+[A-Za-z0-9_]+[[:space:]]*(/\*.*)?$' $H/*.h | sed -E 's/^[[:space:]]*#[[:space:]]*define[[:space:]]+([A-Za-z0-9_]+)[[:space:]]+([A-Za-z0-9_]+).*/\1 \2/' | sort -u > pairs.txt
        nm "$P/lib/libcrypto.a" "$P/lib/libssl.a" 2>/dev/null | awk '$2~/^[TDBRC]$/{print $3}' | sed 's/^_//' | sort -u > d.txt
        awk 'NR==FNR{d[$1]=1;next} ($2 in d) && !($1 in d){print}' d.txt pairs.txt > legacy.txt
        grep -E "^(EVP_|SSL|X509_|DES_)" legacy.txt | grep -vE "^(EVP_MD_CTX_size|EVP_PKEY_CTX_hkdf_mode) " > legacy2.txt
        wc -l legacy.txt legacy2.txt
        test "$(wc -l < legacy2.txt)" -ge 55
        {
        echo '/* OpenSSL 1.1.x -> 3.x legacy symbol shim: tail-jumps to the renamed 3.x functions. */'
        while read old new; do
         echo "__asm__(\".text\\n.globl _${old}\\n_${old}:\\n\\tjmp _${new}\\n\");"
        done < legacy2.txt
        cat <<'C'
        #include <openssl/evp.h>
        #include <openssl/ssl.h>
        #undef EVP_PKEY_get1_tls_encodedpoint
        #undef EVP_PKEY_set1_tls_encodedpoint
        size_t EVP_PKEY_get1_tls_encodedpoint(EVP_PKEY *pkey, unsigned char **ppt)
        { return EVP_PKEY_get1_encoded_public_key(pkey, ppt); }
        int EVP_PKEY_set1_tls_encodedpoint(EVP_PKEY *pkey, const unsigned char *pt, size_t ptlen)
        { return EVP_PKEY_set1_encoded_public_key(pkey, pt, ptlen); }
        C
        } > legacy.c
        gcc -O2 -I"$P/include" -c legacy.c -o ossl_legacy.o
        cp "$P/lib/libcrypto.a" libcrypto-noshim.a
        ar q "$P/lib/libcrypto.a" ossl_legacy.o; ranlib "$P/lib/libcrypto.a"
        nm "$P/lib/libcrypto.a" | grep " T _EVP_CIPHER_nid" | head -3
        cp legacy2.txt "$P/LEGACY-SYMBOLS.txt"
    - name: Build old-style hbssl and hbcurls against the family
      shell: bash
      run: |
        set -euxo pipefail
        WL="$(cygpath -u "$RUNNER_TEMP/toolchain/mingw32")"
        export PATH="$WL/bin:$PATH"
        P="$(cygpath -u "$PWD/out")"
        HBMK="$(cygpath -u "$HBROOT/bin/win/mingw/hbmk2.exe")"
        cd work
        tar xf ../dl/openssl-1.1.1w.tar.gz
        cd openssl-1.1.1w
        "$PERLX" Configure mingw no-asm >/dev/null
        mingw32-make PERL="$PERLX" include/openssl/opensslconf.h >/dev/null
        cd ..
        git clone https://github.com/harbour/core.git hbsrc
        git -C hbsrc checkout --detach $HARBOUR_PIN
        export HB_INSTALL_PREFIX="$(cygpath -m "$HBROOT")"
        export HB_WITH_OPENSSL="$(cygpath -m "$PWD/openssl-1.1.1w/include")"
        mkdir -p ../hbssl-old
        cd hbsrc/contrib/hbssl
        "$HBMK" hbssl.hbp -plat=win -comp=mingw -workdir="$(cygpath -u "$PWD")/w" -o"$(cygpath -u "$OLDPWD")/../hbssl-old/hbssl-x86" 2>&1 | tail -3
        cd "$(cygpath -u "$OLDPWD")"
        cd ..
        ls hbssl-old/
        export HB_WITH_CURL="$(cygpath -m "$P/include")"
        mkdir -p hbcurl-out
        cd work/hbsrc/contrib/hbcurl
        "$HBMK" hbcurls.hbp -plat=win -comp=mingw -workdir="$(cygpath -u "$PWD")/w" -o"$(cygpath -u "$OLDPWD")/hbcurl-out/hbcurls" 2>&1 | tail -3
        cd "$(cygpath -u "$OLDPWD")"
        ls hbcurl-out/
    - name: Prove old hbssl symbol coverage and link plus run real HTTPS fixtures
      shell: bash
      run: |
        set -euxo pipefail
        WL="$(cygpath -u "$RUNNER_TEMP/toolchain/mingw32")"
        export PATH="$WL/bin:$PATH"
        P="$(cygpath -u "$PWD/out")"
        HBMK="$(cygpath -u "$HBROOT/bin/win/mingw/hbmk2.exe")"
        export HB_INSTALL_PREFIX="$(cygpath -m "$HBROOT")"
        nm hbssl-old/libhbssl-x86.a 2>/dev/null | awk '$1=="U"{print $2}' | sed 's/^_//' | sort -u > u.txt
        nm "$P/lib/libcrypto.a" "$P/lib/libssl.a" 2>/dev/null | awk '$2~/^[TDBRC]$/{print $3}' | sed 's/^_//' | sort -u > d2.txt
        comm -23 u.txt d2.txt | grep -E "^(EVP|SSL|X509|BIO|ERR|RSA|PEM|OPENSSL|OBJ|ASN1|SSLeay|RAND|CRYPTO|d2i|i2d|ENGINE|OpenSSL|DH|DSA|EC|HMAC|MD|SHA|CONF|BN|sk_|OCSP|PKCS)" > missing.txt || true
        cat missing.txt
        test ! -s missing.txt
        mkdir -p lt && cd lt
        cat > t1.prg <<'PRG'
        PROCEDURE Main()
           ? SSL_INIT()
           ? OpenSSL_version()
           ? EVP_CIPHER_NID( EVP_get_cipherbyname( "aes-128-cbc" ) ), EVP_CIPHER_KEY_LENGTH( EVP_get_cipherbyname( "aes-128-cbc" ) ), EVP_CIPHER_BLOCK_SIZE( EVP_get_cipherbyname( "aes-128-cbc" ) )
           ? EVP_MD_SIZE( EVP_get_digestbyname( "sha256" ) ), EVP_MD_BLOCK_SIZE( EVP_get_digestbyname( "sha256" ) )
           RETURN
        PRG
        cat > t2.prg <<'PRG'
        #include "hbcurl.ch"
        PROCEDURE Main()
           LOCAL h
           curl_global_init()
           h := curl_easy_init()
           curl_easy_setopt( h, HB_CURLOPT_URL, "https://example.com/" )
           curl_easy_setopt( h, HB_CURLOPT_CAINFO, GetEnv( "OADS_CAFILE" ) )
           curl_easy_setopt( h, HB_CURLOPT_DL_BUFF_SETUP )
           ? curl_easy_perform( h )
           ? SSL_INIT(), OpenSSL_version()
           RETURN
        PRG
        WHOLE="$(cygpath -m "$PWD/../hbssl-old/libhbssl-x86.a")"
        "$HBMK" t1.prg -plat=win -comp=mingw -gtstd -ot1 -L../hbssl-old -L"$P/lib" -lhbssl-x86 -lssl -lcrypto -lz "-ldflag=-Wl,--whole-archive,$WHOLE,--no-whole-archive" -lws2_32 -lcrypt32
        ./t1.exe | tee t1-proof.txt
        grep -q "OpenSSL 3.5.9" t1-proof.txt
        grep -q 419 t1-proof.txt
        "$HBMK" t2.prg -plat=win -comp=mingw -gtstd -ot2 -I../work/hbsrc/contrib/hbcurl -L../hbcurl-out -L../hbssl-old -L"$P/lib" -lhbcurls -lhbssl-x86 -lcurl -lssh2 -lssl -lcrypto -lnghttp2 -lbrotlidec-static -lbrotlienc-static -lbrotlicommon-static -lzstd -lz "-ldflag=-Wl,--whole-archive,$WHOLE,--no-whole-archive" -lws2_32 -lcrypt32 -lwldap32 -lbcrypt
        objdump -p t2.exe | grep -i 'DLL Name' | tee t2-pe.txt
        if grep -Ei 'DLL Name:.*(libssl|libcrypto|libcurl|nghttp2|ssh2|brotli|zstd|libstdc|libgcc|libwinpthread).*\.dll' t2-pe.txt;then exit 1;fi
        MS="$(dirname "$(dirname "$(dirname "$PERLX")")")"
        CA=""
        for c in "/c/Program Files/Git/mingw64/etc/ssl/certs/ca-bundle.crt" "/c/Program Files/Git/usr/ssl/certs/ca-bundle.crt" "$MS/usr/ssl/certs/ca-bundle.crt" "$MS/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem" "$MS/usr/ssl/cert.pem"; do if [ -f "$c" ]; then CA="$c"; break; fi; done
        echo "CA bundle: $CA"
        test -n "$CA"
        grep -c 'BEGIN CERTIFICATE' "$CA"
        export OADS_CAFILE="$(cygpath -m "$CA")"
        ./t2.exe | tee t2-proof.txt
        grep -m1 -v '^[[:space:]]*$' t2-proof.txt | grep -q '^ *0$'
        grep -q "OpenSSL 3.5.9" t2-proof.txt
    - name: Package the family kit
      shell: bash
      run: |
        set -euxo pipefail
        P="$(cygpath -u "$PWD/out")"
        K="$(cygpath -u "$PWD/openssl-curl-mingw10-x86")"
        mkdir -p "$K/lib" "$K/include" "$K/harbour-hbcurl" "$K/test" "$K/bin"
        cp "$P/lib/"*.a "$K/lib/"
        cp -r "$P/include/"* "$K/include/"
        rm -rf "$K/include/nghttp2/"*.in 2>/dev/null || true
        cp hbcurl-out/libhbcurls.a "$K/harbour-hbcurl/"
        cp work/hbsrc/contrib/hbcurl/hbcurl.ch work/hbsrc/contrib/hbcurl/hbcurl.hbx "$K/harbour-hbcurl/"
        cp "$P/LEGACY-SYMBOLS.txt" "$K/"
        cp lt/t1.prg "$K/test/test_hbssl.prg"; cp lt/t2.prg "$K/test/test_https.prg"
        cp lt/t1-proof.txt lt/t2-proof.txt lt/missing.txt "$K/test/" 2>/dev/null || true
        cp "$P/bin/curl.exe" "$K/bin/" || true
        cat > "$K/README.txt" <<'NOTES'
        Static OpenSSL + CURL kit for MinGW-w64 x86 - modernized rebuild
        Versions: OpenSSL 3.5.9 (latest release of the 3.5 LTS line, the same line the
        2026-10-10 kit was built on; upstream release list checked 2026-11-21),
        curl 8.23.0, libssh2 1.11.1, nghttp2 1.71.0, brotli 1.2.1 (plain and -static names),
        zstd 1.5.7, zlib 1.4. Built with GCC 10.2.0 i686 MSVCRT posix dwarf (winlibs 10.2.0, the mtfix88 CI pin).
        Intended for the existing world: HbQt static builds via MinGW 4.9.2,
        Vouch on D:\mingw32 (GCC 10.2). These libraries are MSVCRT, the same CRT
        family and, as far as it could be reconstructed, the same recipe as the
        2026-10-10 kit, with modernized versions.
        Same CRT plus same recipe is necessary, not sufficient: CI proves old-hbssl
        symbol coverage and a live HTTPS fetch on a clean runner, but your actual
        Vouch/HbQt link is the final proof and is yours. Keep the backup of the
        replaced files.

        The stock libhbssl.a keeps working: OpenSSL 3.x no longer exports the old function
        names it calls (EVP_CIPHER_nid, EVP_MD_size, EVP_PKEY_size, ...), so libcrypto.a in
        this kit carries a small merged compat object (ossl_legacy.o) that provides them as
        tail-jump wrappers to the renamed 3.x functions. No hbssl recompile, no link-line
        change. The exact symbol list is in LEGACY-SYMBOLS.txt. The old->new pairs are
        not invented: they are copied from OpenSSL 3.5.9's own headers (its
        include/openssl/evp.h itself defines EVP_CIPHER_nid as EVP_CIPHER_get_nid,
        EVP_MD_size as EVP_MD_get_size, EVP_PKEY_size as EVP_PKEY_get_size, and so
        on); the merged object only materializes those header aliases as linkable
        symbols, filtered to pairs whose new name exists in the built libraries.
        The semantics are OpenSSL's own.

        Install: copy lib\*.a and include\* into the toolchain's lib/include folders (keep
        a backup of the replaced files). Link exactly as your current working build links.
        For reference, the CI proof invoked hbmk2 with: -lhbcurls -lhbssl-x86 -lcurl
        -lssh2 -lssl -lcrypto -lnghttp2 -lbrotlidec-static -lbrotlienc-static
        -lbrotlicommon-static -lzstd -lz -lws2_32 -lcrypt32 -lwldap32 -lbcrypt (that
        tested invocation needed -lbcrypt for curl's BCryptGenRandom; hbmk2 adds the
        other Windows libs itself). Define CURL_STATICLIB when compiling against
        include\curl (harbour-hbcurl\libhbcurls.a is already built with it; hbcurl.ch and
        hbcurl.hbx included). bin\curl.exe is the static curl tool. test\ holds the two
        sample programs CI linked AND RAN against this exact kit: test_hbssl.prg prints the
        OpenSSL version through the old-name shim; test_https.prg fetches https://example.com/
        through hbcurl with the whole family linked in.

